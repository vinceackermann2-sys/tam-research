name: AERA v26.5 issue514 mixed-dtype FICEM WRITE L4 gate

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-5-issue514-ficem-write-mixed-dtype-l4
  cancel-in-progress: false

jobs:
  mixed-dtype-write:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-5-issue514-ficem-write-mixed-dtype-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue514 probe and launcher
        run: |
          python -m py_compile tam_research/aera_v26_5_issue514_ficem_write_mixed_dtype_probe.py
          python -m py_compile modal_aera_v26_5_issue514_ficem_write_mixed_dtype_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue514 sole one-attempt mixed-dtype WRITE boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/514" --jq '.title')" = "[research] AERA-v26.5 mixed-dtype FICEM WRITE synthetic L4 correctness/topology gate after #511"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/514" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/513" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/513" --jq '.head.sha')" = "2268dd022a3bfcb0eda8ab65a9a6b78874231650"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/513" --jq '.merge_commit_sha')" = "d9bda2bd3143308407c0d11e640d984385eb095a"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33662720255" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33662720255" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33662720255" --jq '.head_sha')" = "2268dd022a3bfcb0eda8ab65a9a6b78874231650"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100356904904" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33661498305" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33661498305" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100352870198" --jq '.conclusion')" = "failure"
          test "${TRIGGER_ISSUE}" != "510"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-5-issue514-ficem-write-mixed-dtype-l4]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"
          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.5 #514 mixed-dtype FICEM WRITE result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor d9bda2bd3143308407c0d11e640d984385eb095a HEAD

          test "$(git hash-object tam_research/aera_hardware_core_v26_5_ficem_write_mixed_dtype.py)" = "dab24c733eff7aa08e5f818614f7504eaac48dc3"
          test "$(git hash-object tam_research/aera_hardware_core_v26_4_ficem_write_triton.py)" = "e54570292489bd17570038dca7518419ac00418c"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object tam_research/aera_v26_4_ficem_write_probe.py)" = "7d8c2c4990beb4c7b4a719d02d009ffefe94671f"
          test "$(git hash-object tam_research/aera_v26_5_issue514_ficem_write_mixed_dtype_probe.py)" = "e48dc308bef3b4ef9b6590ab0324db4a50c0f7af"
          test "$(git hash-object modal_aera_v26_5_issue514_ficem_write_mixed_dtype_app.py)" = "1ab50f7b184feda61a6f6e1c7553296bed8863a6"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue514 gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.5 #514 mixed-dtype FICEM WRITE gate** — exact bound main and frozen CPU-green #511 candidate/probe verified. One NVIDIA L4, Actions attempt 1 only. Synthetic correctness/topology only; no end-to-end/freeze/scientific-seed/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue514 mixed-dtype FICEM WRITE L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_5_issue514_ficem_write_mixed_dtype_app.py 2>&1 | tee /tmp/issue514.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_5_ISSUE514_FICEM_WRITE_MIXED_DTYPE_RESULT_JSON=' /tmp/issue514.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue514 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_5_ISSUE514_FICEM_WRITE_MIXED_DTYPE_SUMMARY_JSON=' /tmp/issue514.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.5 #514 mixed-dtype FICEM WRITE result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. PASS permits only separate systems preregistration; no automatic end-to-end/freeze/scientific-seed/100M/breakthrough authorization." || true

      - name: Record issue514 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.5 #514 mixed-dtype WRITE gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
