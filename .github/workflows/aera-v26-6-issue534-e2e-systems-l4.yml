name: AERA v26.6 issue534 end-to-end systems L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-6-issue534-e2e-systems-l4
  cancel-in-progress: false

jobs:
  end-to-end-systems:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-6-issue534-e2e-systems-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check frozen evaluator and issue534 launcher
        run: |
          python -m py_compile tam_research/aera_v26_6_issue530_end_to_end_systems.py
          python -m py_compile modal_aera_v26_6_issue534_end_to_end_systems_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue534 sole systems boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/534" --jq '.title')" = "[research] AERA-v26.6 one-shot end-to-end systems L4 gate after #530/#533"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/534" --jq '.state')" = "open"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/530" --jq '.title')" = "[research] AERA-v26.6 end-to-end systems adapter after authoritative #527 primitive PASS"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/533" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/533" --jq '.head.sha')" = "af3ae4d721ccf218f2d5ebcd41458fd7ff5b8ad3"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/533" --jq '.merge_commit_sha')" = "67b9559cafaf72d08261ff5c988233f2bc20932b"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33682266234" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33682266234" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33682266234" --jq '.head_sha')" = "af3ae4d721ccf218f2d5ebcd41458fd7ff5b8ad3"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100421371756" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/529" --jq '.title')" = "[aera-v26-6-issue527-ficem-write-repaired-oracle-l4] sole #527 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33680028132" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33680028132" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33680028132" --jq '.head_sha')" = "2c0c28005bff8d9b4f36a96de86144dd74107e39"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100414089065" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/510" --jq '.title')" = "[aera-v26-5-issue508-e2e-systems-l4-repair1] sole #508 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33661498305" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33661498305" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33661498305" --jq '.head_sha')" = "1d475a199cfd2b14d5e94e5cffa29e05ac868ab1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100352870198" --jq '.conclusion')" = "failure"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-6-issue534-e2e-systems-l4]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"
          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.6 #534 end-to-end systems result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          bound_count="$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "${bound_count}" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 67b9559cafaf72d08261ff5c988233f2bc20932b HEAD

          test "$(git hash-object tam_research/aera_v26_6_issue530_end_to_end_systems.py)" = "9d5a3c31f4a3862f96b957540baa2e0ec6a84c6b"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems.py)" = "c9731cae7e386f09b2a190b045532591c4fa00be"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems_repair1.py)" = "b3f7082b188644007b873db3733492f424d4941a"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_hardware_core_v26_4_ficem_write_triton.py)" = "e54570292489bd17570038dca7518419ac00418c"
          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object tam_research/aera_v26_6_issue525_mixed_dtype_write_oracle.py)" = "8f472451af4024bb3faacb56d814f7d6bdb25cc9"
          test "$(git hash-object tam_research/aera_v26_6_issue527_ficem_write_repaired_oracle_probe.py)" = "bcfeb6a93ed062b7d00359603dc9fbc7aca5767f"
          test "$(git hash-object modal_aera_v26_6_issue534_end_to_end_systems_app.py)" = "b8fe5715375a1a7eb87311cca053ee071d5736c0"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue534 gate start (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.6 #534 end-to-end systems gate** — exact bound main, #527 primitive PASS, #530/#533 CPU-green adapter, frozen systems surface and consumed #508 failure verified. One NVIDIA L4, Actions attempt 1 only, hard 600-second maximum. No rerun/freeze/scientific-seed/replication/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue534 end-to-end systems L4 gate
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_6_issue534_end_to_end_systems_app.py 2>&1 | tee /tmp/issue534.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_6_ISSUE534_END_TO_END_SYSTEMS_RESULT_JSON=' /tmp/issue534.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue534 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_6_ISSUE534_END_TO_END_SYSTEMS_SUMMARY_JSON=' /tmp/issue534.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.6 #534 end-to-end systems result**\n\n${marker}\n\nDurable Modal JSON plus the authoritative RESULT marker are the experiment record. Systems PASS permits only separate architecture-freeze consideration; it does not itself authorize freeze/science/replication/100M/breakthrough." || true

      - name: Record issue534 pre-result failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.6 #534 end-to-end systems gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, timeout increase, seed substitution, or post-hoc repair is authorized; continuation requires a new preregistration." || true
