name: AERA v26.8 issue564 end-to-end systems L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  end-to-end-systems:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-8-issue564-e2e-systems-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue564 adapter and launcher
        run: |
          python -m py_compile tam_research/aera_v26_8_issue562_end_to_end_systems.py
          python -m py_compile modal_aera_v26_8_issue564_end_to_end_systems_l4_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue564 canonical systems boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/564" --jq '.title')" = "[research] AERA-v26.8 end-to-end systems L4 gate after #562 CPU adapter merge"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/564" --jq '.state')" = "open"
          freeze_comment="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5523269566" --jq '.body')"
          printf '%s\n' "${freeze_comment}" | grep -F '[aera-v26-8-issue564-e2e-systems-l4]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F '/vol/aera-v26/issue564-end-to-end-systems/result.json' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'hard timeout `600` seconds maximum' >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/563" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/563" --jq '.head.sha')" = "5bb71886ab513cc73b0bc991b318a43d045b6210"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/563" --jq '.merge_commit_sha')" = "4277ae6e1f8267be3256c1c49c41835f78fe3147"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33734411109" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33734411109" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100581497823" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100581497823" --jq '.steps[] | select(.name == "Run tests") | .conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/561" --jq '.title')" = "[aera-v26-8-issue558-ficem-read-mixed-strength-precision-l4] sole #558 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/561" --jq '.body' | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')" = "75987bfb7976c6a970d63801c6e81b5b4993f544"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33733085825" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33733085825" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100577290103" --jq '.conclusion')" = "success"
          issue558_result_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/561/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.8 #558 mixed-strength-precision FICEM READ result**")) | .id' | wc -l | tr -d ' ')"
          test "${issue558_result_count}" = "1"
          issue558_result="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/561/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.8 #558 mixed-strength-precision FICEM READ result**")) | .body')"
          printf '%s\n' "${issue558_result}" | grep -F '"decision":"PASS"' >/dev/null
          printf '%s\n' "${issue558_result}" | grep -F '"overall_pass":true' >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/550" --jq '.title')" = "[aera-v26-6-issue545-e2e-systems-l4-successor1] sole #545 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/550" --jq '.body' | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')" = "383444afa414fa955c46f98f11cf733ddcef656f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33686037672" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33686037672" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Verify issue545 canonical successor systems boundary") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Re-verify issue545 canonical trigger immediately before Modal") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Authenticate Modal") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Run canonical issue545 successor1 end-to-end systems L4 gate") | .conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Record issue545 successor1 result (best effort)") | .conclusion')" = "skipped"

          mapfile -t matching_triggers < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue564-e2e-systems-l4]")) | .number' \
              | sort -n
          )
          test "${#matching_triggers[@]}" -ge 1
          canonical_trigger="${matching_triggers[0]}"
          test "${TRIGGER_ISSUE}" = "${canonical_trigger}"

          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.8 #564 end-to-end systems result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 4277ae6e1f8267be3256c1c49c41835f78fe3147 HEAD

          test "$(git hash-object tam_research/aera_v26_8_issue562_end_to_end_systems.py)" = "3534103eea21f7c4d9d31798ad34601fd47090d6"
          test "$(git hash-object tests/test_aera_v26_8_issue562_end_to_end_systems_cpu.py)" = "2893a86cbdf767cdfa92601503d107d5ca3912fb"
          test "$(git hash-object tam_research/aera_v26_6_issue530_end_to_end_systems.py)" = "9d5a3c31f4a3862f96b957540baa2e0ec6a84c6b"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems.py)" = "c9731cae7e386f09b2a190b045532591c4fa00be"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems_repair1.py)" = "b3f7082b188644007b873db3733492f424d4941a"
          test "$(git hash-object tam_research/aera_hardware_core_v26_8_ficem_read_mixed_strength_precision.py)" = "3575c58d1cd730be77649f087908c51dbf3e6088"
          test "$(git hash-object tam_research/aera_hardware_core_v26_7_ficem_read_mixed_dtype.py)" = "d8133c6b204b1ee5f23955255fb2fb09d09bd723"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"
          test "$(git hash-object tam_research/aera_hardware_core_v26_4_ficem_write_triton.py)" = "e54570292489bd17570038dca7518419ac00418c"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object modal_aera_v26_8_issue564_end_to_end_systems_l4_app.py)" = "3b6268a905b4fd2707d1deaf5950c7a89682b4bd"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Re-verify issue564 canonical trigger immediately before Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t matching_triggers < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue564-e2e-systems-l4]")) | .number' \
              | sort -n
          )
          test "${#matching_triggers[@]}" -ge 1
          test "${TRIGGER_ISSUE}" = "${matching_triggers[0]}"

      - name: Record issue564 systems gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.8 #564 systems gate** — canonical-lowest trigger, exact bound main, merged #562 adapter, authoritative #558 READ PASS and consumed #545 systems abort verified. Exactly one NVIDIA L4, Actions attempt 1 only. No rerun/freeze/scientific-seed/replication/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run canonical issue564 end-to-end systems L4 gate
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_8_issue564_end_to_end_systems_l4_app.py 2>&1 | tee /tmp/issue564.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_8_ISSUE564_END_TO_END_SYSTEMS_RESULT_JSON=' /tmp/issue564.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue564 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_8_ISSUE564_END_TO_END_SYSTEMS_SUMMARY_JSON=' /tmp/issue564.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.8 #564 end-to-end systems result**\n\n${marker}\n\nDurable Modal JSON plus authoritative RESULT marker are experiment authority. Systems PASS authorizes only a separately preregistered architecture-freeze audit; no fresh science/replication/100M/breakthrough claim." || true

      - name: Record issue564 pre-result failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.8 #564 systems gate failed before an authoritative RESULT marker.** The attempt is consumed. No rerun, retry, redispatch, alternate eligible trigger or timeout increase is authorized; continuation requires a separate preregistration." || true
