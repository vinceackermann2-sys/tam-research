name: CPW-v2 sequence repaired one-shot 25M H100 replication

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/LAUNCH_V2_SEQUENCE_REPAIR.json'

permissions:
  contents: read
  issues: write

jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_SECONDARY: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
      MODAL_TOKEN_SECRET_SECONDARY: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_LOW_CREDIT_ACCOUNT: ${{ secrets.MODAL_LOW_CREDIT_ACCOUNT }}
      MODAL_MAX_THROTTLE_WAIT: "0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate repaired one-shot authority
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("cpw/LAUNCH_V2_SEQUENCE_REPAIR.json").read_text())
          assert set(cfg)=={"phase","issue","original_issue","cancelled_run","architecture_gate_run","run_control_run","authorized_parent_sha"}
          assert cfg["phase"]=="cpw-v2-sequence-long-horizon-repair-1255"
          assert cfg["issue"]==1255
          assert cfg["original_issue"]==1254
          assert cfg["cancelled_run"]==37326506123
          assert cfg["architecture_gate_run"]==37326045460
          assert cfg["run_control_run"]==37338472376
          assert len(str(cfg["authorized_parent_sha"]))==40
          PY
          AUTHORIZED_PARENT="$(python -c 'import json; print(json.load(open("cpw/LAUNCH_V2_SEQUENCE_REPAIR.json"))["authorized_parent_sha"])')"
          test "$(git rev-parse HEAD^)" = "$AUTHORIZED_PARENT"

          git diff --exit-code 8faff8bb30fd50e5c2b7cc33f90b643957cdac1b "$SOURCE_SHA" -- \
            tam_research/cpw_v2_sequence \
            tests/test_cpw_v2_sequence_1254.py
          git diff --exit-code e326413ddcf592f532b23ef41b7d839421a45965 "$SOURCE_SHA" -- \
            tam_research/cpw_v2_single/model.py \
            tam_research/cpw_v1/model.py
          git diff --exit-code 4a28cde8f339414d44703220f8e331305014e7b1 "$SOURCE_SHA" -- \
            modal_cpw_v2_sequence_1254.py \
            tests/test_cpw_v2_sequence_run_control_1254.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run repaired zero-GPU contracts
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
          pip install 'modal>=1.5.4,<1.6'
          python -m compileall -q modal_cpw_v2_sequence_1254.py tam_research/cpw_v2_sequence
          pytest -q tests/test_cpw_v2_sequence_1254.py tests/test_cpw_v2_sequence_run_control_1254.py

      - name: Select eligible Modal account
        id: account
        run: |
          PYTHONPATH="$PWD" python scripts/modal_select_account_v3.py \
            --required-volume tam-research-data \
            --runtime-probe-path modal_runtime_admission_probe_1067_v1.py

      - name: Activate selected Modal account
        env:
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
          SECONDARY_CREDENTIAL_ALIASES: ${{ steps.account.outputs.secondary_credential_aliases }}
        run: |
          set -euo pipefail
          if [ "$SELECTED_MODAL_ACCOUNT" = "primary" ]; then
            printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
          elif [ "$SELECTED_MODAL_ACCOUNT" = "secondary" ]; then
            case ",$SECONDARY_CREDENTIAL_ALIASES," in
              *,secondary,*) SECONDARY_ID="$MODAL_TOKEN_ID_SECONDARY"; SECONDARY_SECRET="$MODAL_TOKEN_SECRET_SECONDARY" ;;
              *,account2,*) SECONDARY_ID="$MODAL_TOKEN_ID_2"; SECONDARY_SECRET="$MODAL_TOKEN_SECRET_2" ;;
              *,legacy_b,*) SECONDARY_ID="$MODAL_TOKEN_ID_B"; SECONDARY_SECRET="$MODAL_TOKEN_SECRET_B" ;;
              *) exit 93 ;;
            esac
            test -n "$SECONDARY_ID"
            test -n "$SECONDARY_SECRET"
            printf 'MODAL_TOKEN_ID=%s\n' "$SECONDARY_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$SECONDARY_SECRET" >> "$GITHUB_ENV"
          else
            exit 92
          fi

      - name: Verify Modal authentication
        run: modal token info

      - name: Record repaired launch
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1255/comments" \
            -f body="Repaired #1254 launch gate passed. Modal account=${SELECTED_MODAL_ACCOUNT}; source=${GITHUB_SHA}; exact existing 25M/2M shard verified. Launching same unconsumed seeds."

      - name: Run repaired one-shot long-horizon screen
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v2_sequence_1254.py --source-sha "${GITHUB_SHA}" | tee cpw-v2-sequence-repair.log

      - name: Record terminal result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.txt
          import json
          from pathlib import Path
          p="CPW_V2_SEQUENCE_RESULT="
          xs=[x.split(p,1)[1] for x in Path("cpw-v2-sequence-repair.log").read_text(errors="replace").splitlines() if p in x]
          if not xs: raise SystemExit("missing terminal result")
          r=json.loads(xs[-1])
          print("CPW-v2 sequence repaired long-horizon terminal result\n")
          print(f"- classification: `{r['classification']}`")
          print(f"- integrity: `{r['replication_integrity']}`")
          print(f"- Transformer mean NLL: `{r['transformer_mean_nll']}`")
          print(f"- sequence mean NLL: `{r['sequence_mean_nll']}`")
          print(f"- sequence wins: `{r['sequence_wins']}/3`")
          print(f"- mean training-time ratio: `{r['mean_sequence_training_seconds_ratio']:.4f}x`")
          print(f"- mean total-compute ratio: `{r['mean_sequence_total_compute_ratio']:.4f}x`")
          print(f"- mean throughput ratio: `{r['mean_sequence_training_tps_ratio']:.4f}x`")
          print(f"- strong Pareto 3/3: `{r['strong_pareto_3_of_3']}`")
          print(f"- learning-curve deltas T-sequence: `{r['mean_curve_transformer_minus_sequence_nll']}`")
          print("- breakthrough claim authorized: `false`")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1255/comments" -F body=@/tmp/comment.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1254/comments" -F body=@/tmp/comment.txt

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1255/comments" \
            -f body="Repaired CPW-v2 sequence run did not return successfully for source ${GITHUB_SHA}. Inspect the durable namespace before any further action; do not reinterpret infrastructure failure scientifically."
