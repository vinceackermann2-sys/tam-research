name: AERA v26.3 issue449 FICEM read L4 repair4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-3-issue449-ficem-read-l4-repair4
  cancel-in-progress: false

jobs:
  ficem-read-repair4:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-ficem-read-l4-repair4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue449 launcher
        run: python -m py_compile modal_aera_v26_3_ficem_read_repair4_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue449 one-attempt repair4 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/449" --jq '.title')" = "[research] AERA-v26.3 repair4 synthetic L4 FICEM-read gate after #445 CPU proof"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/449" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/446" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/446" --jq '.head.sha')" = "4081eff33c754113b4df7efd39bf1a6f04a9556a"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/446" --jq '.merge_commit_sha')" = "33ec518f978cc95afe5165fc3b3b054151a2475c"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33535610189" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33535610189" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33535610189" --jq '.head_sha')" = "4081eff33c754113b4df7efd39bf1a6f04a9556a"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-ficem-read-l4-repair4]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 33ec518f978cc95afe5165fc3b3b054151a2475c HEAD

          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "a3a603c8a2d4b20ebcccd7663970978f4288a760"
          test "$(git hash-object modal_aera_v26_3_ficem_read_repair4_app.py)" = "ea45263722edc02753221a885b7948770a5054e0"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue449 gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.3 #449 repair4 read gate** — exact bound main, frozen #418 probe and repair4 backend verified. One NVIDIA L4, Actions attempt 1 only. No rerun/end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue449 repair4 synthetic L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_ficem_read_repair4_app.py 2>&1 | tee /tmp/issue449.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE449_FICEM_READ_REPAIR4_RESULT_JSON=' /tmp/issue449.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue449 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_ISSUE449_FICEM_READ_REPAIR4_SUMMARY_JSON=' /tmp/issue449.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.3 #449 FICEM read repair4 result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. No end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Record issue449 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.3 #449 repair4 gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
