name: AERA v26.9 issue625 schema guard repair1 L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  issue625-schema-guard-repair1:
    if: startsWith(github.event.issue.title, '[aera-v26-9-issue625-schema-guard-repair1-l4]')
    runs-on: ubuntu-latest
    env:
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: |
          python -m py_compile modal_aera_v26_9_issue625_schema_guard_repair1_l4_app.py
          python -m py_compile tam_research/aera_v26_9_issue625_schema_guard_repair1.py
      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'
      - name: Verify canonical authorized issue625 boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/625" --jq '.title')" = "[research] AERA-v26.9 #622 schema-guard repair after consumed #624 pre-L4 failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/625" --jq '.state')" = "open"
          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue625-schema-guard-repair1-l4]")) | .number' \
              | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"
          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bind_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bind_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bind_lines}" | sed -n '1p')"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 7c4dd6ac038943e882035ff92a6336a764369c61 HEAD
          auth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/625/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #625 sole L4 schema-guard repair1 authorization")) | .id' | wc -l | tr -d ' ')"
          test "${auth_count}" = "1"
          auth_body="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/625/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #625 sole L4 schema-guard repair1 authorization")) | .body')"
          auth_lines="$(printf '%s\n' "${auth_body}" | sed -n 's/^Authorize main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${auth_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "${auth_lines}" | sed -n '1p')" = "${bound_main}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33808524208" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33808524208" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100824653900" --jq '.conclusion')" = "failure"
          echo "bound_main=${bound_main}" >> "$GITHUB_OUTPUT"
      - name: Record start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #625 schema-guard repair1 gate started** — exact authorized main and consumed #624 boundary verified. One L4 synthetic READ gate only; no model/checkpoint/corpus/training/systems or higher scientific step." || true
      - name: Immediate canonical recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue625-schema-guard-repair1-l4]")) | .number' \
              | sort -n
          )
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"
      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
      - name: Run sole issue625 L4 gate
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal run modal_aera_v26_9_issue625_schema_guard_repair1_l4_app.py 2>&1 | tee /tmp/issue625.log
          test "$(grep -c '^AERA_V26_9_ISSUE625_SCHEMA_GUARD_REPAIR1_RESULT_JSON=' /tmp/issue625.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE625_SCHEMA_GUARD_REPAIR1_SUMMARY_JSON=' /tmp/issue625.log)" = "1"
      - name: Record evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f /tmp/issue625.log; then
            result="$(grep '^AERA_V26_9_ISSUE625_SCHEMA_GUARD_REPAIR1_RESULT_JSON=' /tmp/issue625.log | tail -1 | sed 's/^AERA_V26_9_ISSUE625_SCHEMA_GUARD_REPAIR1_RESULT_JSON=//')"
            summary="$(grep '^AERA_V26_9_ISSUE625_SCHEMA_GUARD_REPAIR1_SUMMARY_JSON=' /tmp/issue625.log | tail -1 | sed 's/^AERA_V26_9_ISSUE625_SCHEMA_GUARD_REPAIR1_SUMMARY_JSON=//')"
            if test -n "${result}"; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #625 authoritative schema-guard repair1 READ gate**\n\nResult: \`${result}\`\n\nSummary: \`${summary}\`\n\nPrimitive READ evidence only. No automatic end-to-end systems execution, evaluator repair, architecture freeze, S2, fresh scientific seed, replication, 100M scaling, or breakthrough claim is authorized." || true
            fi
          fi