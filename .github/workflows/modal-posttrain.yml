name: Modal TAM posttrain only

on:
  workflow_dispatch:
    inputs:
      max_gpu_seconds:
        description: "Hard H100 post-training ceiling (180-260)"
        required: true
        default: "260"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  posttrain:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[modal-posttrain]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve guarded budget
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_MAX_GPU_SECONDS: ${{ inputs.max_gpu_seconds }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.environ["EVENT_NAME"] == "issues":
              cfg = json.loads(os.environ.get("ISSUE_BODY") or "{}")
              seconds = int(cfg.get("max_gpu_seconds", 260))
          else:
              seconds = int(os.environ["INPUT_MAX_GPU_SECONDS"])
          assert 180 <= seconds <= 260
          print(f"max_gpu_seconds={seconds}")
          PY

      - name: Record launcher start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **Post-training launcher started** — hard H100 ceiling=${{ steps.cfg.outputs.max_gpu_seconds }}s; saved 300M-token base only, no pretraining."

      - name: Install Modal
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication
        run: modal token info

      - name: Launch detached post-training continuation
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          modal run --detach --timestamps modal_posttrain_app.py \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --max-gpu-seconds "${{ steps.cfg.outputs.max_gpu_seconds }}"

      - name: Record handoff
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal post-training handoff completed.** No pretraining or additional GPU jobs are triggered."
