name: AERA v26.3 issue482 FICEM read L4 repair5 successor guard repair1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-3-issue482-ficem-read-l4-repair5-successor-guard-repair1
  cancel-in-progress: false

jobs:
  ficem-read-repair5-successor-guard-repair1:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-ficem-read-l4-repair5-successor-guard-repair1]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check frozen issue479 launcher
        run: python -m py_compile modal_aera_v26_3_ficem_read_repair5_successor_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue482 one-attempt guard-repair1 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/482" --jq '.title')" = "[research] AERA-v26.3 #479 successor gate guard repair1 after #481 marker false-positive"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/482" --jq '.state')" = "open"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/479" --jq '.title')" = "[research] AERA-v26.3 repair5 successor-probe fused FICEM read synthetic L4 gate"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/479" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/481" --jq '.title')" = "[aera-v26-3-ficem-read-l4-repair5-successor] sole #479 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33614111991" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33614111991" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33614111991" --jq '.head_sha')" = "d2718370721346a52fc060947b77652d1041cc76"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100195873394" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100195873394" --jq '.steps[] | select(.name == "Authenticate Modal") | .conclusion')" = "skipped"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100195873394" --jq '.steps[] | select(.name == "Run sole issue479 repair5 successor synthetic L4 probe") | .conclusion')" = "skipped"
          test "${TRIGGER_ISSUE}" != "481"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-ficem-read-l4-repair5-successor-guard-repair1]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"

          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.3 #479 FICEM read repair5 successor result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor d2718370721346a52fc060947b77652d1041cc76 HEAD

          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe_repair5.py)" = "6fd6518e10ed1ef4115863f98ac591ffd77ce903"
          test "$(git hash-object modal_aera_v26_3_ficem_read_repair5_successor_app.py)" = "bc0e14c56530e713d3638cd96431329e254a4fcb"
          test "$(git hash-object .github/workflows/aera-v26-3-ficem-read-l4-repair5-successor.yml)" = "1319e0b8ba566b660920cdf3085b906d9f627276"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue482 gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.3 #482 guard-repair1 read gate** — #481 pre-GPU failure verified, exact bound main and all frozen #479 candidate/probe/launcher blobs verified. One NVIDIA L4, Actions attempt 1 only. No rerun/end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue482 guard-repair1 successor synthetic L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_ficem_read_repair5_successor_app.py 2>&1 | tee /tmp/issue482.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE479_FICEM_READ_REPAIR5_SUCCESSOR_RESULT_JSON=' /tmp/issue482.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue482 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_ISSUE479_FICEM_READ_REPAIR5_SUCCESSOR_SUMMARY_JSON=' /tmp/issue482.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.3 #479 FICEM read repair5 successor result**\n\n${marker}\n\nExecuted through #482 guard-repair1. Durable Modal result + authoritative marker are the experiment record. No end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Record issue482 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.3 #482 guard-repair1 successor gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
