name: RLT light-state optimizer-tuned compute-match exact15M 60s 20261007 B

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-20261007-b.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-20261007-b
  cancel-in-progress: false

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b
      JOB_PATH: experiments/rlt/modal/jobs/rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b.json
      TRAINER_PATH: experiments/rlt/train_lightstate_compute_matched_optimizer_tuned_scale15m_60s_b.py
      LAUNCHER_PATH: experiments/rlt/modal_lightstate_compute_matched_optimizer_tuned_scale15m_60s_b.py
      PROFILE_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-scale15m-batch768-modal-20261002-ac.json
      PAIR_A_PATH: experiments/rlt/modal/results/rlt-lightstate-scale15m-paired-4m-modal-20261002-a.json
      PAIR_B_PATH: experiments/rlt/modal/results/rlt-lightstate-scale15m-paired-4m-modal-20261002-b.json
      CROSSDATA_PATH: experiments/rlt/modal/results/rlt-crossdata-lightstate-4m-ab-modal-20261003-a.json
      BATCH_CAL_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-qualitysec-batch-modal-20261003-ad.json
      LIGHT_OPT_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae.json
      TRANSFORMER_OPT_PATH: experiments/rlt/modal/results/rlt-systems-scale15m-optimizer-qualitysec-modal-20260927-x.json
      FAILED_A_PATH: experiments/rlt/modal/results/rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-a.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-lightstate-compute-matched-optimizer-tuned-scale15m-60s-20261007-a.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b.json
      VOLUME_NAME: tam-rlt-ls-cmatch-20261007-b
      ARTIFACT_NAME: rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b-checkpoints

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed successor B
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          TRAINER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$TRAINER_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "TRAINER_BLOB_SHA=$TRAINER_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b',
            'task':'lightstate_compute_matched_optimizer_tuned_scale15m_60s_b',
            'scientific_seed':20261047,
            'paired_batch_seed':20271047,
            'paired_eval_seed':20291047,
            'compile_probe_seed':20301047,
            'training_data_seed':20260924,
            'requires_lightstate_profile_job_id':'rlt-systems-lightstate-scale15m-batch768-modal-20261002-ac',
            'requires_pair_a_job_id':'rlt-lightstate-scale15m-paired-4m-modal-20261002-a',
            'requires_pair_b_job_id':'rlt-lightstate-scale15m-paired-4m-modal-20261002-b',
            'requires_crossdata_job_id':'rlt-crossdata-lightstate-4m-ab-modal-20261003-a',
            'requires_batch_calibration_job_id':'rlt-systems-lightstate-qualitysec-batch-modal-20261003-ad',
            'requires_lightstate_optimizer_calibration_job_id':'rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae',
            'requires_transformer_optimizer_calibration_job_id':'rlt-systems-scale15m-optimizer-qualitysec-modal-20260927-x',
            'time_budget_seconds_each':60.0,
            'lightstate_train_batch_size':64,
            'transformer_train_batch_size':64,
            'lightstate_learning_rate':0.001,
            'lightstate_schedule':'constant',
            'transformer_learning_rate':0.001,
            'transformer_schedule':'cosine',
            'seq_len':64,
            'train_tokens':6000000,
            'val_tokens':500000,
            'expected_parameters_each':15129344,
            'checkpoint_volume':'tam-rlt-ls-cmatch-20261007-b',
            'automatic_retry':False,
          },j
          PY

      - name: Refuse reused successor B seeds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          current=Path('experiments/rlt/modal/jobs/rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b.json')
          targets={20261047,20271047,20291047,20301047}
          collisions=[]
          def walk(v):
              if isinstance(v,dict):
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
              elif isinstance(v,int):
                  yield v
          for root in [Path('experiments/rlt/modal/jobs'),Path('experiments/rlt/modal/claims')]:
              for p in sorted(root.glob('*.json')):
                  if p==current:
                      continue
                  try: obj=json.loads(p.read_text())
                  except Exception: continue
                  overlap=targets.intersection(walk(obj))
                  if overlap: collisions.append((str(p),sorted(overlap)))
          assert not collisions,collisions
          print('Step B seeds unused across existing RLT jobs/claims:',sorted(targets))
          PY

      - name: Require frozen infrastructure-only predecessor A
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$FAILED_A_PATH" >/tmp/failed-a.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/failed-a.json'))
          assert a.get('job_id')=='rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-a',a
          assert a.get('status')=='failed',a
          assert a.get('scientific_conclusion') is None,a
          assert a.get('error_type')=='ModalInvocationOrTransportError',a
          assert a.get('modal_cli_rc')==1,a
          assert 'Invalid Volume name' in a.get('log_tail',''),a
          assert a.get('data_hashes_match_claim') is False,a
          assert a.get('exact_parameter_match_verified') is False,a
          assert a.get('compute_budget_protocol_verified') is False,a
          print('Predecessor A frozen as infrastructure/configuration failure only.')
          PY

      - name: Require frozen light-state and Transformer settings
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$PROFILE_PATH" >/tmp/profile.json
          git show "origin/$BRANCH:$PAIR_A_PATH" >/tmp/a.json
          git show "origin/$BRANCH:$PAIR_B_PATH" >/tmp/b.json
          git show "origin/$BRANCH:$CROSSDATA_PATH" >/tmp/cross.json
          git show "origin/$BRANCH:$BATCH_CAL_PATH" >/tmp/ad.json
          git show "origin/$BRANCH:$LIGHT_OPT_PATH" >/tmp/ae.json
          git show "origin/$BRANCH:$TRANSFORMER_OPT_PATH" >/tmp/x.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/profile.json'))
          assert p.get('job_id')=='rlt-systems-lightstate-scale15m-batch768-modal-20261002-ac',p
          assert p.get('status')=='complete' and p.get('classification')=='PASS_LIGHTSTATE_SCALE15M_GAP_LE_1_25X',p
          assert p['architecture']['parameter_neutral'] is True and p['architecture']['parameters']==15129344,p
          assert p['implementation_validation']['future_token_causality']['passed'] is True,p

          for path,jid in [
              ('/tmp/a.json','rlt-lightstate-scale15m-paired-4m-modal-20261002-a'),
              ('/tmp/b.json','rlt-lightstate-scale15m-paired-4m-modal-20261002-b'),
          ]:
              r=json.load(open(path))
              assert r.get('job_id')==jid and r.get('status')=='complete',r
              assert r.get('data_hashes_match_claim') is True and r.get('exact_parameter_match_verified') is True,r
              c=r['comparison']
              assert c['classification']=='PAIRED_LIGHTSTATE_SCALE15M_4M_RLT_LOWER_NLL_SINGLE_RUN_HINT',c
              assert float(c['derived']['rlt_minus_transformer_final_nll'])<0.0,c
              assert c['semantic_equivalence']['passed'] is True,c

          xdata=json.load(open('/tmp/cross.json'))
          assert xdata.get('job_id')=='rlt-crossdata-lightstate-4m-ab-modal-20261003-a',xdata
          assert xdata.get('status')=='complete',xdata
          ev=xdata['evaluation']
          assert ev['classification']=='CROSSDATA_LIGHTSTATE_4M_AB_BOTH_RLT_LOWER_NLL',ev
          agg=ev['aggregate_across_model_seeds']
          assert agg['pair_count']==2 and agg['rlt_lower_nll_pair_count']==2,agg
          assert float(agg['mean_rlt_minus_transformer_nll'])<0.0,agg

          ad=json.load(open('/tmp/ad.json'))
          assert ad.get('status')=='complete' and ad.get('classification')=='PASS_SCALE15M_LIGHTSTATE_QUALITYSEC_BATCH_CALIBRATION',ad
          assert ad.get('engineering_only') is True and ad.get('scientific_execution') is False,ad
          assert ad.get('data_hashes_match_claim') is True and ad.get('wrapper_semantic_equivalence',{}).get('passed') is True,ad
          assert ad['best_by_final_nll']['batch_size']==64,ad['best_by_final_nll']

          ae=json.load(open('/tmp/ae.json'))
          assert ae.get('job_id')=='rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae',ae
          assert ae.get('status')=='complete' and ae.get('classification')=='PASS_SCALE15M_LIGHTSTATE_OPTIMIZER_QUALITYSEC_CALIBRATION',ae
          assert ae.get('engineering_only') is True and ae.get('scientific_execution') is False,ae
          assert ae.get('data_hashes_match_claim') is True and ae.get('wrapper_semantic_equivalence',{}).get('passed') is True,ae
          assert ae['protocol']['batch_size']==64,ae['protocol']
          assert ae['best_by_final_nll']['candidate']=={
              'name':'constant_lr1e-3','schedule':'constant','learning_rate':0.001
          },ae['best_by_final_nll']

          x=json.load(open('/tmp/x.json'))
          assert x.get('job_id')=='rlt-systems-scale15m-optimizer-qualitysec-modal-20260927-x',x
          assert x.get('status')=='complete' and x.get('classification')=='PASS_SCALE15M_OPTIMIZER_QUALITYSEC_CALIBRATION',x
          assert x.get('engineering_only') is True and x.get('scientific_execution') is False,x
          assert x.get('data_hashes_match_claim') is True and x.get('wrapper_semantic_equivalence',{}).get('passed') is True,x
          assert x['transformer']['batch_size']==64,x['transformer']
          assert x['transformer']['best_by_final_nll']['candidate']=={
              'name':'cosine_lr1e-3','schedule':'cosine','learning_rate':0.001
          },x['transformer']['best_by_final_nll']

          for obj in [ad,ae,x]:
              assert obj['data']['train_sha256']=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',obj
              assert obj['data']['val_sha256']=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',obj
          PY

      - name: Install zero-GPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             'modal>=1.5.4,<1.6' 'numpy>=2.0,<3' 'datasets>=4.0,<5'             'transformers>=4.55,<5' 'tokenizers>=0.21,<1' 'huggingface-hub>=0.34,<1'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Validate successor B source and exact parameter equality
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$TRAINER_PATH" "$LAUNCHER_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('experiments/rlt/train_lightstate_compute_matched_optimizer_tuned_scale15m_60s_b.py').read_text()
          m=Path('experiments/rlt/modal_lightstate_compute_matched_optimizer_tuned_scale15m_60s_b.py').read_text()
          volume='tam-rlt-ls-cmatch-20261007-b'
          assert len(volume)<64,(len(volume),volume)
          assert re.fullmatch(r'[A-Za-z0-9._-]+',volume),volume
          assert f'CHECKPOINT_VOLUME = "{volume}"' in m
          for x in [
            'SCIENTIFIC_SEED = 20_261_047','PAIRED_BATCH_SEED = 20_271_047',
            'PAIRED_EVAL_SEED = 20_291_047','COMPILE_PROBE_SEED = 20_301_047',
            'LIGHTSTATE_TRAIN_BATCH_SIZE = 64','TRANSFORMER_TRAIN_BATCH_SIZE = 64',
            'LIGHTSTATE_LEARNING_RATE = 1e-3','TRANSFORMER_LEARNING_RATE = 1e-3',
            'LIGHTSTATE_SCHEDULE = "constant"','TRANSFORMER_SCHEDULE = "cosine"',
            'TIME_BUDGET_SECONDS = 60.0','EXPECTED_PARAMETERS = 15_129_344',
            'LightStateRecurrentTransformer','CompilableLightStateRLT','ff_inner=938',
            'COMPUTE_MATCHED_LIGHTSTATE_OPTIMIZER_TUNED_SCALE15M_60S_RLT_LOWER_NLL_SINGLE_RUN_HINT',
          ]: assert x in t,x
          for x in [
            'JOB_ID = "rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b"',
            'CHECKPOINT_VOLUME = "tam-rlt-ls-cmatch-20261007-b"',
            'gpu="A100-80GB"','retries=0',
            'RLT_LIGHTSTATE_COMPUTE_MATCHED_OPTIMIZER_TUNED_SCALE15M_60S_B_RESULT_B64=',
          ]: assert x in m,x
          vocab=50257; d=256; max_seq=128
          rlt=vocab*d+max_seq*d
          per_stage=d+3*d*d+d*d+d+d*d+2*d*d+d*d+d+2*d*(4*d)
          rlt += 2*per_stage + d + 2*d*d + d + d + d
          tr=vocab*d+max_seq*d + 3*(4*d+4*d*d+2*d*938) + 2*d
          assert rlt==tr==15129344,(rlt,tr)
          PY

      - name: Reproduce pinned D data bytes before claim
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import hashlib,json,pathlib
          import numpy as np
          from datasets import load_dataset
          from transformers import AutoTokenizer
          train_tokens=6000000; val_tokens=500000; seed=20260924
          tok=AutoTokenizer.from_pretrained('gpt2',use_fast=True)
          stream=load_dataset('HuggingFaceFW/fineweb-edu',name='sample-10BT',split='train',streaming=True)
          stream=stream.shuffle(seed=seed,buffer_size=10000)
          target=train_tokens+val_tokens
          chunks=[]; total=0
          for row in stream:
              text=row.get('text') or ''
              if not text: continue
              ids=tok.encode(text,add_special_tokens=False); ids.append(tok.eos_token_id)
              a=np.asarray(ids,dtype=np.uint16); chunks.append(a); total+=len(a)
              if total>=target: break
          assert total>=target,(total,target)
          all_tokens=np.concatenate(chunks)[:target]
          tp=pathlib.Path('/tmp/stepb-train.bin'); vp=pathlib.Path('/tmp/stepb-val.bin')
          all_tokens[:train_tokens].tofile(tp); all_tokens[train_tokens:].tofile(vp)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          th,vh=sha(tp),sha(vp)
          assert th=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',th
          assert vh=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',vh
          pathlib.Path('/tmp/stepb-data.json').write_text(json.dumps({
            'seed':seed,'train_tokens':train_tokens,'val_tokens':val_tokens,
            'train_sha256':th,'val_sha256':vh
          },indent=2,sort_keys=True)+'\n')
          PY
          RC=$?
          set -e
          test -f /tmp/stepb-data.json
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 134 ]; then exit "$RC"; fi

      - name: Run non-GPU Modal control-plane preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit durable successor B preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_LIGHTSTATE_COMPUTE_MATCHED_OPTIMIZER_TUNED_SCALE15M_60S_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'scientific_execution':False,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'reference_data':json.load(open('/tmp/stepb-data.json')),
            'time_budget_seconds_each':60.0,'lightstate_train_batch_size':64,
            'transformer_train_batch_size':64,'lightstate_learning_rate':0.001,
            'lightstate_schedule':'constant','transformer_learning_rate':0.001,
            'transformer_schedule':'cosine','expected_parameters_each':15129344,
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt lightstate compute-match: record Step B zero-GPU preflight'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Create and commit one-shot successor B scientific claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open(os.environ['DIAGNOSTIC_PATH']))
          payload={
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],'scientific_seed':20261047,
            'paired_batch_seed':20271047,'paired_eval_seed':20291047,'compile_probe_seed':20301047,
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],'time_budget_seconds_each':60.0,
            'lightstate_train_batch_size':64,'transformer_train_batch_size':64,
            'lightstate_learning_rate':0.001,'lightstate_schedule':'constant',
            'transformer_learning_rate':0.001,'transformer_schedule':'cosine',
            'expected_parameters_each':15129344,
            'train_sha256':d['reference_data']['train_sha256'],'val_sha256':d['reference_data']['val_sha256'],
            'automatic_retry_authorized':False,'job':json.load(open(os.environ['JOB_PATH'])),
          }
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt lightstate compute-match: claim $JOB_ID before A100-80GB execution"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal successor B A100-80GB attempt
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 82m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_LIGHTSTATE_COMPUTE_MATCHED_OPTIMIZER_TUNED_SCALE15M_60S_B_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Decode terminal successor B payload
        id: decode
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception:p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                 'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                 'error':f'Modal CLI rc={rc}; no parseable terminal payload','log_tail':log[-6000:],
                 'scientific_conclusion':None}
          pathlib.Path('/tmp/pair-result.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PAIR_STATUS='+str(p.get('status','unknown'))+'\n')
          PY

      - name: Export and verify successor B checkpoints
        id: export
        if: env.PAIR_STATUS == 'complete'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rlt-checkpoints; mkdir -p /tmp/rlt-checkpoints
          modal volume get "$VOLUME_NAME" "$JOB_ID" /tmp/rlt-checkpoints
          python - <<'PY'
          import hashlib,json,pathlib
          r=json.load(open('/tmp/pair-result.json')); root=pathlib.Path('/tmp/rlt-checkpoints')
          def one(n):
              xs=list(root.rglob(n)); assert len(xs)==1,(n,xs); return xs[0]
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          lp,tp=one('lightstate_final.pt'),one('transformer_final.pt')
          assert sha(lp)==r['checkpoint_durability']['lightstate']['sha256']
          assert sha(tp)==r['checkpoint_durability']['transformer']['sha256']
          assert r['checkpoint_durability']['modal_volume_committed'] is True
          PY

      - name: Upload successor B checkpoint artifact
        id: upload
        if: env.PAIR_STATUS == 'complete' && steps.export.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/rlt-checkpoints
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Materialize durable successor B result
        if: always()
        shell: bash
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os,pathlib
          p=json.load(open('/tmp/pair-result.json')); claim=json.load(open(os.environ['CLAIM_PATH']))
          dh=p.get('data_sha256') or {}; c=p.get('comparison') or {}
          ls=c.get('lightstate') or {}; tr=c.get('transformer') or {}; protocol=c.get('protocol') or {}
          p.update({
            'modal_cli_rc':int(os.environ.get('MODAL_RC','999')),'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'data_hashes_match_claim':(
              dh.get('train.bin')==claim['train_sha256'] and dh.get('val.bin')==claim['val_sha256']
            ),
            'exact_parameter_match_verified':(
              ls.get('parameters')==15129344 and tr.get('parameters')==15129344
            ),
            'compute_budget_protocol_verified':(
              protocol.get('post_compile_training_time_budget_seconds_each')==60.0
              and protocol.get('compile_time_excluded_from_compute_budget') is True
              and protocol.get('lightstate_train_batch_size')==64
              and protocol.get('transformer_train_batch_size')==64
              and protocol.get('lightstate_learning_rate')==0.001
              and protocol.get('lightstate_schedule')=='constant'
              and protocol.get('transformer_learning_rate')==0.001
              and protocol.get('transformer_schedule')=='cosine'
            ),
            'checkpoint_export':{
              'modal_volume_get_outcome':os.environ.get('EXPORT_OUTCOME',''),
              'github_artifact_upload_outcome':os.environ.get('UPLOAD_OUTCOME',''),
              'github_artifact_id':os.environ.get('ARTIFACT_ID',''),
              'github_artifact_digest':os.environ.get('ARTIFACT_DIGEST',''),
              'github_artifact_name':os.environ['ARTIFACT_NAME'],'github_run_id':os.environ['GITHUB_RUN_ID'],
            },
          })
          out=pathlib.Path(os.environ['RESULT_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt lightstate compute-match: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize successor B outcome
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('data_hashes_match_claim') is True,r
          assert r.get('exact_parameter_match_verified') is True,r
          assert r.get('compute_budget_protocol_verified') is True,r
          c=r.get('comparison'); assert isinstance(c,dict) and c.get('status')=='complete',c
          assert c.get('breakthrough_claim_supported') is False,c
          assert c.get('semantic_equivalence',{}).get('passed') is True,c
          assert c.get('classification') in {
            'COMPUTE_MATCHED_LIGHTSTATE_OPTIMIZER_TUNED_SCALE15M_60S_RLT_LOWER_NLL_SINGLE_RUN_HINT',
            'COMPUTE_MATCHED_LIGHTSTATE_OPTIMIZER_TUNED_SCALE15M_60S_NO_RLT_QUALITY_ADVANTAGE',
          },c
          lt=float(c['lightstate']['actual_train_seconds']); tt=float(c['transformer']['actual_train_seconds'])
          assert lt>=60.0 and tt>=60.0,(lt,tt)
          assert abs(lt-tt)<1.5,(lt,tt)
          e=r.get('checkpoint_export',{})
          assert e.get('modal_volume_get_outcome')=='success' and e.get('github_artifact_upload_outcome')=='success',e
          print('classification:',c['classification'])
          print('Light-state final NLL:',c['lightstate']['final_eval']['nll'])
          print('Transformer final NLL:',c['transformer']['final_eval']['nll'])
          print('delta NLL:',c['derived']['lightstate_minus_transformer_final_nll'])
          print('Light-state tokens:',c['lightstate']['tokens_seen'],'seconds:',lt)
          print('Transformer tokens:',c['transformer']['tokens_seen'],'seconds:',tt)
          print('token multiple:',c['derived']['transformer_tokens_multiple_vs_lightstate'])
          PY
