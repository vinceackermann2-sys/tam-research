name: CPW-v0 mechanism H100 panel

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/LAUNCH_V0_MECHANISM.json'

permissions:
  contents: read
  issues: write

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_SECONDARY: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
      MODAL_TOKEN_SECRET_SECONDARY: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_LOW_CREDIT_ACCOUNT: ${{ secrets.MODAL_LOW_CREDIT_ACCOUNT }}
      MODAL_MAX_THROTTLE_WAIT: "0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate one-shot mechanism authority
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"

          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("cpw/LAUNCH_V0_MECHANISM.json").read_text())
          assert set(cfg) == {
              "phase", "prereg_issue", "model_gate_run",
              "run_control_gate_run", "authorized_parent_sha"
          }
          assert cfg["phase"] == "cpw-v0-mechanism-25m"
          assert cfg["prereg_issue"] == 1247
          assert cfg["model_gate_run"] == 37313223734
          assert cfg["run_control_gate_run"] == 37313504148
          PY
          PARENT="$(python -c 'import json; print(json.load(open("cpw/LAUNCH_V0_MECHANISM.json"))["authorized_parent_sha"])')"
          test "$(git rev-parse HEAD^)" = "$PARENT"

          git diff --exit-code 311d501a732379afdadcdd2f07a41e42ba9d4819 "$SOURCE_SHA" --             tam_research/cpw_v0             tests/test_cpw_v0_1245.py             docs/CPW_V0_ARCHITECTURE.md

          git diff --exit-code 4d5110a6fd670693c7757ad8f406fadd45fc201d "$SOURCE_SHA" --             tam_research/cpw_v0_mechanism             tests/test_cpw_v0_mechanism_1247.py             modal_cpw_v0_mechanism_app.py             tests/test_cpw_v0_mechanism_run_control_1247.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run frozen zero-GPU contracts
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
          python -m compileall -q modal_cpw_v0_mechanism_app.py tam_research/cpw_v0_mechanism
          pytest -q tests/test_cpw_v0_1245.py tests/test_cpw_v0_mechanism_1247.py tests/test_cpw_v0_mechanism_run_control_1247.py

      - name: Install Modal CLI
        run: pip install 'modal>=1.5.4,<1.6'

      - name: Select eligible Modal account
        id: account
        run: |
          PYTHONPATH="$PWD" python scripts/modal_select_account_v3.py             --required-volume tam-research-data             --runtime-probe-path modal_runtime_admission_probe_1067_v1.py

      - name: Activate selected Modal account
        env:
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
          SECONDARY_CREDENTIAL_ALIASES: ${{ steps.account.outputs.secondary_credential_aliases }}
        run: |
          set -euo pipefail
          if [ "$SELECTED_MODAL_ACCOUNT" = "primary" ]; then
            printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
          elif [ "$SELECTED_MODAL_ACCOUNT" = "secondary" ]; then
            case ",$SECONDARY_CREDENTIAL_ALIASES," in
              *,secondary,*) SECONDARY_ID="$MODAL_TOKEN_ID_SECONDARY"; SECONDARY_SECRET="$MODAL_TOKEN_SECRET_SECONDARY" ;;
              *,account2,*) SECONDARY_ID="$MODAL_TOKEN_ID_2"; SECONDARY_SECRET="$MODAL_TOKEN_SECRET_2" ;;
              *,legacy_b,*) SECONDARY_ID="$MODAL_TOKEN_ID_B"; SECONDARY_SECRET="$MODAL_TOKEN_SECRET_B" ;;
              *) echo "No resolved secondary alias" >&2; exit 93 ;;
            esac
            test -n "$SECONDARY_ID"
            test -n "$SECONDARY_SECRET"
            printf 'MODAL_TOKEN_ID=%s\n' "$SECONDARY_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$SECONDARY_SECRET" >> "$GITHUB_ENV"
          else
            exit 92
          fi

      - name: Verify Modal authentication
        run: modal token info

      - name: Record panel launch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1247/comments"             -f body="CPW-v0 mechanism panel launch gate passed. Modal account=${SELECTED_MODAL_ACCOUNT}; source=${SOURCE_SHA}. Running 8 frozen arms: 0.5M-token integrity smoke, then 3 fresh seeds × 3M tokens/arm if valid."

      - name: Run one-shot mechanism panel
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v0_mechanism_app.py             --source-sha "$SOURCE_SHA" | tee cpw-v0-mechanism.log

      - name: Record mechanism result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/mechanism-comment.txt
          import json
          from pathlib import Path
          prefix = "CPW_V0_MECHANISM_RESULT="
          matches = [
              line.split(prefix, 1)[1]
              for line in Path("cpw-v0-mechanism.log").read_text(errors="replace").splitlines()
              if prefix in line
          ]
          if not matches:
              raise SystemExit("missing terminal mechanism result")
          r = json.loads(matches[-1])
          print("CPW-v0 mechanism panel terminal result")
          print()
          print(f"- classification: \`{r['classification']}\`")
          print(f"- integrity: \`{r['replication_integrity']}\`")
          if r["full_vs_transformer"]:
              x = r["full_vs_transformer"]
              print(f"- FULL vs Transformer mean NLL effect (T-FULL): \`{x['transformer_minus_full_mean_nll']:+.6f}\`")
              print(f"- FULL wins vs Transformer: \`{x['full_wins']}/3\`")
              print(f"- FULL/Transformer train throughput: \`{x['full_training_tps_ratio']:.3f}x\`")
          for name, e in r["effects"].items():
              print(f"- {name}: supported=\`{e['supported']}\`, ablation={e['ablation']}, mean effect(ablation-FULL)=\`{e['mean_effect']:+.6f}\`, FULL wins=\`{e['full_wins']}/3\`")
          print("- breakthrough claim authorized: \`false\`")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1247/comments"             -F body=@/tmp/mechanism-comment.txt

      - name: Record failed panel
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1247/comments"             -f body="CPW-v0 mechanism panel failed for source ${SOURCE_SHA}. No rerun of consumed scientific identities is authorized."
