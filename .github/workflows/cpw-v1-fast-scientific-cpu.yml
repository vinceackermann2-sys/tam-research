name: CPW-v1-fast scientific zero-GPU gate

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'modal_cpw_v1_fast_scientific_1250.py'
      - 'tests/test_cpw_v1_fast_scientific_1250.py'
      - '.github/workflows/cpw-v1-fast-scientific-cpu.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install tests
        run: pip install -e '.[test]'
      - name: Protect frozen scientific architecture and fast backend
        run: |
          git diff --exit-code 531a2a417a39b87c5ee86694916b2640d12b7381 HEAD -- \
            tam_research/cpw_v1 \
            tests/test_cpw_v1_1248.py \
            docs/CPW_V1_ARCHITECTURE.md
          git diff --exit-code c1c395fe6fce8c4184651938f162058cf6fd7d7f HEAD -- \
            tam_research/cpw_v1_fast \
            tests/test_cpw_v1_fast_1249.py
      - name: Scientific source contracts
        run: |
          python -m compileall -q modal_cpw_v1_fast_scientific_1250.py tam_research/cpw_v1 tam_research/cpw_v1_fast
          pytest -q \
            tests/test_cpw_v1_1248.py \
            tests/test_cpw_v1_fast_1249.py \
            tests/test_cpw_v1_fast_scientific_1250.py

# registration-trigger: cpw-v1-fast-scientific-stage0
