name: AERA v26.9 issue602 identity weight visibility L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  issue602-identity-weight-visibility:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-9-issue602-identity-weight-visibility-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue602 harness
        run: |
          python -m py_compile modal_aera_v26_9_issue602_identity_weight_visibility_l4_app.py
          python -m py_compile tam_research/aera_v26_9_issue602_identity_weight_visibility_probe.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify canonical authorized issue602 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/602" --jq '.title')" = "[research] AERA-v26.9 identity-weight-visibility READ L4 gate after #600"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/602" --jq '.state')" = "open"

          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100"               --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue602-identity-weight-visibility-l4]")) | .number'               | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bind_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bind_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bind_lines}" | sed -n '1p')"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 37d2352050730c75dff0ab4b547e990b7865a95d HEAD

          auth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/602/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #602 sole L4 READ gate authorization")) | .id' | wc -l | tr -d ' ')"
          test "${auth_count}" = "1"
          auth_body="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/602/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #602 sole L4 READ gate authorization")) | .body')"
          auth_lines="$(printf '%s\n' "${auth_body}" | sed -n 's/^Authorize main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${auth_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "${auth_lines}" | sed -n '1p')" = "${bound_main}"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/601" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/601" --jq '.merge_commit_sha')" = "37d2352050730c75dff0ab4b547e990b7865a95d"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/601" --jq '.head.sha')" = "5f85075ea110ca802cd465737ddc90ae1e9aef65"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33778674883" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33778674883" --jq '.head_sha')" = "5f85075ea110ca802cd465737ddc90ae1e9aef65"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33778674883" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100726674396" --jq '.conclusion')" = "success"

          test "$(git hash-object tam_research/aera_v26_9_issue602_identity_weight_visibility_probe.py)" = "456203f515d67d1c92b0a9c3e0e59ce4137ac10a"
          test "$(git hash-object modal_aera_v26_9_issue602_identity_weight_visibility_l4_app.py)" = "55bddd82c51a7740096d5460e1f6567557a3af81"
          test "$(git hash-object tests/test_aera_v26_9_issue602_identity_weight_visibility_l4_cpu.py)" = "e530ff12f0d0f0189f8d064526f6da45fa1dff0f"
          test "$(git hash-object tam_research/aera_hardware_core_v26_9_ficem_read_identity_weight_visibility.py)" = "b81cc209f5d95abbe1fb8bd620c78e87c067bc19"
          test "$(git hash-object tam_research/aera_hardware_core_v26_8_ficem_read_mixed_strength_precision.py)" = "3575c58d1cd730be77649f087908c51dbf3e6088"
          test "$(git hash-object tam_research/aera_v26_8_issue558_ficem_read_mixed_strength_precision_probe.py)" = "99ab8252f2b594404aae1ca86752eaa902eb80a5"
          test "$(git hash-object tam_research/aera_v26_7_issue553_ficem_read_mixed_dtype_probe.py)" = "ff9a47f510be07e8adeff018f327338147163cdb"

          test "$(grep -c 'gpu="L4"' modal_aera_v26_9_issue602_identity_weight_visibility_l4_app.py)" = "1"
          test "$(grep -c 'run_identity_weight_visibility_gate_v26_9_issue602(' modal_aera_v26_9_issue602_identity_weight_visibility_l4_app.py)" = "1"
          echo "bound_main=${bound_main}" >> "$GITHUB_OUTPUT"

      - name: Record issue602 gate start
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #602 identity-weight-visibility READ gate started** — exact authorized main, CPU-green #601 evidence, and immutable harness blobs verified. One L4 gate only; no model, checkpoint, corpus, training, systems execution, or higher scientific step." || true

      - name: Recheck canonical trigger immediately before Modal
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100"               --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue602-identity-weight-visibility-l4]")) | .number'               | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.bound_main }}"

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue602 L4 READ gate
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal run modal_aera_v26_9_issue602_identity_weight_visibility_l4_app.py 2>&1 | tee /tmp/issue602.log
          test "$(grep -c '^AERA_V26_9_ISSUE602_IDENTITY_WEIGHT_VISIBILITY_RESULT_JSON=' /tmp/issue602.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE602_IDENTITY_WEIGHT_VISIBILITY_SUMMARY_JSON=' /tmp/issue602.log)" = "1"

      - name: Record issue602 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          if test -f /tmp/issue602.log; then
            summary="$(grep '^AERA_V26_9_ISSUE602_IDENTITY_WEIGHT_VISIBILITY_SUMMARY_JSON=' /tmp/issue602.log | tail -1 | sed 's/^AERA_V26_9_ISSUE602_IDENTITY_WEIGHT_VISIBILITY_SUMMARY_JSON=//')"
            result="$(grep '^AERA_V26_9_ISSUE602_IDENTITY_WEIGHT_VISIBILITY_RESULT_JSON=' /tmp/issue602.log | tail -1 | sed 's/^AERA_V26_9_ISSUE602_IDENTITY_WEIGHT_VISIBILITY_RESULT_JSON=//')"
            if test -n "${result}"; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #602 authoritative identity-weight-visibility READ gate**\n\nResult: \`${result}\`\n\nSummary: \`${summary}\`\n\nPrimitive READ evidence only. No automatic end-to-end systems execution, architecture freeze, S2, fresh scientific seed, replication, 100M scaling, or breakthrough claim is authorized." || true
            fi
          fi
