name: RLT light-state low-batch quality-sec calibration 20261007 AG

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-lightstate-lowbatch-qualitysec-20261007-ag.yml

permissions:
  contents: write

concurrency:
  group: rlt-systems-lightstate-lowbatch-qualitysec-20261007-ag
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-lightstate-lowbatch-qualitysec-modal-20261007-ag
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-lightstate-lowbatch-qualitysec-modal-20261007-ag.json
      LAUNCHER_PATH: experiments/rlt/modal_lightstate_lowbatch_qualitysec_calibration_ag.py
      AD_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-qualitysec-batch-modal-20261003-ad.json
      AE_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae.json
      B_PATH: experiments/rlt/modal/results/rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b.json
      AF_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-compileorder-modal-20261007-af.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-lightstate-lowbatch-qualitysec-20261007-ag.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-lightstate-lowbatch-qualitysec-modal-20261007-ag.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-lowbatch-qualitysec-modal-20261007-ag.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed AG
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          echo "JOB_BLOB_SHA=$JOB_BLOB_SHA" >> "$GITHUB_ENV"
          echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA" >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-systems-lightstate-lowbatch-qualitysec-modal-20261007-ag',
            'task':'systems_lightstate_lowbatch_qualitysec_ag',
            'engineering_seed':20261049,
            'batch_seed':20271049,
            'eval_seed':20291049,
            'compile_probe_seed':20301049,
            'training_data_seed':20260924,
            'requires_batch_calibration_job_id':'rlt-systems-lightstate-qualitysec-batch-modal-20261003-ad',
            'requires_optimizer_calibration_job_id':'rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae',
            'requires_compute_match_job_id':'rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b',
            'requires_compileorder_job_id':'rlt-systems-lightstate-compileorder-modal-20261007-af',
            'batch_sizes':[16,32,48,64],
            'time_budget_seconds_each':60.0,
            'learning_rate':0.001,
            'schedule':'constant',
            'seq_len':64,
            'train_tokens':6000000,
            'val_tokens':500000,
            'expected_parameters':15129344,
            'automatic_retry':False,
          },j
          PY

      - name: Refuse reused AG seeds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          current=Path('experiments/rlt/modal/jobs/rlt-systems-lightstate-lowbatch-qualitysec-modal-20261007-ag.json')
          targets={20261049,20271049,20291049,20301049}
          collisions=[]
          def walk(v):
              if isinstance(v,dict):
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
              elif isinstance(v,int): yield v
          for root in [Path('experiments/rlt/modal/jobs'),Path('experiments/rlt/modal/claims')]:
              for p in sorted(root.glob('*.json')):
                  if p==current: continue
                  try: obj=json.loads(p.read_text())
                  except Exception: continue
                  overlap=targets.intersection(walk(obj))
                  if overlap: collisions.append((str(p),sorted(overlap)))
          assert not collisions,collisions
          print('AG seeds unused:',sorted(targets))
          PY

      - name: Require frozen predecessor evidence
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$AD_PATH" >/tmp/ad.json
          git show "origin/$BRANCH:$AE_PATH" >/tmp/ae.json
          git show "origin/$BRANCH:$B_PATH" >/tmp/b.json
          git show "origin/$BRANCH:$AF_PATH" >/tmp/af.json
          python - <<'PY'
          import json
          H1='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907'
          H2='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2'
          ad=json.load(open('/tmp/ad.json'))
          assert ad.get('job_id')=='rlt-systems-lightstate-qualitysec-batch-modal-20261003-ad',ad
          assert ad.get('status')=='complete' and ad.get('engineering_only') is True,ad
          assert ad.get('scientific_execution') is False and ad.get('data_hashes_match_claim') is True,ad
          assert ad.get('classification')=='PASS_SCALE15M_LIGHTSTATE_QUALITYSEC_BATCH_CALIBRATION',ad
          assert ad.get('wrapper_semantic_equivalence',{}).get('passed') is True,ad
          assert ad['best_by_final_nll']['batch_size']==64,ad['best_by_final_nll']
          assert ad['data']['train_sha256']==H1 and ad['data']['val_sha256']==H2,ad['data']

          ae=json.load(open('/tmp/ae.json'))
          assert ae.get('job_id')=='rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae',ae
          assert ae.get('status')=='complete' and ae.get('engineering_only') is True,ae
          assert ae.get('scientific_execution') is False and ae.get('data_hashes_match_claim') is True,ae
          assert ae.get('classification')=='PASS_SCALE15M_LIGHTSTATE_OPTIMIZER_QUALITYSEC_CALIBRATION',ae
          assert ae.get('wrapper_semantic_equivalence',{}).get('passed') is True,ae
          c=ae['best_by_final_nll']['candidate']
          assert c=={'learning_rate':0.001,'name':'constant_lr1e-3','schedule':'constant'},c
          assert ae['data']['train_sha256']==H1 and ae['data']['val_sha256']==H2,ae['data']

          b=json.load(open('/tmp/b.json'))
          assert b.get('job_id')=='rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b',b
          assert b.get('status')=='complete' and b.get('data_hashes_match_claim') is True,b
          assert b.get('exact_parameter_match_verified') is True,b
          comp=b['comparison']
          assert comp['classification']=='COMPUTE_MATCHED_LIGHTSTATE_OPTIMIZER_TUNED_SCALE15M_60S_NO_RLT_QUALITY_ADVANTAGE',comp
          assert comp['breakthrough_claim_supported'] is False,comp
          assert comp['semantic_equivalence']['passed'] is True,comp
          assert float(comp['derived']['lightstate_minus_transformer_final_nll'])>0.0,comp

          af=json.load(open('/tmp/af.json'))
          assert af.get('job_id')=='rlt-systems-lightstate-compileorder-modal-20261007-af',af
          assert af.get('status')=='complete' and af.get('engineering_only') is True,af
          assert af.get('scientific_execution') is False and af.get('data_hashes_match_claim') is True,af
          assert af.get('classification')=='NO_LARGE_COMPILEORDER_THROUGHPUT_EFFECT',af
          PY

      - name: Install zero-GPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'modal>=1.5.4,<1.6' 'numpy>=2.0,<3' 'datasets>=4.0,<5' 'transformers>=4.55,<5' 'tokenizers>=0.21,<1' 'huggingface-hub>=0.34,<1'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2";
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B";
          else SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"; fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          echo "MODAL_ACCOUNT_SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_ID=$ID" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Validate AG source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$LAUNCHER_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/modal_lightstate_lowbatch_qualitysec_calibration_ag.py').read_text()
          for x in [
            'JOB_ID = "rlt-systems-lightstate-lowbatch-qualitysec-modal-20261007-ag"',
            'ENGINEERING_SEED = 20_261_049',
            'BATCH_SEED = 20_271_049',
            'EVAL_SEED = 20_291_049',
            'COMPILE_PROBE_SEED = 20_301_049',
            'BATCH_SIZES = (16, 32, 48, 64)',
            'TIME_BUDGET_SECONDS = 60.0',
            'LEARNING_RATE = 1e-3',
            'EXPECTED_PARAMETERS = 15_129_344',
            'CompilableLightStateRLT',
            'PASS_SCALE15M_LIGHTSTATE_LOWBATCH_QUALITYSEC_CALIBRATION',
            'RLT_SYSTEMS_LIGHTSTATE_LOWBATCH_QUALITYSEC_AG_RESULT_B64=',
            'gpu="A100-80GB"',
            'retries=0',
          ]: assert x in s,x
          PY

      - name: Reproduce pinned D data bytes before claim
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import hashlib,json,pathlib
          import numpy as np
          from datasets import load_dataset
          from transformers import AutoTokenizer
          train_tokens=6000000; val_tokens=500000; seed=20260924
          tok=AutoTokenizer.from_pretrained('gpt2',use_fast=True)
          stream=load_dataset('HuggingFaceFW/fineweb-edu',name='sample-10BT',split='train',streaming=True)
          stream=stream.shuffle(seed=seed,buffer_size=10000)
          target=train_tokens+val_tokens; chunks=[]; total=0
          for row in stream:
              txt=row.get('text') or ''
              if not txt: continue
              ids=tok.encode(txt,add_special_tokens=False); ids.append(tok.eos_token_id)
              a=np.asarray(ids,dtype=np.uint16); chunks.append(a); total+=len(a)
              if total>=target: break
          assert total>=target,(total,target)
          all_tokens=np.concatenate(chunks)[:target]
          tp=pathlib.Path('/tmp/ag-train.bin'); vp=pathlib.Path('/tmp/ag-val.bin')
          all_tokens[:train_tokens].tofile(tp); all_tokens[train_tokens:].tofile(vp)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          th,vh=sha(tp),sha(vp)
          assert th=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',th
          assert vh=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',vh
          pathlib.Path('/tmp/ag-data.json').write_text(json.dumps({'seed':seed,'train_sha256':th,'val_sha256':vh,'train_tokens':train_tokens,'val_tokens':val_tokens},indent=2,sort_keys=True)+'\n')
          PY
          RC=$?
          set -e
          test -f /tmp/ag-data.json
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 134 ]; then exit "$RC"; fi

      - name: Run non-GPU Modal preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit AG zero-GPU preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_SYSTEMS_LIGHTSTATE_LOWBATCH_QUALITYSEC_AG_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],'engineering_only':True,
            'scientific_execution':False,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'reference_data':json.load(open('/tmp/ag-data.json')),
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt systems: record light-state low-batch quality-sec AG preflight'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Claim one-shot AG calibration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open(os.environ['DIAGNOSTIC_PATH']))
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_seed':20261049,'batch_seed':20271049,'eval_seed':20291049,'compile_probe_seed':20301049,
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],'engineering_only':True,'scientific_execution':False,
            'train_sha256':d['reference_data']['train_sha256'],'val_sha256':d['reference_data']['val_sha256'],
            'automatic_retry_authorized':False,'job':json.load(open(os.environ['JOB_PATH'])),
          },indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100-80GB calibration"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal AG calibration
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 110m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_SYSTEMS_LIGHTSTATE_LOWBATCH_QUALITYSEC_AG_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize durable AG result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try: p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception: p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                 'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                 'error':f'Modal CLI rc={rc}; no parseable terminal payload','log_tail':log[-6000:],
                 'scientific_conclusion':None,'engineering_only':True,'scientific_execution':False}
          claim=json.load(open(os.environ['CLAIM_PATH']))
          d=p.get('data') or {}
          p.update({'modal_cli_rc':rc,'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
                    'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
                    'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
                    'data_hashes_match_claim':(d.get('train_sha256')==claim['train_sha256'] and d.get('val_sha256')==claim['val_sha256'])})
          out=pathlib.Path(os.environ['RESULT_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize AG
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('classification')=='PASS_SCALE15M_LIGHTSTATE_LOWBATCH_QUALITYSEC_CALIBRATION',r
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          assert r.get('breakthrough_claim_supported') is False,r
          assert r.get('data_hashes_match_claim') is True,r
          assert r.get('wrapper_semantic_equivalence',{}).get('passed') is True,r
          assert [x['batch_size'] for x in r['results']]==[16,32,48,64],r['results']
          assert r['best_by_final_nll']['batch_size'] in {16,32,48,64},r['best_by_final_nll']
          print('best_by_final_nll:',r['best_by_final_nll'])
          PY
