name: RLT same-seed block quality sweep 2M 20260930 AC

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-block-quality-sweep-2m-20260930-ac.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: rlt-block-quality-sweep-2m-20260930-ac
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 155
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-block-quality-sweep-2m-modal-20260930-ac
      JOB_PATH: experiments/rlt/modal/jobs/rlt-block-quality-sweep-2m-modal-20260930-ac.json
      BASE_TRAINER_PATH: experiments/rlt/train_compiled_pair_1m.py
      TRAINER_PATH: experiments/rlt/train_block_quality_sweep_2m_ac.py
      LAUNCHER_PATH: experiments/rlt/modal_block_quality_sweep_2m_ac.py
      BLOCK_MODEL_PATH: experiments/rlt/model_block.py
      AB_PATH: experiments/rlt/modal/results/rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab.json
      BLOCK8_PATH: experiments/rlt/modal/results/rlt-block8-scale15m-paired-4m-modal-20260929-a.json
      BLOCK4_PATH: experiments/rlt/modal/results/rlt-block4-scale15m-paired-4m-modal-20260929-a.json
      BLOCK2_PATH: experiments/rlt/modal/results/rlt-block2-scale15m-paired-4m-modal-20260930-a.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-block-quality-sweep-2m-20260930-ac.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-block-quality-sweep-2m-modal-20260930-ac.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-block-quality-sweep-2m-modal-20260930-ac.json
      VOLUME_NAME: tam-rlt-block-quality-sweep-ac-account2
      ARTIFACT_NAME: rlt-block-quality-sweep-2m-modal-20260930-ac-checkpoints
      EXPECTED_TRAIN_SHA256: 0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907
      EXPECTED_VAL_SHA256: e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed AC attempt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          BASE_TRAINER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$BASE_TRAINER_PATH")"
          TRAINER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$TRAINER_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          BLOCK_MODEL_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$BLOCK_MODEL_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "BASE_TRAINER_BLOB_SHA=$BASE_TRAINER_BLOB_SHA"
            echo "TRAINER_BLOB_SHA=$TRAINER_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
            echo "BLOCK_MODEL_BLOB_SHA=$BLOCK_MODEL_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-block-quality-sweep-2m-modal-20260930-ac',
            'task':'block_quality_sweep_2m_ac',
            'scientific_seed':20261039,
            'training_data_seed':20260924,
            'requires_block_sweep_job_id':'rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab',
            'requires_block8_quality_job_id':'rlt-block8-scale15m-paired-4m-modal-20260929-a',
            'requires_block4_quality_job_id':'rlt-block4-scale15m-paired-4m-modal-20260929-a',
            'requires_block2_quality_job_id':'rlt-block2-scale15m-paired-4m-modal-20260930-a',
            'token_budget':2097152,'seq_len':64,'micro_batch_size':16,'grad_accum_steps':1,
            'train_tokens':6000000,'val_tokens':500000,
            'expected_parameters_each':15129344,
            'checkpoint_volume':'tam-rlt-block-quality-sweep-ac-account2',
            'automatic_retry':False,
          },j
          PY

      - name: Require AB and completed block quality evidence
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$AB_PATH" >/tmp/ab.json
          git show "origin/$BRANCH:$BLOCK8_PATH" >/tmp/b8.json
          git show "origin/$BRANCH:$BLOCK4_PATH" >/tmp/b4.json
          git show "origin/$BRANCH:$BLOCK2_PATH" >/tmp/b2.json
          python - <<'PY'
          import json,os
          ab=json.load(open('/tmp/ab.json'))
          assert ab.get('job_id')=='rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab',ab
          assert ab.get('status')=='complete' and ab.get('classification')=='PASS_BLOCK_SWEEP_SCALE15M_BATCH768',ab
          assert ab.get('engineering_only') is True and ab.get('scientific_execution') is False,ab
          v=ab['implementation_validation']
          assert v['block_size_1_exact_reference_equivalence']['passed'] is True,v
          assert v['block_size_1_exact_reference_equivalence']['grad_max_abs']==0,v
          assert v['parameter_neutral_and_state_schema_equal'] is True,v
          assert set(v['future_token_causality_by_block_size'])=={'2','4','8'},v
          assert all(x['passed'] is True for x in v['future_token_causality_by_block_size'].values()),v
          assert ab.get('model_blob_sha')==os.environ['BLOCK_MODEL_BLOB_SHA'],ab
          rows={int(x['block_size']):x for x in ab['blocks']}
          assert set(rows)=={2,4,8},rows
          assert all(x['parameters']==15129344 for x in rows.values()),rows

          expected={
            8:('rlt-block8-scale15m-paired-4m-modal-20260929-a','PAIRED_BLOCK8_SCALE15M_4M_NO_RLT_QUALITY_ADVANTAGE'),
            4:('rlt-block4-scale15m-paired-4m-modal-20260929-a','PAIRED_BLOCK4_SCALE15M_4M_NO_RLT_QUALITY_ADVANTAGE'),
            2:('rlt-block2-scale15m-paired-4m-modal-20260930-a','PAIRED_BLOCK2_SCALE15M_4M_NO_RLT_QUALITY_ADVANTAGE'),
          }
          for bs,path in [(8,'/tmp/b8.json'),(4,'/tmp/b4.json'),(2,'/tmp/b2.json')]:
              r=json.load(open(path)); jid,cls=expected[bs]
              assert r.get('job_id')==jid and r.get('status')=='complete',r
              assert r.get('data_hashes_match_claim') is True and r.get('exact_parameter_match_verified') is True,r
              c=r['comparison']
              assert c['classification']==cls,c
              assert c['architecture_test']['block_size']==bs,c
              assert c['architecture_test'][f'block{bs}_parameters']==15129344,c
              assert c['transformer']['parameters']==15129344,c
              assert c['semantic_equivalence']['passed'] is True,c
              assert float(c['derived']['rlt_minus_transformer_final_nll'])>0.0,c
          PY

      - name: Install zero-GPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'modal>=1.5.4,<1.6' 'numpy>=2.0,<3' 'datasets>=4.0,<5' \
            'transformers>=4.55,<5' 'tokenizers>=0.21,<1' 'huggingface-hub>=0.34,<1'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Validate AC sweep sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/rlt/modal_preflight.py "$BASE_TRAINER_PATH" "$TRAINER_PATH" "$LAUNCHER_PATH" "$BLOCK_MODEL_PATH"
          python - <<'PY'
          from pathlib import Path
          t=Path('experiments/rlt/train_block_quality_sweep_2m_ac.py').read_text()
          m=Path('experiments/rlt/modal_block_quality_sweep_2m_ac.py').read_text()
          b=Path('experiments/rlt/model_block.py').read_text()
          for x in [
            'SCIENTIFIC_SEED = 20_261_039','PAIRED_BATCH_SEED = 20_271_039',
            'PAIRED_EVAL_SEED = 20_291_039','COMPILE_PROBE_SEED = 20_301_039',
            'TOKEN_BUDGET = 2_097_152','BLOCK_SIZES = (1, 2, 4, 8)',
            'EXPECTED_PARAMETERS = 15_129_344','base.SEQ_LEN = seq_len',
            'base.MICRO_BATCH_SIZE = micro_batch_size','base.GRAD_ACCUM_STEPS = grad_accum_steps',
            'transformer_control_consistency','quality_penalty_vs_block1_nll',
            'BLOCK_QUALITY_SWEEP_2M_COMPLETE',
          ]: assert x in t,x
          for x in [
            'JOB_ID = "rlt-block-quality-sweep-2m-modal-20260930-ac"',
            'SCIENTIFIC_SEED = 20_261_039',
            'CHECKPOINT_VOLUME = "tam-rlt-block-quality-sweep-ac-account2"',
            '"token_budget": 2_097_152','"expected_parameters_each": 15_129_344',
            'RLT_BLOCK_QUALITY_SWEEP_2M_AC_RESULT_B64=',
            'gpu="A100-80GB"','retries=0',
          ]: assert x in m,x
          assert 'if self.block_size == 1:' in b and 'return super().forward(tokens)' in b
          PY

      - name: Reproduce pinned D data bytes before claim
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import hashlib,json,pathlib
          import numpy as np
          from datasets import load_dataset
          from transformers import AutoTokenizer
          train_tokens=6000000; val_tokens=500000; seed=20260924
          tok=AutoTokenizer.from_pretrained('gpt2',use_fast=True)
          stream=load_dataset('HuggingFaceFW/fineweb-edu',name='sample-10BT',split='train',streaming=True)
          stream=stream.shuffle(seed=seed,buffer_size=10000)
          target=train_tokens+val_tokens; chunks=[]; total=0
          for row in stream:
              text=row.get('text') or ''
              if not text: continue
              ids=tok.encode(text,add_special_tokens=False); ids.append(tok.eos_token_id)
              a=np.asarray(ids,dtype=np.uint16); chunks.append(a); total+=len(a)
              if total>=target: break
          assert total>=target,(total,target)
          all_tokens=np.concatenate(chunks)[:target]
          tp=pathlib.Path('/tmp/ac-train.bin'); vp=pathlib.Path('/tmp/ac-val.bin')
          all_tokens[:train_tokens].tofile(tp); all_tokens[train_tokens:].tofile(vp)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          th,vh=sha(tp),sha(vp)
          assert th=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',th
          assert vh=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',vh
          pathlib.Path('/tmp/ac-data.json').write_text(json.dumps({
            'seed':seed,'train_tokens':train_tokens,'val_tokens':val_tokens,
            'train_sha256':th,'val_sha256':vh,
          },indent=2,sort_keys=True)+'\n')
          PY
          RC=$?
          set -e
          test -f /tmp/ac-data.json
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 134 ]; then exit "$RC"; fi

      - name: Run non-GPU Modal preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit durable AC preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_BLOCK_QUALITY_SWEEP_2M_AC_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'base_trainer_blob_sha':os.environ['BASE_TRAINER_BLOB_SHA'],
            'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'block_model_blob_sha':os.environ['BLOCK_MODEL_BLOB_SHA'],
            'scientific_execution':False,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'expected_parameters_each':15129344,
            'reference_data':json.load(open('/tmp/ac-data.json')),
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt: record AC same-seed block sweep zero-GPU preflight'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Commit one-shot AC scientific claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open('/tmp/ac-data.json'))
          payload={
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'base_trainer_blob_sha':os.environ['BASE_TRAINER_BLOB_SHA'],
            'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'block_model_blob_sha':os.environ['BLOCK_MODEL_BLOB_SHA'],
            'scientific_seed':20261039,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'expected_parameters_each':15129344,
            'train_sha256':d['train_sha256'],'val_sha256':d['val_sha256'],
            'automatic_retry_authorized':False,
            'job':json.load(open(os.environ['JOB_PATH'])),
          }
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt: claim $JOB_ID before A100-80GB execution"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal A100-80GB AC sweep
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 132m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_BLOCK_QUALITY_SWEEP_2M_AC_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Decode AC terminal payload
        id: decode
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); payload=None
          if b:
              try: payload=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception: payload=None
          if not isinstance(payload,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              payload={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                'error':f'Modal CLI rc={rc}; no parseable terminal payload','log_tail':log[-6000:],
                'scientific_conclusion':None}
          pathlib.Path('/tmp/ac-result.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('AC_STATUS='+str(payload.get('status','unknown'))+'\n')
          PY

      - name: Export and verify AC checkpoints
        id: export
        if: env.AC_STATUS == 'complete'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ac-checkpoints; mkdir -p /tmp/ac-checkpoints
          modal volume get "$VOLUME_NAME" "$JOB_ID" /tmp/ac-checkpoints
          python - <<'PY'
          import hashlib,json,pathlib
          r=json.load(open('/tmp/ac-result.json')); root=pathlib.Path('/tmp/ac-checkpoints')
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          for bs in (1,2,4,8):
              rec=r['checkpoint_durability']['blocks'][str(bs)]
              rs=[p for p in root.rglob('rlt_final.pt') if p.parent.name==f'block{bs}']
              ts=[p for p in root.rglob('transformer_final.pt') if p.parent.name==f'block{bs}']
              assert len(rs)==1 and len(ts)==1,(bs,rs,ts)
              assert sha(rs[0])==rec['rlt']['sha256'],(bs,'rlt')
              assert sha(ts[0])==rec['transformer']['sha256'],(bs,'transformer')
          assert r['checkpoint_durability']['modal_volume_committed'] is True
          PY

      - name: Upload AC checkpoint artifact
        id: upload
        if: env.AC_STATUS == 'complete' && steps.export.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/ac-checkpoints
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Materialize durable AC result
        if: always()
        shell: bash
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os,pathlib
          payload=json.load(open('/tmp/ac-result.json')); claim=json.load(open(os.environ['CLAIM_PATH']))
          dh=payload.get('data_sha256') or {}; c=payload.get('comparison') or {}
          summaries=c.get('summaries') or []
          payload.update({
            'modal_cli_rc':int(os.environ.get('MODAL_RC','999')),
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'base_trainer_blob_sha':os.environ['BASE_TRAINER_BLOB_SHA'],
            'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'block_model_blob_sha':os.environ['BLOCK_MODEL_BLOB_SHA'],
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'data_hashes_match_claim':(
              dh.get('train.bin')==claim['train_sha256'] and dh.get('val.bin')==claim['val_sha256']
            ),
            'exact_parameter_match_verified':(
              len(summaries)==4 and {x.get('block_size') for x in summaries}=={1,2,4,8}
              and all((c.get('pairs') or {}).get(str(x['block_size']),{}).get('rlt',{}).get('parameters')==15129344 for x in summaries)
              and all((c.get('pairs') or {}).get(str(x['block_size']),{}).get('transformer',{}).get('parameters')==15129344 for x in summaries)
            ),
            'checkpoint_export':{
              'modal_volume_get_outcome':os.environ.get('EXPORT_OUTCOME',''),
              'github_artifact_upload_outcome':os.environ.get('UPLOAD_OUTCOME',''),
              'github_artifact_id':os.environ.get('ARTIFACT_ID',''),
              'github_artifact_digest':os.environ.get('ARTIFACT_DIGEST',''),
              'github_artifact_name':os.environ['ARTIFACT_NAME'],
              'github_run_id':os.environ['GITHUB_RUN_ID'],
            },
          })
          p=pathlib.Path(os.environ['RESULT_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize AC sweep
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('data_hashes_match_claim') is True,r
          assert r.get('exact_parameter_match_verified') is True,r
          c=r['comparison']
          assert c['classification']=='BLOCK_QUALITY_SWEEP_2M_COMPLETE',c
          assert c['breakthrough_claim_supported'] is False,c
          assert c['transformer_control_consistency']['passed'] is True,c
          rows=c['summaries']; assert [x['block_size'] for x in rows]==[1,2,4,8],rows
          assert all(x['semantic_equivalence']['passed'] is True for x in rows),rows
          e=r['checkpoint_export']
          assert e['modal_volume_get_outcome']=='success' and e['github_artifact_upload_outcome']=='success',e
          print('Transformer control spread:',c['transformer_control_consistency']['max_minus_min_nll'])
          for x in rows:
              print('block',x['block_size'],'NLL',x['rlt_final_nll'],
                    'delta-vs-transformer',x['rlt_minus_transformer_final_nll'],
                    'penalty-vs-block1',x['quality_penalty_vs_block1_nll'])
          print('best non1:',c['best_non1_by_quality_penalty'])
          PY
