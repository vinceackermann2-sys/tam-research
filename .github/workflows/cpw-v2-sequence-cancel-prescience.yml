name: CPW-v2 sequence cancel pre-science run

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/CANCEL_V2_SEQUENCE_PRESCIENCE.json'

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate cancellation authority
        run: |
          python - <<'PY'
          import json
          x=json.load(open('cpw/CANCEL_V2_SEQUENCE_PRESCIENCE.json'))
          assert x == {'issue': 1255, 'run_id': 37326506123, 'reason': 'pre-science-data-guard'}
          PY
      - name: Cancel pre-science run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/37326506123/cancel"
      - name: Record cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1255/comments" -f body="Cancelled workflow run 37326506123 after read-only inspection proved ATTEMPT/RESULT/FAILURE absent. Scientific seeds remain unconsumed."
