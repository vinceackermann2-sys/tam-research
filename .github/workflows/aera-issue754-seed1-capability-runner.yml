name: AERA issue754 seed1 capability preauth and scientific runner

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-issue754-seed1-capability-runner
  cancel-in-progress: false

jobs:
  issue754-seed1:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[aera-issue748-memory-capability-seed1-preauth]') ||
       startsWith(github.event.issue.title, '[aera-issue748-memory-capability-seed1-l4]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue754 runner
        run: python -m py_compile modal_aera_issue754_seed1_capability_runner.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue754 immutable boundary and select mode
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/754" --jq '.title')" = "[infra] AERA #748 seed1 Modal preauth/scientific-runner implementation after merged #753"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/754" --jq '.state')" = "open"

          freeze_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/754/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #754 pre-implementation seed1 Modal runner freeze")) | .id' | wc -l | tr -d ' ')"
          test "${freeze_count}" = "1"
          freeze_comment="$(gh api "repos/${GITHUB_REPOSITORY}/issues/754/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #754 pre-implementation seed1 Modal runner freeze")) | .body')"

          printf '%s\n' "${freeze_comment}" | grep -F 'SOURCE_MAIN=bb4c01c71deed63c94b89d91c9a713fa2a0f3b34' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'SOURCE_TREE=3caa58461f9d0513c8564210b2e8179897abbfc4' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'BRANCH=infra/aera-issue754-seed1-modal-runner-v1' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PREAUTH_PREFIX=[aera-issue748-memory-capability-seed1-preauth]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'L4_PREFIX=[aera-issue748-memory-capability-seed1-l4]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'RESULT_PATH=/vol/aera-capability/issue748-memory-capability-seed1/result.json' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'CHECKPOINT_DIR=/vol/aera-capability/issue748-memory-capability-seed1/checkpoints' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'MODEL_SEED=17641' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'HARNESS_WRAPPER_BLOB=afc939a69633f68ded05eb585c95a599a8f5c981' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'HARNESS_BASE_BLOB=40003b68987d026265b1d53fcb637f18277f9cac' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PROTOCOL_BLOB=8bd8d646a72c0d5a2b1cbe7bedddc25bff6b43bf' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'CPU_TEST_BLOB=5ad56721532353a1b9d71fac4a470b4b1e1fa704' >/dev/null

          runner_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^RUNNER_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          workflow_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^WORKFLOW_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          runner_test_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^RUNNER_TEST_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_tree="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^FROZEN_TREE=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_commit="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^FROZEN_COMMIT=\([0-9a-f]\{40\}\)$/\1/p')"
          test -n "${runner_blob}" && test -n "${workflow_blob}" && test -n "${runner_test_blob}" && test -n "${frozen_tree}" && test -n "${frozen_commit}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"

          git cat-file -e "${bound_main}^{commit}"
          git checkout --detach "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor bb4c01c71deed63c94b89d91c9a713fa2a0f3b34 "${bound_main}"
          test "$(git rev-parse bb4c01c71deed63c94b89d91c9a713fa2a0f3b34^{tree})" = "3caa58461f9d0513c8564210b2e8179897abbfc4"
          git cat-file -e "${frozen_commit}^{commit}"
          test "$(git rev-parse "${frozen_commit}^{tree}")" = "${frozen_tree}"
          git merge-base --is-ancestor "${frozen_commit}" "${bound_main}"

          test "$(git hash-object modal_aera_issue754_seed1_capability_runner.py)" = "${runner_blob}"
          test "$(git hash-object .github/workflows/aera-issue754-seed1-capability-runner.yml)" = "${workflow_blob}"
          test "$(git hash-object tests/test_aera_issue754_seed1_capability_runner_cpu.py)" = "${runner_test_blob}"
          test "$(git hash-object tam_research/aera_issue748_memory_capability_seed1_harness.py)" = "afc939a69633f68ded05eb585c95a599a8f5c981"
          test "$(git hash-object tam_research/aera_issue748_memory_capability_seed1_harness_base.py)" = "40003b68987d026265b1d53fcb637f18277f9cac"
          test "$(git hash-object docs/aera_issue748_seed1_harness_protocol.json)" = "8bd8d646a72c0d5a2b1cbe7bedddc25bff6b43bf"
          test "$(git hash-object tests/test_aera_issue748_memory_capability_seed1_harness.py)" = "5ad56721532353a1b9d71fac4a470b4b1e1fa704"

          title="$(jq -r '.issue.title' "${GITHUB_EVENT_PATH}")"
          if [[ "${title}" == '[aera-issue748-memory-capability-seed1-preauth]'* ]]; then
            mode=preauth
            prefix='[aera-issue748-memory-capability-seed1-preauth]'
            evidence_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔎 **AERA #754/#748 seed1 preauthorization evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${evidence_count}" = "0"
          else
            mode=l4
            prefix='[aera-issue748-memory-capability-seed1-l4]'
            preauth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("🔎 **AERA #754/#748 seed1 preauthorization evidence**")) | select((.body // "") | contains("Bound main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${preauth_count}" = "1"
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/754/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("## #754 sole seed1 L4 scientific authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | select((.body // "") | contains("Authorize seed: `17641`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
            result_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA #754/#748 seed1 scientific evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${result_count}" = "0"
          fi

          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "bound_main=${bound_main}" >> "${GITHUB_OUTPUT}"
          echo "allowed=true" >> "${GITHUB_OUTPUT}"

      - name: Re-verify issue754 trigger immediately before Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          MODE: ${{ steps.guard.outputs.mode }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BOUND_MAIN}"
          if [[ "${MODE}" == "preauth" ]]; then
            prefix='[aera-issue748-memory-capability-seed1-preauth]'
          else
            prefix='[aera-issue748-memory-capability-seed1-l4]'
            preauth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" | jq -r --arg bound "${BOUND_MAIN}" '.[] | select((.body // "") | startswith("🔎 **AERA #754/#748 seed1 preauthorization evidence**")) | select((.body // "") | contains("Bound main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${preauth_count}" = "1"
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/754/comments?per_page=100" | jq -r --arg bound "${BOUND_MAIN}" '.[] | select((.body // "") | startswith("## #754 sole seed1 L4 scientific authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | select((.body // "") | contains("Authorize seed: `17641`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
          fi
          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run issue754 zero-GPU seed1 preauthorization audit
        if: steps.guard.outputs.mode == 'preauth'
        id: preauth
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          modal run modal_aera_issue754_seed1_capability_runner.py::preauth_main 2>&1 | tee /tmp/issue754-preauth.log
          test "$(grep -c '^AERA_ISSUE754_SEED1_PREAUTH_JSON=' /tmp/issue754-preauth.log)" = "1"

      - name: Record issue754 seed1 preauthorization evidence
        if: steps.guard.outputs.mode == 'preauth' && steps.preauth.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          python - <<'PY' >/tmp/issue754-preauth.md
          import json, os
          from pathlib import Path

          prefix = "AERA_ISSUE754_SEED1_PREAUTH_JSON="
          payloads = [
              json.loads(line[len(prefix):])
              for line in Path("/tmp/issue754-preauth.log").read_text().splitlines()
              if line.startswith(prefix)
          ]
          if len(payloads) != 1:
              raise SystemExit("expected one #754 preauth payload")
          p = payloads[0]
          if p.get("runner_issue") != 754 or p.get("research_issue") != 748:
              raise SystemExit("#754/#748 preauth identity drift")
          if p.get("model_seed") != 17641:
              raise SystemExit("#754 seed1 preauth seed drift")
          if p.get("result_absent") is not True or p.get("checkpoint_absent_or_empty") is not True:
              raise SystemExit("#754 seed1 namespace is not fresh")
          for key in (
              "gpu_used",
              "model_constructed",
              "scientific_seed_consumed",
              "training_performed",
              "evaluation_performed",
              "checkpoint_written",
              "result_written",
              "seeds_2_3_authorized",
              "systems_optimization_authorized",
              "architecture_freeze_authorized",
              "s2_authorized",
              "replication_authorized",
              "scaling_authorized",
              "breakthrough_proven",
          ):
              if p.get(key) is not False:
                  raise SystemExit(f"forbidden #754 preauth flag: {key}")
          print("🔎 **AERA #754/#748 seed1 preauthorization evidence**")
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print("Fresh reserved result path absent: `true`.")
          print("Reserved checkpoint directory absent/empty: `true`.")
          print("Seed `17641` remains unconsumed.")
          print("Zero GPU/model/training/evaluation/checkpoint/result/higher-stage authority was used.")
          print("This evidence authorizes no L4 run; a separate exact-main seed1 scientific authorization is still required.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue754-preauth.md)"

      - name: Run issue754 sole seed1 L4 capability gate
        if: steps.guard.outputs.mode == 'l4'
        id: scientific
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          modal run modal_aera_issue754_seed1_capability_runner.py::l4_main 2>&1 | tee /tmp/issue754-l4.log
          test "$(grep -c '^AERA_ISSUE754_SEED1_PREAUTH_JSON=' /tmp/issue754-l4.log)" = "1"
          test "$(grep -c '^AERA_ISSUE754_SEED1_L4_START_JSON=' /tmp/issue754-l4.log)" = "1"
          test "$(grep -c '^AERA_ISSUE754_SEED1_RESULT_JSON=' /tmp/issue754-l4.log)" = "1"
          test "$(grep -c '^AERA_ISSUE754_SEED1_SUMMARY_JSON=' /tmp/issue754-l4.log)" = "1"

      - name: Record issue754 seed1 scientific evidence
        if: steps.guard.outputs.mode == 'l4' && steps.scientific.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          python - <<'PY' >/tmp/issue754-result.md
          import json, os
          from pathlib import Path

          prefix = "AERA_ISSUE754_SEED1_SUMMARY_JSON="
          payloads = [
              json.loads(line[len(prefix):])
              for line in Path("/tmp/issue754-l4.log").read_text().splitlines()
              if line.startswith(prefix)
          ]
          if len(payloads) != 1:
              raise SystemExit("expected one #754 seed1 summary")
          p = payloads[0]
          if p.get("runner_issue") != 754 or p.get("research_issue") != 748 or p.get("model_seed") != 17641:
              raise SystemExit("#754 seed1 result identity drift")
          for key in (
              "seeds_2_3_authorized",
              "systems_optimization_authorized",
              "architecture_freeze_authorized",
              "scaling_authorized",
              "breakthrough_proven",
          ):
              if p.get(key) is not False:
                  raise SystemExit(f"forbidden #754 seed1 result authority: {key}")

          print("🔬 **AERA #754/#748 seed1 scientific evidence**")
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print("Scientific model seed: `17641` (attempt consumed exactly once).")
          print(f"Status: `{p['status']}`.")
          print(f"Device: `{p['device']}`.")
          if p["status"] == "COMPLETE_FROZEN_SEED1":
              decision = p["decision"]
              print(f"Capability screen pass: `{decision['capability_screen_pass']}`.")
              print(f"Recommendation: `{decision['recommendation']}`.")
              print(f"Equal-token B-A long-distance gain: `{p['equal_token_B_minus_A_long_accuracy']}`.")
              print(f"Equal-GPU-time B-A long-distance gain: `{p['equal_gpu_time_B_minus_A_long_accuracy']}`.")
          else:
              print(f"Failed/incomplete variant: `{p.get('failed_variant')}`.")
              print(f"Recommendation: `{p.get('recommendation')}`.")
          print()
          print("No seeds2/3, systems optimization, architecture freeze, scaling, or breakthrough authority is created automatically.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue754-result.md)"
