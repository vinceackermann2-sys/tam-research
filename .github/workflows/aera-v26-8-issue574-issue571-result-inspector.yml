name: AERA v26.8 issue574 read-only issue571 result inspector

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: aera-v26-8-issue574-issue571-result-inspector
  cancel-in-progress: false

jobs:
  inspect-existing-result:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-8-issue574-issue571-result-inspector]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue574 read-only inspector
        run: python -m py_compile modal_aera_v26_8_issue574_issue571_result_inspector.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify sole CPU-only issue574 inspection boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/574" --jq '.title')" = "[research] AERA-v26.8 read-only durable #571 systems FAIL localization before any repair"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/574" --jq '.state')" = "open"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/573" --jq '.title')" = "[aera-v26-8-issue571-memory-safe-e2e-systems-l4] sole #571 trigger"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33741700781" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33741700781" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33741700781" --jq '.head_sha')" = "c913d817ee1c1a1fca2d7c7622f4c8ca5353772f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33741700781" --jq '.path')" = ".github/workflows/aera-v26-8-issue571-memory-safe-e2e-systems-l4.yml"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100604889696" --jq '.conclusion')" = "success"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue574-issue571-result-inspector]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"
          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔎 **AERA-v26.8 #574 read-only #571 result inspection**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bind_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bind_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bind_lines}" | sed -n '1p')"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor c913d817ee1c1a1fca2d7c7622f4c8ca5353772f HEAD

          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems.py)" = "c9731cae7e386f09b2a190b045532591c4fa00be"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems_repair1.py)" = "b3f7082b188644007b873db3733492f424d4941a"
          test "$(git hash-object tam_research/aera_v26_6_issue530_end_to_end_systems.py)" = "9d5a3c31f4a3862f96b957540baa2e0ec6a84c6b"
          test "$(git hash-object tam_research/aera_v26_8_issue562_end_to_end_systems.py)" = "3534103eea21f7c4d9d31798ad34601fd47090d6"
          test "$(git hash-object tam_research/aera_v26_8_issue569_end_to_end_systems_memory_safe.py)" = "1eeaa80adb2ae960e2a8dad06031c4ed5ca99203"
          test "$(git hash-object tam_research/aera_hardware_core_v26_8_ficem_read_mixed_strength_precision.py)" = "3575c58d1cd730be77649f087908c51dbf3e6088"
          test "$(git hash-object tam_research/aera_hardware_core_v26_7_ficem_read_mixed_dtype.py)" = "d8133c6b204b1ee5f23955255fb2fb09d09bd723"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"
          test "$(git hash-object tam_research/aera_hardware_core_v26_4_ficem_write_triton.py)" = "e54570292489bd17570038dca7518419ac00418c"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object modal_aera_v26_8_issue571_memory_safe_end_to_end_systems_l4_app.py)" = "d0e88d2ebab5a2df340325b2951ed1517c6945b7"
          test "$(git hash-object modal_aera_v26_8_issue574_issue571_result_inspector.py)" = "e5ff20ff60b0b00e70c1e8d7b1ca8516459d2749"

          grep -q 'SOURCE_RESULT_PATH = "/vol/aera-v26/issue571-memory-safe-end-to-end-systems/result.json"' modal_aera_v26_8_issue574_issue571_result_inspector.py
          grep -q 'SOURCE_RESULT_SHA256 = "afeeb62351cc4fb97d272c5b55c9621839e26f83753ae1fb237733d58a5ee472"' modal_aera_v26_8_issue574_issue571_result_inspector.py
          test "$(grep -c 'gpu=' modal_aera_v26_8_issue574_issue571_result_inspector.py || true)" = "0"
          test "$(grep -c 'volume.commit' modal_aera_v26_8_issue574_issue571_result_inspector.py || true)" = "0"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue574 inspection start (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.8 #574 read-only inspection started** — exact bound main and immutable #571 run/job evidence verified. CPU-only Modal reader; zero GPU/model/checkpoint execution; no volume/result mutation." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Inspect immutable issue571 durable result once
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          modal run modal_aera_v26_8_issue574_issue571_result_inspector.py 2>&1 | tee /tmp/issue574.log
          test "$(grep -c '^AERA_V26_8_ISSUE574_ISSUE571_RESULT_CLASSIFICATION_JSON=' /tmp/issue574.log)" = "1"

      - name: Record issue574 inspection result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >/tmp/issue574-summary.md
          import json
          from pathlib import Path
          prefix = "AERA_V26_8_ISSUE574_ISSUE571_RESULT_CLASSIFICATION_JSON="
          lines = Path('/tmp/issue574.log').read_text().splitlines()
          payload = json.loads([line[len(prefix):] for line in lines if line.startswith(prefix)][-1])
          print('🔎 **AERA-v26.8 #574 read-only #571 result inspection**')
          print()
          print(f"Frozen source SHA verified: `{payload['source_result_sha256']}`; decision remains `{payload['source_decision']}`.")
          for batch in ('8', '64'):
              row = payload['batches'][batch]
              print(f"Batch {batch}: failed gates `{json.dumps(row['failed_gates'])}`; classification `{json.dumps(row['classification'], sort_keys=True)}`")
              print(f"Batch {batch} routing-accounting diff count: `{len(row['routing']['accounting_diff'])}`; raw gate signatures persisted: `{row['routing']['raw_gate_signatures_persisted']}`")
              state = row['state_equivalence']
              print(f"Batch {batch} state: pass=`{state.get('pass')}`, continuous_allclose=`{state.get('continuous_allclose')}`, validity_exact=`{state.get('validity_exact')}`, dtype/device/shape exact=`{state.get('dtype_device_shape_exact')}`, max_continuous_abs=`{state.get('max_continuous_abs')}`")
              sparse = row['physical_sparse']
              print(f"Batch {batch} sparse: pass=`{sparse.get('pass')}`, route=`{sparse.get('sparse_route_exercised')}`, select/merge=`{sparse.get('coalesced_select_merge_positive')}`, backend activity=`{sparse.get('backend_activity_positive')}`, backend names exact=`{sparse.get('backend_names_exact')}`")
          print()
          print('The immutable #571 FAIL is unchanged. Full stored state/sparse/routing-accounting/logit/timing/profile evidence is in the Actions classification marker; this read authorizes no repair or GPU work.')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue574-summary.md)" || true
