name: CHM-v1 100M Stage-C payload/integration pre-authority audit v3

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[modal-chm-v1-100m-stage-c-payload-integration-1064-authority-audit-v3]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_SECONDARY: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
      MODAL_TOKEN_SECRET_SECONDARY: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_LOW_CREDIT_ACCOUNT: ${{ secrets.MODAL_LOW_CREDIT_ACCOUNT }}
      MODAL_MAX_THROTTLE_WAIT: "0"
    steps:
      - name: Resolve immutable audit payload and refuse reruns
        id: cfg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = "1"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg=json.loads(os.environ.get("ISSUE_BODY") or "{}")
          expected={
            "phase":"chm-v1-100m-stage-c-payload-integration-1064-authority-audit-v3",
            "control_issue":1064,
            "prereg_issue":1037,
            "result_root":"/vol/chm-v1/100m-stage-c-payload-integration/issue-1064/v3",
            "supersedes_failed_audit_issue":1066,
            "supersedes_failed_audit_run":36254024967,
          }
          for k,v in expected.items():
              assert cfg.get(k)==v, f"{k} mismatch"
          for k in ("source_sha","source_tree","model_sha","evaluator_sha","decomposition_sha","scientific_impl_sha","runner_sha","scientific_workflow_sha","audit_workflow_sha","dual_account_sha","dual_account_cli_sha","runtime_probe_sha"):
              v=str(cfg.get(k,"")).strip().lower()
              assert re.fullmatch(r"[0-9a-f]{40}",v), k
              print(f"{k}={v}")
          PY

      - name: Checkout exact merged implementation boundary
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 0
          path: source

      - name: Verify current main tree blobs and retired-V8 isolation
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          MODEL_SHA: ${{ steps.cfg.outputs.model_sha }}
          EVALUATOR_SHA: ${{ steps.cfg.outputs.evaluator_sha }}
          DECOMPOSITION_SHA: ${{ steps.cfg.outputs.decomposition_sha }}
          SCIENTIFIC_IMPL_SHA: ${{ steps.cfg.outputs.scientific_impl_sha }}
          RUNNER_SHA: ${{ steps.cfg.outputs.runner_sha }}
          SCIENTIFIC_WORKFLOW_SHA: ${{ steps.cfg.outputs.scientific_workflow_sha }}
          AUDIT_WORKFLOW_SHA: ${{ steps.cfg.outputs.audit_workflow_sha }}
          DUAL_ACCOUNT_SHA: ${{ steps.cfg.outputs.dual_account_sha }}
          DUAL_ACCOUNT_CLI_SHA: ${{ steps.cfg.outputs.dual_account_cli_sha }}
          RUNTIME_PROBE_SHA: ${{ steps.cfg.outputs.runtime_probe_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source fetch --no-tags origin main
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v1_100m_scale.py")" = "$MODEL_SHA"
          test "$MODEL_SHA" = "b9b141c0e52d4fd0fff28b12a3588b2adc659b8f"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v1_100m_stage_c_eval.py")" = "$EVALUATOR_SHA"
          test "$EVALUATOR_SHA" = "863bd038e60da5511503adb0c8e1046a680ed3bd"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v1_100m_stage_c_payload_integration.py")" = "$DECOMPOSITION_SHA"
          test "$DECOMPOSITION_SHA" = "8ab98658d4c8ced33623c2d28ec899b35339997e"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/modal_chm_v1_100m_stage_c_990_v1_impl.py")" = "$SCIENTIFIC_IMPL_SHA"
          test "$SCIENTIFIC_IMPL_SHA" = "fb7fe5f8c2a597f7de9e4d03c6908dc0db9558ac"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/modal_dual_account_v3.py")" = "$DUAL_ACCOUNT_SHA"
          test "$DUAL_ACCOUNT_SHA" = "1b830bd8d160d84ee6643317e99205bffdca450c"
          test "$(git -C source rev-parse "$SOURCE_SHA:scripts/modal_select_account_v3.py")" = "$DUAL_ACCOUNT_CLI_SHA"
          test "$DUAL_ACCOUNT_CLI_SHA" = "440292942066d0b3d3a71d40ca8495092674ce6c"
          test "$(git -C source rev-parse "$SOURCE_SHA:modal_runtime_admission_probe_1067_v1.py")" = "$RUNTIME_PROBE_SHA"
          test "$RUNTIME_PROBE_SHA" = "04b1e9c610195b0896a209eb9d6ce3fd4f014fbc"
          test "$(git -C source rev-parse "$SOURCE_SHA:modal_chm_v1_100m_stage_c_payload_integration_1064_v3.py")" = "$RUNNER_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:.github/workflows/modal-chm-v1-100m-stage-c-payload-integration-1064-v3.yml")" = "$SCIENTIFIC_WORKFLOW_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:.github/workflows/modal-chm-v1-100m-stage-c-payload-integration-1064-authority-audit-v3.yml")" = "$AUDIT_WORKFLOW_SHA"
          for path in             source/modal_chm_v1_100m_stage_c_payload_integration_1064_v3.py             source/.github/workflows/modal-chm-v1-100m-stage-c-payload-integration-1064-v3.yml             source/.github/workflows/modal-chm-v1-100m-stage-c-payload-integration-1064-authority-audit-v3.yml             source/tam_research/chm_v1_100m_stage_c_payload_integration.py; do
            ! grep -F "/vol/chm-v1/100m-stage-c-payload-gate/issue-1017/v8" "$path"
          done

      - name: Verify unique audit trigger and diagnostic trigger absence
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]; trigger_number=int(os.environ["TRIGGER_ISSUE"])
          def gh(path,*extra): return json.loads(subprocess.check_output(["gh","api",path,*extra],text=True))
          def exact_title(title):
              q=f'repo:{repo} is:issue in:title "{title}"'
              found=gh("search/issues","-X","GET","-f",f"q={q}","-f","per_page=100")
              return [x for x in found["items"] if x["title"]==title]
          audit_title="[modal-chm-v1-100m-stage-c-payload-integration-1064-authority-audit-v3]"
          audit=exact_title(audit_title)
          assert len(audit)==1 and audit[0]["number"]==trigger_number
          assert len(exact_title("[modal-chm-v1-100m-stage-c-payload-integration-1064-v3]"))==0
          control=gh(f"repos/{repo}/issues/1064"); assert control["state"]=="open"
          comments=gh(f"repos/{repo}/issues/1064/comments?per_page=100")
          assert not any("CHM_V1_100M_STAGE_C_PAYLOAD_INTEGRATION_FINAL_LAUNCHER_AUTHORITY_V3" in c["body"] for c in comments)
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned Modal CLI
        run: pip install 'modal>=1.5.4,<1.6'

      - name: Select eligible Modal account before any reservation
        id: account
        run: |
          cd source
          PYTHONPATH="$PWD" python scripts/modal_select_account_v3.py --required-volume tam-research-data --runtime-probe-path modal_runtime_admission_probe_1067_v1.py
          cd ..

      - name: Freeze selected account evidence
        id: account_binding
        env:
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
          SELECTED_MODAL_WORKSPACE: ${{ steps.account.outputs.selected_workspace_name }}
          ACCOUNT_SELECTION_EVIDENCE_JSON: ${{ steps.account.outputs.selection_evidence_json }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, os
          account=os.environ["SELECTED_MODAL_ACCOUNT"].strip()
          workspace=os.environ["SELECTED_MODAL_WORKSPACE"].strip()
          evidence=os.environ["ACCOUNT_SELECTION_EVIDENCE_JSON"]
          assert account in {"primary","secondary"} and workspace and evidence
          print(f"selected_modal_account={account}")
          print(f"selected_modal_workspace={workspace}")
          print(f"account_selection_evidence_sha256={hashlib.sha256(evidence.encode()).hexdigest()}")
          PY

      - name: Activate selected Modal account
        env:
          SELECTED_MODAL_ACCOUNT: ${{ steps.account_binding.outputs.selected_modal_account }}
          SECONDARY_CREDENTIAL_ALIASES: ${{ steps.account.outputs.secondary_credential_aliases }}
        run: |
          if [ "$SELECTED_MODAL_ACCOUNT" = "primary" ]; then
            printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
          elif [ "$SELECTED_MODAL_ACCOUNT" = "secondary" ]; then
            case ",$SECONDARY_CREDENTIAL_ALIASES," in
              *,secondary,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_SECONDARY"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_SECONDARY"
                ;;
              *,account2,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_2"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_2"
                ;;
              *,legacy_b,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_B"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_B"
                ;;
              *)
                echo "No resolved secondary credential alias label" >&2
                exit 93
                ;;
            esac
            test -n "$SECONDARY_ID"
            test -n "$SECONDARY_SECRET"
            printf 'MODAL_TOKEN_ID=%s\n' "$SECONDARY_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$SECONDARY_SECRET" >> "$GITHUB_ENV"
          else
            exit 92
          fi

      - name: Verify selected Modal authentication
        run: modal token info

      - name: Read live rates and fail closed on 2-hour cap
        id: rates
        run: |
          modal billing rates --json > modal-rates.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open("modal-rates.json",encoding="utf-8"))
          hourly=float(r["gpu_hour_cost_l4"])+4*float(r["cpu_hour_cost"])+16*float(r["mem_gib_hour_cost"])
          worst=hourly*2.0
          assert hourly>0 and worst<=3.00, worst
          print(f"hourly_resource_usd={hourly:.12f}")
          print(f"worst_case_usd={worst:.12f}")
          PY

      - name: Inspect authoritative source checkpoint and unused namespace
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          MODEL_SHA: ${{ steps.cfg.outputs.model_sha }}
          EVALUATOR_SHA: ${{ steps.cfg.outputs.evaluator_sha }}
          DECOMPOSITION_SHA: ${{ steps.cfg.outputs.decomposition_sha }}
          SCIENTIFIC_IMPL_SHA: ${{ steps.cfg.outputs.scientific_impl_sha }}
          RUNNER_SHA: ${{ steps.cfg.outputs.runner_sha }}
          SCIENTIFIC_WORKFLOW_SHA: ${{ steps.cfg.outputs.scientific_workflow_sha }}
          DUAL_ACCOUNT_SHA: ${{ steps.cfg.outputs.dual_account_sha }}
          DUAL_ACCOUNT_CLI_SHA: ${{ steps.cfg.outputs.dual_account_cli_sha }}
          SELECTED_MODAL_ACCOUNT: ${{ steps.account_binding.outputs.selected_modal_account }}
          SELECTED_MODAL_WORKSPACE: ${{ steps.account_binding.outputs.selected_modal_workspace }}
          ACCOUNT_SELECTION_EVIDENCE_SHA256: ${{ steps.account_binding.outputs.account_selection_evidence_sha256 }}
        run: |
          cd source
          modal run modal_chm_v1_100m_stage_c_payload_integration_1064_v3.py --phase inspect-source --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" --model-sha "$MODEL_SHA" --evaluator-sha "$EVALUATOR_SHA" --decomposition-sha "$DECOMPOSITION_SHA" --scientific-impl-sha "$SCIENTIFIC_IMPL_SHA" --runner-sha "$RUNNER_SHA" --workflow-sha "$SCIENTIFIC_WORKFLOW_SHA" --dual-account-sha "$DUAL_ACCOUNT_SHA" --dual-account-cli-sha "$DUAL_ACCOUNT_CLI_SHA" --selected-modal-account "$SELECTED_MODAL_ACCOUNT" --selected-modal-workspace "$SELECTED_MODAL_WORKSPACE" --account-selection-evidence-sha256 "$ACCOUNT_SELECTION_EVIDENCE_SHA256" | tee ../inspect.log
          cd ..
          python - <<'PY'
          import json
          from pathlib import Path
          lines=Path("inspect.log").read_text().splitlines()
          matches=[x.split("CHM_V1_100M_STAGE_C_PAYLOAD_INTEGRATION_SOURCE=",1)[1] for x in lines if "CHM_V1_100M_STAGE_C_PAYLOAD_INTEGRATION_SOURCE=" in x]
          assert len(matches)==1, len(matches)
          state=json.loads(matches[0])
          assert state["stage_c_stop_verified"] is True
          assert state["first_postmortem_payload_integration_weak_verified"] is True
          assert state["checkpoint_file_exists"] is True
          assert state["checkpoint_sha256"]=="846721098816af9aedd5bd9eb9bf855fdeb7a6f402cd3582912ee5775db64831"
          assert state["checkpoint_bytes"]==407424818
          assert state["diagnostic_result_namespace_unused"] is True
          assert state["gpu_allocated"] is False
          assert state["diagnostic_attempt_consumed"] is False
          Path("audit-state.json").write_text(json.dumps(state,indent=2,sort_keys=True))
          PY

      - name: Record immutable pre-authority audit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          MODEL_SHA: ${{ steps.cfg.outputs.model_sha }}
          EVALUATOR_SHA: ${{ steps.cfg.outputs.evaluator_sha }}
          DECOMPOSITION_SHA: ${{ steps.cfg.outputs.decomposition_sha }}
          SCIENTIFIC_IMPL_SHA: ${{ steps.cfg.outputs.scientific_impl_sha }}
          RUNNER_SHA: ${{ steps.cfg.outputs.runner_sha }}
          SCIENTIFIC_WORKFLOW_SHA: ${{ steps.cfg.outputs.scientific_workflow_sha }}
          AUDIT_WORKFLOW_SHA: ${{ steps.cfg.outputs.audit_workflow_sha }}
          DUAL_ACCOUNT_SHA: ${{ steps.cfg.outputs.dual_account_sha }}
          DUAL_ACCOUNT_CLI_SHA: ${{ steps.cfg.outputs.dual_account_cli_sha }}
          SELECTED_MODAL_ACCOUNT: ${{ steps.account_binding.outputs.selected_modal_account }}
          SELECTED_MODAL_WORKSPACE: ${{ steps.account_binding.outputs.selected_modal_workspace }}
          ACCOUNT_SELECTION_EVIDENCE_SHA256: ${{ steps.account_binding.outputs.account_selection_evidence_sha256 }}
          ACCOUNT_SELECTION_EVIDENCE_JSON: ${{ steps.account.outputs.selection_evidence_json }}
          LIVE_HOURLY_RESOURCE_USD: ${{ steps.rates.outputs.hourly_resource_usd }}
          LIVE_WORST_CASE_USD: ${{ steps.rates.outputs.worst_case_usd }}
        run: |
          cat > audit-comment.md <<EOF
          CHM_V1_100M_STAGE_C_PAYLOAD_INTEGRATION_AUTHORITY_AUDIT_V1_PASS

          source_sha=$SOURCE_SHA
          source_tree=$SOURCE_TREE
          model_blob=$MODEL_SHA
          evaluator_blob=$EVALUATOR_SHA
          decomposition_blob=$DECOMPOSITION_SHA
          scientific_implementation_blob=$SCIENTIFIC_IMPL_SHA
          runner_blob=$RUNNER_SHA
          workflow_blob=$SCIENTIFIC_WORKFLOW_SHA
          audit_workflow_blob=$AUDIT_WORKFLOW_SHA
          dual_account_blob=$DUAL_ACCOUNT_SHA
          dual_account_cli_blob=$DUAL_ACCOUNT_CLI_SHA
          selected_modal_account=$SELECTED_MODAL_ACCOUNT
          selected_modal_workspace=$SELECTED_MODAL_WORKSPACE
          account_selection_evidence_sha256=$ACCOUNT_SELECTION_EVIDENCE_SHA256
          account_selection_evidence_json=$ACCOUNT_SELECTION_EVIDENCE_JSON
          checkpoint_sha256=846721098816af9aedd5bd9eb9bf855fdeb7a6f402cd3582912ee5775db64831
          checkpoint_bytes=407424818
          live_hourly_resource_usd=$LIVE_HOURLY_RESOURCE_USD
          live_2h_worst_case_usd=$LIVE_WORST_CASE_USD
          stage_c_stop_verified=true
          first_postmortem_payload_integration_weak_verified=true
          retired_v8_partial_artifacts_excluded=true
          result_namespace_unused=true
          runtime_admission_verified=true
          gpu_allocated=false
          diagnostic_attempt_consumed=false
          trigger_authorized=false
          account_switch_after_reservation_authorized=false
          training_authorized=false
          new_scientific_seed_authorized=false
          stage_d_authorized=false
          EOF
          gh issue comment 1064 --repo "$GITHUB_REPOSITORY" -F audit-comment.md
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
