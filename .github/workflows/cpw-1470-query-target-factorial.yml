name: "CPW #1470 original CPU query-vs-label factorial evidence"

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - .github/workflows/cpw-1470-query-target-factorial.yml

permissions:
  contents: read

jobs:
  first-cpu-frozen-five-arm-factorial:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify immutable CPW old and new blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tam_research/cpw_binding_v2/task.py)" = "79dc0ceda617985eba40f119343bdb2992aa395d"
          test "$(git rev-parse HEAD:tam_research/cpw_binding_science/harness.py)" = "63ab35fc82ea06d91ce2a9b5cbd1d2d9c56baf3f"
          test "$(git rev-parse HEAD:tam_research/cpw_query_gradient_matrix_1452.py)" = "a3da256c549b59dd26d4faeb53b972d9d1143384"
          test "$(git rev-parse HEAD:tam_research/cpw_query_target_factorial_1470.py)" = "c112c3d32f34eefd9ea8e4336399e74b1d5c3b57"
          test "$(git rev-parse HEAD:tests/test_cpw_query_target_factorial_1470.py)" = "b8d541fe273a1ca4c032201ea9f1de8058380e32"
          test "$(git rev-parse HEAD:research/cpw_query_target_factorial_1470.md)" = "5ab5528319f35392fd5877a073ae9c3983ccd755"
          echo "CPW_1470_SOURCE_LOCK_PASS"
      - name: Install CPU PyTorch and package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run ORIGINAL five-arm CPU-only diagnostic exactly once
        shell: bash
        run: |
          set -euo pipefail
          python -m tam_research.cpw_query_target_factorial_1470 | tee cpw-1470-first-factorial.jsonl
      - name: Validate full original evidence and archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math
          from pathlib import Path
          lines=Path("cpw-1470-first-factorial.jsonl").read_text().splitlines()
          marker="CPW_1470_FACTORIAL="
          data=[json.loads(s[len(marker):]) for s in lines if s.startswith(marker)]
          assert len(data)==1
          r=data[0]
          assert r["classification"]=="CPW_1470_RANDOM_INIT_FACTORIAL_QUERY_TARGET_ONLY"
          assert r["engineering_seed_not_scientific"]==1453001
          assert r["query_delays"]==[32,64,128,256]
          assert r["source_delays"]==[32,64,96,128,160,192,224,256]
          assert r["key_blind_accuracy"]==.25
          assert r["optimizer_steps"]==0 and r["training_performed"] is False
          assert r["gpu_allocated"] is False and r["scientific_attempt"] is False
          assert r["breakthrough_claim"] is False
          names=["transformer","sequence_only","afm_last1","afm_first1","r1_final"]
          expected=[24940288,21745408,21721344,21721344,21745408]
          assert [a["arm"] for a in r["results"]]==names
          assert [a["parameter_count"] for a in r["results"]]==expected
          assert len({a["source_prefix_sha256"] for a in r["results"]})==1
          for a in r["results"]:
              assert len(a["model_initial_and_final_state_sha256"])==64
              assert a["signed_key_value_differences"]["interaction_count"]==36
              assert len(a["grid_4x4"])==4
              assert a["training_performed"] is False and a["optimizer_steps"]==0
              for i,row in enumerate(a["grid_4x4"]):
                  assert len(row)==4
                  for j,c in enumerate(row):
                      assert c["query_index"]==i and c["label_index"]==j
                      assert c["correct_binding_label"] is (i==j)
                      assert math.isfinite(c["loss"])
                      for side in ("key","value"):
                          x=c[side+"_gradient_l2"]
                          assert len(x)==8 and all(math.isfinite(z) and z>=0 for z in x)
                          dist=c[side+"_concentration"]["normalized_eight_positions"]
                          if dist is not None:
                              assert abs(sum(dist)-1)<1e-5
          local=next(a for a in r["results"] if a["arm"]=="sequence_only")
          assert all(all(v==0 for v in c["key_gradient_l2"]+c["value_gradient_l2"])
                     for row in local["grid_4x4"] for c in row)
          Path("cpw-1470-first-complete.json").write_text(json.dumps(r,indent=2,sort_keys=True,allow_nan=False)+"\n")
          print("CPW_1470_ORIGINAL_CPU_FACTORIAL_SCHEMA_PASS")
          PY
      - name: Archive original five-arm key/value 4x4x8 matrices
        uses: actions/upload-artifact@v4
        with:
          name: cpw-1470-original-query-vs-target-five-arm
          path: |
            cpw-1470-first-factorial.jsonl
            cpw-1470-first-complete.json
          retention-days: 90
