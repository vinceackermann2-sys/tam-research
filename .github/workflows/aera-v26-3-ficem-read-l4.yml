name: AERA v26.3 issue411 fused FICEM read L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: aera-v26-3-issue411-ficem-read-l4
  cancel-in-progress: false

jobs:
  ficem-read:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-ficem-read-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue411 launcher
        run: python -m py_compile modal_aera_v26_3_ficem_read_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue411 one-attempt synthetic boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Issue #411 permits Actions attempt 1 only; no workflow retry." >&2
            exit 1
          fi

          prereg_title="$(gh api "repos/${GITHUB_REPOSITORY}/issues/411" --jq '.title')"
          test "${prereg_title}" = "[research] AERA-v26.3 fused FICEM top-4 read tail + synthetic L4 gate"

          trigger_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-ficem-read-l4]")) | .number' \
              | wc -l | tr -d ' '
          )"
          if [ "${trigger_count}" != "1" ]; then
            echo "Expected exactly one issue411 FICEM read trigger, found ${trigger_count}." >&2
            exit 1
          fi

          result_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("🔬 **AERA-v26.3 #411 fused FICEM read result**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${result_comment_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(
            printf '%s\n' "${event_body}" \
              | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' \
              | head -n 1
          )"
          if [ -z "${bound_main}" ]; then
            echo "Trigger must contain an exact 'Bind main: `<40-hex-sha>`' line." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 8227367a9c53cbb2c3ad14be426f4e9d95f46c89 HEAD

          test -f tam_research/aera_hardware_core_v26_3_ficem_read_triton.py
          test -f tam_research/aera_v26_3_ficem_read_probe.py
          test -f modal_aera_v26_3_ficem_read_app.py
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record frozen issue411 guard (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          body="🔒 **AERA-v26.3 #411 fused FICEM read gate** — checked-out main **${head_sha}**. Synthetic standalone FICEM read only: d_model200, chunk256, capacity48, memory_dim50, top-4, float32/bfloat16, batch8/64, mixed/full state, one NVIDIA L4 <=300 GPU seconds, Actions attempt 1 only. Write path unchanged. No model/checkpoint/corpus/training/scientific seed/end-to-end/freeze/S2/100M/breakthrough authorization."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}" || {
            echo "warning: issue411 guard comment could not be posted; reporting is non-authoritative" >&2
            exit 0
          }

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue411 synthetic L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_ficem_read_app.py 2>&1 | tee /tmp/aera-v26-3-issue411-ficem-read.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE411_FICEM_READ_RESULT_JSON=' /tmp/aera-v26-3-issue411-ficem-read.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue411 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result-comment.md
          import json
          from pathlib import Path

          lines = Path('/tmp/aera-v26-3-issue411-ficem-read.log').read_text(errors='replace').splitlines()
          marker = 'AERA_V26_ISSUE411_FICEM_READ_SUMMARY_JSON='
          rows = [line[len(marker):] for line in lines if line.startswith(marker)]
          if not rows:
              raise SystemExit('issue411 compact summary marker missing')
          payload = json.loads(rows[-1])
          out = [
              '🔬 **AERA-v26.3 #411 fused FICEM read result**',
              '',
              f'- decision: **{payload["decision"]}**; overall PASS: **{payload["overall_pass"]}**',
              f'- device: **{payload["device"]}**',
              f'- per-dtype geomean full-read latency ratios: **{payload["geomean_latency_ratio_by_dtype"]}** (each required <= **0.90x**)',
              f'- correctness / known-empty / near-tie: **{payload["correctness_pass"]} / {payload["known_empty_pass"]} / {payload["near_tie_pass"]}**',
              f'- row latency / full-event ratio / single fused tail / no reference tail ops: **{payload["row_latency_pass"]} / {payload["full_event_ratio_pass"]} / {payload["single_tail_kernel_pass"]} / {payload["candidate_no_reference_tail_ops_pass"]}**',
          ]
          for key, row in payload['row_ratios'].items():
              out.append(
                  f'- {key}: latency **{row["latency"]:.3f}x**, CUDA-event ratio **{row["events"]:.3f}x**, correctness **{row["correctness"]}**'
              )
          out += [
              '',
              '- Synthetic standalone FICEM read only; write backend remains reference.',
              '- Durable Modal result + authoritative result marker are the experiment record; this comment is reporting only.',
              '- This result does **not** authorize end-to-end timing, architecture freeze, S2, a scientific seed, 100M, or a breakthrough claim.',
          ]
          print('\n'.join(out))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$(cat /tmp/result-comment.md)" || true

      - name: Record issue411 workflow failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          tail -n 100 /tmp/aera-v26-3-issue411-ficem-read.log > /tmp/failure-tail.txt 2>/dev/null || true
          {
            echo '⚠️ **AERA-v26.3 #411 FICEM read gate failed before an authoritative result marker.**'
            echo
            echo "Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'No rerun, automatic retry, or timeout increase is authorized. Any continuation requires a new preregistration.'
            echo
            echo '<details><summary>log tail</summary>'
            echo
            echo '```text'
            cat /tmp/failure-tail.txt
            echo '```'
            echo '</details>'
          } > /tmp/failure-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$(cat /tmp/failure-comment.md)" || true
