name: AERA v26.10 issue736 stage-control idle attribution
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: aera-v26-10-issue736-region-idle-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  issue736-stage-control-idle:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[aera-v26-10-issue736-region-idle-preauth]') ||
       startsWith(github.event.issue.title, '[aera-v26-10-issue736-region-idle-l4]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax-check issue736 diagnostic and frozen dependencies
        run: |
          python -m py_compile modal_aera_v26_10_issue736_stage_control_idle_attribution.py
          python -m py_compile modal_aera_v26_10_issue710_memory_safe_harness.py
          python -m py_compile tam_research/aera_hardware_core_v26_10_latent_depth_sync_coalescing.py
      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'
      - name: Verify issue736 immutable boundary and select mode
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/736" --jq '.title')" = "[research] AERA-v26.10 stage/control-flow idle attribution after #732/#735"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/736" --jq '.state')" = "open"
          parent="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5574994790" --jq '.body')"
          printf '%s\n' "$parent" | grep -F 'next target: `None`' >/dev/null
          printf '%s\n' "$parent" | grep -F '52.51891326904297' >/dev/null
          printf '%s\n' "$parent" | grep -F '101.74742126464844' >/dev/null
          freeze_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/736/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #736 pre-implementation stage/control-flow idle attribution freeze")) | .id' | wc -l | tr -d ' ')"
          test "$freeze_count" = "1"
          freeze="$(gh api "repos/${GITHUB_REPOSITORY}/issues/736/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #736 pre-implementation stage/control-flow idle attribution freeze")) | .body')"
          for required in \
            'SOURCE_MAIN=d15d94f39e59d0c6cc8d1514f44a33452d279a74' \
            'SOURCE_TREE=fe5181034b3cb07076b17a43c7137829124d8cbb' \
            'BRANCH=research/aera-v26-10-issue736-stage-control-idle-attribution' \
            'PREAUTH_PREFIX=[aera-v26-10-issue736-region-idle-preauth]' \
            'L4_PREFIX=[aera-v26-10-issue736-region-idle-l4]' \
            'RESULT_PATH=/vol/aera-v26/issue736-stage-control-idle-attribution/result.json' \
            'PARENT_TRIGGER=735' 'PARENT_EVIDENCE_COMMENT=5574994790' \
            'PARENT_RUN=34156438962' 'PARENT_JOB=101849137998' 'PARENT_ATTEMPT=1' \
            'ISSUE710_LAUNCHER_BLOB=b885250753ea169cd89dd7a978bb3647fd261fe8' \
            'V26_10_IMPL_BLOB=d8f691c198eed1fa96bcbb78a4e76cad82d18779' \
            'BATCHES=8,64' 'WARMUP_CALLS=3' 'UNPROFILED_CALLS=3' 'PROFILE_CALLS=1' \
            'MIN_REGION_MS=1.0' 'MIN_REGION_SHARE=0.10' \
            'AUTHORIZATION_HEADING=## #736 sole L4 stage/control-flow idle attribution authorization'; do
            printf '%s\n' "$freeze" | grep -F "$required" >/dev/null
          done
          launcher_blob="$(printf '%s\n' "$freeze" | sed -n 's/^LAUNCHER_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          workflow_blob="$(printf '%s\n' "$freeze" | sed -n 's/^WORKFLOW_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          cpu_test_blob="$(printf '%s\n' "$freeze" | sed -n 's/^CPU_TEST_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_tree="$(printf '%s\n' "$freeze" | sed -n 's/^FROZEN_TREE=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_commit="$(printf '%s\n' "$freeze" | sed -n 's/^FROZEN_COMMIT=\([0-9a-f]\{40\}\)$/\1/p')"
          test -n "$launcher_blob" && test -n "$workflow_blob" && test -n "$cpu_test_blob" && test -n "$frozen_tree" && test -n "$frozen_commit"
          body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          bound_lines="$(printf '%s\n' "$body" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "$bound_lines" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "$bound_lines" | head -n1)"
          git cat-file -e "${bound_main}^{commit}"
          git checkout --detach "$bound_main"
          test "$(git rev-parse HEAD)" = "$bound_main"
          git merge-base --is-ancestor d15d94f39e59d0c6cc8d1514f44a33452d279a74 "$bound_main"
          git cat-file -e "${frozen_commit}^{commit}"
          test "$(git rev-parse "${frozen_commit}^{tree}")" = "$frozen_tree"
          git merge-base --is-ancestor "$frozen_commit" "$bound_main"
          test "$(git hash-object modal_aera_v26_10_issue736_stage_control_idle_attribution.py)" = "$launcher_blob"
          test "$(git hash-object .github/workflows/aera-v26-10-issue736-stage-control-idle-attribution.yml)" = "$workflow_blob"
          test "$(git hash-object tests/test_aera_v26_10_issue736_stage_control_idle_attribution_cpu.py)" = "$cpu_test_blob"
          test "$(git hash-object modal_aera_v26_10_issue710_memory_safe_harness.py)" = "b885250753ea169cd89dd7a978bb3647fd261fe8"
          test "$(git hash-object tam_research/aera_hardware_core_v26_10_latent_depth_sync_coalescing.py)" = "d8f691c198eed1fa96bcbb78a4e76cad82d18779"
          title="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
          if [[ "$title" == '[aera-v26-10-issue736-region-idle-preauth]'* ]]; then
            mode=preauth; prefix='[aera-v26-10-issue736-region-idle-preauth]'
            evidence_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔎 **AERA-v26.10 #736 stage/control idle preauthorization evidence**")) | .id' | wc -l | tr -d ' ')"
            test "$evidence_count" = "0"
          else
            mode=l4; prefix='[aera-v26-10-issue736-region-idle-l4]'
            preauth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" | jq -r --arg bound "$bound_main" '.[] | select((.body // "") | startswith("🔎 **AERA-v26.10 #736 stage/control idle preauthorization evidence**")) | select((.body // "") | contains("Bound main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "$preauth_count" = "1"
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/736/comments?per_page=100" | jq -r --arg bound "$bound_main" '.[] | select((.body // "") | startswith("## #736 sole L4 stage/control-flow idle attribution authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "$auth_count" = "1"
            result_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.10 #736 stage/control-flow idle attribution evidence**")) | .id' | wc -l | tr -d ' ')"
            test "$result_count" = "0"
          fi
          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "$TRIGGER_ISSUE" = "${matches[0]}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "bound_main=$bound_main" >> "$GITHUB_OUTPUT"
      - name: Re-verify issue736 trigger immediately before Modal
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          MODE: ${{ steps.guard.outputs.mode }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BOUND_MAIN"
          if [[ "$MODE" == "preauth" ]]; then
            prefix='[aera-v26-10-issue736-region-idle-preauth]'
          else
            prefix='[aera-v26-10-issue736-region-idle-l4]'
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/736/comments?per_page=100" | jq -r --arg bound "$BOUND_MAIN" '.[] | select((.body // "") | startswith("## #736 sole L4 stage/control-flow idle attribution authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "$auth_count" = "1"
          fi
          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "$TRIGGER_ISSUE" = "${matches[0]}"
      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
      - name: Run issue736 zero-GPU preauthorization audit
        if: steps.guard.outputs.mode == 'preauth'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          modal run modal_aera_v26_10_issue736_stage_control_idle_attribution.py::preauth_main 2>&1 | tee /tmp/issue736-preauth.log
          test "$(grep -c '^AERA_V26_10_ISSUE736_PREAUTH_JSON=' /tmp/issue736-preauth.log)" = "1"
      - name: Record issue736 preauthorization evidence
        if: steps.guard.outputs.mode == 'preauth' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          python - <<'PY' >/tmp/issue736-preauth.md
          import json, os
          from pathlib import Path
          marker="AERA_V26_10_ISSUE736_PREAUTH_JSON="
          ps=[json.loads(x[len(marker):]) for x in Path('/tmp/issue736-preauth.log').read_text().splitlines() if x.startswith(marker)]
          if len(ps)!=1:raise SystemExit("expected one #736 preauth payload")
          p=ps[0]
          if p.get("research_issue")!=736 or p.get("result_absent") is not True or p.get("gpu_used") is not False or p.get("model_constructed") is not False:raise SystemExit("#736 preauth drift")
          print("🔎 **AERA-v26.10 #736 stage/control idle preauthorization evidence**")
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print("Zero-GPU preflight passed: result absent; parent #735 result, checkpoints, #710 launcher and v26.10 implementation revalidated. No L4 or optimization authority.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue736-preauth.md)"
      - name: Run issue736 sole L4 stage/control idle diagnostic
        if: steps.guard.outputs.mode == 'l4'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          modal run modal_aera_v26_10_issue736_stage_control_idle_attribution.py::l4_main 2>&1 | tee /tmp/issue736-l4.log
          test "$(grep -c '^AERA_V26_10_ISSUE736_PREAUTH_JSON=' /tmp/issue736-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_10_ISSUE736_L4_START_JSON=' /tmp/issue736-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_10_ISSUE736_RESULT_JSON=' /tmp/issue736-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_10_ISSUE736_SUMMARY_JSON=' /tmp/issue736-l4.log)" = "1"
      - name: Record issue736 attribution evidence
        if: steps.guard.outputs.mode == 'l4' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >/tmp/issue736-summary.md
          import json
          from pathlib import Path
          marker="AERA_V26_10_ISSUE736_SUMMARY_JSON="
          ps=[json.loads(x[len(marker):]) for x in Path('/tmp/issue736-l4.log').read_text().splitlines() if x.startswith(marker)]
          if len(ps)!=1:raise SystemExit("expected one #736 summary")
          p=ps[0]
          if p.get("research_issue")!=736:raise SystemExit("#736 identity drift")
          for k in ("optimization_authorized","full_e2e_systems_gate_authorized","systems_pass_earned","architecture_freeze_authorized","s2_authorized","fresh_scientific_seed_authorized","independent_replication_credit","100m_authorized","breakthrough_proven"):
              if p.get(k) is not False:raise SystemExit(f"forbidden #736 authority {k}")
          print("🔬 **AERA-v26.10 #736 stage/control-flow idle attribution evidence**")
          print()
          print(f"Device: `{p['device']}`; next target region: `{p.get('next_target_region')}`.")
          for b,r in sorted(p["batches"].items(),key=lambda kv:int(kv[0])):
              print(f"Batch {b}: unprofiled `{r['unprofiled_whole_call']['median_ms']}` ms; profiled `{r['profiled_cuda_event_ms']}` ms; exclusive families `{json.dumps(r['exclusive_family_table'],sort_keys=True)}`.")
          print("Diagnostic only. No optimization, E2E systems rerun, systems PASS, architecture freeze, S2, scaling, or breakthrough authority.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue736-summary.md)"
