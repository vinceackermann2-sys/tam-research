name: AERA v26.10 issue706 latent-depth sync coalescing

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-10-issue706-sync-coalescing-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  issue706-latent-depth-sync-coalescing:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[aera-v26-10-issue706-latent-depth-sync-coalescing-preauth]') ||
       startsWith(github.event.issue.title, '[aera-v26-10-issue706-latent-depth-sync-coalescing-l4]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue706 implementation and launcher
        run: |
          python -m py_compile tam_research/aera_hardware_core_v26_10_latent_depth_sync_coalescing.py
          python -m py_compile modal_aera_v26_10_issue706_latent_depth_sync_coalescing.py
          python -m py_compile modal_aera_v26_9_issue665_frozen_throughput_component_attribution.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue706 immutable boundary and select mode
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/706" --jq '.title')" = "[research] AERA-v26.10 latent-depth sync coalescing after #702/#705"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/706" --jq '.state')" = "open"

          parent="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5572472746" --jq '.body')"
          printf '%s\n' "${parent}" | grep -F '🔬 **AERA-v26.9 #702 CUDA timeline attribution evidence**' >/dev/null
          printf '%s\n' "${parent}" | grep -F 'Preregistered diagnostic target: `launch_or_idle_reduction`.' >/dev/null
          printf '%s\n' "${parent}" | grep -F '"cudaStreamSynchronize": 49' >/dev/null
          printf '%s\n' "${parent}" | grep -F '"cudaStreamSynchronize": 51' >/dev/null

          freeze_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/706/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #706 pre-implementation v26.10 latent-depth sync coalescing freeze")) | .id' | wc -l | tr -d ' ')"
          test "${freeze_count}" = "1"
          freeze="$(gh api "repos/${GITHUB_REPOSITORY}/issues/706/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #706 pre-implementation v26.10 latent-depth sync coalescing freeze")) | .body')"

          for required in \
            'SOURCE_MAIN=4883abe053347379812901c5c2057da70c11e3e7' \
            'SOURCE_TREE=27be25ba578aa530c1e6d832db1a38be4c8bc22a' \
            'BRANCH=research/aera-v26-10-issue706-latent-depth-sync-coalescing' \
            'PREAUTH_PREFIX=[aera-v26-10-issue706-latent-depth-sync-coalescing-preauth]' \
            'L4_PREFIX=[aera-v26-10-issue706-latent-depth-sync-coalescing-l4]' \
            'RESULT_PATH=/vol/aera-v26/issue706-v26-10-latent-depth-sync-coalescing/result.json' \
            'PARENT_RESULT_PATH=/vol/aera-v26/issue702-cuda-timeline-dispatch-gap-attribution/result.json' \
            'PARENT_ISSUE=702' \
            'PARENT_TRIGGER=705' \
            'PARENT_EVIDENCE_COMMENT=5572472746' \
            'PARENT_RUN=34135719600' \
            'PARENT_JOB=101786085046' \
            'PARENT_ATTEMPT=1' \
            'V26_10_IMPL_BLOB=d8f691c198eed1fa96bcbb78a4e76cad82d18779' \
            'V25_1_NOHOST_BLOB=237e5615cf32f644e8675808a6b3e9adaf04fb23' \
            'V26_RUNTIME_BLOB=268644ac4edee15a4cc4e29d3fed7f61eeb3caa7' \
            'V26_9_SYSTEMS_BLOB=512572340cc09e2e7ad6729712258c12cb377ef2' \
            'BASE_SYSTEMS_BLOB=c9731cae7e386f09b2a190b045532591c4fa00be' \
            'TRIAGE_BLOB=e5ce8cdda0777dce97816e2640f4492803a6b191' \
            'V26_9_BACKEND_BLOB=b81cc209f5d95abbe1fb8bd620c78e87c067bc19' \
            'ISSUE665_LAUNCHER_BLOB=72f27391ff2f0a7bff8d4532f307ddc4869cf494' \
            'BATCHES=8,64' \
            'TOKEN_SEED_RULE=138471+10000+batch_size' \
            'WARMUP_CALLS=3' \
            'TIMED_CALLS_PER_CONDITION=20' \
            'PROFILE_CALLS_PER_CONDITION=1' \
            'MIN_LATENCY_IMPROVEMENT=0.05' \
            'MIN_STREAM_SYNCHRONIZE_REDUCTION=20' \
            'INTEGRATED_ATOL=0.01' \
            'INTEGRATED_RTOL=0.01'; do
            printf '%s\n' "${freeze}" | grep -F "${required}" >/dev/null
          done

          impl_blob="$(printf '%s\n' "${freeze}" | sed -n 's/^V26_10_IMPL_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          launcher_blob="$(printf '%s\n' "${freeze}" | sed -n 's/^LAUNCHER_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          workflow_blob="$(printf '%s\n' "${freeze}" | sed -n 's/^WORKFLOW_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          cpu_test_blob="$(printf '%s\n' "${freeze}" | sed -n 's/^CPU_TEST_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_tree="$(printf '%s\n' "${freeze}" | sed -n 's/^FROZEN_TREE=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_commit="$(printf '%s\n' "${freeze}" | sed -n 's/^FROZEN_COMMIT=\([0-9a-f]\{40\}\)$/\1/p')"
          test -n "${impl_blob}" && test -n "${launcher_blob}" && test -n "${workflow_blob}" && test -n "${cpu_test_blob}" && test -n "${frozen_tree}" && test -n "${frozen_commit}"

          body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"
          git cat-file -e "${bound_main}^{commit}"
          git checkout --detach "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 4883abe053347379812901c5c2057da70c11e3e7 "${bound_main}"
          test "$(git rev-parse 4883abe053347379812901c5c2057da70c11e3e7^{tree})" = "27be25ba578aa530c1e6d832db1a38be4c8bc22a"
          git cat-file -e "${frozen_commit}^{commit}"
          test "$(git rev-parse "${frozen_commit}^{tree}")" = "${frozen_tree}"
          git merge-base --is-ancestor "${frozen_commit}" "${bound_main}"

          test "$(git hash-object tam_research/aera_hardware_core_v26_10_latent_depth_sync_coalescing.py)" = "${impl_blob}"
          test "$(git hash-object modal_aera_v26_10_issue706_latent_depth_sync_coalescing.py)" = "${launcher_blob}"
          test "$(git hash-object .github/workflows/aera-v26-10-issue706-latent-depth-sync-coalescing.yml)" = "${workflow_blob}"
          test "$(git hash-object tests/test_aera_v26_10_issue706_latent_depth_sync_coalescing_cpu.py)" = "${cpu_test_blob}"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_nohost.py)" = "237e5615cf32f644e8675808a6b3e9adaf04fb23"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_v26_9_issue643_bounded_memory_end_to_end_systems.py)" = "512572340cc09e2e7ad6729712258c12cb377ef2"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems.py)" = "c9731cae7e386f09b2a190b045532591c4fa00be"
          test "$(git hash-object tam_research/aera_v25_post8471_triage.py)" = "e5ce8cdda0777dce97816e2640f4492803a6b191"
          test "$(git hash-object tam_research/aera_hardware_core_v26_9_ficem_read_identity_weight_visibility.py)" = "b81cc209f5d95abbe1fb8bd620c78e87c067bc19"
          test "$(git hash-object modal_aera_v26_9_issue665_frozen_throughput_component_attribution.py)" = "72f27391ff2f0a7bff8d4532f307ddc4869cf494"

          title="$(jq -r '.issue.title' "${GITHUB_EVENT_PATH}")"
          if [[ "${title}" == '[aera-v26-10-issue706-latent-depth-sync-coalescing-preauth]'* ]]; then
            mode=preauth
            prefix='[aera-v26-10-issue706-latent-depth-sync-coalescing-preauth]'
            evidence_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔎 **AERA-v26.10 #706 preauthorization evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${evidence_count}" = "0"
          else
            mode=l4
            prefix='[aera-v26-10-issue706-latent-depth-sync-coalescing-l4]'
            preauth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("🔎 **AERA-v26.10 #706 preauthorization evidence**")) | select((.body // "") | contains("Bound main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${preauth_count}" = "1"
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/706/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("## #706 sole L4 latent-depth sync coalescing authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
            result_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("⚙️ **AERA-v26.10 #706 latent-depth sync coalescing evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${result_count}" = "0"
          fi

          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "bound_main=${bound_main}" >> "${GITHUB_OUTPUT}"
          echo "allowed=true" >> "${GITHUB_OUTPUT}"

      - name: Re-verify issue706 trigger immediately before Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          MODE: ${{ steps.guard.outputs.mode }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BOUND_MAIN}"
          if [[ "${MODE}" == "preauth" ]]; then
            prefix='[aera-v26-10-issue706-latent-depth-sync-coalescing-preauth]'
          else
            prefix='[aera-v26-10-issue706-latent-depth-sync-coalescing-l4]'
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/706/comments?per_page=100" | jq -r --arg bound "${BOUND_MAIN}" '.[] | select((.body // "") | startswith("## #706 sole L4 latent-depth sync coalescing authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
          fi
          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run issue706 zero-GPU preauthorization audit
        if: steps.guard.outputs.mode == 'preauth'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          modal run modal_aera_v26_10_issue706_latent_depth_sync_coalescing.py::preauth_main 2>&1 | tee /tmp/issue706-preauth.log
          test "$(grep -c '^AERA_V26_10_ISSUE706_PREAUTH_JSON=' /tmp/issue706-preauth.log)" = "1"

      - name: Record issue706 preauthorization evidence
        if: steps.guard.outputs.mode == 'preauth' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          python - <<'PY' >/tmp/issue706-preauth.md
          import json, os
          from pathlib import Path
          marker='AERA_V26_10_ISSUE706_PREAUTH_JSON='
          rows=[json.loads(line[len(marker):]) for line in Path('/tmp/issue706-preauth.log').read_text().splitlines() if line.startswith(marker)]
          if len(rows)!=1: raise SystemExit('expected exactly one #706 preauth payload')
          p=rows[0]
          required={'research_issue':706,'parent_issue':702,'parent_trigger':705,'parent_evidence_comment':5572472746,'parent_run':34135719600,'parent_job':101786085046,'parent_attempt':1,'source_decision':'FAIL_FROZEN_E2E_SYSTEMS_GATE','parent_next_target':'launch_or_idle_reduction','result_absent':True,'gpu_used':False,'model_constructed':False,'new_measurement_performed':False}
          for k,v in required.items():
              if p.get(k)!=v: raise SystemExit(f'#706 preauth drift {k}: {p.get(k)!r}')
          for k in ('optimization_microbenchmark_authorized','full_e2e_systems_gate_authorized','systems_pass_earned','architecture_freeze_authorized','s2_authorized','fresh_scientific_seed_authorized','independent_replication_credit','100m_authorized','breakthrough_proven'):
              if p.get(k) is not False: raise SystemExit(f'forbidden #706 preauth flag {k}')
          print('🔎 **AERA-v26.10 #706 preauthorization evidence**')
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print('Zero-GPU preflight passed: `result_absent=true`, `gpu_used=false`, `model_constructed=false`, `new_measurement_performed=false`.')
          print('Exact #705 parent result, checkpoints, implementation and frozen source blobs were revalidated. No L4, systems, or higher-stage authority is created by this evidence.')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue706-preauth.md)"

      - name: Run issue706 sole L4 optimization microbenchmark
        if: steps.guard.outputs.mode == 'l4'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          modal run modal_aera_v26_10_issue706_latent_depth_sync_coalescing.py::l4_main 2>&1 | tee /tmp/issue706-l4.log
          test "$(grep -c '^AERA_V26_10_ISSUE706_PREAUTH_JSON=' /tmp/issue706-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_10_ISSUE706_L4_START_JSON=' /tmp/issue706-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_10_ISSUE706_RESULT_JSON=' /tmp/issue706-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_10_ISSUE706_SUMMARY_JSON=' /tmp/issue706-l4.log)" = "1"

      - name: Record issue706 optimization evidence
        if: steps.guard.outputs.mode == 'l4' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >/tmp/issue706-result.md
          import json
          from pathlib import Path
          marker='AERA_V26_10_ISSUE706_SUMMARY_JSON='
          rows=[json.loads(line[len(marker):]) for line in Path('/tmp/issue706-l4.log').read_text().splitlines() if line.startswith(marker)]
          if len(rows)!=1: raise SystemExit('expected exactly one #706 summary')
          p=rows[0]
          if p.get('research_issue')!=706: raise SystemExit('#706 summary issue drift')
          if p.get('decision') not in ('PASS_V26_10_LATENT_DEPTH_SYNC_COALESCING_MICROBENCH','FAIL_V26_10_LATENT_DEPTH_SYNC_COALESCING_MICROBENCH'): raise SystemExit('#706 decision drift')
          if p.get('systems_pass_earned') is not False: raise SystemExit('#706 microbench cannot earn systems pass')
          for k in ('architecture_freeze_authorized','s2_authorized','fresh_scientific_seed_authorized','independent_replication_credit','100m_authorized','breakthrough_proven'):
              if p.get(k) is not False: raise SystemExit(f'forbidden #706 result flag {k}')
          print('⚙️ **AERA-v26.10 #706 latent-depth sync coalescing evidence**')
          print()
          print(f"Device: `{p['device']}`; decision: `{p['decision']}`; overall pass: `{p['overall_pass']}`.")
          for batch,row in sorted(p['batches'].items(),key=lambda kv:int(kv[0])):
              print(f"Batch {batch}: correctness `{row['correctness_pass']}`; v26.9/v26.10 median `{row['baseline_median_ms']}` / `{row['candidate_median_ms']}` ms; improvement `{row['latency_improvement_fraction']}`; syncs `{row['baseline_cudaStreamSynchronize']}` -> `{row['candidate_cudaStreamSynchronize']}` (reduction `{row['cudaStreamSynchronize_reduction']}`); latency gate `{row['latency_gate_pass']}`; sync gate `{row['sync_gate_pass']}`; batch pass `{row['pass']}`.")
          print()
          print(f"Fresh frozen Transformer-relative E2E systems gate authorized: `{p['fresh_full_e2e_systems_gate_authorized']}`. Systems PASS remains `false`; no higher-stage authority is created here.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue706-result.md)"
