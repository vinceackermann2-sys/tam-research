name: Modal AERA v5 integrated L4 gate

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  integrated-gate:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v5-integrated-l4]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check integrated benchmark
        run: python -m py_compile modal_aera_v5_integrated_l4_gate.py
      - name: Install Modal
        run: pip install 'modal>=1.1,<2'
      - name: Verify Modal authentication
        run: modal token info
      - name: Materialize callback secret
        run: modal secret create --force github-secret GITHUB_TOKEN="$GITHUB_TOKEN"
      - name: Record hard guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔒 **Integrated AERA-v5 L4 guard** — exactly one L4; CPU mixed-precision preflight first; inference/microbenchmark only; no optimizer, training, checkpoint mutation, or automatic retry. Hard GPU timeout=600s. Thresholds unchanged from the v4 gate."
      - name: Run integrated L4 gate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: modal run --timestamps modal_aera_v5_integrated_l4_gate.py --repo-full-name "$GITHUB_REPOSITORY" --issue-number "$ISSUE_NUMBER"
      - name: Record workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="❌ **Integrated AERA-v5 L4 workflow failed.** No automatic retry was attempted. Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
