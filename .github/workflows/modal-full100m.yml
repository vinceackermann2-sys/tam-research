name: Modal TAM 100M full 2B training

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full100m:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[modal-full100m]'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal with non-preemptible CPU support
        run: pip install 'modal>=1.2.3,<2'

      - name: Verify Modal authentication
        run: modal token info

      - name: Materialize short-lived Modal GitHub callback secret
        run: |
          modal secret create --force github-secret GITHUB_TOKEN="$GITHUB_TOKEN"

      - name: Guard and stop superseded preempting CPU app on manual reopen
        if: github.event_name == 'issues' && github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          H100_SIGNATURE='🔥 **TAM-v3-100M-Full H100 started**'
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
              --jq '.[].body' | grep -Fq "$H100_SIGNATURE"; then
            echo 'Authoritative H100-start callback exists on the production issue; refusing replacement.'
            exit 1
          fi

          modal app list --json > /tmp/apps.json
          ACTIVE_APP_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/apps.json').read_text())
          matches = []
          for row in rows:
              if row.get('description') != 'tam-research-full100m':
                  continue
              state = str(row.get('state', '')).lower()
              try:
                  tasks = int(str(row.get('tasks', '0')))
              except ValueError:
                  tasks = 0
              if 'stopped' not in state and tasks > 0:
                  matches.append(row)
          matches.sort(key=lambda row: str(row.get('created_at', '')), reverse=True)
          print(matches[0].get('app_id', '') if matches else '')
          PY
          )"

          if [ -n "$ACTIVE_APP_ID" ]; then
            modal app logs "$ACTIVE_APP_ID" --tail 2500 > /tmp/active-full100m.log 2>&1 || true
            if grep -Fq "$H100_SIGNATURE" /tmp/active-full100m.log; then
              echo "Modal app $ACTIVE_APP_ID already reached H100; refusing replacement."
              exit 1
            fi

            # The CPU app can finish/crash between `app list` and `app stop`. Treat only
            # Modal's explicit already-stopped response as a successful idempotent stop;
            # any other stop error remains fatal so we never launch alongside an unknown
            # still-active production app.
            set +e
            STOP_OUTPUT="$(modal app stop "$ACTIVE_APP_ID" --yes 2>&1)"
            STOP_RC=$?
            set -e
            printf '%s\n' "$STOP_OUTPUT"
            if [ "$STOP_RC" -ne 0 ] && ! grep -Fq 'App is already stopped' <<<"$STOP_OUTPUT"; then
              echo "Failed to stop Modal app $ACTIVE_APP_ID; refusing replacement."
              exit "$STOP_RC"
            fi

            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -f body="🛑 **Controlled CPU-prep replacement** — previous Modal app \`$ACTIVE_APP_ID\` is stopped (or had already stopped during the guarded handoff). Guard verified no authoritative H100-start callback in GitHub or current Modal logs. The replacement uses \`nonpreemptible=True\` for CPU prep; this is a single user-requested recovery, not an automatic retry."
          else
            echo 'No active full100M Modal app found; continuing with guarded fixed launch.'
          fi

      - name: Record immutable budget guard
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔒 **100M full-run budget guard** — code-fixed aggregate H100 ceiling=11,700s; 2,000,000,000 pretraining tokens; callers cannot raise the ceiling. CPU preparation is non-preemptible, capped at 4h, and cannot allocate a GPU. No automatic retry is configured."

      - name: Launch detached full 100M pipeline
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          modal run --detach --timestamps modal_full100m_nonpreemptible_app.py::app.nonpreemptible_main \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"

      - name: Record handoff
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal full-100M handoff complete.** Non-preemptible CPU data preparation runs first; exactly one capped H100 training function is spawned only after preparation commits successfully."
