name: Modal TAM 100M full 2B training

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full100m:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[modal-full100m]'))
    runs-on: ubuntu-latest
    # The local Modal entrypoint waits for CPU-only preparation before detaching the
    # H100 call. Keep the GitHub runner alive for that entire 4h preparation ceiling
    # plus setup/handoff margin; this does not change any Modal compute budget.
    timeout-minutes: 300
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # A GitHub Actions installation token is short-lived and repo-scoped. It is
      # materialized into Modal only so the active launch can post callbacks while
      # this workflow is alive. The scheduled monitor mirrors later Modal log events.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install 'modal>=1.1,<2'

      - name: Verify Modal authentication
        run: modal token info

      - name: Materialize short-lived Modal GitHub callback secret
        run: |
          modal secret create github-secret GITHUB_TOKEN="$GITHUB_TOKEN" --force

      - name: Record immutable budget guard
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔒 **100M full-run budget guard** — code-fixed aggregate H100 ceiling=11,700s; 2,000,000,000 pretraining tokens; callers cannot raise the ceiling. Data preparation is CPU-only and capped at 4h. No automatic retry is configured."

      - name: Launch detached full 100M pipeline
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          modal run --detach --timestamps modal_full100m_app.py \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"

      - name: Record handoff
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal full-100M handoff complete.** CPU data preparation runs first; exactly one capped H100 training function is spawned after preparation. Later stage/eval callbacks are mirrored by the zero-GPU monitor if this short-lived GitHub token has expired."
