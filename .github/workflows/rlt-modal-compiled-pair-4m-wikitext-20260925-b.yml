name: RLT Modal compiled paired 4M WikiText 20260925 B

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-modal-compiled-pair-4m-wikitext-20260925-b.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: rlt-modal-compiled-pair-4m-wikitext-20260925-b
  cancel-in-progress: false

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-compiled-paired-4m-wikitext-modal-20260925-b
      JOB_PATH: experiments/rlt/modal/jobs/rlt-compiled-paired-4m-wikitext-modal-20260925-b.json
      BASE_TRAINER_PATH: experiments/rlt/train_compiled_pair_1m.py
      TRAINER_PATH: experiments/rlt/train_compiled_pair_4m_wikitext_b.py
      LAUNCHER_PATH: experiments/rlt/modal_compiled_pair_4m_wikitext_b.py
      PRIOR_WIKITEXT_PATH: experiments/rlt/modal/results/rlt-compiled-paired-4m-wikitext-modal-20260923-a.json
      CROSSCORPUS_PATH: experiments/rlt/modal/results/rlt-crosscorpus-wikitext-4m-abcd-modal-20260923-a.json
      SYSTEMS_PATH: experiments/rlt/modal/results/rlt-systems-decoder-cache768-modal-20260917-l.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-compiled-pair-4m-wikitext-20260925-b.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-compiled-paired-4m-wikitext-modal-20260925-b.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-compiled-paired-4m-wikitext-modal-20260925-b.json
      VOLUME_NAME: tam-rlt-scientific-checkpoints
      ARTIFACT_NAME: rlt-compiled-paired-4m-wikitext-modal-20260925-b-checkpoints
      DATASET_ID: Salesforce/wikitext
      DATASET_CONFIG: wikitext-103-raw-v1
      DATASET_REVISION: 00aa25585682d4957f9e86edc73f59be7419af99
      TRAIN_SPLIT: train
      VAL_SPLIT: validation
      TOKENIZER_ID: gpt2
      TRAIN_TOKENS: "6000000"
      VAL_TOKENS: "131072"

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse any previously claimed or completed WikiText training attempt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          BASE_TRAINER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$BASE_TRAINER_PATH")"
          TRAINER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$TRAINER_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "BASE_TRAINER_BLOB_SHA=$BASE_TRAINER_BLOB_SHA"
            echo "TRAINER_BLOB_SHA=$TRAINER_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" > /tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,'job_id':'rlt-compiled-paired-4m-wikitext-modal-20260925-b',
            'task':'compiled_paired_4m_wikitext_b','scientific_seed':20261013,
            'requires_prior_wikitext_job_id':'rlt-compiled-paired-4m-wikitext-modal-20260923-a',
            'requires_crosscorpus_job_id':'rlt-crosscorpus-wikitext-4m-abcd-modal-20260923-a',
            'requires_systems_job_id':'rlt-systems-decoder-cache768-modal-20260917-l',
            'dataset_id':'Salesforce/wikitext','dataset_config':'wikitext-103-raw-v1',
            'dataset_revision':'00aa25585682d4957f9e86edc73f59be7419af99',
            'train_split':'train','val_split':'validation','tokenizer_id':'gpt2',
            'token_budget':4194304,'seq_len':64,'micro_batch_size':16,'grad_accum_steps':1,
            'train_tokens':6000000,'val_tokens':131072,
            'checkpoint_volume':'tam-rlt-scientific-checkpoints','automatic_retry':False,
          },j
          PY

      - name: Require WikiText cross-corpus result and frozen systems result
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$PRIOR_WIKITEXT_PATH" > /tmp/prior.json
          git show "origin/$BRANCH:$CROSSCORPUS_PATH" > /tmp/cross.json
          git show "origin/$BRANCH:$SYSTEMS_PATH" > /tmp/systems.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/prior.json'))
          assert p.get('job_id')=='rlt-compiled-paired-4m-wikitext-modal-20260923-a',p
          assert p.get('status')=='complete' and p.get('dataset_hashes_match_claim') is True,p
          pc=p.get('comparison'); assert isinstance(pc,dict) and pc.get('status')=='complete',pc
          assert pc.get('classification')=='PAIRED_4M_WIKITEXT_RLT_LOWER_NLL_SINGLE_RUN_HINT',pc
          assert pc.get('breakthrough_claim_supported') is False,pc
          assert float(pc['derived']['rlt_minus_transformer_final_nll'])<0.0,pc
          assert p.get('checkpoint_durability',{}).get('modal_volume_committed') is True,p
          c=json.load(open('/tmp/cross.json'))
          assert c.get('job_id')=='rlt-crosscorpus-wikitext-4m-abcd-modal-20260923-a',c
          assert c.get('status')=='complete' and c.get('dataset_hash_matches_claim') is True,c
          e=c.get('evaluation'); assert isinstance(e,dict) and e.get('status')=='complete',e
          assert e.get('classification')=='CROSSCORPUS_WIKITEXT_4M_ABCD_NO_RLT_QUALITY_ADVANTAGE',e
          assert e.get('breakthrough_claim_supported') is False,e
          a=e['aggregate_across_model_pairs']
          assert a['pair_count']==4 and a['rlt_lower_pair_count']==1,a
          assert float(a['mean_rlt_minus_transformer_nll'])>0.0,a
          s=json.load(open('/tmp/systems.json'))
          assert s.get('status')=='complete' and s.get('classification')=='PASS_CACHE768_WEAK',s
          assert s['semantic_equivalence']['passed'] is True,s
          PY

      - name: Install zero-GPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             'modal>=1.5.4,<1.6' 'numpy>=2.0,<3' 'datasets>=4.0,<5'             'transformers>=4.55,<5' 'tokenizers>=0.21,<1' 'huggingface-hub>=0.34,<1'

      - name: Select Modal account before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""
          ID=""
          SECRET=""
          if [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"
            ID="$MODAL_TOKEN_ID_B"
            SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"
            ID="$MODAL_TOKEN_ID_A"
            SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"
          test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"
          export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          modal billing summary --json > /tmp/modal-billing-summary.json || true
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"
          echo "Selected Modal account slot $SLOT before scientific claim."

      - name: Validate WikiText training sources locally
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/rlt/modal_preflight.py "$BASE_TRAINER_PATH" "$TRAINER_PATH" "$LAUNCHER_PATH"
          python - <<'PY'
          from pathlib import Path
          t=Path('experiments/rlt/train_compiled_pair_4m_wikitext_b.py').read_text()
          m=Path('experiments/rlt/modal_compiled_pair_4m_wikitext_b.py').read_text()
          b=Path('experiments/rlt/train_compiled_pair_1m.py').read_text()
          for x in ['SCIENTIFIC_SEED = 20_261_013','PAIRED_BATCH_SEED = 20_271_013',
                    'PAIRED_EVAL_SEED = 20_291_013','COMPILE_PROBE_SEED = 20_301_013',
                    'TOKEN_BUDGET = 4_194_304','EVAL_BATCHES = 64',
                    'PAIRED_4M_WIKITEXT_RLT_LOWER_NLL_SINGLE_RUN_HINT',
                    'PAIRED_4M_WIKITEXT_NO_RLT_QUALITY_ADVANTAGE']: assert x in t,x
          for x in ['JOB_ID = "rlt-compiled-paired-4m-wikitext-modal-20260925-b"',
                    'DATASET_ID = "Salesforce/wikitext"','DATASET_CONFIG = "wikitext-103-raw-v1"',
                    'DATASET_REVISION = "00aa25585682d4957f9e86edc73f59be7419af99"',
                    'TRAIN_SPLIT = "train"','VAL_SPLIT = "validation"',
                    'revision=DATASET_REVISION','train_compiled_pair_4m_wikitext_b(',
                    'retries=0','gpu="A100"','RLT_COMPILED_PAIR_4M_WIKITEXT_B_RESULT_B64=']: assert x in m,x
          assert 'model_state_dict' in b and 'optimizer_state_dict' in b
          PY

      - name: Prove pinned WikiText train and validation bytes on CPU before claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          import numpy as np
          from datasets import load_dataset
          from transformers import AutoTokenizer
          tok=AutoTokenizer.from_pretrained(os.environ['TOKENIZER_ID'],use_fast=True)
          assert tok.vocab_size < 2**16
          def build(split,target,path):
              ds=load_dataset(os.environ['DATASET_ID'],name=os.environ['DATASET_CONFIG'],
                              split=split,revision=os.environ['DATASET_REVISION'])
              chunks=[]; total=0; rows=0
              for row in ds:
                  text=row.get('text') or ''
                  if not text: continue
                  ids=tok.encode(text,add_special_tokens=False); ids.append(tok.eos_token_id)
                  a=np.asarray(ids,dtype=np.uint16); chunks.append(a); total+=len(a); rows+=1
                  if total>=target: break
              assert total>=target,(split,total,target)
              x=np.concatenate(chunks)[:target]; p=pathlib.Path(path); x.tofile(p)
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(8*1024*1024),b''): h.update(chunk)
              return {'split':split,'target_tokens':target,'tokens_written':int(x.size),
                      'raw_tokens_before_truncation':total,'source_rows_consumed':rows,'sha256':h.hexdigest()}
          train=build(os.environ['TRAIN_SPLIT'],int(os.environ['TRAIN_TOKENS']),'/tmp/wikitext-train.bin')
          val=build(os.environ['VAL_SPLIT'],int(os.environ['VAL_TOKENS']),'/tmp/wikitext-val.bin')
          p={'dataset':os.environ['DATASET_ID'],'dataset_config':os.environ['DATASET_CONFIG'],
             'dataset_revision':os.environ['DATASET_REVISION'],'tokenizer':os.environ['TOKENIZER_ID'],
             'dtype':'uint16','train':train,'validation':val}
          pathlib.Path('/tmp/wikitext-training-preflight.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          print(json.dumps(p,sort_keys=True))
          PY

      - name: Run non-GPU Modal control-plane preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/modal-preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/modal-preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit combined zero-GPU preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          data=json.load(open('/tmp/wikitext-training-preflight.json'))
          p.update({'classification':'RLT_COMPILED_PAIRED_4M_WIKITEXT_ZERO_GPU_PREFLIGHT_PASS',
                    'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
                    'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
                    'base_trainer_blob_sha':os.environ['BASE_TRAINER_BLOB_SHA'],
                    'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
                    'scientific_execution':False,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
                    'wikitext_training_data_preflight':data})
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt wikitext 4m: record zero-GPU data and control preflight'
          git push origin "HEAD:$BRANCH"

      - name: Create and commit one-shot WikiText scientific claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open(os.environ['DIAGNOSTIC_PATH'])); data=d['wikitext_training_data_preflight']
          payload={'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
                   'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
                   'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'base_trainer_blob_sha':os.environ['BASE_TRAINER_BLOB_SHA'],
                   'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
                   'scientific_seed':20261013,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
                   'wikitext_train_bin_sha256':data['train']['sha256'],
                   'wikitext_val_bin_sha256':data['validation']['sha256'],'automatic_retry_authorized':False,
                   'job':json.load(open(os.environ['JOB_PATH']))}
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt wikitext 4m: claim $JOB_ID before A100 training"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal A100 paired WikiText 4M attempt
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 82m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_COMPILED_PAIR_4M_WIKITEXT_B_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Decode terminal WikiText payload
        id: decode
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); payload=None
          if b:
              try: payload=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception: payload=None
          if not isinstance(payload,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              payload={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                       'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                       'error':f'Modal CLI rc={rc}; no parseable terminal payload','log_tail':log[-6000:],
                       'scientific_conclusion':None}
          pathlib.Path('/tmp/pair-result.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('PAIR_STATUS='+str(payload.get('status','unknown'))+'\n')
          PY

      - name: Export and verify WikiText checkpoints
        id: export
        if: env.PAIR_STATUS == 'complete'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rlt-checkpoints; mkdir -p /tmp/rlt-checkpoints
          modal volume get "$VOLUME_NAME" "$JOB_ID" /tmp/rlt-checkpoints
          python - <<'PY'
          import hashlib,json,pathlib
          r=json.load(open('/tmp/pair-result.json')); root=pathlib.Path('/tmp/rlt-checkpoints')
          def one(n):
              xs=list(root.rglob(n)); assert len(xs)==1,(n,xs); return xs[0]
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          rp,tp=one('rlt_final.pt'),one('transformer_final.pt')
          assert sha(rp)==r['checkpoint_durability']['rlt']['sha256']
          assert sha(tp)==r['checkpoint_durability']['transformer']['sha256']
          assert r['checkpoint_durability']['modal_volume_committed'] is True
          PY

      - name: Upload WikiText checkpoint artifact
        id: upload
        if: env.PAIR_STATUS == 'complete' && steps.export.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/rlt-checkpoints
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Materialize durable WikiText result
        if: always()
        shell: bash
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          payload=json.load(open('/tmp/pair-result.json'))
          claim=json.load(open(os.environ['CLAIM_PATH']))
          data=payload.get('data') or {}
          th=(data.get('train') or {}).get('sha256'); vh=(data.get('validation') or {}).get('sha256')
          payload.update({'modal_cli_rc':int(os.environ.get('MODAL_RC','999')),'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'base_trainer_blob_sha':os.environ['BASE_TRAINER_BLOB_SHA'],'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'dataset_hashes_match_claim':(th is not None and vh is not None and
                th==claim['wikitext_train_bin_sha256'] and vh==claim['wikitext_val_bin_sha256']),
            'checkpoint_export':{'modal_volume_get_outcome':os.environ.get('EXPORT_OUTCOME',''),
              'github_artifact_upload_outcome':os.environ.get('UPLOAD_OUTCOME',''),
              'github_artifact_id':os.environ.get('ARTIFACT_ID',''),'github_artifact_digest':os.environ.get('ARTIFACT_DIGEST',''),
              'github_artifact_name':os.environ['ARTIFACT_NAME'],'github_run_id':os.environ['GITHUB_RUN_ID']}})
          p=pathlib.Path(os.environ['RESULT_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt wikitext 4m: record $JOB_ID terminal result"
          git push origin "HEAD:$BRANCH"

      - name: Summarize WikiText training outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete' or r.get('dataset_hashes_match_claim') is not True: raise SystemExit(1)
          c=r.get('comparison')
          if not isinstance(c,dict) or c.get('status')!='complete' or c.get('breakthrough_claim_supported') is not False:
              raise SystemExit(1)
          if c.get('classification') not in {'PAIRED_4M_WIKITEXT_RLT_LOWER_NLL_SINGLE_RUN_HINT',
                                             'PAIRED_4M_WIKITEXT_NO_RLT_QUALITY_ADVANTAGE'}: raise SystemExit(1)
          if r.get('checkpoint_durability',{}).get('modal_volume_committed') is not True: raise SystemExit(1)
          e=r.get('checkpoint_export',{})
          if e.get('modal_volume_get_outcome')!='success' or e.get('github_artifact_upload_outcome')!='success':
              raise SystemExit(1)
          print('classification:',c['classification'])
          print('RLT final NLL:',c['rlt']['final_eval']['nll'])
          print('Transformer final NLL:',c['transformer']['final_eval']['nll'])
          print('delta NLL:',c['derived']['rlt_minus_transformer_final_nll'])
          PY
