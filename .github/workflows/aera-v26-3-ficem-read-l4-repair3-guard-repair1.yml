name: AERA v26.3 issue433 FICEM read L4 repair3 guard repair1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-3-issue433-ficem-read-l4-repair3-guard-repair1
  cancel-in-progress: false

jobs:
  ficem-read-repair3-guard-repair1:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-ficem-read-l4-repair3-guard-repair1]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check frozen launcher
        run: python -m py_compile modal_aera_v26_3_ficem_read_repair3_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue436 repair1 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/436" --jq '.title')" = "[research] AERA-v26.3 issue433 L4 guard repair1 after pre-GPU GitHub permission failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/436" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33507022732" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33507022732" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33507022732" --jq '.head_sha')" = "8b2f850e35a21cbfc6a9266a9bbba8c3821c971f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33507022732/jobs" --jq '.jobs[] | select(.name == "ficem-read-repair3") | .steps[] | select(.name == "Run sole issue433 repair3 synthetic L4 probe") | .conclusion')" = "skipped"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/427" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/427" --jq '.head.sha')" = "0ad68f50c5ca937a0de9e4bd1c5464e1c0aeab24"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/427" --jq '.merge_commit_sha')" = "7e1346709d3c1eb158c9ec7d621cafdf498da315"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-ficem-read-l4-repair3-guard-repair1]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 8b2f850e35a21cbfc6a9266a9bbba8c3821c971f HEAD

          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "b6b37f0379b280eea4e5c2b16f349951dadc4df9"
          test "$(git hash-object modal_aera_v26_3_ficem_read_repair3_app.py)" = "0768818305985809dc8ba232f8d5b4a115c7ea24"
          test "$(git hash-object .github/workflows/aera-v26-3-ficem-read-l4-repair3.yml)" = "19649b4f9abe42ccee1451071eb115f0461d1a70"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue436 repaired synthetic L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_ficem_read_repair3_app.py 2>&1 | tee /tmp/issue436.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE433_FICEM_READ_REPAIR3_RESULT_JSON=' /tmp/issue436.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue436 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_ISSUE433_FICEM_READ_REPAIR3_SUMMARY_JSON=' /tmp/issue436.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.3 #433 FICEM read repair3 result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. No end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Record issue436 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.3 #436 repaired gate failed before an authoritative result marker.** No rerun, retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
