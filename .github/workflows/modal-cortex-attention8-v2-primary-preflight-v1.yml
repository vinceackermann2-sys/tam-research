name: CORTEX attention-8 v2 primary preflight v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[modal-cortex-attention8-v2-primary-preflight-v1]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Refuse reruns
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"

      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Static zero-GPU read-only authority check
        run: |
          set -euo pipefail
          python -m py_compile modal_cortex_attention8_v2_primary_preflight_v1.py
          python - <<'PY'
          from pathlib import Path
          runner = Path("modal_cortex_attention8_v2_primary_preflight_v1.py").read_text()
          workflow = Path(
              ".github/workflows/modal-cortex-attention8-v2-primary-preflight-v1.yml"
          ).read_text()
          top = workflow.split("\njobs:", 1)[0]
          assert "workflow_dispatch:" not in top
          assert ("gpu" + "=") not in runner
          assert ("modal volume " + "put") not in workflow
          assert ("modal volume " + "delete") not in workflow
          assert '"writes_performed": False' in runner
          assert '"seed_consumed": False' in runner
          assert '"scientific_training_authorized": False' in runner
          assert "retries=0" in runner
          PY

      - name: Install pinned Modal CLI
        run: python -m pip install 'modal>=1.5.4,<1.6'

      - name: Verify primary account runtime health
        run: |
          set -euo pipefail
          modal token info
          modal volume list --json > primary-volumes.json
          python - <<'PY'
          import json
          payload=json.load(open("primary-volumes.json",encoding="utf-8"))
          assert "tam-research-data" in json.dumps(payload)
          PY

      - name: Run primary read-only preflight
        id: inspect
        run: |
          set -euo pipefail
          modal run --detach --timestamps modal_cortex_attention8_v2_primary_preflight_v1.py | tee primary-preflight.log
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lines=Path("primary-preflight.log").read_text(encoding="utf-8").splitlines()
          matches=[line.split("PRIMARY_PREFLIGHT=",1)[1] for line in lines if "PRIMARY_PREFLIGHT=" in line]
          assert len(matches)==1, matches
          payload=json.loads(matches[0])
          print("payload_json="+json.dumps(payload,sort_keys=True,separators=(",",":")))
          PY

      - name: Record terminal primary preflight
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAYLOAD_JSON: ${{ steps.inspect.outputs.payload_json }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="ATTENTION8_V2_PRIMARY_PREFLIGHT_V1 ${PAYLOAD_JSON}"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
