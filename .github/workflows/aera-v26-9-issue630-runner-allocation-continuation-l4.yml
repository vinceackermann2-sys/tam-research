name: AERA v26.9 issue630 runner allocation continuation L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  issue630-runner-allocation-continuation:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-9-issue630-runner-allocation-continuation-l4]')
    runs-on: ubuntu-24.04
    env:
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python -m py_compile modal_aera_v26_9_issue630_runner_allocation_continuation_l4_app.py
          python -m py_compile tam_research/aera_v26_9_issue625_schema_guard_repair1.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify canonical authorized issue630 boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/630" --jq '.title')" = "[research] AERA-v26.9 #625 runner-allocation continuation after consumed #629 pre-runner failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/630" --jq '.state')" = "open"

          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue630-runner-allocation-continuation-l4]")) | .number' \
              | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bind_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bind_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bind_lines}" | sed -n '1p')"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 96b42b0b3dfae4e06209bac6fb55ce02e2960034 HEAD

          auth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/630/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #630 sole L4 runner-allocation continuation authorization")) | .id' | wc -l | tr -d ' ')"
          test "${auth_count}" = "1"
          auth_body="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/630/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #630 sole L4 runner-allocation continuation authorization")) | .body')"
          auth_lines="$(printf '%s\n' "${auth_body}" | sed -n 's/^Authorize main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${auth_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "${auth_lines}" | sed -n '1p')" = "${bound_main}"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33846259975" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33846259975" --jq '.head_sha')" = "96b42b0b3dfae4e06209bac6fb55ce02e2960034"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33846259975" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100938724271" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100938724271" --jq '.runner_id')" = "0"
          test -z "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100938724271" --jq '.runner_name // ""')"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100938724271" --jq '.steps | length')" = "0"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/628" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/628" --jq '.merge_commit_sha')" = "96b42b0b3dfae4e06209bac6fb55ce02e2960034"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/628" --jq '.head.sha')" = "1b0ce133e2147f64b969aac32d9b59ace2ccfddf"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33843877696" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33843877696" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100931510903" --jq '.conclusion')" = "success"

          test "$(git hash-object tam_research/aera_v26_9_issue625_schema_guard_repair1.py)" = "92d06a4954bca1b302355e81f5bf09b06fcee222"
          test "$(git hash-object tam_research/aera_hardware_core_v26_9_ficem_read_identity_weight_visibility.py)" = "b81cc209f5d95abbe1fb8bd620c78e87c067bc19"
          test "$(grep -c 'gpu="L4"' modal_aera_v26_9_issue630_runner_allocation_continuation_l4_app.py)" = "1"
          test "$(grep -c 'run_schema_guard_repair1_gate_v26_9_issue625(' modal_aera_v26_9_issue630_runner_allocation_continuation_l4_app.py)" = "1"

      - name: Record start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #630 runner-allocation continuation started** — exact authorized main, consumed #629 pre-runner boundary, and frozen #625 scientific bytes verified. One L4 synthetic READ gate only; no model/checkpoint/corpus/training/systems or higher scientific step." || true

      - name: Immediate canonical recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue630-runner-allocation-continuation-l4]")) | .number' \
              | sort -n
          )
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"
          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(git rev-parse HEAD)" = "${bound_main}"

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue630 L4 gate
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal run modal_aera_v26_9_issue630_runner_allocation_continuation_l4_app.py 2>&1 | tee /tmp/issue630.log
          test "$(grep -c '^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_PRECHECK_JSON=' /tmp/issue630.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_PREFLIGHT_JSON=' /tmp/issue630.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_L4_START_JSON=' /tmp/issue630.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_RESULT_JSON=' /tmp/issue630.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_SUMMARY_JSON=' /tmp/issue630.log)" = "1"

      - name: Record evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f /tmp/issue630.log; then
            result="$(grep '^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_RESULT_JSON=' /tmp/issue630.log | tail -1 | sed 's/^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_RESULT_JSON=//')"
            summary="$(grep '^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_SUMMARY_JSON=' /tmp/issue630.log | tail -1 | sed 's/^AERA_V26_9_ISSUE630_RUNNER_ALLOCATION_CONTINUATION_SUMMARY_JSON=//')"
            if test -n "${result}"; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #630 authoritative runner-allocation continuation READ gate**\n\nResult: \`${result}\`\n\nSummary: \`${summary}\`\n\nPrimitive READ evidence only. No automatic end-to-end systems execution, evaluator repair, architecture freeze, S2, fresh scientific seed, replication, 100M scaling, or breakthrough claim is authorized." || true
            fi
          fi
