name: CPW-v1 pairwise one-shot H100 panel

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/LAUNCH_V1_PAIRWISE.json'

permissions:
  contents: read
  issues: write

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_SECONDARY: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
      MODAL_TOKEN_SECRET_SECONDARY: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_LOW_CREDIT_ACCOUNT: ${{ secrets.MODAL_LOW_CREDIT_ACCOUNT }}
      MODAL_MAX_THROTTLE_WAIT: "0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate one-shot pairwise authority
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("cpw/LAUNCH_V1_PAIRWISE.json").read_text())
          assert set(cfg)=={"phase","issue","cpu_gate_run","run_control_run","authorized_parent_sha"}
          assert cfg["phase"]=="cpw-v1-pairwise-core-panel"
          assert cfg["issue"]==1252
          assert cfg["cpu_gate_run"]==37319397787
          assert cfg["run_control_run"]==37319672968
          assert len(str(cfg["authorized_parent_sha"]))==40
          PY
          AUTHORIZED_PARENT="$(python -c 'import json; print(json.load(open("cpw/LAUNCH_V1_PAIRWISE.json"))["authorized_parent_sha"])')"
          test "$(git rev-parse HEAD^)" = "$AUTHORIZED_PARENT"

          git diff --exit-code cac5a27c82b499b4e5de407971e08d7d5e3eaa27 "$SOURCE_SHA" --             tam_research/cpw_v1_pairwise             tests/test_cpw_v1_pairwise_1252.py             .github/workflows/cpw-v1-pairwise-cpu.yml

          git diff --exit-code fd19f6f14bd49b9b8ffd9693932d3b6f16fd3a95 "$SOURCE_SHA" --             modal_cpw_v1_pairwise_1252.py             tests/test_cpw_v1_pairwise_run_control_1252.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run frozen CPU contracts
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
          python -m compileall -q tam_research/cpw_v1_pairwise modal_cpw_v1_pairwise_1252.py
          pytest -q             tests/test_cpw_v1_pairwise_1252.py             tests/test_cpw_v1_pairwise_run_control_1252.py

      - name: Install pinned Modal CLI
        run: pip install 'modal>=1.5.4,<1.6'

      - name: Select eligible Modal account
        id: account
        run: |
          PYTHONPATH="$PWD" python scripts/modal_select_account_v3.py             --required-volume tam-research-data             --runtime-probe-path modal_runtime_admission_probe_1067_v1.py

      - name: Activate selected Modal account
        env:
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
          SECONDARY_CREDENTIAL_ALIASES: ${{ steps.account.outputs.secondary_credential_aliases }}
        run: |
          set -euo pipefail
          if [ "$SELECTED_MODAL_ACCOUNT" = "primary" ]; then
            printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
          elif [ "$SELECTED_MODAL_ACCOUNT" = "secondary" ]; then
            case ",$SECONDARY_CREDENTIAL_ALIASES," in
              *,secondary,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_SECONDARY"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_SECONDARY"
                ;;
              *,account2,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_2"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_2"
                ;;
              *,legacy_b,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_B"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_B"
                ;;
              *)
                exit 93
                ;;
            esac
            test -n "$SECONDARY_ID"
            test -n "$SECONDARY_SECRET"
            printf 'MODAL_TOKEN_ID=%s\n' "$SECONDARY_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$SECONDARY_SECRET" >> "$GITHUB_ENV"
          else
            exit 92
          fi

      - name: Verify Modal authentication
        run: modal token info

      - name: Record pairwise launch
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
        run: |
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/issues/1252/comments"             -f body="CPW-v1 pairwise panel launch gate passed. Account=${SELECTED_MODAL_ACCOUNT}; source=${GITHUB_SHA}. Launching frozen 5-arm 0.5M smoke then three fresh 3M-token paired panels. No retry authorized."

      - name: Run one-shot pairwise panel
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v1_pairwise_1252.py             --source-sha "${GITHUB_SHA}" | tee cpw-v1-pairwise.log

      - name: Record terminal result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/cpw-v1-pairwise-comment.txt
          import json
          from pathlib import Path
          prefix="CPW_V1_PAIRWISE_RESULT="
          matches=[line.split(prefix,1)[1] for line in Path("cpw-v1-pairwise.log").read_text(errors="replace").splitlines() if prefix in line]
          if not matches:
              raise SystemExit("missing terminal result")
          r=json.loads(matches[-1])
          print("CPW-v1 pairwise core panel terminal result")
          print()
          print(f"- classification: `{r['classification']}`")
          print(f"- integrity: `{r['replication_integrity']}`")
          print(f"- selected successor: `{r['selected_successor']}`")
          for arm, x in r["candidate_results"].items():
              print(f"- {arm}: delta(T-C)={x['transformer_minus_candidate_mean_nll']:+.6f}, wins={x['wins_vs_transformer']}/3, TPS={x['training_tps_ratio']:.3f}x, params={x['parameter_fraction_of_transformer']:.3f}x, quality={x['quality_supported']}, efficiency={x['efficiency_supported']}, pareto={x['pareto_supported']}")
          print("- breakthrough claim authorized: `false`")
          PY
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/issues/1252/comments"             -F body=@/tmp/cpw-v1-pairwise-comment.txt

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/issues/1252/comments"             -f body="CPW-v1 pairwise one-shot panel failed for source ${GITHUB_SHA}. This scientific attempt is consumed; do not rerun or replace seeds."
