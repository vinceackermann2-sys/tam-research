name: Modal TAM behavior eval

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  behavior-eval:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[modal-behavior-eval]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check evaluator
        run: python -m py_compile modal_behavior_eval_app.py

      - name: Record launcher start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🧪 **CPU-only behavioral evaluation launcher started.** Base vs SFT vs DPO; no GPU requested."

      - name: Install Modal
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication
        run: modal token info

      - name: Run CPU-only behavior benchmark
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          modal run --timestamps modal_behavior_eval_app.py \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"
