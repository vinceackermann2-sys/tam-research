name: CHM-v3 100M DAEC Stage-C pre-authority audit v2

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  audit:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[modal-chm-v3-100m-daec-stage-c-1323-authority-audit-v1]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      MODAL_MAX_THROTTLE_WAIT: "0"

    steps:
      - name: Resolve immutable audit payload and refuse reruns
        id: cfg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = "1"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = json.loads(os.environ.get("ISSUE_BODY") or "{}")
          expected = {
              "phase": "chm-v3-100m-daec-stage-c-1323-authority-audit-v1",
              "control_issue": 1323,
              "prereg_issue": 1316,
              "scientific_seed": 2013161,
              "result_root": "/vol/chm-v3/100m-daec-stage-c/issue-1323/seed-2013161-v1",
          }
          for key, value in expected.items():
              assert cfg.get(key) == value, f"{key} mismatch: {cfg.get(key)!r} != {value!r}"
          for key in (
              "source_sha", "source_tree", "daec_sha", "stage_c_protocol_sha",
              "model_sha", "small_protocol_sha", "evaluator_sha", "dual_account_sha",
              "dual_account_cli_sha", "runtime_probe_sha", "core_sha", "runner_sha",
              "scientific_workflow_sha", "audit_workflow_sha",
          ):
              value = str(cfg.get(key, "")).strip().lower()
              assert re.fullmatch(r"[0-9a-f]{40}", value), f"{key} must be full lowercase SHA"
              print(f"{key}={value}")
          print("scientific_seed=2013161")
          PY

      - name: Checkout exact merged implementation boundary
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 0
          path: source

      - name: Verify current main and all frozen blobs
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          DAEC_SHA: ${{ steps.cfg.outputs.daec_sha }}
          STAGE_C_PROTOCOL_SHA: ${{ steps.cfg.outputs.stage_c_protocol_sha }}
          MODEL_SHA: ${{ steps.cfg.outputs.model_sha }}
          SMALL_PROTOCOL_SHA: ${{ steps.cfg.outputs.small_protocol_sha }}
          EVALUATOR_SHA: ${{ steps.cfg.outputs.evaluator_sha }}
          DUAL_ACCOUNT_SHA: ${{ steps.cfg.outputs.dual_account_sha }}
          DUAL_ACCOUNT_CLI_SHA: ${{ steps.cfg.outputs.dual_account_cli_sha }}
          RUNTIME_PROBE_SHA: ${{ steps.cfg.outputs.runtime_probe_sha }}
          CORE_SHA: ${{ steps.cfg.outputs.core_sha }}
          RUNNER_SHA: ${{ steps.cfg.outputs.runner_sha }}
          SCIENTIFIC_WORKFLOW_SHA: ${{ steps.cfg.outputs.scientific_workflow_sha }}
          AUDIT_WORKFLOW_SHA: ${{ steps.cfg.outputs.audit_workflow_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source fetch --no-tags origin main
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_SHA"

          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v3_100m_daec.py")" = "$DAEC_SHA"
          test "$DAEC_SHA" = "77e9ccbff4383be40e6e2865503e1c3926bbda74"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v3_100m_daec_stage_c.py")" = "$STAGE_C_PROTOCOL_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v3_100m_daec_target_nll_stable.py")" = "482e2c930fa02448e45327747f10571315fd41dc"
          test "$STAGE_C_PROTOCOL_SHA" = "b1a58e52b76ff7d06f14a569a7b6274afee8076c"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v1_100m_scale.py")" = "$MODEL_SHA"
          test "$MODEL_SHA" = "b9b141c0e52d4fd0fff28b12a3588b2adc659b8f"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v1_small_lm_protocol.py")" = "$SMALL_PROTOCOL_SHA"
          test "$SMALL_PROTOCOL_SHA" = "d5c2e405b5306f556e7fbe70aacd552867e69d3e"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v1_100m_stage_c_eval.py")" = "$EVALUATOR_SHA"
          test "$EVALUATOR_SHA" = "863bd038e60da5511503adb0c8e1046a680ed3bd"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/modal_dual_account_v3.py")" = "$DUAL_ACCOUNT_SHA"
          test "$DUAL_ACCOUNT_SHA" = "adb979e2ecaa7cdf1c0ee36e7a4d929783e078d6"
          test "$(git -C source rev-parse "$SOURCE_SHA:scripts/modal_select_account_v3.py")" = "$DUAL_ACCOUNT_CLI_SHA"
          test "$DUAL_ACCOUNT_CLI_SHA" = "440292942066d0b3d3a71d40ca8495092674ce6c"
          test "$(git -C source rev-parse "$SOURCE_SHA:modal_runtime_admission_probe_1067_v1.py")" = "$RUNTIME_PROBE_SHA"
          test "$RUNTIME_PROBE_SHA" = "04b1e9c610195b0896a209eb9d6ce3fd4f014fbc"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v3_100m_daec_stage_c_execution.py")" = "$CORE_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:modal_chm_v3_100m_daec_stage_c_1323_v1.py")" = "$RUNNER_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:.github/workflows/modal-chm-v3-100m-daec-stage-c-1323-v1.yml")" = "$SCIENTIFIC_WORKFLOW_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:.github/workflows/modal-chm-v3-100m-daec-stage-c-1323-authority-audit-v1.yml")" = "$AUDIT_WORKFLOW_SHA"

      - name: Verify unique audit and scientific trigger absence
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          issue = int(os.environ["AUDIT_ISSUE"])
          def gh(path, *extra):
              return json.loads(subprocess.check_output(["gh", "api", path, *extra], text=True))
          def exact(title):
              q = f'repo:{repo} is:issue in:title "{title}"'
              r = gh("search/issues", "-X", "GET", "-f", f"q={q}", "-f", "per_page=100")
              return [x for x in r["items"] if x["title"] == title]
          audit_title = "[modal-chm-v3-100m-daec-stage-c-1323-authority-audit-v1]"
          found = exact(audit_title)
          assert len(found) == 1 and found[0]["number"] == issue, found
          assert len(exact("[modal-chm-v3-100m-daec-stage-c-1323-seed-2013161-v1]")) == 0
          comments = gh(f"repos/{repo}/issues/1323/comments?per_page=100")
          assert not any("CHM_V3_1323_FINAL_LAUNCHER_AUTHORITY_V1" in c["body"] for c in comments)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal and project test dependencies
        run: pip install 'modal>=1.5.4,<1.6'

      - name: Select one runtime-eligible Modal account
        id: account
        run: |
          cd source
          PYTHONPATH="$PWD" python scripts/modal_select_account_v3.py             --required-volume tam-research-data             --low-credit-account primary             --runtime-probe-path modal_runtime_admission_probe_1067_v1.py
          cd ..

      - name: Freeze selected account and selection evidence
        id: binding
        env:
          ACCOUNT: ${{ steps.account.outputs.selected_account }}
          EVIDENCE: ${{ steps.account.outputs.selection_evidence_json }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, os
          account = os.environ["ACCOUNT"].strip()
          evidence = os.environ["EVIDENCE"]
          assert account in {"primary", "secondary"}, account
          assert evidence, "selection evidence missing"
          print(f"selected_modal_account={account}")
          print(f"account_selection_evidence_sha256={hashlib.sha256(evidence.encode()).hexdigest()}")
          PY

      - name: Bind selected credentials, derive authenticated workspace, and read live 9600s rates
        id: rates
        env:
          ACCOUNT: ${{ steps.binding.outputs.selected_modal_account }}
          PRIMARY_ID: ${{ secrets.MODAL_TOKEN_ID }}
          PRIMARY_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SECONDARY_ID: ${{ secrets.MODAL_TOKEN_ID_2 }}
          SECONDARY_SECRET: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
        run: |
          if [ "$ACCOUNT" = "secondary" ]; then
            export MODAL_TOKEN_ID="$SECONDARY_ID"
            export MODAL_TOKEN_SECRET="$SECONDARY_SECRET"
          else
            export MODAL_TOKEN_ID="$PRIMARY_ID"
            export MODAL_TOKEN_SECRET="$PRIMARY_SECRET"
          fi
          modal token info | tee modal-token-info.txt
          modal billing rates --json > modal-rates.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          token_info = Path("modal-token-info.txt").read_text(encoding="utf-8")
          match = re.search(r"^(?:Workspace|User):\s*([^\s(]+)", token_info, re.MULTILINE)
          assert match, "authenticated Modal workspace/user missing from token info"
          workspace = match.group(1).strip()
          assert workspace and workspace.lower() != "none", workspace
          rates = json.load(open("modal-rates.json", encoding="utf-8"))
          l4 = float(rates["gpu_hour_cost_l4"])
          cpu = float(rates["cpu_hour_cost"])
          ram = float(rates["mem_gib_hour_cost"])
          for name, value in (("l4", l4), ("cpu", cpu), ("ram", ram)):
              assert value > 0.0, f"invalid {name} rate"
          hourly = l4 + 4 * cpu + 16 * ram
          worst = hourly * (9600.0 / 3600.0)
          assert worst <= 3.00, f"live 9600s worst-case ${worst:.6f} exceeds $3 cap"
          print(f"selected_modal_workspace={workspace}")
          print(f"hourly_resource_usd={hourly:.12f}")
          print(f"worst_case_usd={worst:.12f}")
          PY

      - name: Inspect namespace and frozen corpus on selected account
        env:
          ACCOUNT: ${{ steps.binding.outputs.selected_modal_account }}
          EXPECTED_WORKSPACE: ${{ steps.rates.outputs.selected_modal_workspace }}
          EVIDENCE_SHA: ${{ steps.binding.outputs.account_selection_evidence_sha256 }}
          PRIMARY_ID: ${{ secrets.MODAL_TOKEN_ID }}
          PRIMARY_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SECONDARY_ID: ${{ secrets.MODAL_TOKEN_ID_2 }}
          SECONDARY_SECRET: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          DAEC_SHA: ${{ steps.cfg.outputs.daec_sha }}
          STAGE_C_PROTOCOL_SHA: ${{ steps.cfg.outputs.stage_c_protocol_sha }}
          MODEL_SHA: ${{ steps.cfg.outputs.model_sha }}
          SMALL_PROTOCOL_SHA: ${{ steps.cfg.outputs.small_protocol_sha }}
          EVALUATOR_SHA: ${{ steps.cfg.outputs.evaluator_sha }}
          DUAL_ACCOUNT_SHA: ${{ steps.cfg.outputs.dual_account_sha }}
          DUAL_ACCOUNT_CLI_SHA: ${{ steps.cfg.outputs.dual_account_cli_sha }}
          RUNTIME_PROBE_SHA: ${{ steps.cfg.outputs.runtime_probe_sha }}
          CORE_SHA: ${{ steps.cfg.outputs.core_sha }}
          RUNNER_SHA: ${{ steps.cfg.outputs.runner_sha }}
          WORKFLOW_SHA: ${{ steps.cfg.outputs.scientific_workflow_sha }}
        run: |
          if [ "$ACCOUNT" = "secondary" ]; then
            export MODAL_TOKEN_ID="$SECONDARY_ID"; export MODAL_TOKEN_SECRET="$SECONDARY_SECRET"
          else
            export MODAL_TOKEN_ID="$PRIMARY_ID"; export MODAL_TOKEN_SECRET="$PRIMARY_SECRET"
          fi
          cd source
          modal run modal_chm_v3_100m_daec_stage_c_1323_v1.py             --phase inspect-source             --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE"             --daec-sha "$DAEC_SHA" --stage-c-protocol-sha "$STAGE_C_PROTOCOL_SHA"             --model-sha "$MODEL_SHA" --small-protocol-sha "$SMALL_PROTOCOL_SHA"             --evaluator-sha "$EVALUATOR_SHA"             --dual-account-sha "$DUAL_ACCOUNT_SHA" --dual-account-cli-sha "$DUAL_ACCOUNT_CLI_SHA"             --runtime-probe-sha "$RUNTIME_PROBE_SHA" --core-sha "$CORE_SHA"             --runner-sha "$RUNNER_SHA" --workflow-sha "$WORKFLOW_SHA"             --selected-modal-account "$ACCOUNT" --selected-modal-workspace "$EXPECTED_WORKSPACE"             --account-selection-evidence-sha256 "$EVIDENCE_SHA" | tee ../inspect.log
          cd ..
          python - <<'PY'
          import json
          from pathlib import Path
          lines = Path("inspect.log").read_text(encoding="utf-8").splitlines()
          matches = [x.split("CHM_V3_100M_DAEC_STAGE_C_SOURCE=",1)[1]
                     for x in lines if "CHM_V3_100M_DAEC_STAGE_C_SOURCE=" in x]
          assert len(matches) == 1, len(matches)
          state = json.loads(matches[0])
          assert state["result_namespace_unused"] is True
          assert state["gpu_allocated"] is False
          assert state["scientific_seed_consumed"] is False
          Path("audit-state.json").write_text(json.dumps(state, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Record immutable authority audit on control issue
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          DAEC_SHA: ${{ steps.cfg.outputs.daec_sha }}
          STAGE_C_PROTOCOL_SHA: ${{ steps.cfg.outputs.stage_c_protocol_sha }}
          MODEL_SHA: ${{ steps.cfg.outputs.model_sha }}
          SMALL_PROTOCOL_SHA: ${{ steps.cfg.outputs.small_protocol_sha }}
          EVALUATOR_SHA: ${{ steps.cfg.outputs.evaluator_sha }}
          DUAL_ACCOUNT_SHA: ${{ steps.cfg.outputs.dual_account_sha }}
          DUAL_ACCOUNT_CLI_SHA: ${{ steps.cfg.outputs.dual_account_cli_sha }}
          RUNTIME_PROBE_SHA: ${{ steps.cfg.outputs.runtime_probe_sha }}
          CORE_SHA: ${{ steps.cfg.outputs.core_sha }}
          RUNNER_SHA: ${{ steps.cfg.outputs.runner_sha }}
          WORKFLOW_SHA: ${{ steps.cfg.outputs.scientific_workflow_sha }}
          AUDIT_WORKFLOW_SHA: ${{ steps.cfg.outputs.audit_workflow_sha }}
          ACCOUNT: ${{ steps.binding.outputs.selected_modal_account }}
          WORKSPACE: ${{ steps.rates.outputs.selected_modal_workspace }}
          EVIDENCE_SHA: ${{ steps.binding.outputs.account_selection_evidence_sha256 }}
          HOURLY: ${{ steps.rates.outputs.hourly_resource_usd }}
          WORST: ${{ steps.rates.outputs.worst_case_usd }}
        run: |
          cat > audit-comment.md <<EOF
          CHM_V3_1323_AUTHORITY_AUDIT_V2_PASS

          source_sha=$SOURCE_SHA
          source_tree=$SOURCE_TREE
          daec_blob=$DAEC_SHA
          stage_c_protocol_blob=$STAGE_C_PROTOCOL_SHA
          model_blob=$MODEL_SHA
          small_protocol_blob=$SMALL_PROTOCOL_SHA
          evaluator_blob=$EVALUATOR_SHA
          dual_account_blob=$DUAL_ACCOUNT_SHA
          dual_account_cli_blob=$DUAL_ACCOUNT_CLI_SHA
          runtime_probe_blob=$RUNTIME_PROBE_SHA
          core_blob=$CORE_SHA
          runner_blob=$RUNNER_SHA
          workflow_blob=$WORKFLOW_SHA
          audit_workflow_blob=$AUDIT_WORKFLOW_SHA
          scientific_seed=2013161
          selected_modal_account=$ACCOUNT
          selected_modal_workspace=$WORKSPACE
          account_selection_evidence_sha256=$EVIDENCE_SHA
          live_hourly_resource_usd=$HOURLY
          live_9600s_worst_case_usd=$WORST
          result_namespace_unused=true
          gpu_allocated=false
          scientific_seed_consumed=false
          trigger_authorized=false
          automatic_retry_authorized=false
          checkpoint_resume_authorized=false
          replication_authorized=false
          stage_d_authorized=false
          EOF
          gh issue comment 1323 --repo "$GITHUB_REPOSITORY" -F audit-comment.md
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
