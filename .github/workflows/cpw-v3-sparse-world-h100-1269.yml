name: CPW-v3 sparse-world one-shot 3M H100 panel

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/LAUNCH_V3_SPARSE_WORLD_1269.json'

permissions:
  contents: read
  issues: write

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate frozen one-shot authority
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"

          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("cpw/LAUNCH_V3_SPARSE_WORLD_1269.json").read_text())
          assert set(cfg) == {
              "phase",
              "authority_issue",
              "scientific_issue",
              "preflight_issue",
              "architecture_gate_run",
              "run_control_run",
              "import_probe_run",
              "namespace_preflight_run",
              "authorized_parent_sha",
          }
          assert cfg["phase"] == "cpw-v3-sparse-world-one-shot-1269"
          assert cfg["authority_issue"] == 1269
          assert cfg["scientific_issue"] == 1261
          assert cfg["preflight_issue"] == 1263
          assert cfg["architecture_gate_run"] == 37470390411
          assert cfg["run_control_run"] == 37471004582
          assert cfg["import_probe_run"] == 37471163752
          assert cfg["namespace_preflight_run"] == 37594989879
          assert cfg["authorized_parent_sha"] == "51e7450dd8def8ee9789026f9f929e0245177c03"
          PY

          AUTHORIZED_PARENT="$(python -c 'import json; print(json.load(open("cpw/LAUNCH_V3_SPARSE_WORLD_1269.json"))["authorized_parent_sha"])')"
          test "$(git rev-parse HEAD^)" = "$AUTHORIZED_PARENT"

          git diff --exit-code 67c768799b0f05e0ca02be5fb1e4b09f8a16b2ab "$SOURCE_SHA" -- \
            tam_research/cpw_v3_sparse_world \
            tests/test_cpw_v3_sparse_world_1261.py \
            docs/CPW_V3_SPARSE_WORLD.md

          git diff --exit-code 5dc48c9f27b1decdd03dd2b617121dac8d71d0a7 "$SOURCE_SHA" -- \
            modal_cpw_v3_sparse_world_1261.py \
            tests/test_cpw_v3_run_control_1261.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run frozen zero-GPU contracts
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
          pip install 'modal>=1.5.4,<1.6'
          python -m compileall -q modal_cpw_v3_sparse_world_1261.py tam_research/cpw_v3_sparse_world
          pytest -q \
            tests/test_cpw_v3_sparse_world_1261.py \
            tests/test_cpw_v3_run_control_1261.py

      - name: Bind verified account2
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID_2"
          test -n "$MODAL_TOKEN_SECRET_2"
          printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID_2" >> "$GITHUB_ENV"
          printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET_2" >> "$GITHUB_ENV"

      - name: Verify Modal authentication
        run: modal token info

      - name: Record scientific launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/launch.txt <<EOF
          CPW-v3 #1261 one-shot H100 launch gate passed.

          - source: `${GITHUB_SHA}`
          - authority: #1269
          - architecture gate: `37470390411`
          - run-control gate: `37471004582`
          - account2 import probe: `37471163752`
          - clean account2 namespace preflight: `37594989879`
          - smoke seed: `1261001`
          - replication seeds: `1261101,1261102,1261103`
          - retries: `0`
          - resume: `false`
          - breakthrough claim: `false`
          - scale-up authority: `false`

          Launching the unchanged preregistered five-arm CPW-v3 sparse-WORLD panel exactly once on account2.
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1269/comments" -F body=@/tmp/launch.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1261/comments" -F body=@/tmp/launch.txt

      - name: Run one-shot sparse-WORLD panel
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v3_sparse_world_1261.py --source-sha "${GITHUB_SHA}" | tee cpw-v3-panel.log

      - name: Record terminal result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.txt
          import json
          from pathlib import Path

          prefix = "CPW_V3_RESULT="
          rows = [
              line.split(prefix, 1)[1]
              for line in Path("cpw-v3-panel.log").read_text(errors="replace").splitlines()
              if prefix in line
          ]
          if not rows:
              raise SystemExit("missing CPW_V3_RESULT terminal marker")
          result = json.loads(rows[-1])

          print("CPW-v3 #1261 sparse-WORLD terminal result")
          print()
          print(f"- classification: `{result['classification']}`")
          print(f"- replication integrity: `{result['replication_integrity']}`")
          print(f"- selected successor: `{result['selected_successor']}`")
          for arm in ("world_last1", "world_2", "world_3"):
              stats = result["candidate_stats"].get(arm)
              if stats is None:
                  continue
              print(
                  f"- {arm}: ΔNLL(T-C)=`{stats['mean_transformer_minus_candidate_nll']:+.6f}`, "
                  f"wins=`{stats['wins']}/3`, TPS=`{stats['mean_training_tps_ratio']:.3f}x`, "
                  f"compute=`{stats['mean_total_compute_ratio']:.3f}x`, "
                  f"quality=`{stats['quality_supported']}`, pareto=`{stats['pareto_supported']}`, "
                  f"strong3/3=`{stats['strong_pareto_3_of_3']}`"
              )
          seq = result.get("sequence_only_reference")
          if seq:
              print(
                  f"- sequence-only reference: ΔNLL(T-C)=`{seq['mean_transformer_minus_candidate_nll']:+.6f}`, "
                  f"TPS=`{seq['mean_training_tps_ratio']:.3f}x`, "
                  f"compute=`{seq['mean_total_compute_ratio']:.3f}x`"
              )
          print("- breakthrough claim authorized: `false`")
          print("- scale-up authorized: `false`")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1269/comments" -F body=@/tmp/result.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1261/comments" -F body=@/tmp/result.txt

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/failure.txt <<EOF
          CPW-v3 #1261 one-shot workflow did not return successfully for source `${GITHUB_SHA}`.

          Inspect durable `ATTEMPT.json` / `RESULT.json` / `FAILURE.json` before any further action. This launch identity is frozen; no automatic retry or resume is authorized.
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1269/comments" -F body=@/tmp/failure.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1261/comments" -F body=@/tmp/failure.txt
