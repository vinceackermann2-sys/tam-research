name: AERA v26.6 issue527 repaired-oracle FICEM WRITE L4 gate

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-6-issue527-ficem-write-repaired-oracle-l4
  cancel-in-progress: false

jobs:
  repaired-oracle-write:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-6-issue527-ficem-write-repaired-oracle-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue527 probe and launcher
        run: |
          python -m py_compile tam_research/aera_v26_6_issue527_ficem_write_repaired_oracle_probe.py
          python -m py_compile modal_aera_v26_6_issue527_ficem_write_repaired_oracle_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue527 sole one-attempt repaired-oracle WRITE boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/527" --jq '.title')" = "[research] AERA-v26.6 repaired-oracle full mixed-source WRITE L4 correctness/topology gate after #525"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/527" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/526" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/526" --jq '.head.sha')" = "275fed17e0e0c855a8f9a5fd39bfa484e1b78ed2"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/526" --jq '.merge_commit_sha')" = "e18aa12f1ddd96ba30f1b3f5e2be67d5f0922116"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33676365160" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33676365160" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33676365160" --jq '.head_sha')" = "275fed17e0e0c855a8f9a5fd39bfa484e1b78ed2"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100401938039" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/521" --jq '.title')" = "[aera-v26-6-issue519-ficem-write-materialize-cast-l4] sole #519 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33672232063" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100388368044" --jq '.conclusion')" = "success"
          test "${TRIGGER_ISSUE}" != "521"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/524" --jq '.title')" = "[aera-v26-6-issue522-readonly-issue519-result-inspector] sole #522 CPU-only trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33675476637" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100398984660" --jq '.conclusion')" = "success"
          test "${TRIGGER_ISSUE}" != "524"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-6-issue527-ficem-write-repaired-oracle-l4]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"
          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.6 #527 repaired-oracle FICEM WRITE result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor e18aa12f1ddd96ba30f1b3f5e2be67d5f0922116 HEAD

          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"
          test "$(git hash-object tam_research/aera_v26_6_issue519_ficem_write_materialize_cast_probe.py)" = "ec22807434192f58e292bffc3de9828be2b44272"
          test "$(git hash-object tam_research/aera_v26_6_issue525_mixed_dtype_write_oracle.py)" = "8f472451af4024bb3faacb56d814f7d6bdb25cc9"
          test "$(git hash-object tests/test_aera_v26_6_issue525_mixed_dtype_write_oracle_cpu.py)" = "de3ae08b9db04803359d216f601d5c68dac3a542"
          test "$(git hash-object tam_research/aera_v26_6_issue527_ficem_write_repaired_oracle_probe.py)" = "bcfeb6a93ed062b7d00359603dc9fbc7aca5767f"
          test "$(git hash-object modal_aera_v26_6_issue527_ficem_write_repaired_oracle_app.py)" = "f893c4bf7d07d8adcf6a20bb43fe7d8e941e4868"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue527 gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.6 #527 repaired-oracle FICEM WRITE gate** — exact bound main, CPU-green #525 oracle, and frozen full #519 regression surface verified. One NVIDIA L4, Actions attempt 1 only. Synthetic correctness/topology only; no end-to-end/freeze/scientific-seed/replication/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue527 repaired-oracle FICEM WRITE L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_6_issue527_ficem_write_repaired_oracle_app.py 2>&1 | tee /tmp/issue527.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_6_ISSUE527_FICEM_WRITE_REPAIRED_ORACLE_RESULT_JSON=' /tmp/issue527.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue527 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_6_ISSUE527_FICEM_WRITE_REPAIRED_ORACLE_SUMMARY_JSON=' /tmp/issue527.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.6 #527 repaired-oracle FICEM WRITE result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. PASS permits only separate end-to-end systems preregistration; no automatic freeze/scientific-seed/replication/100M/breakthrough authorization." || true

      - name: Record issue527 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.6 #527 repaired-oracle WRITE gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
