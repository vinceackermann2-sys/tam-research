name: CPW-v2 single predictor one-shot H100 panel
on:
  push:
    branches: [experiment/cpw-v0-brain-predictive-workspace-20261005]
    paths: ['cpw/LAUNCH_V2_SINGLE.json']
permissions: {contents: read, issues: write}
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_SECONDARY: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
      MODAL_TOKEN_SECRET_SECONDARY: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_LOW_CREDIT_ACCOUNT: ${{ secrets.MODAL_LOW_CREDIT_ACCOUNT }}
      MODAL_MAX_THROTTLE_WAIT: "0"
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Validate one-shot authority
        env: {RUN_ATTEMPT: "${{ github.run_attempt }}", SOURCE_SHA: "${{ github.sha }}"}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("cpw/LAUNCH_V2_SINGLE.json").read_text())
          assert set(c)=={"phase","issue","cpu_gate_run","run_control_run","authorized_parent_sha"}
          assert c["phase"]=="cpw-v2-single-predictor-panel"
          assert c["issue"]==1253
          assert c["cpu_gate_run"]==37321216029
          assert c["run_control_run"]==37321543469
          PY
          P="$(python -c 'import json; print(json.load(open("cpw/LAUNCH_V2_SINGLE.json"))["authorized_parent_sha"])')"
          test "$(git rev-parse HEAD^)" = "$P"
          git diff --exit-code 5912524447ebb4893aeeb9aad28f63df05c503fb "$SOURCE_SHA" -- tam_research/cpw_v2_single tests/test_cpw_v2_single_1253.py .github/workflows/cpw-v2-single-cpu.yml
          git diff --exit-code 59b728d8dcf05ee0df58efa88e8c153019d8b4a2 "$SOURCE_SHA" -- modal_cpw_v2_single_1253.py tests/test_cpw_v2_single_run_control_1253.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - name: Re-run contracts
        run: pytest -q tests/test_cpw_v2_single_1253.py tests/test_cpw_v2_single_run_control_1253.py
      - run: pip install 'modal>=1.5.4,<1.6'
      - name: Select eligible Modal account
        id: account
        run: PYTHONPATH="$PWD" python scripts/modal_select_account_v3.py --required-volume tam-research-data --runtime-probe-path modal_runtime_admission_probe_1067_v1.py
      - name: Activate selected account
        env:
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
          SECONDARY_CREDENTIAL_ALIASES: ${{ steps.account.outputs.secondary_credential_aliases }}
        run: |
          set -euo pipefail
          if [ "$SELECTED_MODAL_ACCOUNT" = "primary" ]; then
            echo "MODAL_TOKEN_ID=$MODAL_TOKEN_ID" >> "$GITHUB_ENV"; echo "MODAL_TOKEN_SECRET=$MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
          else
            case ",$SECONDARY_CREDENTIAL_ALIASES," in
              *,secondary,*) ID="$MODAL_TOKEN_ID_SECONDARY"; SECRET="$MODAL_TOKEN_SECRET_SECONDARY";;
              *,account2,*) ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2";;
              *,legacy_b,*) ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B";;
              *) exit 93;;
            esac
            echo "MODAL_TOKEN_ID=$ID" >> "$GITHUB_ENV"; echo "MODAL_TOKEN_SECRET=$SECRET" >> "$GITHUB_ENV"
          fi
      - run: modal token info
      - name: Record launch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1253/comments" -f body="CPW-v2 single-predictor frozen panel launching from ${GITHUB_SHA}. One 0.5M integrity smoke then three fresh 3M-token panels; no retry authorized."
      - name: Run panel
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v2_single_1253.py --source-sha "${GITHUB_SHA}" | tee cpw-v2-single.log
      - name: Record result
        if: success()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python - <<'PY' > /tmp/result.txt
          import json
          from pathlib import Path
          p="CPW_V2_SINGLE_RESULT="
          xs=[x.split(p,1)[1] for x in Path("cpw-v2-single.log").read_text(errors="replace").splitlines() if p in x]
          r=json.loads(xs[-1])
          print("CPW-v2 single-predictor panel terminal result\n")
          print(f"- classification: `{r['classification']}`")
          print(f"- selected successor: `{r['selected_successor']}`")
          for a,x in r["candidate_results"].items():
              print(f"- {a}: delta(T-C)={x['transformer_minus_candidate_mean_nll']:+.6f}, wins={x['wins_vs_transformer']}/3, TPS={x['training_tps_ratio']:.3f}x, params={x['parameter_fraction_of_transformer']:.3f}x, quality={x['quality_supported']}, pareto={x['pareto_supported']}, strong={x['strong_pareto_3_of_3']}")
          print("- breakthrough claim authorized: `false`")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1253/comments" -F body=@/tmp/result.txt
