name: Modal CORTEX-S 100M systems microbench v1 repair3

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  launch:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[modal-cortex-s-100m-systems-microbench-v1-repair3]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Resolve immutable repair3 phase and source
        id: cfg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = json.loads(os.environ.get('ISSUE_BODY') or '{}')
          phase = str(cfg.get('phase', '')).strip().lower()
          source_sha = str(cfg.get('source_sha', '')).strip().lower()
          assert phase == 'microbench-v1-repair3', "issue phase must be exactly microbench-v1-repair3"
          assert re.fullmatch(r'[0-9a-f]{40}', source_sha), "source_sha must be a full commit SHA"
          print(f'phase={phase}')
          print(f'source_sha={source_sha}')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checkout and live main are exactly the frozen source
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.cfg.outputs.source_sha }}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${{ steps.cfg.outputs.source_sha }}"

      - name: Fail closed with stdlib-only repair3 protocol check
        run: |
          test -f architectures/cortex_s/SYSTEMS_MICROBENCH_100M_V1_REPAIR3.md
          test -f architectures/cortex_s/experiments/scale100m_2b/systems_microbench_v1_repair3.py
          test -f modal_cortex_s_100m_systems_microbench_v1_repair3.py
          python - <<'PY'
          import ast
          from pathlib import Path

          core_path = Path('architectures/cortex_s/experiments/scale100m_2b/systems_microbench_v1_repair3.py')
          core = core_path.read_text(encoding='utf-8')
          launcher = Path('modal_cortex_s_100m_systems_microbench_v1_repair3.py').read_text(encoding='utf-8')
          doc = Path('architectures/cortex_s/SYSTEMS_MICROBENCH_100M_V1_REPAIR3.md').read_text(encoding='utf-8')

          assert 'ENGINEERING_SEED = 2_026_090_903' in core
          assert 'CONSUMED_ENGINEERING_SEEDS = (910_001, 2_026_090_901, 2_026_090_902)' in core
          assert 'PARENT_REPAIR2_RUN_ID = 34_329_354_099' in core
          assert 'from torch import _dynamo as dynamo' in core
          assert 'MIN_PROMISING_SPEEDUP = 1.20' in core
          assert 'STOP_GROUPED_BELOW_SPEEDUP = 1.10' in core
          assert 'MEASURED_STEPS = 20' in core
          assert 'APP_NAME = "cortex-s-v0-100m-systems-microbench-v1-repair3"' in launcher
          assert 'RESULT_ROOT = "/vol/cortex-s-v0/100m-systems-microbench-v1-repair3"' in launcher
          assert 'H100_TIMEOUT_SECONDS = 15 * 60' in launcher
          assert 'phase: str = "microbench-v1-repair3"' in launcher
          assert 'zero_gpu_repair3_contract_probe' in launcher
          assert 'def full_2b(' not in launcher
          assert 'train_full_2b' not in launcher
          assert '[modal-cortex-s-100m-systems-microbench-v1-repair3]' in doc
          assert '34329354099' in doc
          assert '2026090902' in doc

          tree = ast.parse(core, filename=str(core_path))
          benchmark = next(
              node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == '_benchmark_full_model_variant'
          )
          bad_torch_imports = []
          for node in ast.walk(benchmark):
              if isinstance(node, ast.Import):
                  bad_torch_imports.extend(alias.name for alias in node.names if alias.name == 'torch' or alias.name.startswith('torch.'))
          assert not bad_torch_imports, f'function-local torch imports reintroduced: {bad_torch_imports}'
          print('stdlib-only repair3 protocol guard PASS')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal only
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication before any remote function launch
        run: modal token info

      - name: Record guarded repair3 H100 handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **CORTEX-S systems microbench repair3 launcher authenticated** — source=${{ steps.cfg.outputs.source_sha }}, engineering seed=2026090903. Fresh scoping-repair namespace; CPU/data/layout/scoping gate runs first and at most one bounded H100 dispatch may follow. No scientific seed or 2B training function is authorized."

      - name: Launch exact frozen repair3 systems microbenchmark detached
        run: |
          modal run --detach --timestamps modal_cortex_s_100m_systems_microbench_v1_repair3.py \
            --phase "${{ steps.cfg.outputs.phase }}" \
            --source-sha "${{ steps.cfg.outputs.source_sha }}"

      - name: Record successful repair3 completion handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🧪 **CORTEX-S repair3 Modal run returned successfully.** Authoritative DATA_GATE/RESULT evidence is persisted in the single-use repair3 Volume namespace. This engineering run still cannot authorize 2B training."
