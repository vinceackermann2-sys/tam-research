name: AERA v26.8 issue578 first-divergence localizer L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  localize-first-divergence:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-8-issue578-first-divergence-localizer-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue578 harness
        run: |
          python -m py_compile modal_aera_v26_8_issue578_first_divergence_localizer_app.py
          python -m py_compile tam_research/aera_v26_8_issue578_first_divergence_localizer.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify canonical authorized issue578 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/578" --jq '.title')" = "[research] AERA-v26.8 first-divergence integrated state localization after #574"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/578" --jq '.state')" = "open"

          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue578-first-divergence-localizer-l4]")) | .number' \
              | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bind_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bind_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bind_lines}" | sed -n '1p')"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor bbf548edf47fd91948c54819f1cee47c4c567ed6 HEAD

          auth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/578/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #578 sole L4 diagnostic authorization")) | .id' | wc -l | tr -d ' ')"
          test "${auth_count}" = "1"
          auth_body="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/578/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #578 sole L4 diagnostic authorization")) | .body')"
          auth_lines="$(printf '%s\n' "${auth_body}" | sed -n 's/^Authorize main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${auth_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "${auth_lines}" | sed -n '1p')" = "${bound_main}"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33741700781" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33741700781" --jq '.head_sha')" = "c913d817ee1c1a1fca2d7c7622f4c8ca5353772f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100604889696" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33744802059" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33744802059" --jq '.head_sha')" = "bbf548edf47fd91948c54819f1cee47c4c567ed6"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100614716963" --jq '.conclusion')" = "success"

          test "$(git hash-object tam_research/aera_v26_8_issue578_first_divergence_localizer.py)" = "5933d1113b950348bb63e5f3eb8713ad36dbf580"
          test "$(git hash-object modal_aera_v26_8_issue578_first_divergence_localizer_app.py)" = "cd47e1252bed5617556998659eadfe6a61637d39"
          test "$(git hash-object tam_research/aera_v26_8_issue562_end_to_end_systems.py)" = "3534103eea21f7c4d9d31798ad34601fd47090d6"
          test "$(git hash-object tam_research/aera_hardware_core_v26_8_ficem_read_mixed_strength_precision.py)" = "3575c58d1cd730be77649f087908c51dbf3e6088"
          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"

          test "$(grep -c 'gpu="L4"' modal_aera_v26_8_issue578_first_divergence_localizer_app.py)" = "1"
          test "$(grep -c 'run_first_divergence_localization' modal_aera_v26_8_issue578_first_divergence_localizer_app.py)" -ge "1"
          echo "bound_main=${bound_main}" >> "$GITHUB_OUTPUT"

      - name: Record issue578 localization start (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.8 #578 first-divergence localization started** — exact authorized main verified. One L4 diagnostic only; no training, checkpoint mutation, performance tuning, or repair." || true

      - name: Recheck canonical trigger immediately before Modal
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue578-first-divergence-localizer-l4]")) | .number' \
              | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.bound_main }}"

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue578 L4 diagnostic
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal run modal_aera_v26_8_issue578_first_divergence_localizer_app.py 2>&1 | tee /tmp/issue578.log
          test "$(grep -c '^AERA_V26_8_ISSUE578_FIRST_DIVERGENCE_RESULT_JSON=' /tmp/issue578.log)" = "1"
          test "$(grep -c '^AERA_V26_8_ISSUE578_FIRST_DIVERGENCE_SUMMARY_JSON=' /tmp/issue578.log)" = "1"

      - name: Record issue578 result (best effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          if test -f /tmp/issue578.log; then
            summary="$(grep '^AERA_V26_8_ISSUE578_FIRST_DIVERGENCE_SUMMARY_JSON=' /tmp/issue578.log | tail -1 | sed 's/^AERA_V26_8_ISSUE578_FIRST_DIVERGENCE_SUMMARY_JSON=//')"
            result="$(grep '^AERA_V26_8_ISSUE578_FIRST_DIVERGENCE_RESULT_JSON=' /tmp/issue578.log | tail -1 | sed 's/^AERA_V26_8_ISSUE578_FIRST_DIVERGENCE_RESULT_JSON=//')"
            if test -n "${result}"; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.8 #578 authoritative first-divergence localization**\n\nResult: \`${result}\`\n\nSummary: \`${summary}\`\n\nThis is diagnostic evidence only. It authorizes no repair, rerun, architecture freeze, S2, fresh scientific seed, replication, 100M scaling, or breakthrough claim." || true
            fi
          fi
