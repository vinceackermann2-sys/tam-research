name: AERA v26.8 issue588 first-divergence guard repair1 L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  localize-first-divergence:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-8-issue588-first-divergence-guard-repair1-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue588 harness
        run: |
          python -m py_compile modal_aera_v26_8_issue588_first_divergence_guard_repair1_app.py
          python -m py_compile tam_research/aera_v26_8_issue581_first_divergence_no_grad.py
          python -m py_compile tam_research/aera_v26_8_issue578_first_divergence_localizer.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify canonical authorized issue588 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/588" --jq '.title')" = "[research] AERA-v26.8 #584 guard repair1 after consumed #587 pre-GPU pull-request permission failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/588" --jq '.state')" = "open"

          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue588-first-divergence-guard-repair1-l4]")) | .number' \
              | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bind_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bind_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bind_lines}" | sed -n '1p')"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor ad3b56106ea80956dcd1e8b457a5ef3169507351 HEAD

          auth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/588/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #588 sole L4 diagnostic authorization")) | .id' | wc -l | tr -d ' ')"
          test "${auth_count}" = "1"
          auth_body="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/588/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #588 sole L4 diagnostic authorization")) | .body')"
          auth_lines="$(printf '%s\n' "${auth_body}" | sed -n 's/^Authorize main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${auth_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "${auth_lines}" | sed -n '1p')" = "${bound_main}"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/586" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/586" --jq '.merge_commit_sha')" = "ad3b56106ea80956dcd1e8b457a5ef3169507351"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33751191196" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33751191196" --jq '.head_sha')" = "58bfecc6a00214f827862a9e38befd5b03d8db89"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33751191196" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100634879254" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33752190666" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33752190666" --jq '.head_sha')" = "ad3b56106ea80956dcd1e8b457a5ef3169507351"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33752190666" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100638055124" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100638055124" --jq '.steps[] | select(.name=="Verify canonical authorized issue584 boundary") | .conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100638055124" --jq '.steps[] | select(.name=="Authenticate Modal") | .conclusion')" = "skipped"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100638055124" --jq '.steps[] | select(.name=="Run sole issue584 L4 diagnostic") | .conclusion')" = "skipped"

          test "$(git hash-object modal_aera_v26_8_issue584_first_divergence_no_grad_l4_app.py)" = "25842ba4c02546e4773764354919de683d5fd6f0"
          test "$(git hash-object .github/workflows/aera-v26-8-issue584-first-divergence-no-grad-l4.yml)" = "25d420e4f30fbbe8ac2fbb93419039db7b54bfa6"
          test "$(git hash-object tests/test_aera_v26_8_issue584_first_divergence_no_grad_l4_cpu.py)" = "0e5995adb6bf6aa99e875115a9490783fb2287ff"
          test "$(git hash-object tam_research/aera_v26_8_issue581_first_divergence_no_grad.py)" = "8800bb399e21b691e0d7703cc3eeaf486d3223b6"
          test "$(git hash-object tam_research/aera_v26_8_issue578_first_divergence_localizer.py)" = "5933d1113b950348bb63e5f3eb8713ad36dbf580"
          test "$(git hash-object tam_research/aera_v26_8_issue562_end_to_end_systems.py)" = "3534103eea21f7c4d9d31798ad34601fd47090d6"
          test "$(git hash-object tam_research/aera_hardware_core_v26_8_ficem_read_mixed_strength_precision.py)" = "3575c58d1cd730be77649f087908c51dbf3e6088"
          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"

          test "$(grep -c 'gpu="L4"' modal_aera_v26_8_issue588_first_divergence_guard_repair1_app.py)" = "1"
          test "$(grep -c 'run_first_divergence_localization_issue581(' modal_aera_v26_8_issue588_first_divergence_guard_repair1_app.py)" = "1"
          echo "bound_main=${bound_main}" >> "$GITHUB_OUTPUT"

      - name: Record issue588 localization start (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.8 #588 first-divergence guard-repair1 started** — exact authorized main and consumed #587 pre-GPU boundary verified. One L4 diagnostic only; no training, checkpoint mutation, performance tuning, or repair." || true

      - name: Recheck canonical trigger immediately before Modal
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue588-first-divergence-guard-repair1-l4]")) | .number' \
              | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.bound_main }}"

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue588 L4 diagnostic
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal run modal_aera_v26_8_issue588_first_divergence_guard_repair1_app.py 2>&1 | tee /tmp/issue588.log
          test "$(grep -c '^AERA_V26_8_ISSUE588_FIRST_DIVERGENCE_GUARD_REPAIR1_RESULT_JSON=' /tmp/issue588.log)" = "1"
          test "$(grep -c '^AERA_V26_8_ISSUE588_FIRST_DIVERGENCE_GUARD_REPAIR1_SUMMARY_JSON=' /tmp/issue588.log)" = "1"

      - name: Record issue588 result (best effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          if test -f /tmp/issue588.log; then
            summary="$(grep '^AERA_V26_8_ISSUE588_FIRST_DIVERGENCE_GUARD_REPAIR1_SUMMARY_JSON=' /tmp/issue588.log | tail -1 | sed 's/^AERA_V26_8_ISSUE588_FIRST_DIVERGENCE_GUARD_REPAIR1_SUMMARY_JSON=//')"
            result="$(grep '^AERA_V26_8_ISSUE588_FIRST_DIVERGENCE_GUARD_REPAIR1_RESULT_JSON=' /tmp/issue588.log | tail -1 | sed 's/^AERA_V26_8_ISSUE588_FIRST_DIVERGENCE_GUARD_REPAIR1_RESULT_JSON=//')"
            if test -n "${result}"; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.8 #588 authoritative first-divergence localization**\n\nResult: \`${result}\`\n\nSummary: \`${summary}\`\n\nDiagnostic evidence only. No repair, rerun, architecture freeze, S2, fresh scientific seed, replication, 100M scaling, or breakthrough claim is authorized." || true
            fi
          fi
