name: CPW-v5 #1304 zero-GPU postmortem

on:
  push:
    branches:
      - audit/cpw-v5-afm-postmortem-1304
    paths:
      - 'scripts/cpw_v5_postmortem_1304.py'
      - 'tests/test_cpw_v5_postmortem_1304.py'
      - '.github/workflows/cpw-v5-postmortem-1304.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
      - name: Verify frozen scientific source untouched
        run: |
          set -euo pipefail
          git diff --exit-code 9ac27396556997a530fab953bceed46e30ac27ba HEAD -- \
            tam_research/cpw_v5_afm \
            tam_research/cpw_v4_memory \
            modal_cpw_v5_afm_1290.py
      - name: Compile CPU-only diagnostic
        run: python -m py_compile scripts/cpw_v5_postmortem_1304.py
      - name: Run diagnostic contracts
        run: pytest -q tests/test_cpw_v5_postmortem_1304.py
      - name: Output CPU diagnostic report
        run: python scripts/cpw_v5_postmortem_1304.py | tee cpw-v5-postmortem.log
      - name: Record diagnostics on issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/cpw-v5-report.txt
          import json
          from pathlib import Path
          prefix='CPW_V5_POSTMORTEM='
          lines=Path('cpw-v5-postmortem.log').read_text().splitlines()
          entries=[json.loads(l.split(prefix,1)[1]) for l in lines if prefix in l]
          assert len(entries)==1
          report=entries[0]
          assert report['cpu_only'] is True
          assert report['scientific_seeds_consumed'] is False
          print('CPW-v5 #1304 CPU-only postmortem')
          print('')
          print('```json')
          print(json.dumps(report,indent=2,sort_keys=True))
          print('```')
          print('')
          print('These are constructed-feature/initialization diagnostics, NOT trained-model scientific results.')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1304/comments" -F body=@/tmp/cpw-v5-report.txt

# registration-trigger: cpw-v5-postmortem-1304
