name: AERA v26.8 issue558 mixed-strength-precision FICEM READ L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  ficem-read-mixed-strength-precision:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-8-issue558-ficem-read-mixed-strength-precision-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue558 probe and launcher
        run: |
          python -m py_compile tam_research/aera_v26_8_issue558_ficem_read_mixed_strength_precision_probe.py
          python -m py_compile modal_aera_v26_8_issue558_ficem_read_mixed_strength_precision_l4_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue558 canonical mixed-strength-precision READ boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/558" --jq '.title')" = "[research] AERA-v26.8 mixed-strength-precision READ L4 gate after #556 CPU merge"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/558" --jq '.state')" = "open"
          issue558_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/558" --jq '.body')"
          printf '%s\n' "${issue558_body}" | grep -F 'ae25cb4133c1ff94bec1cdfa9aa58e4081c05c73' >/dev/null
          printf '%s\n' "${issue558_body}" | grep -F '009af31baf70e46eb93b6e7489d62f356a02b727521d3fabe4a7dab2dcf5ab47' >/dev/null
          freeze_comment="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5522486484" --jq '.body')"
          printf '%s\n' "${freeze_comment}" | grep -F '[aera-v26-8-issue558-ficem-read-mixed-strength-precision-l4]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F '/vol/aera-v26/issue558-ficem-read-mixed-strength-precision/result.json' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F '300' >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/556" --jq '.title')" = "[research] AERA-v26.8 mixed-dtype READ strength-precision repair after authoritative #553 FAIL"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/557" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/557" --jq '.head.sha')" = "783c5e2921d1d7fc7f598948d1bb968e51260440"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/557" --jq '.merge_commit_sha')" = "ae25cb4133c1ff94bec1cdfa9aa58e4081c05c73"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33730039451" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33730039451" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100567632346" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100567632346" --jq '.steps[] | select(.name == "Run tests") | .conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/555" --jq '.title')" = "[aera-v26-7-issue553-ficem-read-mixed-dtype-l4] sole #553 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/555" --jq '.body' | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')" = "e4866dd6d4556fc090b556c09ae49fcf4c59105f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33727540468" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33727540468" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100559866985" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100559866985" --jq '.steps[] | select(.name == "Verify issue553 canonical mixed-dtype READ boundary") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100559866985" --jq '.steps[] | select(.name == "Re-verify issue553 canonical trigger immediately before Modal") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100559866985" --jq '.steps[] | select(.name == "Authenticate Modal") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100559866985" --jq '.steps[] | select(.name == "Run canonical issue553 mixed-dtype FICEM READ L4 gate") | .conclusion')" = "success"
          issue553_result_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/555/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.7 #553 mixed-dtype FICEM READ result**")) | .id' | wc -l | tr -d ' ')"
          test "${issue553_result_count}" = "1"
          issue553_result="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/555/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.7 #553 mixed-dtype FICEM READ result**")) | .body')"
          printf '%s\n' "${issue553_result}" | grep -F '"decision":"FAIL"' >/dev/null
          printf '%s\n' "${issue553_result}" | grep -F '"historical":{"decision":"PASS","overall_pass":true' >/dev/null
          printf '%s\n' "${issue553_result}" | grep -F '"mixed":{"overall_pass":false,"rows_pass":false' >/dev/null
          printf '%s\n' "${issue553_result}" | grep -F '"device":"NVIDIA L4"' >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/550" --jq '.title')" = "[aera-v26-6-issue545-e2e-systems-l4-successor1] sole #545 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/550" --jq '.body' | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')" = "383444afa414fa955c46f98f11cf733ddcef656f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33686037672" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33686037672" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Verify issue545 canonical successor systems boundary") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Re-verify issue545 canonical trigger immediately before Modal") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Authenticate Modal") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Run canonical issue545 successor1 end-to-end systems L4 gate") | .conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100433658768" --jq '.steps[] | select(.name == "Record issue545 successor1 result (best effort)") | .conclusion')" = "skipped"

          mapfile -t matching_triggers < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue558-ficem-read-mixed-strength-precision-l4]")) | .number' \
              | sort -n
          )
          test "${#matching_triggers[@]}" -ge 1
          canonical_trigger="${matching_triggers[0]}"
          test "${TRIGGER_ISSUE}" = "${canonical_trigger}"

          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.8 #558 mixed-strength-precision FICEM READ result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor ae25cb4133c1ff94bec1cdfa9aa58e4081c05c73 HEAD

          test "$(git hash-object tam_research/aera_hardware_core_v26_8_ficem_read_mixed_strength_precision.py)" = "3575c58d1cd730be77649f087908c51dbf3e6088"
          test "$(git hash-object tests/test_aera_v26_8_issue556_ficem_read_mixed_strength_precision_cpu.py)" = "443d36dcc61eb72f8a2f406a6f2ae1abfeb365c4"
          test "$(git hash-object tam_research/aera_hardware_core_v26_7_ficem_read_mixed_dtype.py)" = "d8133c6b204b1ee5f23955255fb2fb09d09bd723"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"
          test "$(git hash-object tam_research/aera_v26_7_issue553_ficem_read_mixed_dtype_probe.py)" = "ff9a47f510be07e8adeff018f327338147163cdb"
          test "$(git hash-object modal_aera_v26_7_issue553_ficem_read_mixed_dtype_l4_app.py)" = "b3630e065c56c93a1b7f6f164416f068ccb2ecac"
          test "$(git hash-object .github/workflows/aera-v26-7-issue553-ficem-read-mixed-dtype-l4.yml)" = "eef7826f1a76a853d9cf745243612dd457d79a10"
          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe_repair5.py)" = "6fd6518e10ed1ef4115863f98ac591ffd77ce903"
          test "$(git hash-object tam_research/aera_v26_6_issue530_end_to_end_systems.py)" = "9d5a3c31f4a3862f96b957540baa2e0ec6a84c6b"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object tam_research/aera_v26_8_issue558_ficem_read_mixed_strength_precision_probe.py)" = "99ab8252f2b594404aae1ca86752eaa902eb80a5"
          test "$(git hash-object modal_aera_v26_8_issue558_ficem_read_mixed_strength_precision_l4_app.py)" = "634758b2293d982055521c2584771499a3b28149"

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Re-verify issue558 canonical trigger immediately before Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t matching_triggers < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue558-ficem-read-mixed-strength-precision-l4]")) | .number' \
              | sort -n
          )
          test "${#matching_triggers[@]}" -ge 1
          test "${TRIGGER_ISSUE}" = "${matching_triggers[0]}"

      - name: Record issue558 gate boundary (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="🔒 **AERA-v26.8 #558 mixed-strength-precision FICEM READ gate** — canonical-lowest trigger, exact bound main, #557 CPU-green v26.8 candidate, authoritative #553 FAIL, historical #479 READ PASS, #529 WRITE PASS and consumed #545 abort evidence verified. Exactly one NVIDIA L4, Actions attempt 1 only. No rerun/end-to-end/freeze/scientific-seed/replication/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run canonical issue558 mixed-strength-precision FICEM READ L4 gate
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_8_issue558_ficem_read_mixed_strength_precision_l4_app.py 2>&1 | tee /tmp/issue558.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_8_ISSUE558_FICEM_READ_MIXED_STRENGTH_PRECISION_RESULT_JSON=' /tmp/issue558.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue558 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_8_ISSUE558_FICEM_READ_MIXED_STRENGTH_PRECISION_SUMMARY_JSON=' /tmp/issue558.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="🔬 **AERA-v26.8 #558 mixed-strength-precision FICEM READ result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment authority. PASS permits only separate end-to-end systems preregistration; no architecture freeze, fresh science, replication, 100M, or breakthrough claim." || true

      - name: Record issue558 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="⚠️ **AERA-v26.8 #558 mixed-strength-precision FICEM READ gate failed before an authoritative result marker.** The canonical attempt is consumed. No rerun, retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
