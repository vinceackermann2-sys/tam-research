name: CHM-v2 100M QVA Stage-B L4 systems preflight v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  launch:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[modal-chm-v2-100m-qva-stage-b-parent-1147-v1]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_MAX_THROTTLE_WAIT: "0"

    steps:
      - name: Refuse reruns and resolve immutable Stage-B payload
        id: cfg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = "1"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = json.loads(os.environ.get("ISSUE_BODY") or "{}")
          expected = {
              "phase": "chm-v2-100m-qva-stage-b-1155-v1",
              "engineering_seed": 1147201,
              "parent_hypothesis_issue": 1147,
              "systems_issue": 1155,
              "result_root": "/vol/chm-v2/100m-qva-stage-b/parent-1147/seed-1147201-v1",
          }
          for key, value in expected.items():
              assert cfg.get(key) == value, f"{key} mismatch: {cfg.get(key)!r} != {value!r}"
          for key in (
              "source_sha", "source_tree", "qva_sha", "contract_sha",
              "harness_sha", "workflow_sha",
          ):
              value = str(cfg.get(key, "")).strip().lower()
              assert re.fullmatch(r"[0-9a-f]{40}", value), f"{key} must be full lowercase SHA"
              print(f"{key}={value}")
          authority = cfg.get("authority_comment_id")
          assert isinstance(authority, int) and authority > 0, "authority_comment_id must be positive"
          print(f"authority_comment_id={authority}")
          PY

      - name: Checkout exact authorized boundary
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 0
          path: source

      - name: Fail closed on live main and frozen CHM-v2 blobs
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          QVA_SHA: ${{ steps.cfg.outputs.qva_sha }}
          CONTRACT_SHA: ${{ steps.cfg.outputs.contract_sha }}
          HARNESS_SHA: ${{ steps.cfg.outputs.harness_sha }}
          WORKFLOW_SHA: ${{ steps.cfg.outputs.workflow_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source fetch --no-tags origin main
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_SHA"

          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v2_100m_qva.py")" = "$QVA_SHA"
          test "$QVA_SHA" = "a34a8dffc2c2c1702a909782c3aba2593e90947c"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v1_100m_scale.py")" = "b9b141c0e52d4fd0fff28b12a3588b2adc659b8f"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v1_small_lm_protocol.py")" = "d5c2e405b5306f556e7fbe70aacd552867e69d3e"
          test "$(git -C source rev-parse "$SOURCE_SHA:tam_research/chm_v2_100m_stage_b.py")" = "$CONTRACT_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:modal_chm_v2_100m_qva_stage_b_1155_v1.py")" = "$HARNESS_SHA"
          test "$(git -C source rev-parse "$SOURCE_SHA:.github/workflows/modal-chm-v2-100m-qva-stage-b-1155-v1.yml")" = "$WORKFLOW_SHA"

      - name: Verify final authority and unique post-authority trigger
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          QVA_SHA: ${{ steps.cfg.outputs.qva_sha }}
          CONTRACT_SHA: ${{ steps.cfg.outputs.contract_sha }}
          HARNESS_SHA: ${{ steps.cfg.outputs.harness_sha }}
          WORKFLOW_SHA: ${{ steps.cfg.outputs.workflow_sha }}
          AUTHORITY_COMMENT_ID: ${{ steps.cfg.outputs.authority_comment_id }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          owner = os.environ["REPO_OWNER"]
          trigger_number = int(os.environ["ISSUE_NUMBER"])
          authority_id = int(os.environ["AUTHORITY_COMMENT_ID"])

          def gh(path, *extra):
              return json.loads(subprocess.check_output(["gh", "api", path, *extra], text=True))

          control = gh(f"repos/{repo}/issues/1155")
          assert control["state"] == "open"
          comments = gh(f"repos/{repo}/issues/1155/comments?per_page=100")
          matches = [c for c in comments if int(c["id"]) == authority_id]
          assert len(matches) == 1, "final authority comment not found"
          authority = matches[0]
          assert authority["user"]["login"] == owner
          body = authority["body"]
          for needle in (
              "CHM_V2_1155_FINAL_LAUNCHER_AUTHORITY_V1",
              f"source_sha={os.environ['SOURCE_SHA']}",
              f"source_tree={os.environ['SOURCE_TREE']}",
              f"qva_blob={os.environ['QVA_SHA']}",
              f"contract_blob={os.environ['CONTRACT_SHA']}",
              f"harness_blob={os.environ['HARNESS_SHA']}",
              f"workflow_blob={os.environ['WORKFLOW_SHA']}",
              "engineering_seed=1147201",
              "gpu=1x NVIDIA L4",
              "max_gpu_seconds=1200",
              "max_stage_b_compute_usd=0.50",
              "trigger_authorized=true",
              "scientific_seed_authorized=false",
              "automatic_retry_authorized=false",
          ):
              assert needle in body, f"authority missing {needle!r}"

          trigger = gh(f"repos/{repo}/issues/{trigger_number}")
          assert trigger["user"]["login"] == owner
          assert trigger["created_at"] > authority["created_at"]
          title = "[modal-chm-v2-100m-qva-stage-b-parent-1147-v1]"
          query = f'repo:{repo} is:issue in:title "{title}"'
          found = gh("search/issues", "-X", "GET", "-f", f"q={query}", "-f", "per_page=100")
          exact = [item for item in found["items"] if item["title"] == title]
          assert len(exact) == 1, f"exact trigger count={len(exact)}"
          assert exact[0]["number"] == trigger_number
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Modal CLI
        run: pip install 'modal>=1.5.4,<1.6'

      - name: Verify Modal authentication
        run: modal token info

      - name: Fail closed on live Modal rates and 20-minute cap
        id: rates
        run: |
          modal billing rates --json > modal-rates.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          rates = json.load(open("modal-rates.json", encoding="utf-8"))
          l4 = float(rates["gpu_hour_cost_l4"])
          cpu = float(rates["cpu_hour_cost"])
          ram = float(rates["mem_gib_hour_cost"])
          for name, value in (("l4", l4), ("cpu", cpu), ("ram", ram)):
              assert value > 0.0, f"invalid {name} hourly rate"
          hourly = l4 + 4 * cpu + 16 * ram
          worst = hourly * (1200 / 3600)
          assert worst <= 0.50, f"live 1200s Stage-B bound ${worst:.6f} exceeds $0.50 cap"
          print(f"hourly_resource_usd={hourly:.12f}")
          print(f"worst_case_stage_b_usd={worst:.12f}")
          PY

      - name: Run zero-GPU corpus and protocol preflight
        id: preflight
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          QVA_SHA: ${{ steps.cfg.outputs.qva_sha }}
          HARNESS_SHA: ${{ steps.cfg.outputs.harness_sha }}
          WORKFLOW_SHA: ${{ steps.cfg.outputs.workflow_sha }}
          AUTHORITY_COMMENT_ID: ${{ steps.cfg.outputs.authority_comment_id }}
        run: |
          cd source
          modal run modal_chm_v2_100m_qva_stage_b_1155_v1.py \
            --phase preflight \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --qva-sha "$QVA_SHA" --harness-sha "$HARNESS_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --authority-comment-id "$AUTHORITY_COMMENT_ID" | tee ../zero-gpu.log
          cd ..
          python - <<'PY'
          import json
          from pathlib import Path
          lines = Path("zero-gpu.log").read_text(encoding="utf-8").splitlines()
          matches = [x.split("CHM_V2_100M_QVA_STAGE_B_ZERO_GPU=", 1)[1]
                     for x in lines if "CHM_V2_100M_QVA_STAGE_B_ZERO_GPU=" in x]
          assert len(matches) == 1, len(matches)
          p = json.loads(matches[0])
          assert p["status"] == "PASS"
          assert p["engineering_seed"] == 1147201
          assert p["gpu_allocated"] is False
          assert p["engineering_attempt_consumed"] is False
          assert p["scientific_seed_authorized"] is False
          Path("zero-gpu.json").write_text(json.dumps(p, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Record zero-GPU evidence before allocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1155 --repo "$GITHUB_REPOSITORY" --body             "CHM-v2 #1155 zero-GPU Stage-B preflight PASS. No GPU allocation; engineering attempt 1147201 unconsumed; no scientific seed exists."

      - name: Write durable dispatch marker before L4 allocation
        id: reserve
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          QVA_SHA: ${{ steps.cfg.outputs.qva_sha }}
          HARNESS_SHA: ${{ steps.cfg.outputs.harness_sha }}
          WORKFLOW_SHA: ${{ steps.cfg.outputs.workflow_sha }}
          AUTHORITY_COMMENT_ID: ${{ steps.cfg.outputs.authority_comment_id }}
        run: |
          cd source
          modal run modal_chm_v2_100m_qva_stage_b_1155_v1.py \
            --phase reserve \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --qva-sha "$QVA_SHA" --harness-sha "$HARNESS_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --authority-comment-id "$AUTHORITY_COMMENT_ID" | tee ../dispatch.log

      - name: Record dispatch reservation
        if: steps.reserve.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1155 --repo "$GITHUB_REPOSITORY" --body             "CHM-v2 #1155 dispatch reserved. The next step is the single authorized L4 systems allocation. Once the GPU function begins, engineering attempt 1147201 is permanently consumed; no retry/rerun/redispatch/resume is authorized."

      - name: Launch Stage-B L4 systems attempt exactly once
        id: launch
        if: steps.reserve.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          QVA_SHA: ${{ steps.cfg.outputs.qva_sha }}
          HARNESS_SHA: ${{ steps.cfg.outputs.harness_sha }}
          WORKFLOW_SHA: ${{ steps.cfg.outputs.workflow_sha }}
          AUTHORITY_COMMENT_ID: ${{ steps.cfg.outputs.authority_comment_id }}
          LIVE_HOURLY_RESOURCE_USD: ${{ steps.rates.outputs.hourly_resource_usd }}
        run: |
          cd source
          modal run modal_chm_v2_100m_qva_stage_b_1155_v1.py \
            --phase run \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --qva-sha "$QVA_SHA" --harness-sha "$HARNESS_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --authority-comment-id "$AUTHORITY_COMMENT_ID" \
            --live-hourly-resource-usd "$LIVE_HOURLY_RESOURCE_USD" | tee ../result.log

      - name: Inspect durable Stage-B state
        id: inspect
        if: always() && steps.reserve.outcome == 'success'
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.cfg.outputs.source_tree }}
          QVA_SHA: ${{ steps.cfg.outputs.qva_sha }}
          HARNESS_SHA: ${{ steps.cfg.outputs.harness_sha }}
          WORKFLOW_SHA: ${{ steps.cfg.outputs.workflow_sha }}
          AUTHORITY_COMMENT_ID: ${{ steps.cfg.outputs.authority_comment_id }}
        run: |
          cd source
          modal run modal_chm_v2_100m_qva_stage_b_1155_v1.py \
            --phase inspect \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --qva-sha "$QVA_SHA" --harness-sha "$HARNESS_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --authority-comment-id "$AUTHORITY_COMMENT_ID" | tee ../inspect.log
          cd ..
          python - <<'PY'
          import json
          from pathlib import Path
          lines = Path("inspect.log").read_text(encoding="utf-8").splitlines()
          matches = [x.split("CHM_V2_100M_QVA_STAGE_B_STATE=", 1)[1]
                     for x in lines if "CHM_V2_100M_QVA_STAGE_B_STATE=" in x]
          assert len(matches) == 1, len(matches)
          state = json.loads(matches[0])
          Path("state.json").write_text(json.dumps(state, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Record authoritative Stage-B terminal state
        if: always() && steps.inspect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("state.json").read_text(encoding="utf-8"))
          result = state["files"].get("RESULT.json")
          failure = state["files"].get("ATTEMPT_FAILURE.json")
          consumed = state["files"].get("ATTEMPT_CONSUMED.json")
          assert consumed is not None and consumed["engineering_attempt_consumed"] is True

          if result is not None:
              v1 = result["measurements"]["chm_v1_eiem"]
              qva = result["measurements"]["chm_v2_qva"]
              proj = result["projection"]
              lines = [
                  "CHM_V2_1155_STAGE_B_AUTHORITATIVE_RESULT",
                  "",
                  f"classification={result['classification']}",
                  f"passed={str(result['passed']).lower()}",
                  f"stop_reasons={json.dumps(result['stop_reasons'])}",
                  f"v1_tokens_per_second={v1['tokens_per_second']:.6f}",
                  f"qva_tokens_per_second={qva['tokens_per_second']:.6f}",
                  f"v1_peak_vram_gib={v1['peak_vram_bytes'] / 1024**3:.6f}",
                  f"qva_peak_vram_gib={qva['peak_vram_bytes'] / 1024**3:.6f}",
                  f"qva_v1_throughput_ratio={proj['qva_v1_throughput_ratio']:.9f}",
                  f"projected_pair_seconds={proj['pair_projected_seconds']:.6f}",
                  f"projected_pair_compute_usd={proj['pair_projected_compute_usd']:.6f}",
                  f"start_plan_sha256={result['start_plan_sha256']}",
                  "engineering_attempt_consumed=true",
                  "automatic_retry_authorized=false",
                  "scientific_seed_authorized=false",
                  "stage_c_authorized_automatically=false",
                  "",
                  "Systems feasibility only; no modeling/scientific claim.",
              ]
              terminal = "result"
          elif failure is not None:
              lines = [
                  "CHM_V2_1155_STAGE_B_TERMINAL_INFRASTRUCTURE_FAILURE",
                  "",
                  f"error_type={failure['error_type']}",
                  f"error={failure['error']}",
                  "engineering_attempt_consumed=true",
                  "automatic_retry_authorized=false",
                  "scientific_seed_authorized=false",
                  "scientific_interpretation=false",
              ]
              terminal = "failure"
          else:
              raise RuntimeError("reserved Stage-B attempt ended without durable RESULT or FAILURE")
          Path("terminal-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path("terminal-kind.txt").write_text(terminal, encoding="utf-8")
          PY
          gh issue comment 1155 --repo "$GITHUB_REPOSITORY" -F terminal-comment.md
          gh issue close 1155 --repo "$GITHUB_REPOSITORY" --reason completed
          gh issue close "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          test "$(cat terminal-kind.txt)" = "result"

      - name: Fail workflow if the one-shot L4 function failed
        if: always() && steps.reserve.outcome == 'success'
        run: |
          test "${{ steps.launch.outcome }}" = "success"
