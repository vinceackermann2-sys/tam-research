name: AERA v26.6 issue546 end-to-end systems L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  end-to-end-systems:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-6-issue546-e2e-systems-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue546 evaluator and launcher
        run: |
          python -m py_compile tam_research/aera_v26_6_issue530_end_to_end_systems.py
          python -m py_compile modal_aera_v26_6_issue546_end_to_end_systems_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue546 canonical systems boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/546" --jq '.title')" = "[research] AERA-v26.6 #539 trigger-race guard repair and successor one-shot systems gate"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/546" --jq '.state')" = "open"

          # Freeze the consumed #539 trigger race as pre-GPU historical evidence.
          for issue in 542 543 544; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" --jq '.title')" = "[aera-v26-6-issue539-e2e-systems-l4] sole #539 trigger"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" --jq '.body' | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')" = "8db5422929f66f89f323f2fc518c1d6b9b224581"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33684268881" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33684268881" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100427851578" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100427851578" --jq '.steps[] | select(.name == "Authenticate Modal") | .conclusion')" = "skipped"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100427851578" --jq '.steps[] | select(.name == "Run sole issue539 end-to-end systems L4 gate") | .conclusion')" = "skipped"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33684274250" --jq '.conclusion')" = "cancelled"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33684274250" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33684274250/jobs" --jq '.total_count')" = "0"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33684290786" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33684290786" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100428014282" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100428014282" --jq '.steps[] | select(.name == "Authenticate Modal") | .conclusion')" = "skipped"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100428014282" --jq '.steps[] | select(.name == "Run sole issue539 end-to-end systems L4 gate") | .conclusion')" = "skipped"

          # Canonical-trigger repair: the lowest same-prefix issue number is the only eligible event.
          matching="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-6-issue546-e2e-systems-l4]")) | .number' | sort -n -u)"
          test -n "${matching}"
          canonical="$(printf '%s\n' "${matching}" | head -n 1)"
          test -n "${canonical}"
          test "${TRIGGER_ISSUE}" = "${canonical}"

          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.6 #546 end-to-end systems result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 8db5422929f66f89f323f2fc518c1d6b9b224581 HEAD

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/533" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/533" --jq '.head.sha')" = "af3ae4d721ccf218f2d5ebcd41458fd7ff5b8ad3"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33682266234" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100421371756" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/541" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/541" --jq '.head.sha')" = "37599439e7d0dcdb26d45a1e04bedb6b1ec18a14"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33683772449" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100426223779" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/529" --jq '.title')" = "[aera-v26-6-issue527-ficem-write-repaired-oracle-l4] sole #527 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33680028132" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33680028132" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100414089065" --jq '.conclusion')" = "success"

          test "$(git hash-object tam_research/aera_v26_6_issue530_end_to_end_systems.py)" = "9d5a3c31f4a3862f96b957540baa2e0ec6a84c6b"
          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems.py)" = "c9731cae7e386f09b2a190b045532591c4fa00be"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems_repair1.py)" = "b3f7082b188644007b873db3733492f424d4941a"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_hardware_core_v26_4_ficem_write_triton.py)" = "e54570292489bd17570038dca7518419ac00418c"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object modal_aera_v26_6_issue539_end_to_end_systems_app.py)" = "4663d86e9dc2f8eedb68213cf673ce1f80e15574"
          test "$(git hash-object .github/workflows/aera-v26-6-issue539-e2e-systems-l4.yml)" = "4e03f6e42c7635f4779f17aaa8d30488d968bc1f"
          test "$(git hash-object modal_aera_v26_6_issue546_end_to_end_systems_app.py)" = "1c4ad1bd314007ac31e61a68e844b61969320f50"
          echo "canonical_trigger=${canonical}" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue546 canonical gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.6 #546 canonical end-to-end systems gate** — this issue is the lowest-numbered same-prefix trigger and is the only eligible event. Exact bound main and frozen #530/#527/#539 evidence verified. One NVIDIA L4, Actions attempt 1 only. No rerun/freeze/science/replication/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run canonical issue546 end-to-end systems L4 gate
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_6_issue546_end_to_end_systems_app.py 2>&1 | tee /tmp/issue546.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_6_ISSUE546_END_TO_END_SYSTEMS_RESULT_JSON=' /tmp/issue546.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue546 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_6_ISSUE546_END_TO_END_SYSTEMS_SUMMARY_JSON=' /tmp/issue546.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.6 #546 end-to-end systems result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. Systems PASS alone authorizes at most separate architecture-freeze consideration; no fresh science/replication/100M/breakthrough claim." || true

      - name: Record issue546 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.6 #546 canonical systems gate failed before an authoritative result marker.** No rerun, retry, redispatch, alternate eligible trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
