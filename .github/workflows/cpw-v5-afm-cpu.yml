name: CPW-v5 associative fast-memory zero-GPU gate

on:
  push:
    branches:
      - research/cpw-v5-associative-fast-memory-1296
    paths:
      - 'tam_research/cpw_v5_afm/**'
      - 'tests/test_cpw_v5_afm_1296.py'
      - '.github/workflows/cpw-v5-afm-cpu.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install tests
        run: pip install -e '.[test]'
      - name: Protect frozen CPW-v4 benchmark
        run: |
          git diff --exit-code 76039a277d416b77d19606a3cf5d25978a102ad1 HEAD -- \
            tam_research/cpw_v4_memory/task.py \
            tam_research/cpw_v4_memory/protocol.py \
            tam_research/cpw_v4_memory/train.py
      - name: Syntax check
        run: python -m compileall -q tam_research/cpw_v5_afm
      - name: CPW-v5 AFM contracts
        run: pytest -q tests/test_cpw_v5_afm_1296.py
