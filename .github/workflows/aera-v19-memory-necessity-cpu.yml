name: AERA v19 integrated fast-memory necessity CPU diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: aera-v19-memory-necessity-cpu-v1
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v19-memory-necessity-cpu]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e .
      - name: Record frozen guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔒 **AERA-v19 integrated fast-memory necessity CPU diagnostic** — no GPU. V19 architecture unchanged; all whole-stage routes are held open identically in both controls to isolate memory. Matched full stream+memory and separately trained stream-only models start bit-exact and see identical randomized key/value write, overwrite, distractor and delayed-query sessions. Frozen gates: task validity >=95%; full query accuracy >=80%; full beats separately trained stream-only by >=15pp; disabling memory on the same full checkpoint drops >=15pp; overwrite current-value accuracy >=80%; stale-value error <=10%; fresh-session accuracy <= chance+10pp; deployment writes mutate no base parameters; exact session isolation. Scientific failure is terminal evidence for this diagnostic and is not a workflow failure. No production data, GPU, architecture freeze, 100M authorization or breakthrough claim."
      - name: Run diagnostic
        run: |
          set -o pipefail
          python aera_v19_memory_necessity_cpu.py | tee /tmp/aera-v19-memory-necessity.log
          grep -q 'AERA_V19_MEMORY_NECESSITY_RESULT_JSON=' /tmp/aera-v19-memory-necessity.log
      - name: Record authoritative result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result.md
          import json
          from pathlib import Path
          marker='AERA_V19_MEMORY_NECESSITY_RESULT_JSON='
          rows=[line.split(marker,1)[1] for line in Path('/tmp/aera-v19-memory-necessity.log').read_text(errors='replace').splitlines() if marker in line]
          if not rows:
              raise SystemExit('result marker missing')
          r=json.loads(rows[-1])
          f=r['full_stream_plus_memory']; off=r['same_checkpoint_memory_disabled']; s=r['separately_trained_stream_only']; safe=r['deployment_safety']
          print('🧠 **AERA-v19 integrated fast-memory necessity CPU result**')
          print()
          print(f"- oracle task validity: **{100*r['task']['oracle_accuracy']:.1f}%**")
          print(f"- full stream+memory query accuracy: **{100*f['query_accuracy']:.1f}%**; NLL **{f['query_nll']:.4f}**")
          print(f"- separately trained stream-only accuracy: **{100*s['query_accuracy']:.1f}%**; gap **{100*r['full_minus_stream_only_accuracy']:+.1f} pp**")
          print(f"- same full checkpoint with memory disabled: **{100*off['query_accuracy']:.1f}%**; memory contribution **{100*r['same_checkpoint_memory_contribution_accuracy']:+.1f} pp**")
          print(f"- overwrite current-value accuracy: **{100*f['overwrite_current_value_accuracy']:.1f}%**")
          print(f"- stale-value error: **{100*f['stale_value_error_rate']:.1f}%**")
          print(f"- fresh-session query accuracy: **{100*safe['fresh_session_query_accuracy']:.1f}%** vs chance **{100*r['task']['chance_accuracy']:.1f}%**")
          print(f"- deployment base parameters unchanged: **{safe['deployment_base_parameters_unchanged']}**")
          print(f"- exact session isolation: **{safe['session_isolation_exact']}**")
          print(f"- frozen checks: `{json.dumps(r['checks'], sort_keys=True)}`")
          print(f"- integrated memory necessity diagnostic: **{'PASS' if r['pass'] else 'FAIL'}**")
          print()
          print('CPU controlled-task evidence only. No real-language memory claim, architecture freeze, 100M authorization or breakthrough claim follows.')
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$(cat /tmp/result.md)"
      - name: Record implementation/runtime failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          tail -n 120 /tmp/aera-v19-memory-necessity.log > /tmp/tail.txt 2>/dev/null || true
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="❌ **AERA-v19 memory-necessity CPU workflow implementation/runtime failure.** This is not a scientific result. Inspect/fix CPU-first before any fresh run boundary.\n\n\`\`\`text\n$(cat /tmp/tail.txt)\n\`\`\`"
