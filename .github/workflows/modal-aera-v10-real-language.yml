name: Modal AERA v10 real-language gate

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  real-language-gate:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v10-real-language]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check launcher
        run: python -m py_compile modal_aera_v10_real_language_gate.py tam_research/aera_real_language.py
      - name: Install Modal
        run: pip install 'modal>=1.5,<2'
      - name: Verify launcher imports without local PyTorch
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('torch') is None, 'regression host unexpectedly has torch installed'
          import modal_aera_v10_real_language_gate
          print('launcher import OK without local torch')
          PY
      - name: Verify Modal authentication
        run: modal token info
      - name: Record hard guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔒 **AERA-v10 real-language gate** — one L4; exact immutable production GPT-2 token bytes; AERA 24.317M stored params vs Transformer 24.940M; exactly 8,388,608 training tokens/model; same sampled batches/seed/context/optimizer; learned stage/expert/depth routing; 2700s hard GPU ceiling; no automatic retry. This is a pre-100M seed, not a breakthrough claim."
      - name: Run matched real-language gate
        id: modal
        shell: bash
        run: |
          set -o pipefail
          set +e
          modal run --timestamps modal_aera_v10_real_language_gate.py | tee /tmp/aera-v10-language.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q 'AERA_V10_LANGUAGE_RESULT_JSON=' /tmp/aera-v10-language.log; then
            exit 0
          fi
          exit "$status"
      - name: Record authoritative result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result.md
          import json
          from pathlib import Path
          lines=Path('/tmp/aera-v10-language.log').read_text(errors='replace').splitlines()
          marker='AERA_V10_LANGUAGE_RESULT_JSON='
          rows=[line.split(marker,1)[1] for line in lines if marker in line]
          if not rows:
              raise SystemExit('result marker missing')
          r=json.loads(rows[-1]); a=r['aera']; t=r['transformer']; inf=r['inference']
          ar=a['final_eval']; tr=t['final_eval']; route=ar['routing']; pc=r['parameter_accounting']
          print('📊 **AERA-v10 matched real-language seed8201 result**')
          print()
          print(f"- AERA stored params: **{pc['aera_stored_parameters']:,}**")
          print(f"- Transformer params: **{pc['transformer_parameters']:,}**")
          print(f"- tokens/model: **{a['tokens_seen']:,}**")
          print(f"- Transformer val NLL: **{tr['nll']:.4f}** (PPL {tr['perplexity']:.2f})")
          print(f"- AERA val NLL: **{ar['nll']:.4f}** (PPL {ar['perplexity']:.2f})")
          print(f"- AERA carried-state advantage: **{ar['state_nll_advantage']:+.4f} NLL** vs reset")
          print(f"- learned stage execution: **{100*route['stage_execution_fraction']:.1f}%**")
          print(f"- learned active experts/executed stage: **{route['mean_active_experts_when_executed']:.2f}**")
          print(f"- learned latent steps/executed stage: **{route['mean_reason_steps_when_executed']:.2f}**")
          print(f"- training tok/s: Transformer **{t['training_tokens_per_second']:.0f}**, AERA **{a['training_tokens_per_second']:.0f}**")
          print(f"- batch8 learned-routing inference speed AERA/Transformer: **{inf['batch8']['aera_vs_transformer_speed']:.2f}x**")
          print(f"- preregistered seed gate: **{'PASS' if r['seed_pass'] else 'FAIL'}**")
          print(f"- checks: `{json.dumps(r['checks'], sort_keys=True)}`")
          print()
          print('One seed cannot authorize 100M by itself. A positive result must be replicated on two fresh seeds before the 100M decision.')
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$(cat /tmp/result.md)"
      - name: Record workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="❌ **AERA-v10 real-language workflow failed.** No automatic retry was attempted. Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
