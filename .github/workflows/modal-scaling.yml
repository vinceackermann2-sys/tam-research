name: Modal TAM scaling

on:
  workflow_dispatch:
    inputs:
      model_scale:
        description: "Model scale: 25m, 50m, or 100m"
        required: true
        default: "50m"
      token_budget:
        description: "Training tokens per model"
        required: true
        default: "5000000"
      architectures:
        description: "Comma-separated: transformer,tamv3"
        required: true
        default: "transformer,tamv3"
      seeds:
        description: "Comma-separated integer seeds"
        required: true
        default: "7100"
      micro_batch_size:
        description: "Sequences per micro-batch"
        required: true
        default: "32"
      grad_accum_steps:
        description: "Accumulation passes"
        required: true
        default: "4"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  scale:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[modal-scale]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve validated scaling configuration
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_MODEL_SCALE: ${{ inputs.model_scale }}
          INPUT_TOKEN_BUDGET: ${{ inputs.token_budget }}
          INPUT_ARCHITECTURES: ${{ inputs.architectures }}
          INPUT_SEEDS: ${{ inputs.seeds }}
          INPUT_MICRO_BATCH_SIZE: ${{ inputs.micro_batch_size }}
          INPUT_GRAD_ACCUM_STEPS: ${{ inputs.grad_accum_steps }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          if os.environ["EVENT_NAME"] == "issues":
              cfg = json.loads(os.environ.get("ISSUE_BODY") or "{}")
              scale = str(cfg.get("model_scale", "50m")).lower()
              token_budget = int(cfg.get("token_budget", 5_000_000))
              architectures = str(cfg.get("architectures", "transformer,tamv3"))
              seeds = str(cfg.get("seeds", "7100"))
              micro = int(cfg.get("micro_batch_size", 32))
              accum = int(cfg.get("grad_accum_steps", 4))
          else:
              scale = os.environ["INPUT_MODEL_SCALE"].lower()
              token_budget = int(os.environ["INPUT_TOKEN_BUDGET"])
              architectures = os.environ["INPUT_ARCHITECTURES"]
              seeds = os.environ["INPUT_SEEDS"]
              micro = int(os.environ["INPUT_MICRO_BATCH_SIZE"])
              accum = int(os.environ["INPUT_GRAD_ACCUM_STEPS"])

          archs = [x.strip() for x in architectures.split(",") if x.strip()]
          seed_list = [x.strip() for x in seeds.split(",") if x.strip()]
          assert scale in {"25m", "50m", "100m"}
          assert archs and set(archs) <= {"transformer", "tamv3"}
          assert seed_list and len(seed_list) <= 6 and all(re.fullmatch(r"\d{1,10}", x) for x in seed_list)
          assert 1_000_000 <= token_budget <= 1_000_000_000
          assert micro in {8, 16, 32, 64, 128}
          assert accum in {1, 2, 4, 8, 16}
          assert micro * accum == 128

          print(f"model_scale={scale}")
          print(f"token_budget={token_budget}")
          print(f"architectures={','.join(archs)}")
          print(f"seeds={','.join(seed_list)}")
          print(f"micro_batch_size={micro}")
          print(f"grad_accum_steps={accum}")
          PY

      - name: Record scaling launcher start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **Scaling launcher started** — validating Modal authentication."

      - name: Install Modal
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication
        run: modal token info

      - name: Launch detached scaling run
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          modal run --detach --timestamps modal_scale_app.py \
            --model-scale "${{ steps.cfg.outputs.model_scale }}" \
            --token-budget "${{ steps.cfg.outputs.token_budget }}" \
            --architectures "${{ steps.cfg.outputs.architectures }}" \
            --seeds "${{ steps.cfg.outputs.seeds }}" \
            --micro-batch-size "${{ steps.cfg.outputs.micro_batch_size }}" \
            --grad-accum-steps "${{ steps.cfg.outputs.grad_accum_steps }}" \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"

      - name: Record handoff
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal scaling handoff completed.**"
