name: AERA v26.3 issue452 repair4 product reduction localization

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: aera-v26-3-issue452-repair4-product-reduction-localize
  cancel-in-progress: false

jobs:
  localize:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-repair4-product-reduction-localize-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue452 launcher
        run: python -m py_compile modal_aera_v26_3_repair4_product_reduction_localize_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue452 one-attempt localization boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Issue #452 permits Actions attempt 1 only; no workflow retry." >&2
            exit 1
          fi

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/452" --jq '.title')" = "[research] AERA-v26.3 post-repair4 BF16 product/reduction localization after #451 L4 correctness miss"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/451" --jq '.title')" = "[aera-v26-3-ficem-read-l4-repair4] sole issue449 repair4 read gate"

          source_run_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33537116699" --jq '.conclusion')"
          source_run_attempt="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33537116699" --jq '.run_attempt')"
          source_run_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33537116699" --jq '.head_sha')"
          test "${source_run_conclusion}" = "failure"
          test "${source_run_attempt}" = "1"
          test "${source_run_head}" = "9d45b41d40c6859f4dc4ffc1b70c26e0f7768976"

          source_l4_step="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33537116699/jobs" \
              --jq '.jobs[] | select(.id == 99954032841) | .steps[] | select(.name == "Run sole issue449 repair4 synthetic L4 probe") | .conclusion'
          )"
          test "${source_l4_step}" = "failure"

          trigger_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-repair4-product-reduction-localize-l4]")) | .number' \
              | wc -l | tr -d ' '
          )"
          if [ "${trigger_count}" != "1" ]; then
            echo "Expected exactly one issue452 repair4 product/reduction localization trigger, found ${trigger_count}." >&2
            exit 1
          fi

          result_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("🔬 **AERA-v26.3 #452 repair4 product/reduction localization**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${result_comment_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(
            printf '%s\n' "${event_body}" \
              | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' \
              | head -n 1
          )"
          if [ -z "${bound_main}" ]; then
            echo "Trigger must contain exact Bind main line." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 9d45b41d40c6859f4dc4ffc1b70c26e0f7768976 HEAD

          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "a3a603c8a2d4b20ebcccd7663970978f4288a760"
          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test -f tam_research/aera_v26_3_repair4_product_reduction_localize.py
          test -f modal_aera_v26_3_repair4_product_reduction_localize_app.py
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record frozen issue452 guard (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          body="🔒 **AERA-v26.3 #452 localization gate** — checked-out main **${head_sha}**. Frozen repair4 backend/probe; exact ordinal-5 \`bfloat16_batch8_mixed\`; one isolated product/reduction diagnostic kernel; one NVIDIA L4 <=180 seconds, Actions attempt 1 only. No timing/performance/model/checkpoint/corpus/training/scientific-seed/freeze/S2/100M/breakthrough authorization."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}" || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue452 repair4 product reduction localization
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_repair4_product_reduction_localize_app.py 2>&1 | tee /tmp/aera-v26-3-issue452-product-localize.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE452_REPAIR4_PRODUCT_REDUCTION_LOCALIZE_RESULT_JSON=' /tmp/aera-v26-3-issue452-product-localize.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue452 localization (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result-comment.md
          import json
          from pathlib import Path
          lines = Path('/tmp/aera-v26-3-issue452-product-localize.log').read_text(errors='replace').splitlines()
          marker = 'AERA_V26_ISSUE452_REPAIR4_PRODUCT_REDUCTION_LOCALIZE_SUMMARY_JSON='
          rows = [line[len(marker):] for line in lines if line.startswith(marker)]
          if not rows:
              raise SystemExit('issue452 summary marker missing')
          p = json.loads(rows[-1])
          pre = p['reference_vs_production_pre_out']
          final = p['reference_vs_production_final_out']
          prod = p['reference_products_match_micro']
          recalled = p['reference_native_recalled_match_micro']
          mirror = p['micro_bf16_vs_production_repair4']
          out = [
              '🔬 **AERA-v26.3 #452 repair4 product/reduction localization**',
              '',
              f'- row: **{p["target_row"]}** on **{p["device"]}**',
              f'- frozen correctness_row PASS: **{p["primary_pass"]}**; false subgates: **{p["primary_false_subgates"]}**',
              f'- top indices exact: **{p["reference_vs_production_top_indices_bit_equal"]}**',
              f'- pre-out production: allclose **{pre["allclose"]}**, max abs **{pre["max_abs_error"]:.6g}**',
              f'- final learned out: allclose **{final["allclose"]}**, max abs **{final["max_abs_error"]:.6g}**, failing elements **{final["failing_element_count"]}**',
              f'- reference BF16 products vs diagnostic rounded products bit-exact: **{prod["bit_equal"]}**',
              f'- reference native recalled vs diagnostic BF16 recalled bit-exact: **{recalled["bit_equal"]}**',
              f'- diagnostic mirror matches production repair4: **{p["diagnostic_product_mirror_matches_production"]}**; max abs **{mirror["max_abs_error"]:.6g}**',
              '',
              '- Localization only. No timing or performance decision was made.',
              '- Durable result + authoritative marker are the record. No rerun is authorized.',
          ]
          print('\n'.join(out))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/result-comment.md)" || true

      - name: Record issue452 workflow failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.3 #452 localization failed before an authoritative result marker.** No rerun, retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
