name: Modal AERA v25 real-language development seed8471

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: aera-v25-real-language-dev-8471-v1
  cancel-in-progress: false

jobs:
  real-language-dev:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v25-real-language-dev-8471]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check frozen launcher and protocol
        run: >-
          python -m py_compile
          modal_aera_v25_real_language_dev_app.py
          tam_research/aera_real_language_v25.py
          tam_research/aera_real_language_v25_gpu.py
          tam_research/aera_v25_systems.py
          tam_research/aera_hardware_core_v25.py
      - name: Install Modal
        run: pip install 'modal>=1.5,<2'
      - name: Verify launcher imports without local PyTorch
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('torch') is None, 'runner unexpectedly has torch before Modal launch'
          import modal_aera_v25_real_language_dev_app
          print('v25 seed8471 launcher import OK without local torch')
          PY
      - name: Verify Modal authentication
        run: modal token info
      - name: Refuse duplicate or unauthorized seed8471 trigger
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          prereg=$(gh issue view 366 --repo "$GITHUB_REPOSITORY" --json title --jq '.title | startswith("[research] AERA-v25 FICEM fresh real-language development seed8471")')
          systems_pass=$(gh api "repos/$GITHUB_REPOSITORY/issues/365/comments" --jq '[.[] | select(.body | contains("overall systems gate: **PASS**"))] | length')
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --jq '[.[] | select(.body | contains("AERA-v25 FICEM real-language development seed8471"))] | length')
          duplicates=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 300 --json number,title --jq '[.[] | select(.title | startswith("[aera-v25-real-language-dev-8471]"))] | length')
          if [ "$prereg" != "true" ] || [ "$systems_pass" -lt 1 ] || [ "$existing" -gt 0 ] || [ "$duplicates" -gt 1 ] || [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -f body="🚫 **AERA-v25 seed8471 refused.** Requires frozen #366, authoritative #365 systems PASS, exactly one seed8471 trigger, no prior v25 seed8471 guard/result on this issue, and Actions attempt 1. No Modal/GPU run was started by this invocation."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Record hard scientific guard
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔒 **AERA-v25 FICEM real-language development seed8471** — sole fresh development seed authorized by frozen #366 after controlled #361 + production systems #365 PASS. Exact immutable GPT-2 corpus; 8,388,608 training tokens/model; matched ~25M Transformer; one L4; 1800s ceiling. Exact v25 FICEM: chunk256/seq512, memory_dim50=25 identity+25 context, 48 slots/stage, 77,760 bytes/session, 255 candidates -> exactly 16 physical writes and one vectorized update per completed executed stage/chunk, top-4 reads T=0.10. Training uses inherited real-language task/routing/stream objective + decoder-aligned payload CE weight1, address auxiliary weight0, max256 payload events/microbatch x4=1024/optimizer step. All #324/v18 quality, memory, stream, routing and memory-enabled throughput thresholds remain unchanged, especially second-chunk memory advantage >=+0.005 NLL, batch8 >=0.25x and batch64 >=1.25x. Development only; no freeze/S2/replication/100M/breakthrough authorization. Duplicate refusal; Actions attempt1 only; no automatic retry."
      - name: Run AERA v25 development gate
        if: steps.guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -o pipefail
          set +e
          modal run --timestamps modal_aera_v25_real_language_dev_app.py | tee /tmp/aera-v25-dev.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q 'AERA_V25_DEV_RESULT_JSON=' /tmp/aera-v25-dev.log; then
            exit 0
          fi
          exit "$status"
      - name: Record authoritative result
        if: steps.guard.outputs.allowed == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result.md
          import json
          from pathlib import Path

          marker = 'AERA_V25_DEV_RESULT_JSON='
          lines = Path('/tmp/aera-v25-dev.log').read_text(errors='replace').splitlines()
          rows = [line.split(marker, 1)[1] for line in lines if marker in line]
          if not rows:
              raise SystemExit('v25 result marker missing')
          r = json.loads(rows[-1])
          a = r['aera']; t = r['transformer']; m = r['v25_memory_eval']
          ad = r['v25_heldout_adaptivity']; sy = r['v25_systems_eval']
          pc = r['parameter_accounting']; checks = r['v25_development_checks']
          sec = m['second_chunk']; w = m['executed_stage_effective_write_strength']
          epi = m['episodic_state']; sparse = m['sparse_write_execution']
          aux = m['heldout_payload_auxiliary']; rates = ad['optional_stage_run_fractions']
          valid = epi['valid_slot_fraction']
          print('🧠 **AERA-v25 FICEM real-language development seed8471 result**')
          print()
          print(f"- stored params: AERA **{pc['aera_stored_parameters']:,}**, Transformer **{pc['transformer_parameters']:,}**")
          print(f"- tokens/model: **{a['tokens_seen']:,}**")
          print(f"- training tok/s: AERA **{a['training_tokens_per_second']:.0f}**, Transformer **{t['training_tokens_per_second']:.0f}**")
          print(f"- held-out NLL: AERA+memory **{m['stream_plus_memory_nll']:.4f}**, Transformer **{m['transformer_nll']:.4f}** (gap {m['quality_gap_nll']:+.4f})")
          print(f"- same-checkpoint stream-only NLL: **{m['stream_only_nll']:.4f}**; reset **{m['reset_state_and_memory_nll']:.4f}**")
          print(f"- overall fast-memory advantage: **{m['memory_overall_advantage_nll']:+.4f} NLL**")
          print(f"- second-chunk fast-memory advantage: **{sec['memory_advantage_nll']:+.4f} NLL** (gate >= +0.0050)")
          print(f"- second-chunk stream advantage: **{sec['stream_advantage_nll']:+.4f} NLL**; memory-only vs reset **{sec['memory_only_advantage_over_reset_nll']:+.4f} NLL**")
          print(f"- effective write mean/p10/p90: **{w['mean']:.3f} / {w['p10']:.3f} / {w['p90']:.3f}**")
          print(f"- episodic state: **{m['memory_state_bytes_per_session']:,} bytes/session**, finite **{epi['all_keys_values_strengths_finite']}**, capacity48 **{epi['capacity_bounded_exactly_48']}**, session isolation **{epi['session_isolation_exact']}**")
          print(f"- valid-slot utilization mean/p10/p90: **{valid['mean']:.3f} / {valid['p10']:.3f} / {valid['p90']:.3f}**")
          print(f"- sparse execution exact 16/255/1: **{sparse['all_completed_measured_stages_exact_16_of_255_one_update']}**; measured rows **{len(sparse['rows'])}**")
          print(f"- heldout payload CE **{aux['memory_payload_token_loss']:.4f}**; token acc **{aux['memory_payload_token_accuracy']:.3f}**; sampled events **{aux['sampled_payload_events']:.0f}**")
          print(f"- optional stage run fractions: **{100*rates[0]:.1f}% / {100*rates[1]:.1f}% / {100*rates[2]:.1f}%**; total stage execution **{100*ad['total_per_example_stage_execution_fraction']:.1f}%**")
          print(f"- difficulty/compute Spearman rho **{ad['difficulty_compute_spearman_rho']:.3f}**; adaptivity **{'PASS' if ad['pass'] else 'FAIL'}**")
          for bs in ('8', '64'):
              row = sy['rows'][bs]
              print(f"- batch{bs} memory-enabled: AERA **{row['aera']['tokens_per_second']:.0f} tok/s**, Transformer **{row['transformer']['tokens_per_second']:.0f} tok/s**, ratio **{row['aera_vs_transformer_speed']:.3f}x**")
          print(f"- frozen checks: `{json.dumps(checks, sort_keys=True)}`")
          print(f"- v25 development pass: **{'PASS' if r['v25_development_pass'] else 'FAIL'}**")
          print(f"- frozen decision: **{'authorize separate exact freeze + S2 preregistration' if r['v25_development_pass'] else 'diagnose failing gate before any freeze or scale'}**")
          print()
          print('Seed8471 is development-only. PASS would establish the core v25 architecture as working on this real-language development gate, but would still require a separate exact freeze, S2 ablations and >=3 fresh post-freeze replications before any 100M/breakthrough authorization.')
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$(cat /tmp/result.md)"
      - name: Record workflow failure
        if: steps.guard.outputs.allowed == 'true' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          tail -n 240 /tmp/aera-v25-dev.log > /tmp/tail.txt 2>/dev/null || true
          if grep -q 'AERA_V25_DEV_L4_START_JSON=' /tmp/aera-v25-dev.log 2>/dev/null; then
            seed_status='Seed8471 reached the L4 start marker and is consumed permanently; it must never be rerun.'
          else
            seed_status='No L4 start marker was observed. No automatic retry is allowed; any continuation must first diagnose the implementation/runtime failure under #366.'
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="❌ **AERA-v25 real-language seed8471 workflow failed.** This is implementation/runtime evidence only unless an authoritative result marker was posted. $seed_status No automatic retry was attempted. Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nLast log lines:\n\`\`\`text\n$(cat /tmp/tail.txt)\n\`\`\`"
