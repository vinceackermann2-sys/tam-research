name: AERA v26.10 issue716 L4 authorization-heading guard repair1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-10-issue716-auth-guard-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  issue716-auth-heading-guard-repair:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[aera-v26-10-issue716-l4-auth-guard-repair1-preauth]') ||
       startsWith(github.event.issue.title, '[aera-v26-10-issue716-l4-auth-guard-repair1-l4]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue716 wrapper and frozen dependencies
        run: |
          python -m py_compile modal_aera_v26_10_issue716_l4_auth_guard_repair1.py
          python -m py_compile modal_aera_v26_10_issue710_memory_safe_harness.py
          python -m py_compile modal_aera_v26_10_issue706_latent_depth_sync_coalescing.py
          python -m py_compile tam_research/aera_hardware_core_v26_10_latent_depth_sync_coalescing.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue716 immutable boundary and select mode
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/716" --jq '.title')" = "[infra] AERA-v26.10 #715 L4 authorization-heading guard repair1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/716" --jq '.state')" = "open"

          failure="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5573729021" --jq '.body')"
          printf '%s\n' "${failure}" | grep -F 'workflow run `34145700849`' >/dev/null
          printf '%s\n' "${failure}" | grep -F 'job `101817171862`' >/dev/null
          printf '%s\n' "${failure}" | grep -F 'before the immediate pre-Modal recheck, Modal authentication' >/dev/null
          printf '%s\n' "${failure}" | grep -F '## #710 sole L4 memory-safe harness authorization' >/dev/null
          printf '%s\n' "${failure}" | grep -F '## #710 sole L4 memory-safe optimization microbenchmark authorization' >/dev/null

          freeze_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/716/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #716 pre-implementation L4 authorization-heading guard repair1 freeze")) | .id' | wc -l | tr -d ' ')"
          test "${freeze_count}" = "1"
          freeze="$(gh api "repos/${GITHUB_REPOSITORY}/issues/716/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #716 pre-implementation L4 authorization-heading guard repair1 freeze")) | .body')"

          for required in \
            'SOURCE_MAIN=8371d9ab3988df33c7b92b529016618ebf60f9ee' \
            'SOURCE_TREE=fd171423b5878c9082e689d7d83da9f8c7c81569' \
            'BRANCH=infra/aera-v26-10-issue716-l4-auth-guard-repair1' \
            'PREAUTH_PREFIX=[aera-v26-10-issue716-l4-auth-guard-repair1-preauth]' \
            'L4_PREFIX=[aera-v26-10-issue716-l4-auth-guard-repair1-l4]' \
            'RESULT_PATH=/vol/aera-v26/issue716-v26-10-l4-auth-guard-repair1/result.json' \
            'AUTHORIZATION_HEADING=## #716 sole L4 authorization-heading guard repair1 authorization' \
            'CONSUMED_TRIGGER=715' \
            'CONSUMED_RUN=34145700849' \
            'CONSUMED_JOB=101817171862' \
            'CONSUMED_ATTEMPT=1' \
            'CONSUMED_FAILURE_COMMENT=5573729021' \
            'PREVIOUS_AUTH_COMMENT=5573681590' \
            'ISSUE710_LAUNCHER_BLOB=b885250753ea169cd89dd7a978bb3647fd261fe8' \
            'V26_10_IMPL_BLOB=d8f691c198eed1fa96bcbb78a4e76cad82d18779' \
            'LOGIT_COMPARE_BATCH_CHUNK=1' \
            'BATCHES=8,64' \
            'WARMUP_CALLS=3' \
            'TIMED_CALLS_PER_CONDITION=20' \
            'PROFILE_CALLS_PER_CONDITION=1' \
            'MIN_LATENCY_IMPROVEMENT=0.05' \
            'MIN_STREAM_SYNCHRONIZE_REDUCTION=20' \
            'INTEGRATED_ATOL=0.01' \
            'INTEGRATED_RTOL=0.01'; do
            printf '%s\n' "${freeze}" | grep -F "${required}" >/dev/null
          done

          launcher_blob="$(printf '%s\n' "${freeze}" | sed -n 's/^LAUNCHER_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          workflow_blob="$(printf '%s\n' "${freeze}" | sed -n 's/^WORKFLOW_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          cpu_test_blob="$(printf '%s\n' "${freeze}" | sed -n 's/^CPU_TEST_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_tree="$(printf '%s\n' "${freeze}" | sed -n 's/^FROZEN_TREE=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_commit="$(printf '%s\n' "${freeze}" | sed -n 's/^FROZEN_COMMIT=\([0-9a-f]\{40\}\)$/\1/p')"
          test -n "${launcher_blob}" && test -n "${workflow_blob}" && test -n "${cpu_test_blob}" && test -n "${frozen_tree}" && test -n "${frozen_commit}"

          body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"

          git cat-file -e "${bound_main}^{commit}"
          git checkout --detach "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 8371d9ab3988df33c7b92b529016618ebf60f9ee "${bound_main}"
          test "$(git rev-parse 8371d9ab3988df33c7b92b529016618ebf60f9ee^{tree})" = "fd171423b5878c9082e689d7d83da9f8c7c81569"
          git cat-file -e "${frozen_commit}^{commit}"
          test "$(git rev-parse "${frozen_commit}^{tree}")" = "${frozen_tree}"
          git merge-base --is-ancestor "${frozen_commit}" "${bound_main}"

          test "$(git hash-object modal_aera_v26_10_issue716_l4_auth_guard_repair1.py)" = "${launcher_blob}"
          test "$(git hash-object .github/workflows/aera-v26-10-issue716-l4-auth-guard-repair1.yml)" = "${workflow_blob}"
          test "$(git hash-object tests/test_aera_v26_10_issue716_l4_auth_guard_repair1_cpu.py)" = "${cpu_test_blob}"
          test "$(git hash-object modal_aera_v26_10_issue710_memory_safe_harness.py)" = "b885250753ea169cd89dd7a978bb3647fd261fe8"
          test "$(git hash-object tam_research/aera_hardware_core_v26_10_latent_depth_sync_coalescing.py)" = "d8f691c198eed1fa96bcbb78a4e76cad82d18779"

          title="$(jq -r '.issue.title' "${GITHUB_EVENT_PATH}")"
          if [[ "${title}" == '[aera-v26-10-issue716-l4-auth-guard-repair1-preauth]'* ]]; then
            mode=preauth
            prefix='[aera-v26-10-issue716-l4-auth-guard-repair1-preauth]'
            evidence_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔎 **AERA-v26.10 #716 preauthorization evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${evidence_count}" = "0"
          else
            mode=l4
            prefix='[aera-v26-10-issue716-l4-auth-guard-repair1-l4]'
            preauth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("🔎 **AERA-v26.10 #716 preauthorization evidence**")) | select((.body // "") | contains("Bound main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${preauth_count}" = "1"
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/716/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("## #716 sole L4 authorization-heading guard repair1 authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
            result_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("⚙️ **AERA-v26.10 #716 optimization microbenchmark evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${result_count}" = "0"
          fi

          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "bound_main=${bound_main}" >> "${GITHUB_OUTPUT}"
          echo "allowed=true" >> "${GITHUB_OUTPUT}"

      - name: Re-verify issue716 trigger immediately before Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          MODE: ${{ steps.guard.outputs.mode }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BOUND_MAIN}"
          if [[ "${MODE}" == "preauth" ]]; then
            prefix='[aera-v26-10-issue716-l4-auth-guard-repair1-preauth]'
          else
            prefix='[aera-v26-10-issue716-l4-auth-guard-repair1-l4]'
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/716/comments?per_page=100" | jq -r --arg bound "${BOUND_MAIN}" '.[] | select((.body // "") | startswith("## #716 sole L4 authorization-heading guard repair1 authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
          fi
          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run issue716 zero-GPU preauthorization audit
        if: steps.guard.outputs.mode == 'preauth'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          modal run modal_aera_v26_10_issue716_l4_auth_guard_repair1.py::preauth_main 2>&1 | tee /tmp/issue716-preauth.log
          test "$(grep -c '^AERA_V26_10_ISSUE716_PREAUTH_JSON=' /tmp/issue716-preauth.log)" = "1"

      - name: Record issue716 preauthorization evidence
        if: steps.guard.outputs.mode == 'preauth' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          python - <<'PY' >/tmp/issue716-preauth.md
          import json, os
          from pathlib import Path
          marker='AERA_V26_10_ISSUE716_PREAUTH_JSON='
          payloads=[json.loads(x[len(marker):]) for x in Path('/tmp/issue716-preauth.log').read_text().splitlines() if x.startswith(marker)]
          if len(payloads)!=1: raise SystemExit('expected exactly one #716 preauth payload')
          p=payloads[0]
          required={'research_issue':716,'source_main':os.environ['BOUND_MAIN'],'consumed_trigger':715,'consumed_failure_comment':5573729021,'consumed_run':34145700849,'consumed_job':101817171862,'consumed_attempt':1,'result_absent':True,'gpu_used':False,'model_constructed':False,'new_measurement_performed':False,'orchestration_guard_repair_only':True}
          for k,v in required.items():
              if p.get(k)!=v: raise SystemExit(f'#716 preauth drift {k}: {p.get(k)!r}')
          for k in ('optimization_microbenchmark_authorized','full_e2e_systems_gate_authorized','systems_pass_earned','architecture_freeze_authorized','s2_authorized','fresh_scientific_seed_authorized','independent_replication_credit','100m_authorized','breakthrough_proven'):
              if p.get(k) is not False: raise SystemExit(f'forbidden #716 preauth flag {k}')
          print('🔎 **AERA-v26.10 #716 preauthorization evidence**')
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print('Zero-GPU preflight passed: `result_absent=true`, `gpu_used=false`, `model_constructed=false`, `new_measurement_performed=false`.')
          print('Frozen #710 memory-safe launcher, v26.10 implementation, checkpoint hashes, thresholds and #715 failure lineage were revalidated. No L4 or higher-stage authority is created by this evidence.')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue716-preauth.md)"

      - name: Run issue716 sole L4 optimization microbenchmark
        if: steps.guard.outputs.mode == 'l4'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -o pipefail
          modal run modal_aera_v26_10_issue716_l4_auth_guard_repair1.py::l4_main 2>&1 | tee /tmp/issue716-l4.log
          test "$(grep -c '^AERA_V26_10_ISSUE716_PREAUTH_JSON=' /tmp/issue716-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_10_ISSUE716_L4_START_JSON=' /tmp/issue716-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_10_ISSUE716_SUMMARY_JSON=' /tmp/issue716-l4.log)" = "1"

      - name: Record issue716 optimization microbenchmark evidence
        if: steps.guard.outputs.mode == 'l4' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          python - <<'PY' >/tmp/issue716-result.md
          import json, os
          from pathlib import Path
          marker='AERA_V26_10_ISSUE716_SUMMARY_JSON='
          payloads=[json.loads(x[len(marker):]) for x in Path('/tmp/issue716-l4.log').read_text().splitlines() if x.startswith(marker)]
          if len(payloads)!=1: raise SystemExit('expected exactly one #716 summary payload')
          p=payloads[0]
          if p.get('research_issue')!=716 or p.get('source_main')!=os.environ['BOUND_MAIN']:
              raise SystemExit('#716 result identity drift')
          if p.get('orchestration_guard_repair_only') is not True:
              raise SystemExit('#716 orchestration provenance missing')
          if p.get('systems_pass_earned') is not False:
              raise SystemExit('#716 cannot directly earn systems PASS')
          for k in ('architecture_freeze_authorized','s2_authorized','fresh_scientific_seed_authorized','independent_replication_credit','100m_authorized','breakthrough_proven'):
              if p.get(k) is not False: raise SystemExit(f'forbidden #716 higher-stage flag {k}')
          print('⚙️ **AERA-v26.10 #716 optimization microbenchmark evidence**')
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print(f"Decision: `{p.get('decision')}`; full-E2E authorization: `{p.get('full_e2e_systems_gate_authorized')}`; systems PASS earned: `false`.")
          print(f"Frozen rows: `{json.dumps(p.get('rows'),sort_keys=True)}`")
          print('This is the inherited #710 memory-safe benchmark under repaired #716 orchestration. A PASS can authorize only a separately preregistered fresh full Transformer-relative E2E systems gate.')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue716-result.md)"
