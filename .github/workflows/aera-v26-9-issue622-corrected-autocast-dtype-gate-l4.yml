name: AERA v26.9 issue622 corrected autocast dtype gate L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  issue622-corrected-autocast-dtype-gate:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-9-issue622-corrected-autocast-dtype-gate-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue622 harness
        run: |
          python -m py_compile tam_research/aera_v26_9_issue622_corrected_autocast_dtype_gate.py
          python -m py_compile modal_aera_v26_9_issue622_corrected_autocast_dtype_gate_l4_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify canonical authorized issue622 boundary
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/622" --jq '.title')" = "[research] AERA-v26.9 corrected integrated autocast dtype-contract L4 gate after #621"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/622" --jq '.state')" = "open"

          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100"               --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue622-corrected-autocast-dtype-gate-l4]")) | .number'               | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bind_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bind_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bind_lines}" | sed -n '1p')"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor caa7b019e9232d607d69b0e422e6d9550d675ff4 HEAD

          auth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/622/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #622 sole L4 corrected dtype gate authorization")) | .id' | wc -l | tr -d ' ')"
          test "${auth_count}" = "1"
          auth_body="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/622/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #622 sole L4 corrected dtype gate authorization")) | .body')"
          auth_lines="$(printf '%s\n' "${auth_body}" | sed -n 's/^Authorize main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${auth_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "${auth_lines}" | sed -n '1p')" = "${bound_main}"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/620" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/620" --jq '.merge_commit_sha')" = "caa7b019e9232d607d69b0e422e6d9550d675ff4"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33801996811" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33801996811" --jq '.head_sha')" = "caa7b019e9232d607d69b0e422e6d9550d675ff4"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33801996811" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100803474596" --jq '.conclusion')" = "success"

          test "$(git hash-object tam_research/aera_v26_9_issue622_corrected_autocast_dtype_gate.py)" = "4e08ac9af18f666f09009e4d2c5822b11e91c2c1"
          test "$(git hash-object modal_aera_v26_9_issue622_corrected_autocast_dtype_gate_l4_app.py)" = "e0fa3b0856b9750402209c6487f407b189672436"
          test "$(git hash-object tam_research/aera_hardware_core_v26_9_ficem_read_identity_weight_visibility.py)" = "b81cc209f5d95abbe1fb8bd620c78e87c067bc19"
          test "$(git hash-object tam_research/aera_v26_9_issue602_identity_weight_visibility_probe.py)" = "456203f515d67d1c92b0a9c3e0e59ce4137ac10a"
          test "$(grep -c 'gpu="L4"' modal_aera_v26_9_issue622_corrected_autocast_dtype_gate_l4_app.py)" = "1"
          test "$(grep -c 'run_corrected_autocast_dtype_gate_v26_9_issue622(' modal_aera_v26_9_issue622_corrected_autocast_dtype_gate_l4_app.py)" = "1"

      - name: Record issue622 start
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #622 corrected autocast dtype gate started** — exact authorized main, frozen harness bytes, #621 provenance, and immutable #602 source authority verified. One L4 synthetic READ gate only; no model/checkpoint/corpus/training/systems or higher scientific step." || true

      - name: Recheck canonical trigger immediately before Modal
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100"               --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue622-corrected-autocast-dtype-gate-l4]")) | .number'               | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"
          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(git rev-parse HEAD)" = "${bound_main}"

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue622 L4 corrected dtype gate
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal run modal_aera_v26_9_issue622_corrected_autocast_dtype_gate_l4_app.py 2>&1 | tee /tmp/issue622.log
          test "$(grep -c '^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_PRECHECK_JSON=' /tmp/issue622.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_PREFLIGHT_JSON=' /tmp/issue622.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_L4_START_JSON=' /tmp/issue622.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_RESULT_JSON=' /tmp/issue622.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_SUMMARY_JSON=' /tmp/issue622.log)" = "1"

      - name: Record issue622 evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          if test -f /tmp/issue622.log; then
            result="$(grep '^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_RESULT_JSON=' /tmp/issue622.log | tail -1 | sed 's/^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_RESULT_JSON=//')"
            summary="$(grep '^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_SUMMARY_JSON=' /tmp/issue622.log | tail -1 | sed 's/^AERA_V26_9_ISSUE622_CORRECTED_AUTOCAST_DTYPE_GATE_SUMMARY_JSON=//')"
            if test -n "${result}"; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #622 authoritative corrected autocast dtype gate**\n\nResult: \`${result}\`\n\nSummary: \`${summary}\`\n\nPrimitive synthetic READ evidence only. #602 remains historical FAIL. No automatic systems execution, repair, architecture freeze, S2, scientific seed, replication, 100M scaling, or breakthrough claim is authorized." || true
            fi
          fi
