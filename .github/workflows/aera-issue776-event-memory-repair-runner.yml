name: AERA issue776 repaired event-memory seed27641 runner

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-issue776-event-memory-repair-seed27641
  cancel-in-progress: false

jobs:
  issue776-repair:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[aera-event-memory-repair-seed27641-preauth-v1]') ||
       startsWith(github.event.issue.title, '[aera-event-memory-repair-seed27641-l4-v1]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue776 runner
        run: python -m py_compile modal_aera_issue776_event_memory_repair_runner.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue776 immutable boundary and select mode
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        shell: bash --noprofile --norc {0}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/776" --jq '.title')" = "[prereg/no-gpu] AERA repaired event-memory capability retest after merged #774"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/776" --jq '.state')" = "open"

          freeze_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/776/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #776 pre-implementation event-memory repair runner freeze")) | .id' | wc -l | tr -d ' ')"
          test "${freeze_count}" = "1"
          freeze_comment="$(gh api "repos/${GITHUB_REPOSITORY}/issues/776/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #776 pre-implementation event-memory repair runner freeze")) | .body')"

          printf '%s\n' "${freeze_comment}" | grep -F 'SOURCE_MAIN=0a838b5e20a867ddf886589445fb7e856644d109' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'SOURCE_TREE=88b06324ae046510f88e037667b6304c6e74c33e' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'IMPLEMENTATION_BASE_MAIN=5c53d405af9d76e20a1a3e10979fe3c88380157d' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'IMPLEMENTATION_BASE_TREE=81264d140d51cdba30a9c9f51abd9dc9dacabcb6' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'BRANCH=infra/aera-issue776-event-memory-repair-runner-v1' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PREAUTH_PREFIX=[aera-event-memory-repair-seed27641-preauth-v1]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'L4_PREFIX=[aera-event-memory-repair-seed27641-l4-v1]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'RESULT_PATH=/vol/aera-capability/event-memory-repair-v1-seed27641/result.json' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'CHECKPOINT_DIR=/vol/aera-capability/event-memory-repair-v1-seed27641/checkpoints' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'MODEL_SEED=27641' >/dev/null

          adapter_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^ADAPTER_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          protocol_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^PROTOCOL_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          runner_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^RUNNER_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          workflow_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^WORKFLOW_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          test_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^RUNNER_TEST_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_tree="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^FROZEN_TREE=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_commit="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^FROZEN_COMMIT=\([0-9a-f]\{40\}\)$/\1/p')"
          test -n "${adapter_blob}" && test -n "${protocol_blob}" && test -n "${runner_blob}" && test -n "${workflow_blob}" && test -n "${test_blob}" && test -n "${frozen_tree}" && test -n "${frozen_commit}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"

          git cat-file -e "${bound_main}^{commit}"
          git checkout --detach "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 0a838b5e20a867ddf886589445fb7e856644d109 "${bound_main}"
          test "$(git rev-parse 0a838b5e20a867ddf886589445fb7e856644d109^{tree})" = "88b06324ae046510f88e037667b6304c6e74c33e"
          git merge-base --is-ancestor 5c53d405af9d76e20a1a3e10979fe3c88380157d "${bound_main}"
          test "$(git rev-parse 5c53d405af9d76e20a1a3e10979fe3c88380157d^{tree})" = "81264d140d51cdba30a9c9f51abd9dc9dacabcb6"
          git cat-file -e "${frozen_commit}^{commit}"
          test "$(git rev-parse "${frozen_commit}^{tree}")" = "${frozen_tree}"
          git merge-base --is-ancestor "${frozen_commit}" "${bound_main}"

          test "$(git hash-object tam_research/aera_issue776_event_memory_scientific_adapter.py)" = "${adapter_blob}"
          test "$(git hash-object docs/aera_issue776_event_memory_repair_protocol.json)" = "${protocol_blob}"
          test "$(git hash-object modal_aera_issue776_event_memory_repair_runner.py)" = "${runner_blob}"
          test "$(git hash-object .github/workflows/aera-issue776-event-memory-repair-runner.yml)" = "${workflow_blob}"
          test "$(git hash-object tests/test_aera_issue776_event_memory_runner_cpu.py)" = "${test_blob}"
          test "$(git hash-object tam_research/aera_issue770_integrated_event_memory_cpu.py)" = "b695b1b7b7476be3a16433c96dff32870f2e1f49"
          test "$(git hash-object tam_research/aera_issue748_memory_capability_seed1_harness_base.py)" = "40003b68987d026265b1d53fcb637f18277f9cac"
          test "$(git hash-object tam_research/aera_memory_capability_gate_v1.py)" = "981602432b684989f7a5011ff953e6965368c5e5"
          test "$(git hash-object tam_research/aera_hardware_core_v18.py)" = "97861a2407876f62665b13140c2135b4a11d4597"
          test "$(git hash-object tam_research/aera_delta_memory.py)" = "ec0b5d29b3d4ac27bd60fd9c152480b9f177c3e9"

          title="$(jq -r '.issue.title' "${GITHUB_EVENT_PATH}")"
          if [[ "${title}" == '[aera-event-memory-repair-seed27641-preauth-v1]'* ]]; then
            mode=preauth
            prefix='[aera-event-memory-repair-seed27641-preauth-v1]'
            evidence_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔎 **AERA #776 repaired seed27641 preauthorization evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${evidence_count}" = "0"
          else
            mode=l4
            prefix='[aera-event-memory-repair-seed27641-l4-v1]'
            preauth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("🔎 **AERA #776 repaired seed27641 preauthorization evidence**")) | select((.body // "") | contains("Bound main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${preauth_count}" = "1"
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/776/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("## #776 repaired seed 27641 L4 scientific authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | select((.body // "") | contains("Authorize seed: `27641`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
            result_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA #776 repaired seed27641 scientific evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${result_count}" = "0"
          fi

          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "bound_main=${bound_main}" >> "${GITHUB_OUTPUT}"
          echo "allowed=true" >> "${GITHUB_OUTPUT}"

      - name: Re-verify issue776 trigger immediately before Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          MODE: ${{ steps.guard.outputs.mode }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        shell: bash --noprofile --norc {0}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BOUND_MAIN}"
          if [[ "${MODE}" == "preauth" ]]; then
            prefix='[aera-event-memory-repair-seed27641-preauth-v1]'
          else
            prefix='[aera-event-memory-repair-seed27641-l4-v1]'
            preauth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" | jq -r --arg bound "${BOUND_MAIN}" '.[] | select((.body // "") | startswith("🔎 **AERA #776 repaired seed27641 preauthorization evidence**")) | select((.body // "") | contains("Bound main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${preauth_count}" = "1"
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/776/comments?per_page=100" | jq -r --arg bound "${BOUND_MAIN}" '.[] | select((.body // "") | startswith("## #776 repaired seed 27641 L4 scientific authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | select((.body // "") | contains("Authorize seed: `27641`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
          fi
          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run issue776 zero-GPU repaired-seed preauthorization
        if: steps.guard.outputs.mode == 'preauth'
        id: preauth
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          modal run modal_aera_issue776_event_memory_repair_runner.py::preauth_main 2>&1 | tee /tmp/issue776-preauth.log
          test "$(grep -c '^AERA_ISSUE776_REPAIR_PREAUTH_JSON=' /tmp/issue776-preauth.log)" = "1"

      - name: Record issue776 repaired-seed preauthorization evidence
        if: steps.guard.outputs.mode == 'preauth' && steps.preauth.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        shell: bash --noprofile --norc {0}
        run: |
          python - <<'PY' >/tmp/issue776-preauth.md
          import json, os
          from pathlib import Path
          prefix = "AERA_ISSUE776_REPAIR_PREAUTH_JSON="
          payloads = [json.loads(x[len(prefix):]) for x in Path("/tmp/issue776-preauth.log").read_text().splitlines() if x.startswith(prefix)]
          if len(payloads) != 1:
              raise SystemExit("expected one #776 preauth payload")
          p = payloads[0]
          if p.get("runner_issue") != 776 or p.get("research_issue") != 776 or p.get("model_seed") != 27641:
              raise SystemExit("#776 preauth identity drift")
          if p.get("result_absent") is not True or p.get("checkpoint_absent_or_empty") is not True:
              raise SystemExit("#776 namespace not fresh")
          for key in (
              "gpu_used", "model_constructed", "scientific_seed_consumed",
              "training_performed", "evaluation_performed", "checkpoint_written",
              "result_written", "seed_37641_authorized",
              "systems_optimization_authorized", "architecture_freeze_authorized",
              "s2_replication_authorized", "scaling_authorized", "breakthrough_proven",
          ):
              if p.get(key) is not False:
                  raise SystemExit(f"#776 preauth authority drift: {key}")
          print("🔎 **AERA #776 repaired seed27641 preauthorization evidence**")
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print("Model seed: `27641` — **not consumed**")
          print(f"Result namespace fresh: `{p['result_path']}`")
          print(f"Checkpoint namespace fresh: `{p['checkpoint_dir']}`")
          print("GPU used: `false`; model constructed: `false`; training/evaluation: `false`; writes: `false`.")
          print()
          print("This evidence authorizes no L4/scientific run. Explicit user authorization for repaired seed `27641` remains required.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue776-preauth.md)" >/dev/null

      - name: Run issue776 sole repaired seed27641 L4 capability gate
        if: steps.guard.outputs.mode == 'l4'
        id: l4
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          modal run modal_aera_issue776_event_memory_repair_runner.py::l4_main 2>&1 | tee /tmp/issue776-l4.log
          test "$(grep -c '^AERA_ISSUE776_REPAIR_PREAUTH_JSON=' /tmp/issue776-l4.log)" = "1"
          test "$(grep -c '^AERA_ISSUE776_REPAIR_L4_START_JSON=' /tmp/issue776-l4.log)" = "1"
          test "$(grep -c '^AERA_ISSUE776_REPAIR_RESULT_JSON=' /tmp/issue776-l4.log)" = "1"
          test "$(grep -c '^AERA_ISSUE776_REPAIR_SUMMARY_JSON=' /tmp/issue776-l4.log)" = "1"

      - name: Record issue776 repaired seed27641 scientific evidence
        if: always() && steps.guard.outputs.mode == 'l4'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
          L4_OUTCOME: ${{ steps.l4.outcome }}
        shell: bash --noprofile --norc {0}
        run: |
          python - <<'PY' >/tmp/issue776-science.md
          import json, os
          from pathlib import Path
          path = Path("/tmp/issue776-l4.log")
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          def payloads(prefix):
              out = []
              for line in lines:
                  if line.startswith(prefix):
                      try:
                          out.append(json.loads(line[len(prefix):]))
                      except Exception:
                          pass
              return out
          starts = payloads("AERA_ISSUE776_REPAIR_L4_START_JSON=")
          results = payloads("AERA_ISSUE776_REPAIR_RESULT_JSON=")
          summaries = payloads("AERA_ISSUE776_REPAIR_SUMMARY_JSON=")
          progress = payloads("AERA_ISSUE776_REPAIR_PROGRESS_JSON=")
          print("🔬 **AERA #776 repaired seed27641 scientific evidence**")
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print(f"Workflow L4 step outcome: `{os.environ.get('L4_OUTCOME', '')}`")
          print(f"L4 start markers: `{len(starts)}`; result markers: `{len(results)}`; summary markers: `{len(summaries)}`; progress markers: `{len(progress)}`")
          if starts:
              print(f"Observed L4 start seed: `{starts[0].get('model_seed')}`; GPU request: `{starts[0].get('gpu')}`")
          if results:
              r = results[-1]
              print(f"Status: `{r.get('status')}`")
              d = r.get("decision") or {}
              print(f"Recommendation: `{d.get('recommendation')}`")
              checks = d.get("checks") or {}
              et = checks.get("equal_token") or {}
              eg = checks.get("equal_gpu_time") or {}
              print(f"Equal-token B-A long: `{et.get('B_minus_A_long_accuracy')}`")
              print(f"Equal-GPU-time B-A long: `{eg.get('B_minus_A_long_accuracy')}`")
          else:
              print("No completed result marker was observed. Do not classify an infrastructure/pre-result failure as scientific PASS/FAIL.")
          print()
          print("No retry/rerun/redispatch is authorized by this evidence. Seed `37641`, systems optimization, architecture freeze, replication, scaling and breakthrough claims remain unauthorized.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue776-science.md)" >/dev/null
