name: AERA v26.3 issue414 FICEM read L4 repair1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: aera-v26-3-issue414-ficem-read-l4-repair1
  cancel-in-progress: false

jobs:
  ficem-read-repair1:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-ficem-read-l4-repair1]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue414 launcher
        run: python -m py_compile modal_aera_v26_3_ficem_read_repair1_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue414 one-attempt repair boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Issue #414 permits Actions attempt 1 only; no workflow retry." >&2
            exit 1
          fi

          prereg_title="$(gh api "repos/${GITHUB_REPOSITORY}/issues/414" --jq '.title')"
          test "${prereg_title}" = "[research] AERA-v26.3 FICEM read repair1: explicit Triton constexpr constants after #411 pre-result compile failure"

          issue411_state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/411" --jq '.state')"
          test "${issue411_state}" = "closed"
          run411_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33496856233" --jq '.conclusion')"
          run411_attempt="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33496856233" --jq '.run_attempt')"
          test "${run411_conclusion}" = "failure"
          test "${run411_attempt}" = "1"

          trigger_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-ficem-read-l4-repair1]")) | .number' \
              | wc -l | tr -d ' '
          )"
          if [ "${trigger_count}" != "1" ]; then
            echo "Expected exactly one issue414 FICEM read repair1 trigger, found ${trigger_count}." >&2
            exit 1
          fi

          result_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("🔬 **AERA-v26.3 #414 FICEM read repair1 result**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${result_comment_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(
            printf '%s\n' "${event_body}" \
              | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' \
              | head -n 1
          )"
          if [ -z "${bound_main}" ]; then
            echo "Trigger must contain an exact 'Bind main: `<40-hex-sha>`' line." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 8f956aea5dd25fbbef5c718e634da4d293b96b4e HEAD

          test -f tam_research/aera_hardware_core_v26_3_ficem_read_triton.py
          test -f tam_research/aera_v26_3_ficem_read_probe.py
          test -f modal_aera_v26_3_ficem_read_repair1_app.py
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record frozen issue414 repair guard (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          body="🔒 **AERA-v26.3 #414 FICEM read repair1 gate** — checked-out main **${head_sha}**. This is a separately preregistered repair after exhausted #411/#413 compile failure, not a rerun. The #411 synthetic probe and all rows/thresholds are unchanged. Only explicit Triton constexpr read constants + literal frozen upper strength clamp changed. One NVIDIA L4 <=300 GPU seconds, Actions attempt 1 only. No model/checkpoint/corpus/training/scientific seed/end-to-end/freeze/S2/100M/breakthrough authorization."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}" || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue414 repair1 synthetic L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_ficem_read_repair1_app.py 2>&1 | tee /tmp/aera-v26-3-issue414-ficem-read-repair1.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE414_FICEM_READ_REPAIR1_RESULT_JSON=' /tmp/aera-v26-3-issue414-ficem-read-repair1.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue414 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result-comment.md
          import json
          from pathlib import Path

          lines = Path('/tmp/aera-v26-3-issue414-ficem-read-repair1.log').read_text(errors='replace').splitlines()
          marker = 'AERA_V26_ISSUE414_FICEM_READ_REPAIR1_SUMMARY_JSON='
          rows = [line[len(marker):] for line in lines if line.startswith(marker)]
          if not rows:
              raise SystemExit('issue414 compact summary marker missing')
          payload = json.loads(rows[-1])
          out = [
              '🔬 **AERA-v26.3 #414 FICEM read repair1 result**',
              '',
              f'- decision: **{payload["decision"]}**; overall PASS: **{payload["overall_pass"]}**',
              f'- device: **{payload["device"]}**',
              f'- per-dtype geomean full-read latency ratios: **{payload["geomean_latency_ratio_by_dtype"]}** (each required <= **0.90x**)',
              f'- correctness / known-empty / near-tie: **{payload["correctness_pass"]} / {payload["known_empty_pass"]} / {payload["near_tie_pass"]}**',
              f'- row latency / full-event ratio / single fused tail / no reference tail ops: **{payload["row_latency_pass"]} / {payload["full_event_ratio_pass"]} / {payload["single_tail_kernel_pass"]} / {payload["candidate_no_reference_tail_ops_pass"]}**',
          ]
          for key, row in payload['row_ratios'].items():
              out.append(
                  f'- {key}: latency **{row["latency"]:.3f}x**, CUDA-event ratio **{row["events"]:.3f}x**, correctness **{row["correctness"]}**'
              )
          out += [
              '',
              '- Exact #411 synthetic probe reused unchanged; this is the separately preregistered #414 repair attempt.',
              '- Durable Modal result + authoritative result marker are the experiment record; this comment is reporting only.',
              '- This result does **not** authorize end-to-end timing, architecture freeze, S2, a scientific seed, 100M, or a breakthrough claim.',
          ]
          print('\n'.join(out))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$(cat /tmp/result-comment.md)" || true

      - name: Record issue414 workflow failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          tail -n 120 /tmp/aera-v26-3-issue414-ficem-read-repair1.log > /tmp/failure-tail.txt 2>/dev/null || true
          {
            echo '⚠️ **AERA-v26.3 #414 FICEM read repair1 gate failed before an authoritative result marker.**'
            echo
            echo "Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'No rerun, automatic retry, or timeout increase is authorized. Any continuation requires another new preregistration.'
            echo
            echo '<details><summary>log tail</summary>'
            echo
            echo '```text'
            cat /tmp/failure-tail.txt
            echo '```'
            echo '</details>'
          } > /tmp/failure-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$(cat /tmp/failure-comment.md)" || true
