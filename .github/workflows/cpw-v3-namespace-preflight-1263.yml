name: CPW-v3 account2 read-only namespace preflight

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/INSPECT_V3_NAMESPACE_1263.json'

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate preflight trigger
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("cpw/INSPECT_V3_NAMESPACE_1263.json").read_text())
          assert cfg == {
              "issue": 1263,
              "scientific_issue": 1261,
              "mode": "account2-read-only-namespace-preflight",
              "writes_performed": False,
              "gpu_requested": False,
          }
          PY

      - name: Install Modal
        run: pip install 'modal>=1.5.4,<1.6'

      - name: Bind account2
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID_2"
          test -n "$MODAL_TOKEN_SECRET_2"
          printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID_2" >> "$GITHUB_ENV"
          printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET_2" >> "$GITHUB_ENV"

      - name: Verify authentication
        run: modal token info

      - name: Inspect namespace read-only
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v3_namespace_inspect_1263.py | tee cpw-v3-namespace.log

      - name: Validate and record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.txt
          import json
          from pathlib import Path

          prefix = "CPW_V3_NAMESPACE_INSPECT="
          rows = [
              line.split(prefix, 1)[1]
              for line in Path("cpw-v3-namespace.log").read_text(errors="replace").splitlines()
              if prefix in line
          ]
          assert rows, "missing CPW-v3 namespace payload"
          result = json.loads(rows[-1])

          assert result["issue"] == 1263
          assert result["scientific_issue"] == 1261
          assert result["writes_performed"] is False
          assert result["gpu_requested"] is False
          assert result["namespace_clean"] is True
          assert result["attempt"] is False
          assert result["result"] is False
          assert result["failure"] is False
          assert result["data_guard_ok"] is True

          print("CPW-v3 #1263 account2 namespace preflight PASS")
          print()
          print(f"- root exists: `{result['root_exists']}`")
          print("- ATTEMPT.json: `absent`")
          print("- RESULT.json: `absent`")
          print("- FAILURE.json: `absent`")
          print("- frozen data guard: `pass`")
          print("- GPU requested: `false`")
          print("- writes performed: `false`")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1263/comments" -F body=@/tmp/comment.txt
