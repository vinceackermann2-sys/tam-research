name: RLT systems exact15M q1 attention profile 20260926 P

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-scale15m-q1-attention-20260926-p.yml

permissions:
  contents: write

concurrency:
  group: rlt-systems-scale15m-q1-attention-20260926-p
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-scale15m-q1-attention-modal-20260926-p
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-scale15m-q1-attention-modal-20260926-p.json
      LAUNCHER_PATH: experiments/rlt/modal_scale15m_q1_attention_profile_p.py
      KERNEL_PATH: experiments/rlt/modal/results/rlt-systems-scale15m-kernel-profile-modal-20260926-o.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-scale15m-q1-attention-20260926-p.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-scale15m-q1-attention-modal-20260926-p.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-scale15m-q1-attention-modal-20260926-p.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed q1 profile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-systems-scale15m-q1-attention-modal-20260926-p',
            'task':'systems_scale15m_q1_attention_p',
            'engineering_seed':20261022,
            'requires_kernel_profile_job_id':'rlt-systems-scale15m-kernel-profile-modal-20260926-o',
            'batch':768,'heads':8,'head_dim':32,'query_len':1,
            'key_lengths':[1,8,16,32,64],
            'automatic_retry':False,
          },j
          PY

      - name: Require exact15M kernel profile O
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$KERNEL_PATH" >/tmp/kernel.json
          python - <<'PY'
          import json
          k=json.load(open('/tmp/kernel.json'))
          assert k.get('job_id')=='rlt-systems-scale15m-kernel-profile-modal-20260926-o',k
          assert k.get('status')=='complete' and k.get('classification')=='PASS_SCALE15M_KERNEL_PROFILE',k
          assert k.get('engineering_only') is True and k.get('scientific_execution') is False,k
          assert k.get('semantic_equivalence',{}).get('passed') is True,k
          assert k['profile']['batch_size']==768 and k['profile']['seq_len']==64,k
          assert k['rlt']['parameters']==15129344 and k['transformer']['parameters']==15129344,k
          assert float(k['derived']['transformer_throughput_multiple_vs_rlt'])>2.0,k
          top=k['rlt']['top_events_by_self_device_time']
          assert any(x.get('key')=='aten::_flash_attention_backward' and int(x.get('count',0))>=250 for x in top),top
          PY

      - name: Install Modal
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'modal>=1.5.4,<1.6'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Validate q1 profiler source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$LAUNCHER_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/modal_scale15m_q1_attention_profile_p.py').read_text()
          for x in [
            'JOB_ID = "rlt-systems-scale15m-q1-attention-modal-20260926-p"',
            'ENGINEERING_SEED = 20_261_022','BATCH = 768','HEADS = 8','HEAD_DIM = 32',
            'QUERY_LEN = 1','KEY_LENGTHS = (1, 8, 16, 32, 64)',
            'SDPBackend.FLASH_ATTENTION','SDPBackend.MATH',
            'SDPBackend.EFFICIENT_ATTENTION','SDPBackend.CUDNN_ATTENTION',
            'RLT_SYSTEMS_SCALE15M_Q1_ATTENTION_P_RESULT_B64=',
            'gpu="A100-80GB"','retries=0',
          ]: assert x in s,x
          PY

      - name: Run non-GPU Modal control-plane preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit q1 engineering preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_SYSTEMS_SCALE15M_Q1_ATTENTION_P_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],'engineering_only':True,
            'scientific_execution':False,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt systems: record q1-attention profile preflight'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Claim one-shot q1 profiler attempt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_seed':20261022,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'engineering_only':True,'scientific_execution':False,
            'automatic_retry_authorized':False,'job':json.load(open(os.environ['JOB_PATH'])),
          },indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100-80GB q1 profile"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal q1-attention profile
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 28m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_SYSTEMS_SCALE15M_Q1_ATTENTION_P_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize durable q1 result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception:p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                 'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                 'error':f'Modal CLI rc={rc}; no parseable terminal payload',
                 'log_tail':log[-6000:],'scientific_conclusion':None}
          p.update({'modal_cli_rc':rc,'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
                    'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
                    'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
                    'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT']})
          out=pathlib.Path(os.environ['RESULT_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize q1 profile
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('classification')=='PASS_SCALE15M_Q1_ATTENTION_BACKEND_PROFILE',r
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          print('len32 ranking:',r['steady_state_len32_ranking'])
          print('numerical len32:',r['numerical_vs_flash'].get('32'))
          print('numerical len64:',r['numerical_vs_flash'].get('64'))
          PY
