name: RLT gated-scan throughput AJ
on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-gated-scan-throughput-20261008-aj.yml
permissions:
  contents: write
concurrency:
  group: rlt-systems-gated-scan-throughput-20261008-aj
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-gated-scan-throughput-modal-20261008-aj
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-gated-scan-throughput-modal-20261008-aj.json
      LAUNCHER_PATH: experiments/rlt/modal_gated_scan_throughput_aj.py
      MODEL_PATH: experiments/rlt/model_gated_scan.py
      AI_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-component-attribution-modal-20261008-ai.json
      DIAG_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-gated-scan-throughput-20261008-aj.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-gated-scan-throughput-modal-20261008-aj.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-gated-scan-throughput-modal-20261008-aj.json
    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0
      - name: Guard AJ one-shot job and seeds
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH"
          echo "heads: $(git rev-parse origin/main) $(git rev-parse origin/$BRANCH)"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          echo "JOB_BLOB_SHA=$(git rev-parse "origin/$BRANCH:$JOB_PATH")" >> "$GITHUB_ENV"
          echo "LAUNCHER_BLOB_SHA=$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")" >> "$GITHUB_ENV"
          echo "MODEL_BLOB_SHA=$(git rev-parse "origin/$BRANCH:$MODEL_PATH")" >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          from pathlib import Path
          job=json.load(open('/tmp/job.json'))
          assert job=={
           'schema':1,'job_id':'rlt-systems-gated-scan-throughput-modal-20261008-aj',
           'task':'systems_gated_scan_throughput_aj',
           'engineering_seed':20261052,'batch_seed':20271052,'compile_probe_seed':20301052,
           'requires_attribution_job_id':'rlt-systems-lightstate-component-attribution-modal-20261008-ai',
           'requires_gated_scan_cpu_workflow_run_id':37750663298,
           'variants':['lightstate_full','gated_scan','transformer_control'],
           'batch_size':64,'seq_len':64,'synthetic_bank_size':8,'time_budget_seconds_each':12.0,
           'expected_parameters_each':15129344,'automatic_retry':False,
          },job
          own=Path('experiments/rlt/modal/jobs/rlt-systems-gated-scan-throughput-modal-20261008-aj.json')
          target={20261052,20271052,20301052}
          def walk(obj):
           if isinstance(obj,dict):
            for v in obj.values(): yield from walk(v)
           elif isinstance(obj,list):
            for v in obj: yield from walk(v)
           elif isinstance(obj,int): yield obj
          bad=[]
          for root in ['experiments/rlt/modal/jobs','experiments/rlt/modal/claims']:
           for path in Path(root).glob('*.json'):
            if path==own:continue
            try: value=json.loads(path.read_text())
            except Exception:continue
            intersection=target.intersection(walk(value))
            if intersection: bad.append((str(path),sorted(intersection)))
          assert not bad,bad
          print('Unconsumed AJ seeds:',sorted(target))
          PY
      - name: Require successful AI and scan CPU evidence
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$AI_PATH" >/tmp/ai.json
          python - <<'PY'
          import json,urllib.request
          r=json.load(open('/tmp/ai.json'))
          assert r.get('job_id')=='rlt-systems-lightstate-component-attribution-modal-20261008-ai'
          assert r.get('status')=='complete' and r.get('classification')=='PASS_LIGHTSTATE_COMPONENT_ATTRIBUTION'
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False
          assert r.get('modal_cli_rc')==0 and r.get('breakthrough_claim_supported') is False
          assert r.get('full_wrapper_semantic_equivalence',{}).get('passed') is True
          assert len(r['results'])==5 and all(x['parameters']==15129344 for x in r['results'])
          url='https://api.github.com/repos/vinceackermann2-sys/tam-research/actions/runs/37750663298'
          req=urllib.request.Request(url,headers={'User-Agent':'rlt-aj-preflight'})
          with urllib.request.urlopen(req,timeout=30) as f: run=json.load(f)
          assert run['id']==37750663298 and run['status']=='completed' and run['conclusion']=='success',run
          assert run['head_branch']=='exp/rlt-colab',run
          PY
      - name: Choose Modal account and verify AJ source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'modal>=1.5.4,<1.6'
          SLOT=""; ID=""; SECRET=""
          if [ -n "$MODAL_TOKEN_ID_2" ] && [ -n "$MODAL_TOKEN_SECRET_2" ]; then
           SLOT="2";ID="$MODAL_TOKEN_ID_2";SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "$MODAL_TOKEN_ID_B" ] && [ -n "$MODAL_TOKEN_SECRET_B" ]; then
           SLOT="B";ID="$MODAL_TOKEN_ID_B";SECRET="$MODAL_TOKEN_SECRET_B"
          else
           SLOT="A";ID="$MODAL_TOKEN_ID_A";SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID";export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          echo "MODAL_ACCOUNT_SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_ID=$ID" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$SECRET" >> "$GITHUB_ENV"
          python -m py_compile "$LAUNCHER_PATH" "$MODEL_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          a=Path('experiments/rlt/modal_gated_scan_throughput_aj.py').read_text()
          for x in [
           'JOB_ID = "rlt-systems-gated-scan-throughput-modal-20261008-aj"',
           'ENGINEERING_SEED = 20_261_052','BATCH_SEED = 20_271_052',
           'COMPILE_PROBE_SEED = 20_301_052','TIME_BUDGET_SECONDS = 12.0',
           'gpu="A100-80GB"','retries=0','GatedScanLightStateRLT',
           'PASS_GATED_SCAN_ENGINEERING_THROUGHPUT_ATTRIBUTION',
           'RLT_SYSTEMS_GATED_SCAN_AJ_RESULT_B64='
          ]:assert x in a,x
          m=Path('experiments/rlt/model_gated_scan.py').read_text()
          for x in ['class GatedScanLightStateRLT','associative_affine_scan',
                    'sequential_affine_reference','GATE_LOGIT_BIAS = 2.0']: assert x in m,x
          PY
      - name: Run zero-GPU Modal and exact image preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"
          timeout 15m modal run "$LAUNCHER_PATH"::verify_dependencies 2>&1 | tee /tmp/aj-cpu.log
          C="$(grep '^RLT_SYSTEMS_GATED_SCAN_AJ_PREFLIGHT_B64=' /tmp/aj-cpu.log | tail -1 | cut -d= -f2-)"
          test -n "$C"
          echo "AJ_CPU_B64=$C" >> "$GITHUB_ENV"
          python - "$P" "$C" <<'PY'
          import base64,json,sys
          a=json.loads(base64.urlsafe_b64decode(sys.argv[1].encode()))
          c=json.loads(base64.urlsafe_b64decode(sys.argv[2].encode()))
          assert a.get('status')=='pass' and a.get('scientific_job_executed') is False,a
          assert c.get('status')=='pass' and c.get('gpu_requested') is False,c
          assert c.get('cpu_forward_shapes_passed') is True and c.get('scan_vs_serial_passed') is True,c
          assert c.get('parameter_counts')=={
           'lightstate_full':15129344,'gated_scan':15129344,'transformer_control':15129344
          },c
          print('Zero-GPU AJ preflight succeeded.')
          PY
      - name: Commit zero-GPU verification before claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          c=json.loads(base64.urlsafe_b64decode(os.environ['AJ_CPU_B64'].encode()))
          assert p['status']=='pass' and c['status']=='pass'
          p.update({
           'classification':'RLT_GATED_SCAN_AJ_ZERO_GPU_PREFLIGHT_PASS',
           'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
           'job_id_checked':os.environ['JOB_ID'],
           'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
           'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
           'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
           'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
           'engineering_only':True,'scientific_execution':False,
           'cpu_model_preflight':c
          })
          out=pathlib.Path(os.environ['DIAG_PATH']);out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "$BRANCH"
          echo "preflight refs: $(git rev-parse origin/main) $(git rev-parse origin/$BRANCH)"
          git add "$DIAG_PATH"
          git commit -m 'rlt systems: record gated-scan AJ zero-GPU preflight'
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Durably claim exactly one AJ run
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open(os.environ['DIAG_PATH']))
          assert d['status']=='pass' and d['cpu_model_preflight']['status']=='pass'
          out=pathlib.Path(os.environ['CLAIM_PATH']);out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({
           'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed',
           'claimed_unix':time.time(),'worker':'github-actions-modal',
           'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
           'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
           'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
           'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
           'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
           'engineering_seed':20261052,'batch_seed':20271052,'compile_probe_seed':20301052,
           'engineering_only':True,'scientific_execution':False,
           'synthetic_data_only':True,'automatic_retry_authorized':False,
           'job':json.load(open(os.environ['JOB_PATH']))
          },sort_keys=True,indent=2)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100 benchmark"
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Execute one A100 AJ throughput benchmark
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 105m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=$?
          B64="$(grep '^RLT_SYSTEMS_GATED_SCAN_AJ_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0
      - name: Persist terminal AJ result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64','');rc=int(os.environ.get('MODAL_RC','999'))
          p=None
          if b:
           try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
           except Exception:p=None
          if not isinstance(p,dict):
           log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
           p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed',
           'finished_unix':time.time(),'worker':'github-actions-modal',
           'error_type':'ModalInvocationOrTransportError',
           'error':f'Modal CLI rc={rc}; no parseable terminal payload',
           'log_tail':log[-6000:],'scientific_conclusion':None,
           'engineering_only':True,'scientific_execution':False}
          p.update({'modal_cli_rc':rc,'branch':os.environ['BRANCH'],
           'trigger_sha':os.environ['GITHUB_SHA'],
           'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
           'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
           'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
           'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT']})
          f=pathlib.Path(os.environ['RESULT_PATH']);f.parent.mkdir(parents=True,exist_ok=True)
          f.write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          git fetch origin main "$BRANCH"
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Summarize AJ
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,sort_keys=True,indent=2))
          assert r.get('status')=='complete',r
          assert r.get('classification')=='PASS_GATED_SCAN_ENGINEERING_THROUGHPUT_ATTRIBUTION',r
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          assert r.get('breakthrough_claim_supported') is False and r.get('gpu_scan_vs_serial_passed') is True,r
          assert [x['name'] for x in r['results']]==['lightstate_full','gated_scan','transformer_control']
          assert all(x['parameters']==15129344 for x in r['results'])
          print('Ratios:',r['derived'])
          PY
