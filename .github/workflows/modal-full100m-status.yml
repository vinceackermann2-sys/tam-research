name: Modal full-100M status probe

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  status:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[modal-status-full100m]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install 'modal>=1.1,<2'

      - name: Verify Modal authentication
        run: modal token info

      - name: Query GitHub and Modal state without compute
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u

          gh run list --workflow modal-full100m.yml --limit 10 \
            --json databaseId,displayTitle,event,status,conclusion,createdAt,updatedAt,url \
            > /tmp/gh_runs.json 2>/tmp/gh_runs.err || true
          LATEST_GH_RUN_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              rows = json.loads(Path('/tmp/gh_runs.json').read_text())
          except Exception:
              rows = []
          candidates = [row for row in rows if str(row.get('displayTitle', '')).startswith('[modal-full100m]')]
          print(candidates[0].get('databaseId', '') if candidates else '')
          PY
          )"
          printf '%s' "$LATEST_GH_RUN_ID" > /tmp/latest_gh_run_id.txt
          if [ -n "$LATEST_GH_RUN_ID" ]; then
            gh run view "$LATEST_GH_RUN_ID" --log > /tmp/gh_run.log 2>/tmp/gh_run.err || true
          else
            : > /tmp/gh_run.log
            echo "No matching modal-full100m workflow run found" > /tmp/gh_run.err
          fi

          modal app list --json > /tmp/apps.json 2>/tmp/apps.err || true
          LATEST_APP_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              apps = json.loads(Path('/tmp/apps.json').read_text())
          except Exception:
              apps = []
          matches = [row for row in apps if row.get('description') == 'tam-research-full100m']
          print(matches[0].get('app_id', '') if matches else '')
          PY
          )"
          printf '%s' "$LATEST_APP_ID" > /tmp/latest_app_id.txt

          if [ -n "$LATEST_APP_ID" ]; then
            modal app history "$LATEST_APP_ID" --json > /tmp/history.json 2>/tmp/history.err || true
            modal app logs "$LATEST_APP_ID" --tail 500 --timestamps --show-function-id --show-container-id > /tmp/logs.txt 2>/tmp/logs.err || true
          else
            : > /tmp/history.json
            : > /tmp/logs.txt
            echo "No tam-research-full100m app ID found" > /tmp/history.err
          fi

          modal volume ls tam-research-data data/tam100m-2b-curated-v1 --json > /tmp/pretrain.json 2>/tmp/pretrain.err || true
          modal volume ls tam-research-data data/tam100m-posttrain-v1 --json > /tmp/posttrain.json 2>/tmp/posttrain.err || true
          modal volume ls tam-research-data full100m-runs --json > /tmp/runs.json 2>/tmp/runs.err || true

          python - <<'PY' > /tmp/comment.md
          from pathlib import Path
          import json

          def read(path):
              p = Path(path)
              return p.read_text(errors='replace').strip() if p.exists() else ''

          def load_json(path):
              text = read(path)
              if not text:
                  return None
              try:
                  return json.loads(text)
              except Exception:
                  return text

          latest_gh_run_id = read('/tmp/latest_gh_run_id.txt')
          latest_app_id = read('/tmp/latest_app_id.txt')
          gh_runs = load_json('/tmp/gh_runs.json')
          gh_run_log = read('/tmp/gh_run.log')
          apps = load_json('/tmp/apps.json')
          history = load_json('/tmp/history.json')
          pretrain = load_json('/tmp/pretrain.json')
          posttrain = load_json('/tmp/posttrain.json')
          runs = load_json('/tmp/runs.json')
          logs = read('/tmp/logs.txt')

          print('🔎 **TAM-v3-100M production status probe (zero GPU)**')
          print('')
          print('This probe only queried GitHub Actions, Modal metadata/logs and the persistent Volume; it did not start any Modal function or allocate a GPU.')
          print('')
          print(f'Latest matched GitHub run ID: `{latest_gh_run_id or "none"}`')
          print(f'Latest matched Modal app ID: `{latest_app_id or "none"}`')
          print('')
          print('### Full-100M GitHub workflow runs')
          print('```json')
          print(json.dumps(gh_runs, indent=2)[:12000] if not isinstance(gh_runs, str) else gh_runs[:12000])
          print('```')
          print('### Latest full-100M GitHub run log')
          print('```text')
          print(gh_run_log[-24000:] if gh_run_log else '(no GitHub Actions log returned)')
          print('```')
          print('### Modal app list')
          print('```json')
          print(json.dumps(apps, indent=2)[:12000] if not isinstance(apps, str) else apps[:12000])
          print('```')
          print('### Modal app history')
          print('```json')
          print(json.dumps(history, indent=2)[:12000] if not isinstance(history, str) else history[:12000])
          print('```')
          print('### Recent Modal app logs')
          print('```text')
          print(logs[-18000:] if logs else '(no stdout logs returned)')
          print('```')
          print('### Volume: pretraining data')
          print('```json')
          print(json.dumps(pretrain, indent=2)[:8000] if not isinstance(pretrain, str) else pretrain[:8000])
          print('```')
          print('### Volume: post-training data')
          print('```json')
          print(json.dumps(posttrain, indent=2)[:6000] if not isinstance(posttrain, str) else posttrain[:6000])
          print('```')
          print('### Volume: full100m-runs')
          print('```json')
          print(json.dumps(runs, indent=2)[:6000] if not isinstance(runs, str) else runs[:6000])
          print('```')

          errors = {
              'gh-runs': read('/tmp/gh_runs.err'),
              'gh-run-log': read('/tmp/gh_run.err'),
              'app-list': read('/tmp/apps.err'),
              'app-history': read('/tmp/history.err'),
              'app-logs': read('/tmp/logs.err'),
              'pretrain-ls': read('/tmp/pretrain.err'),
              'posttrain-ls': read('/tmp/posttrain.err'),
              'runs-ls': read('/tmp/runs.err'),
          }
          nonempty = {k: v for k, v in errors.items() if v}
          if nonempty:
              print('### Probe stderr')
              print('```text')
              for key, value in nonempty.items():
                  print(f'[{key}] {value[:4000]}')
              print('```')
          PY

          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="$(cat /tmp/comment.md)"
