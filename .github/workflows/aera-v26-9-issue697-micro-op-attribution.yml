name: AERA v26.9 issue697 micro-op attribution

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-9-issue697-micro-op-attribution
  cancel-in-progress: false

jobs:
  issue697-micro-op-attribution:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[aera-v26-9-issue697-micro-op-preauth]') ||
       startsWith(github.event.issue.title, '[aera-v26-9-issue697-micro-op-l4]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue697 diagnostic and frozen root dependencies
        run: |
          python -m py_compile modal_aera_v26_9_issue697_micro_op_attribution.py
          python -m py_compile modal_aera_v26_9_issue687_stage_internal_throughput_attribution.py
          python -m py_compile modal_aera_v26_9_issue665_frozen_throughput_component_attribution.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue697 immutable boundary and select mode
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/697" --jq '.title')" = "[research] AERA-v26.9 micro-op attribution after #687/#696"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/697" --jq '.state')" = "open"

          freeze_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/697/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #697 pre-implementation micro-op attribution freeze")) | .id' | wc -l | tr -d ' ')"
          test "${freeze_count}" = "1"
          freeze_comment="$(gh api "repos/${GITHUB_REPOSITORY}/issues/697/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("## #697 pre-implementation micro-op attribution freeze")) | .body')"

          printf '%s\n' "${freeze_comment}" | grep -F 'SOURCE_MAIN=2b89fd0e6d12ad3f0d2d0ca870d838669cd7fddd' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'SOURCE_TREE=ad75aae06273fe42769855f5273f5e516a1dd20f' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'BRANCH=research/aera-v26-9-issue697-micro-op-attribution' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PREAUTH_PREFIX=[aera-v26-9-issue697-micro-op-preauth]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'L4_PREFIX=[aera-v26-9-issue697-micro-op-l4]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'RESULT_PATH=/vol/aera-v26/issue697-micro-op-attribution/result.json' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PARENT_RESULT_PATH=/vol/aera-v26/issue687-stage-internal-throughput-attribution/result.json' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PARENT_TRIGGER=696' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PARENT_EVIDENCE_COMMENT=5569795957' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PARENT_RUN=34115412471' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PARENT_JOB=101720942690' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'PARENT_ATTEMPT=1' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'ISSUE687_LAUNCHER_BLOB=b9950c032686a496c6d944c30c441428499cb367' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'ISSUE665_LAUNCHER_BLOB=72f27391ff2f0a7bff8d4532f307ddc4869cf494' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'BASE_CORE_BLOB=ffe0341829fb905e40ef9ae3544f797471f1aa9c' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'MATERIAL_SHARE_MIN=0.15' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'MATERIAL_MS_MIN=1.0' >/dev/null

          launcher_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^LAUNCHER_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          workflow_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^WORKFLOW_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          cpu_test_blob="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^CPU_TEST_BLOB=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_tree="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^FROZEN_TREE=\([0-9a-f]\{40\}\)$/\1/p')"
          frozen_commit="$(printf '%s\n' "${freeze_comment}" | sed -n 's/^FROZEN_COMMIT=\([0-9a-f]\{40\}\)$/\1/p')"
          test -n "${launcher_blob}" && test -n "${workflow_blob}" && test -n "${cpu_test_blob}" && test -n "${frozen_tree}" && test -n "${frozen_commit}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"

          git cat-file -e "${bound_main}^{commit}"
          git checkout --detach "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 2b89fd0e6d12ad3f0d2d0ca870d838669cd7fddd "${bound_main}"
          test "$(git rev-parse 2b89fd0e6d12ad3f0d2d0ca870d838669cd7fddd^{tree})" = "ad75aae06273fe42769855f5273f5e516a1dd20f"
          git cat-file -e "${frozen_commit}^{commit}"
          test "$(git rev-parse "${frozen_commit}^{tree}")" = "${frozen_tree}"
          git merge-base --is-ancestor "${frozen_commit}" "${bound_main}"

          test "$(git hash-object modal_aera_v26_9_issue697_micro_op_attribution.py)" = "${launcher_blob}"
          test "$(git hash-object .github/workflows/aera-v26-9-issue697-micro-op-attribution.yml)" = "${workflow_blob}"
          test "$(git hash-object tests/test_aera_v26_9_issue697_micro_op_attribution_cpu.py)" = "${cpu_test_blob}"
          test "$(git hash-object modal_aera_v26_9_issue687_stage_internal_throughput_attribution.py)" = "b9950c032686a496c6d944c30c441428499cb367"
          test "$(git hash-object modal_aera_v26_9_issue665_frozen_throughput_component_attribution.py)" = "72f27391ff2f0a7bff8d4532f307ddc4869cf494"
          test "$(git hash-object tam_research/aera_hardware_core.py)" = "ffe0341829fb905e40ef9ae3544f797471f1aa9c"

          title="$(jq -r '.issue.title' "${GITHUB_EVENT_PATH}")"
          if [[ "${title}" == '[aera-v26-9-issue697-micro-op-preauth]'* ]]; then
            mode=preauth
            prefix='[aera-v26-9-issue697-micro-op-preauth]'
            evidence_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔎 **AERA-v26.9 #697 micro-op preauthorization evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${evidence_count}" = "0"
          else
            mode=l4
            prefix='[aera-v26-9-issue697-micro-op-l4]'
            preauth_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("🔎 **AERA-v26.9 #697 micro-op preauthorization evidence**")) | select((.body // "") | contains("Bound main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${preauth_count}" = "1"
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/697/comments?per_page=100" | jq -r --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("## #697 sole L4 micro-op attribution authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
            result_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.9 #697 micro-op attribution evidence**")) | .id' | wc -l | tr -d ' ')"
            test "${result_count}" = "0"
          fi

          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "bound_main=${bound_main}" >> "${GITHUB_OUTPUT}"
          echo "allowed=true" >> "${GITHUB_OUTPUT}"

      - name: Re-verify issue697 trigger immediately before Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          MODE: ${{ steps.guard.outputs.mode }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BOUND_MAIN}"
          if [[ "${MODE}" == "preauth" ]]; then
            prefix='[aera-v26-9-issue697-micro-op-preauth]'
          else
            prefix='[aera-v26-9-issue697-micro-op-l4]'
            auth_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/697/comments?per_page=100" | jq -r --arg bound "${BOUND_MAIN}" '.[] | select((.body // "") | startswith("## #697 sole L4 micro-op attribution authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' | wc -l | tr -d ' ')"
            test "${auth_count}" = "1"
          fi
          mapfile -t matches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(has(\"pull_request\") | not) | select(.title | startswith(\"${prefix}\")) | .number" | sort -n)
          test "${#matches[@]}" = "1"
          test "${TRIGGER_ISSUE}" = "${matches[0]}"

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run issue697 zero-GPU preauthorization audit
        if: steps.guard.outputs.mode == 'preauth'
        id: preauth
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          modal run modal_aera_v26_9_issue697_micro_op_attribution.py::preauth_main 2>&1 | tee /tmp/issue697-preauth.log
          test "$(grep -c '^AERA_V26_9_ISSUE697_MICRO_OP_PREAUTH_JSON=' /tmp/issue697-preauth.log)" = "1"

      - name: Record issue697 preauthorization evidence
        if: steps.guard.outputs.mode == 'preauth' && steps.preauth.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          BOUND_MAIN: ${{ steps.guard.outputs.bound_main }}
        run: |
          python - <<'PY' >/tmp/issue697-preauth.md
          import json, os
          from pathlib import Path
          marker="AERA_V26_9_ISSUE697_MICRO_OP_PREAUTH_JSON="
          ps=[json.loads(x[len(marker):]) for x in Path("/tmp/issue697-preauth.log").read_text().splitlines() if x.startswith(marker)]
          if len(ps)!=1: raise SystemExit("expected one #697 preauth payload")
          p=ps[0]
          if p.get("research_issue")!=697 or p.get("result_absent") is not True: raise SystemExit("#697 preauth drift")
          for k in ("gpu_used","model_constructed","new_measurement_performed","optimization_authorized","systems_pass_earned","architecture_freeze_authorized","s2_authorized","fresh_scientific_seed_authorized","independent_replication_credit","100m_authorized","breakthrough_proven"):
              if p.get(k) is not False: raise SystemExit(f"forbidden #697 preauth flag {k}")
          print("🔎 **AERA-v26.9 #697 micro-op preauthorization evidence**")
          print()
          print(f"Bound main: `{os.environ['BOUND_MAIN']}`")
          print(f"Fresh result path absent: `{p['result_absent']}`.")
          print(f"Parent trigger/comment/run/job/attempt: `{p['parent_trigger']}` / `{p['parent_evidence_comment']}` / `{p['parent_run']}` / `{p['parent_job']}` / `{p['parent_attempt']}`.")
          print(f"Source systems decision remains `{p['source_decision']}`.")
          print("Zero GPU/model/measurement/higher-stage authority was used.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue697-preauth.md)"

      - name: Run issue697 sole L4 micro-op diagnostic
        if: steps.guard.outputs.mode == 'l4'
        id: diagnostic
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          modal run modal_aera_v26_9_issue697_micro_op_attribution.py::l4_main 2>&1 | tee /tmp/issue697-l4.log
          test "$(grep -c '^AERA_V26_9_ISSUE697_MICRO_OP_PREAUTH_JSON=' /tmp/issue697-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE697_MICRO_OP_L4_START_JSON=' /tmp/issue697-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE697_MICRO_OP_RESULT_JSON=' /tmp/issue697-l4.log)" = "1"
          test "$(grep -c '^AERA_V26_9_ISSUE697_MICRO_OP_SUMMARY_JSON=' /tmp/issue697-l4.log)" = "1"

      - name: Record issue697 micro-op attribution evidence
        if: steps.guard.outputs.mode == 'l4' && steps.diagnostic.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >/tmp/issue697-summary.md
          import json
          from pathlib import Path
          marker="AERA_V26_9_ISSUE697_MICRO_OP_SUMMARY_JSON="
          ps=[json.loads(x[len(marker):]) for x in Path("/tmp/issue697-l4.log").read_text().splitlines() if x.startswith(marker)]
          if len(ps)!=1: raise SystemExit("expected one #697 summary")
          p=ps[0]
          if p.get("research_issue")!=697 or p.get("source_decision")!="FAIL_FROZEN_E2E_SYSTEMS_GATE": raise SystemExit("#697 summary authority drift")
          for k in ("optimization_authorized","systems_pass_earned","architecture_freeze_authorized","s2_authorized","fresh_scientific_seed_authorized","independent_replication_credit","100m_authorized","breakthrough_proven"):
              if p.get(k) is not False: raise SystemExit(f"forbidden #697 result flag {k}")
          print("🔬 **AERA-v26.9 #697 micro-op attribution evidence**")
          print()
          print(f"Device: `{p['device']}`; source systems decision remains `{p['source_decision']}`.")
          print(f"Common next target: `{p['next_target']}`.")
          print(f"Regime-specific targets: `{json.dumps(p['regime_specific_targets'],sort_keys=True)}`.")
          for batch,row in sorted(p["batches"].items(),key=lambda kv:int(kv[0])):
              print()
              print(f"Batch {batch}: parent glue `{row['parent_glue_ms']}` ms; parent experts `{row['parent_experts_ms']}` ms.")
              print(f"Unprofiled/profiled full-call medians: `{row['baseline_full_median_ms']}` / `{row['profiled_full_median_ms']}` ms; profiler distortion `{row['profiler_distortion_ratio']}`x.")
              print(f"Generic impacts: `{json.dumps(row['generic_impacts_ms'],sort_keys=True)}`.")
              print(f"Expert detail: `{json.dumps(row['expert_detail_ms'],sort_keys=True)}`.")
          print()
          print("Diagnostic attribution only. No optimization, systems PASS, architecture freeze, S2, scaling, or breakthrough authority is created automatically.")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue697-summary.md)"
