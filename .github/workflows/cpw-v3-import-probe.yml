name: CPW-v3 CPU Modal import probe

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/PROBE_V3_IMPORT_1261.json'

permissions:
  contents: read
  issues: write

jobs:
  import_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate probe trigger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("cpw/PROBE_V3_IMPORT_1261.json").read_text())
          assert cfg["issue"] == 1261
          assert cfg["mode"] == "cpu-modal-import-probe"
          assert cfg["gpu"] is False
          PY
      - name: Install Modal
        run: pip install 'modal>=1.5.4,<1.6'
      - name: Bind account2
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID_2"
          test -n "$MODAL_TOKEN_SECRET_2"
          printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID_2" >> "$GITHUB_ENV"
          printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET_2" >> "$GITHUB_ENV"
      - name: Run CPU-only remote import probe
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v3_import_probe_1261.py | tee cpw-v3-import.log
      - name: Validate and record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.txt
          import json
          from pathlib import Path
          p="CPW_V3_IMPORT_PROBE="
          rows=[x.split(p,1)[1] for x in Path("cpw-v3-import.log").read_text(errors="replace").splitlines() if p in x]
          assert rows, "missing CPW-v3 import probe marker"
          r=json.loads(rows[-1])
          assert r["imports_ok"] is True
          assert r["gpu_requested"] is False
          assert r["volume_mounted"] is False
          assert r["writes_performed"] is False
          assert r["scientific_seed_consumed"] is False
          assert set(r["parameters"].values()) == {21745408}
          print("CPW-v3 #1261 CPU Modal import probe PASS")
          print()
          print(f"- parameters: `{r['parameters']}`")
          print(f"- WORLD layouts: `{r['world_layer_layouts']}`")
          print("- GPU requested: `false`")
          print("- scientific seed consumed: `false`")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1261/comments" -F body=@/tmp/comment.txt
