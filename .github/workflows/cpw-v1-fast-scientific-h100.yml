name: CPW-v1-fast one-shot scientific replication

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/LAUNCH_V1_FAST_SCIENCE.json'

permissions:
  contents: read
  issues: write

jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_SECONDARY: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
      MODAL_TOKEN_SECRET_SECONDARY: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_LOW_CREDIT_ACCOUNT: ${{ secrets.MODAL_LOW_CREDIT_ACCOUNT }}
      MODAL_MAX_THROTTLE_WAIT: "0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate one-shot scientific authority
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("cpw/LAUNCH_V1_FAST_SCIENCE.json").read_text())
          assert set(cfg)=={"phase","issue","cpu_gate_run","systems_evidence_issue","authorized_parent_sha"}
          assert cfg["phase"]=="cpw-v1-fast-scientific-replication"
          assert cfg["issue"]==1250
          assert cfg["cpu_gate_run"]==37318135296
          assert cfg["systems_evidence_issue"]==1249
          assert len(str(cfg["authorized_parent_sha"]))==40
          PY
          AUTHORIZED_PARENT="$(python -c 'import json; print(json.load(open("cpw/LAUNCH_V1_FAST_SCIENCE.json"))["authorized_parent_sha"])')"
          test "$(git rev-parse HEAD^)" = "$AUTHORIZED_PARENT"

          git diff --exit-code 531a2a417a39b87c5ee86694916b2640d12b7381 "$SOURCE_SHA" -- \
            tam_research/cpw_v1 \
            tests/test_cpw_v1_1248.py \
            docs/CPW_V1_ARCHITECTURE.md

          git diff --exit-code c1c395fe6fce8c4184651938f162058cf6fd7d7f "$SOURCE_SHA" -- \
            tam_research/cpw_v1_fast \
            tests/test_cpw_v1_fast_1249.py

          git diff --exit-code 73b72066bd79ace8b999deb63be564e6d21e2f44 "$SOURCE_SHA" -- \
            modal_cpw_v1_fast_scientific_1250.py \
            tests/test_cpw_v1_fast_scientific_1250.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run frozen CPU contracts
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
          python -m compileall -q modal_cpw_v1_fast_scientific_1250.py tam_research/cpw_v1 tam_research/cpw_v1_fast
          pytest -q \
            tests/test_cpw_v1_1248.py \
            tests/test_cpw_v1_fast_1249.py \
            tests/test_cpw_v1_fast_scientific_1250.py

      - name: Install pinned Modal CLI
        run: pip install 'modal>=1.5.4,<1.6'

      - name: Select eligible Modal account
        id: account
        run: |
          PYTHONPATH="$PWD" python scripts/modal_select_account_v3.py \
            --required-volume tam-research-data \
            --runtime-probe-path modal_runtime_admission_probe_1067_v1.py

      - name: Activate selected Modal account
        env:
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
          SECONDARY_CREDENTIAL_ALIASES: ${{ steps.account.outputs.secondary_credential_aliases }}
        run: |
          set -euo pipefail
          if [ "$SELECTED_MODAL_ACCOUNT" = "primary" ]; then
            printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
          elif [ "$SELECTED_MODAL_ACCOUNT" = "secondary" ]; then
            case ",$SECONDARY_CREDENTIAL_ALIASES," in
              *,secondary,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_SECONDARY"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_SECONDARY"
                ;;
              *,account2,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_2"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_2"
                ;;
              *,legacy_b,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_B"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_B"
                ;;
              *)
                exit 93
                ;;
            esac
            printf 'MODAL_TOKEN_ID=%s\n' "$SECONDARY_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$SECONDARY_SECRET" >> "$GITHUB_ENV"
          else
            exit 92
          fi

      - name: Verify Modal authentication
        run: modal token info

      - name: Record scientific launch
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1250/comments" \
            -f body="CPW-v1-fast frozen scientific launch gate passed. Account=${SELECTED_MODAL_ACCOUNT}; source=${GITHUB_SHA}. Launching 1M integrity smoke then three fresh paired 5M-token replications. No retry authorized."

      - name: Run one-shot fresh scientific replication
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v1_fast_scientific_1250.py \
            --source-sha "${GITHUB_SHA}" | tee cpw-v1-fast-science.log

      - name: Record terminal result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/cpw-v1-fast-science-comment.txt
          import json
          from pathlib import Path
          prefix="CPW_V1_FAST_RESULT="
          matches=[line.split(prefix,1)[1] for line in Path("cpw-v1-fast-science.log").read_text(errors="replace").splitlines() if prefix in line]
          if not matches:
              raise SystemExit("missing terminal result")
          r=json.loads(matches[-1])
          print("CPW-v1-fast fresh scientific replication")
          print()
          print(f"- classification: `{r['classification']}`")
          print(f"- integrity: `{r['replication_integrity']}`")
          print(f"- Transformer mean NLL: `{r['transformer_mean_nll']}`")
          print(f"- CPW-v1-fast mean NLL: `{r['cpwv1fast_mean_nll']}`")
          print(f"- CPW wins: `{r['cpwv1fast_wins']}/3`")
          print(f"- quality supported: `{r['quality_supported']}`")
          print(f"- mean CPW/Transformer train TPS: `{r['mean_cpw_training_tps_ratio']}`")
          print(f"- mean CPW/Transformer training seconds: `{r['mean_cpw_training_seconds_ratio']}`")
          print(f"- mean CPW/Transformer total compute: `{r['mean_cpw_total_compute_ratio']}`")
          for p in r["replication"]:
              print(f"- seed {p['seed']}: T={p['transformer']['nll']:.6f}, CPW={p['cpwv1fast']['nll']:.6f}, delta(T-CPW)={p['transformer_minus_cpw_nll']:+.6f}, TPS={p['cpw_training_tps_ratio']:.3f}x, train_s={p['cpw_training_seconds_ratio']:.3f}x")
          print("- breakthrough claim authorized: `false`")
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1250/comments" \
            -F body=@/tmp/cpw-v1-fast-science-comment.txt

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1250/comments" \
            -f body="CPW-v1-fast scientific workflow failed for source ${GITHUB_SHA}. This scientific attempt is consumed; do not rerun. Inspect durable failure evidence before any successor."
