name: AERA v26.6 issue519 materialize-cast FICEM WRITE L4 gate

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-6-issue519-ficem-write-materialize-cast-l4
  cancel-in-progress: false

jobs:
  materialize-cast-write:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-6-issue519-ficem-write-materialize-cast-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue519 probe and launcher
        run: |
          python -m py_compile tam_research/aera_v26_6_issue519_ficem_write_materialize_cast_probe.py
          python -m py_compile modal_aera_v26_6_issue519_ficem_write_materialize_cast_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue519 sole one-attempt materialize-cast WRITE boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/519" --jq '.title')" = "[research] AERA-v26.6 mixed-source FICEM WRITE full L4 correctness/topology gate after #517"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/519" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/518" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/518" --jq '.head.sha')" = "c2edcfeb28efebe3818a92c5e00d53ea72689c75"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/518" --jq '.merge_commit_sha')" = "cc9f401d7d3b5ed5c75dc8905ffc8f12df32616b"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33668780903" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33668780903" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33668780903" --jq '.head_sha')" = "c2edcfeb28efebe3818a92c5e00d53ea72689c75"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100376942271" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/516" --jq '.title')" = "[aera-v26-5-issue514-ficem-write-mixed-dtype-l4] sole #514 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33664645415" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33664645415" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100363263710" --jq '.conclusion')" = "success"
          test "${TRIGGER_ISSUE}" != "516"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-6-issue519-ficem-write-materialize-cast-l4]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"
          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.6 #519 materialize-cast FICEM WRITE result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor cc9f401d7d3b5ed5c75dc8905ffc8f12df32616b HEAD

          test "$(git hash-object tam_research/aera_hardware_core_v26_6_ficem_write_materialize_cast.py)" = "d45c262314a0b4691f26812a279937a225043ad9"
          test "$(git hash-object tam_research/aera_hardware_core_v26_5_ficem_write_mixed_dtype.py)" = "dab24c733eff7aa08e5f818614f7504eaac48dc3"
          test "$(git hash-object tam_research/aera_hardware_core_v26_4_ficem_write_triton.py)" = "e54570292489bd17570038dca7518419ac00418c"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object tam_research/aera_v26_4_ficem_write_probe.py)" = "7d8c2c4990beb4c7b4a719d02d009ffefe94671f"
          test "$(git hash-object tam_research/aera_v26_5_issue514_ficem_write_mixed_dtype_probe.py)" = "e48dc308bef3b4ef9b6590ab0324db4a50c0f7af"
          test "$(git hash-object tam_research/aera_v26_6_issue519_ficem_write_materialize_cast_probe.py)" = "ec22807434192f58e292bffc3de9828be2b44272"
          test "$(git hash-object modal_aera_v26_6_issue519_ficem_write_materialize_cast_app.py)" = "fcb4a98f62f512bca33b7baa600c7d445da767b6"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue519 gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.6 #519 materialize-cast FICEM WRITE gate** — exact bound main, CPU-green #517 repair, and frozen full #514 regression surface verified. One NVIDIA L4, Actions attempt 1 only. Synthetic correctness/topology only; no end-to-end/freeze/scientific-seed/replication/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue519 materialize-cast FICEM WRITE L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_6_issue519_ficem_write_materialize_cast_app.py 2>&1 | tee /tmp/issue519.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_6_ISSUE519_FICEM_WRITE_MATERIALIZE_CAST_RESULT_JSON=' /tmp/issue519.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue519 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_6_ISSUE519_FICEM_WRITE_MATERIALIZE_CAST_SUMMARY_JSON=' /tmp/issue519.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.6 #519 materialize-cast FICEM WRITE result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. PASS permits only separate end-to-end systems preregistration; no automatic freeze/scientific-seed/replication/100M/breakthrough authorization." || true

      - name: Record issue519 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.6 #519 materialize-cast WRITE gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
