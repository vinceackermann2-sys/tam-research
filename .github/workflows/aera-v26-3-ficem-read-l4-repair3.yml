name: AERA v26.3 issue433 FICEM read L4 repair3

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: aera-v26-3-issue433-ficem-read-l4-repair3
  cancel-in-progress: false

jobs:
  ficem-read-repair3:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-ficem-read-l4-repair3]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue433 launcher
        run: python -m py_compile modal_aera_v26_3_ficem_read_repair3_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue433 one-attempt repair3 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Issue #433 permits Actions attempt 1 only; no workflow retry." >&2
            exit 1
          fi

          prereg_title="$(gh api "repos/${GITHUB_REPOSITORY}/issues/433" --jq '.title')"
          test "${prereg_title}" = "[research] AERA-v26.3 repair3 synthetic L4 FICEM-read gate after #426 CPU proof"

          issue433_state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/433" --jq '.state')"
          test "${issue433_state}" = "open"

          issue426_title="$(gh api "repos/${GITHUB_REPOSITORY}/issues/426" --jq '.title')"
          test "${issue426_title}" = "[research] AERA-v26.3 FICEM read repair3: BF16 reference-rounded fused arithmetic after #423 localization"

          pr427_merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/427" --jq '.merged')"
          pr427_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/427" --jq '.head.sha')"
          pr427_merge="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/427" --jq '.merge_commit_sha')"
          test "${pr427_merged}" = "true"
          test "${pr427_head}" = "0ad68f50c5ca937a0de9e4bd1c5464e1c0aeab24"
          test "${pr427_merge}" = "7e1346709d3c1eb158c9ec7d621cafdf498da315"

          cpu_run_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33503499118" --jq '.conclusion')"
          cpu_run_attempt="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33503499118" --jq '.run_attempt')"
          cpu_run_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33503499118" --jq '.head_sha')"
          test "${cpu_run_conclusion}" = "success"
          test "${cpu_run_attempt}" = "1"
          test "${cpu_run_head}" = "0ad68f50c5ca937a0de9e4bd1c5464e1c0aeab24"

          trigger_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-ficem-read-l4-repair3]")) | .number' \
              | wc -l | tr -d ' '
          )"
          if [ "${trigger_count}" != "1" ]; then
            echo "Expected exactly one issue433 FICEM read repair3 trigger, found ${trigger_count}." >&2
            exit 1
          fi

          result_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("🔬 **AERA-v26.3 #433 FICEM read repair3 result**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${result_comment_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(
            printf '%s\n' "${event_body}" \
              | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' \
              | head -n 1
          )"
          if [ -z "${bound_main}" ]; then
            echo "Trigger must contain an exact 'Bind main: `<40-hex-sha>`' line." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 7e1346709d3c1eb158c9ec7d621cafdf498da315 HEAD

          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "b6b37f0379b280eea4e5c2b16f349951dadc4df9"
          grep -F '"bf16_reference_rounding_repair3": True' tam_research/aera_hardware_core_v26_3_ficem_read_triton.py >/dev/null
          grep -F '"float32_path_changed_by_repair3": False' tam_research/aera_hardware_core_v26_3_ficem_read_triton.py >/dev/null
          test -f modal_aera_v26_3_ficem_read_repair3_app.py
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record frozen issue433 repair3 guard (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          body="🔒 **AERA-v26.3 #433 FICEM read repair3 gate** — checked-out main **${head_sha}**. Separately preregistered after #426 CPU proof. Frozen #418 probe blob, seed/order, rows, tie-aware correctness, timing, tolerances and PASS thresholds are unchanged. Repair3 backend blob is frozen. One NVIDIA L4 <=300 GPU seconds, Actions attempt 1 only. No model/checkpoint/corpus/training/scientific seed/end-to-end/freeze/S2/100M/breakthrough authorization."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}" || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue433 repair3 synthetic L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_ficem_read_repair3_app.py 2>&1 | tee /tmp/aera-v26-3-issue433-ficem-read-repair3.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE433_FICEM_READ_REPAIR3_RESULT_JSON=' /tmp/aera-v26-3-issue433-ficem-read-repair3.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue433 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result-comment.md
          import json
          from pathlib import Path

          lines = Path('/tmp/aera-v26-3-issue433-ficem-read-repair3.log').read_text(errors='replace').splitlines()
          marker = 'AERA_V26_ISSUE433_FICEM_READ_REPAIR3_SUMMARY_JSON='
          rows = [line[len(marker):] for line in lines if line.startswith(marker)]
          if not rows:
              raise SystemExit('issue433 compact summary marker missing')
          payload = json.loads(rows[-1])
          localized = payload['localized_bfloat16_batch8_mixed']
          out = [
              '🔬 **AERA-v26.3 #433 FICEM read repair3 result**',
              '',
              f'- decision: **{payload["decision"]}**; overall PASS: **{payload["overall_pass"]}**',
              f'- device: **{payload["device"]}**',
              f'- per-dtype geomean full-read latency ratios: **{payload["geomean_latency_ratio_by_dtype"]}** (each required <= **0.90x**)',
              f'- correctness / known-empty / near-tie: **{payload["correctness_pass"]} / {payload["known_empty_pass"]} / {payload["near_tie_pass"]}**',
              f'- row latency / full-event ratio / single fused tail / no reference tail ops: **{payload["row_latency_pass"]} / {payload["full_event_ratio_pass"]} / {payload["single_tail_kernel_pass"]} / {payload["candidate_no_reference_tail_ops_pass"]}**',
              f'- localized bfloat16_batch8_mixed: pass **{localized["pass"]}**, tie-aware selection **{localized["selection_semantically_equivalent"]}**, distinct-set exact **{localized["distinct_selected_set_exact"]}**, pre-out close **{localized["pre_out_recalled_close"]}**, final-out close **{localized["final_out_close"]}**, pre-out max abs diff **{localized["pre_out_max_abs_diff"]}**',
          ]
          for key, row in payload['row_ratios'].items():
              out.append(
                  f'- {key}: latency **{row["latency"]:.3f}x**, CUDA-event ratio **{row["events"]:.3f}x**, correctness **{row["correctness"]}**, tie queries **{row["tie_query_count"]} ({row["tie_query_fraction"]:.6f})**, tie-aware selection **{row["selection_semantically_equivalent"]}**'
              )
          out += [
              '',
              '- Frozen #418 probe/fixtures/tolerances/timing/thresholds were reused without modification.',
              '- Durable Modal result + authoritative result marker are the experiment record; this comment is reporting only.',
              '- This result does **not** authorize end-to-end timing, architecture freeze, S2, a scientific seed, 100M, or a breakthrough claim.',
          ]
          print('\n'.join(out))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$(cat /tmp/result-comment.md)" || true

      - name: Record issue433 workflow failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          tail -n 120 /tmp/aera-v26-3-issue433-ficem-read-repair3.log > /tmp/failure-tail.txt 2>/dev/null || true
          {
            echo '⚠️ **AERA-v26.3 #433 FICEM read repair3 gate failed before an authoritative result marker.**'
            echo
            echo "Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized. Any continuation requires another new preregistration.'
            echo
            echo '<details><summary>log tail</summary>'
            echo
            echo '```text'
            cat /tmp/failure-tail.txt
            echo '```'
            echo '</details>'
          } > /tmp/failure-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$(cat /tmp/failure-comment.md)" || true
