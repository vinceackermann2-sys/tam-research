name: CPW-v4 #1285 exact-head launch validation

on:
  push:
    branches:
      - research/cpw-v4-delayed-recall-launch-1285

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate exact launch-control scope
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE=6220ef98a57551a2a592429041df3e9ae650de4a
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          python - <<'PY'
          import subprocess
          base='6220ef98a57551a2a592429041df3e9ae650de4a'
          allowed={
              '.github/workflows/cpw-v4-delayed-recall-h100-1285.yml',
              '.github/workflows/cpw-v4-launch-1285-ci.yml',
              'cpw/LAUNCH_V4_DELAYED_RECALL_1285.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed <= allowed, f'unexpected paths: {sorted(changed-allowed)}'
          assert {
              '.github/workflows/cpw-v4-delayed-recall-h100-1285.yml',
              'cpw/LAUNCH_V4_DELAYED_RECALL_1285.json',
          } <= changed
          PY

      - name: Protect frozen scientific implementation
        run: |
          set -euo pipefail
          git diff --exit-code 6220ef98a57551a2a592429041df3e9ae650de4a HEAD -- \
            tam_research/cpw_v4_memory \
            modal_cpw_v4_memory_1275.py \
            tests/test_cpw_v4_memory_1275.py \
            tests/test_cpw_v4_run_control_1275.py \
            docs/CPW_V4_DELAYED_RECALL.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate launch authority statically
        run: |
          python -m py_compile modal_cpw_v4_memory_1275.py
          python - <<'PY'
          import json
          from pathlib import Path
          workflow=Path('.github/workflows/cpw-v4-delayed-recall-h100-1285.yml').read_text()
          cfg=json.loads(Path('cpw/LAUNCH_V4_DELAYED_RECALL_1285.json').read_text())
          assert cfg == {
              'phase':'cpw-v4-delayed-recall-one-shot-1285',
              'authority_issue':1285,
              'scientific_issue':1275,
              'preflight_issue':1281,
              'architecture_gate_run':37597773057,
              'run_control_run':37597933015,
              'import_probe_run':37598001897,
              'implementation_validation_run':37633058821,
              'namespace_scope_run':37634318217,
              'namespace_preflight_run':37634318347,
              'authorized_parent_sha':'6220ef98a57551a2a592429041df3e9ae650de4a',
          }
          required=[
              'github.run_attempt',
              'github.repository_owner',
              'git rev-parse HEAD^',
              'f6070fdd9271667c1b0eff6eb6ae45fb05c3f16b',
              'tests/test_cpw_v4_memory_1275.py',
              'tests/test_cpw_v4_run_control_1275.py',
              'MODAL_TOKEN_ID_2',
              'MODAL_TOKEN_SECRET_2',
              'modal_cpw_v4_memory_1275.py --source-sha',
              'no automatic retry',
          ]
          for token in required:
              assert token in workflow, token
          assert 'workflow_dispatch' not in workflow
          runner=Path('modal_cpw_v4_memory_1275.py').read_text()
          assert 'retries=0' in runner
          assert 'gpu="H100!"' in runner
          PY
