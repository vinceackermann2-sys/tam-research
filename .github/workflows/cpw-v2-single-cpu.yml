name: CPW-v2 single predictor zero-GPU gate

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'tam_research/cpw_v2_single/**'
      - 'tests/test_cpw_v2_single_1253.py'
      - '.github/workflows/cpw-v2-single-cpu.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install tests
        run: pip install -e '.[test]'
      - name: Protect frozen parent research
        run: |
          git diff --exit-code cac5a27c82b499b4e5de407971e08d7d5e3eaa27 HEAD --             tam_research/cpw_v1_pairwise             tests/test_cpw_v1_pairwise_1252.py             .github/workflows/cpw-v1-pairwise-cpu.yml
      - name: Single-predictor contracts
        run: |
          python -m compileall -q tam_research/cpw_v2_single
          pytest -q tests/test_cpw_v2_single_1253.py

# registration-trigger: cpw-v2-single-stage0
