name: CPW-v2 direct Modal app-id logs

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/INSPECT_V2_DIRECT_APP_ID.json'

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'modal>=1.5.4,<1.6'
      - name: Bind account2
        run: |
          printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID_2" >> "$GITHUB_ENV"
          printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET_2" >> "$GITHUB_ENV"
      - name: Read app logs by immutable app id
        run: |
          set +e
          modal app logs ap-EX4EC5nGFgNL1Fu6TC7byG --tail 300 --timestamps 2>&1 | tee app-id.log
          exit 0
      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.txt
          from pathlib import Path
          t=Path("app-id.log").read_text(errors="replace")
          if len(t)>30000: t=t[-30000:]
          print("CPW-v2 #1256 direct Modal app-id logs\n")
          print("```text")
          print(t)
          print("```")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1256/comments" -F body=@/tmp/comment.txt
