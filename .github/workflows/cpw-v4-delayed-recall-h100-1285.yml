name: CPW-v4 delayed-recall one-shot H100 benchmark

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/LAUNCH_V4_DELAYED_RECALL_1285.json'

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate frozen one-shot authority
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('cpw/LAUNCH_V4_DELAYED_RECALL_1285.json').read_text())
          assert cfg == {
              'phase':'cpw-v4-delayed-recall-one-shot-1285',
              'authority_issue':1285,
              'scientific_issue':1275,
              'preflight_issue':1281,
              'architecture_gate_run':37597773057,
              'run_control_run':37597933015,
              'import_probe_run':37598001897,
              'implementation_validation_run':37633058821,
              'namespace_scope_run':37634318217,
              'namespace_preflight_run':37634318347,
              'authorized_parent_sha':'6220ef98a57551a2a592429041df3e9ae650de4a',
          }
          PY
          AUTHORIZED_PARENT="$(python -c 'import json; print(json.load(open("cpw/LAUNCH_V4_DELAYED_RECALL_1285.json"))["authorized_parent_sha"])')"
          test "$(git rev-parse HEAD^)" = "$AUTHORIZED_PARENT"
          git diff --exit-code f6070fdd9271667c1b0eff6eb6ae45fb05c3f16b "$SOURCE_SHA" -- \
            tam_research/cpw_v4_memory \
            modal_cpw_v4_memory_1275.py \
            tests/test_cpw_v4_memory_1275.py \
            tests/test_cpw_v4_run_control_1275.py \
            docs/CPW_V4_DELAYED_RECALL.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run frozen zero-GPU contracts
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
          pip install 'modal>=1.5.4,<1.6'
          python -m compileall -q modal_cpw_v4_memory_1275.py tam_research/cpw_v4_memory
          pytest -q tests/test_cpw_v4_memory_1275.py tests/test_cpw_v4_run_control_1275.py

      - name: Bind verified account2
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID_2"
          test -n "$MODAL_TOKEN_SECRET_2"
          printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID_2" >> "$GITHUB_ENV"
          printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET_2" >> "$GITHUB_ENV"

      - name: Verify Modal authentication
        run: modal token info

      - name: Record scientific launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/launch.txt <<EOF
          CPW-v4 #1275 delayed-recall one-shot H100 launch gate passed.

          - source: `${GITHUB_SHA}`
          - authority: #1285
          - preflight: #1281 / run `37634318347`
          - smoke seed: `1273001`
          - replication seeds: `1273101,1273102,1273103`
          - retries: `0`
          - resume: `false`
          - checkpoint reuse: `false`
          - breakthrough claim: `false`
          - scale-up authority: `false`

          Launching the unchanged preregistered delayed associative recall benchmark exactly once on account2.
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1285/comments" -F body=@/tmp/launch.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1275/comments" -F body=@/tmp/launch.txt

      - name: Run one-shot delayed-recall benchmark
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v4_memory_1275.py --source-sha "${GITHUB_SHA}" | tee cpw-v4-memory.log

      - name: Record terminal result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/result.txt
          import json
          from pathlib import Path
          prefix='CPW_V4_MEMORY_RESULT='
          rows=[line.split(prefix,1)[1] for line in Path('cpw-v4-memory.log').read_text(errors='replace').splitlines() if prefix in line]
          if not rows:
              raise SystemExit('missing CPW_V4_MEMORY_RESULT terminal marker')
          result=json.loads(rows[-1])
          agg=result['aggregate']
          print('CPW-v4 #1275 delayed-recall terminal result')
          print()
          print(f"- classification: `{result['classification']}`")
          print(f"- replication integrity: `{result['replication_integrity']}`")
          print(f"- Transformer learns: `{agg['transformer_learns']}`")
          print(f"- sequence leakage alarm: `{agg['sequence_leakage_alarm']}`")
          print(f"- supported seed count: `{agg['supported_seed_count']}/3`")
          print(f"- memory supported: `{agg['memory_supported']}`")
          print(f"- strong memory supported: `{agg['strong_memory_supported']}`")
          print(f"- Transformer long mean accuracy: `{agg['transformer_long_mean_accuracy']}`")
          print(f"- sequence long mean accuracy: `{agg['sequence_long_mean_accuracy']}`")
          print(f"- WORLD_LAST1 long mean accuracy: `{agg['world_long_mean_accuracy']}`")
          print(f"- WORLD_LAST1 distance-256 accuracy: `{agg['world_distance_256_accuracy']}`")
          for arm, distances in agg.get('distance_means', {}).items():
              compact={d:{'accuracy':round(v['accuracy'],6),'nll':round(v['nll'],6)} for d,v in distances.items()}
              print(f"- {arm} per-distance: `{compact}`")
          print('- breakthrough claim authorized: `false`')
          print('- scale-up authorized: `false`')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1285/comments" -F body=@/tmp/result.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1275/comments" -F body=@/tmp/result.txt

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/failure.txt <<EOF
          CPW-v4 #1275 one-shot workflow did not return successfully for source `${GITHUB_SHA}`.

          Inspect durable `ATTEMPT.json` / `RESULT.json` / `FAILURE.json` before any further action. This launch identity is frozen; no automatic retry or resume is authorized.
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1285/comments" -F body=@/tmp/failure.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1275/comments" -F body=@/tmp/failure.txt
