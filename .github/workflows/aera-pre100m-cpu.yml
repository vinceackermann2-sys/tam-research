name: AERA pre-100M CPU validation

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: startsWith(github.event.issue.title, '[aera-pre100m-cpu]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install repository
        run: pip install -e .
      - name: Run full CPU pre-100M validation v4
        id: probe
        shell: bash
        run: |
          set -o pipefail
          python aera_pre100m_cpu_v4.py 2>&1 | tee /tmp/aera-result.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          tail -n 1 /tmp/aera-result.log > /tmp/aera-result.json
      - name: Post result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo '🧪 **AERA pre-100M CPU validation v4 complete.**'
            echo
            echo '```json'
            cat /tmp/aera-result.json
            echo '```'
            echo
            echo 'Scope: learned/synthetic mechanism and tiny integrated-model validation only. The integration task includes a dense-control validity gate. This still does not authorize a 100M run or establish GPU sparse speedup / real-language superiority.'
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/comment.md
      - name: Post failure marker with traceback
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo '❌ **AERA pre-100M CPU validation v4 failed.** Do not proceed to a 100M run.'
            echo
            echo 'Last validation log lines:'
            echo '```text'
            if [ -f /tmp/aera-result.log ]; then tail -n 120 /tmp/aera-result.log; else echo 'validation log was not created'; fi
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/comment.md
