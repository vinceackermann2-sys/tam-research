name: Phase-31 pre-authority CPU invariants

on:
  push:
    branches:
      - experiment/physics-tokenizer-phase31-recursive-damping-20260916
    paths:
      - tam_research/physics_tokenizer_phase31.py
      - tests/test_physics_tokenizer_phase31.py
      - results/physics_tokens/phase31_recursive_damping_protocol.json

permissions:
  contents: read

jobs:
  phase31-preauthority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7,<2.11'
          python -m pip install 'numpy>=2.0,<3' 'pytest>=8,<9' 'scipy>=1.10,<2'
          python -m pip install -e . --no-deps

      - name: Run Phase-31 CPU invariants
        run: python -m pytest -q tests/test_physics_tokenizer_phase31.py
