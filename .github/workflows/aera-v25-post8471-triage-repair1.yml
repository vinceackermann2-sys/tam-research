name: AERA v25 post-seed8471 checkpoint triage repair1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      startsWith(github.event.issue.title, '[aera-v25-post8471-triage-repair1]') &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - name: Refuse workflow re-run attempt
        if: github.run_attempt != 1
        run: |
          echo 'repair1 permits Actions attempt 1 only'
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check frozen repair1 diagnostic
        run: >-
          python -m py_compile
          modal_aera_v25_post8471_triage_repair1_app.py
          tam_research/aera_v25_post8471_triage_repair1.py

      - name: Install Modal
        run: pip install 'modal>=1.5,<2'

      - name: Verify launcher imports without local PyTorch
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('torch') is None, 'runner unexpectedly has torch before Modal launch'
          import modal_aera_v25_post8471_triage_repair1_app
          print('v25 issue369 repair1 launcher import OK without local torch')
          PY

      - name: Verify Modal authentication
        run: modal token info

      - name: Verify source failure and repair preregistration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repair_title=$(gh issue view 372 --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          test "$repair_title" = "[research] AERA-v25 post8471 triage repair1: bounded-memory diagnostic evaluation"
          failure_count=$(gh issue view 371 --repo "$GITHUB_REPOSITORY" --comments --json comments --jq '[.comments[] | select(.body | contains("checkpoint triage implementation/runtime failure"))] | length')
          result_count=$(gh issue view 371 --repo "$GITHUB_REPOSITORY" --comments --json comments --jq '[.comments[] | select(.body | contains("AERA-v25 post-seed8471 checkpoint triage result"))] | length')
          test "$failure_count" -ge 1
          test "$result_count" -eq 0

      - name: Refuse duplicate repair1 triage
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --jq '[.[] | select(.body | contains("AERA-v25 post-seed8471 checkpoint triage repair1 result"))] | length')
          duplicates=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 400 --json number,title --jq '[.[] | select(.title | startswith("[aera-v25-post8471-triage-repair1]"))] | length')
          if [ "$existing" -gt 0 ] || [ "$duplicates" -gt 1 ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -f body="🚫 **Duplicate issue369 repair1 triage refused.** Repair #372 permits exactly one repair1 trigger and Actions attempt 1 only. No Modal/GPU run was started by this invocation."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record repair1 hard guard
        if: steps.duplicate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          sha=$(git rev-parse HEAD)
          body="🔒 **AERA-v25 post-seed8471 checkpoint triage repair1** — frozen #369 diagnostic under implementation repair #372 after #371 OOM before any metric. Same seed8471 checkpoints, immutable corpus, diagnostic seed138471, exact batches/alphas/masks/bootstrap/adaptivity/systems conditions. Repair only: models load outside inference mode; all diagnostic families execute under inference mode; CE uses fixed 32-token time slices; literal run-attempt=1; allocator expandable segments. One L4 <=900s; checked-out main **$sha**. No training/backward/optimizer/checkpoint mutation, no threshold change, no automatic retry, no freeze/S2/replication/100M/breakthrough authorization."
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body"

      - name: Run checkpoint-only repair1 triage
        if: steps.duplicate.outputs.allowed == 'true'
        id: diagnostic
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          set +e
          modal run --timestamps modal_aera_v25_post8471_triage_repair1_app.py | tee /tmp/aera-v25-post8471-triage-repair1.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q 'AERA_V25_POST8471_TRIAGE_REPAIR1_RESULT_JSON=' /tmp/aera-v25-post8471-triage-repair1.log; then
            exit 0
          fi
          exit "$status"

      - name: Record authoritative checkpoint triage repair1 result
        if: steps.duplicate.outputs.allowed == 'true' && steps.diagnostic.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result.md
          import json
          from pathlib import Path

          marker = 'AERA_V25_POST8471_TRIAGE_REPAIR1_RESULT_JSON='
          lines = Path('/tmp/aera-v25-post8471-triage-repair1.log').read_text(errors='replace').splitlines()
          rows = [line.split(marker, 1)[1] for line in lines if marker in line]
          if not rows:
              raise SystemExit('repair1 triage result marker missing')
          r = json.loads(rows[-1])
          memory = r['memory_diagnostic']
          paired = memory['paired_statistics']['production_vs_stream_only_second_chunk']
          sweep = memory['read_scale_sweep']
          best_alpha, best_alpha_row = max(sweep.items(), key=lambda kv: kv[1]['second_chunk_advantage_vs_alpha0'])
          stage = memory['stage_read_localization']
          best_stage, best_stage_row = max(stage.items(), key=lambda kv: kv[1]['second_chunk_advantage_vs_all_zero'])
          adapt = r['adaptivity_diagnostic']['memory_enabled_hard_sparse']
          print('🔬 **AERA-v25 post-seed8471 checkpoint triage repair1 result**')
          print()
          print(f"- paired production second-chunk advantage vs stream-only: **{paired['control_minus_production_advantage_mean']:+.5f} NLL**; 95% CI for production-control **[{paired['production_minus_control_ci95_low']:+.5f}, {paired['production_minus_control_ci95_high']:+.5f}]**")
          print(f"- best read alpha: **{best_alpha}**, advantage vs alpha0 **{best_alpha_row['second_chunk_advantage_vs_alpha0']:+.5f} NLL**; production alpha1 **{sweep['1.00']['second_chunk_advantage_vs_alpha0']:+.5f}**")
          print(f"- best stage-read configuration: **{best_stage}**, advantage vs all-zero **{best_stage_row['second_chunk_advantage_vs_all_zero']:+.5f} NLL**")
          print(f"- large-sample adaptivity rho **{adapt['spearman_rho']:+.3f}**; quartiles **{adapt['quartile_compute_means_easy_to_hard']}**; Q4-Q3 **{adapt['q4_minus_q3_compute']:+.4f}**, bootstrap CI **[{adapt['q4_minus_q3_bootstrap']['ci95_low']:+.4f}, {adapt['q4_minus_q3_bootstrap']['ci95_high']:+.4f}]**")
          for bs in ('8', '64'):
              row = r['systems_diagnostic']['rows'][bs]
              print(f"- batch{bs}: core AERA/Transformer **{row['memory_bypassed_aera_vs_transformer_speed_ratio']:.3f}x**, full **{row['full_aera_vs_transformer_speed_ratio']:.3f}x**, read overhead **{row['read_path_overhead_ms']:+.2f} ms**, write overhead **{row['write_path_overhead_ms']:+.2f} ms**, full memory overhead **{row['full_incremental_memory_overhead_ms']:+.2f} ms**")
          print(f"- recommendations: **{', '.join(r['recommendations'])}**")
          print(f"- parameter versions unchanged: **{r['source_checkpoint']['parameter_versions_unchanged']}**; training/backward/optimizer/new checkpoint: **False / False / False / False**")
          print('- #368 remains scientific FAIL; this diagnostic cannot authorize freeze, replication, 100M, or breakthrough claims.')
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$(cat /tmp/result.md)"

      - name: Record repair1 triage failure
        if: failure() && steps.duplicate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="⚠️ **AERA-v25 issue369 checkpoint triage repair1 implementation/runtime failure.** This is not scientific evidence and does not change #368. No automatic retry, no new scientific seed, and no freeze/scale authorization. Stop and diagnose before any further invocation."
