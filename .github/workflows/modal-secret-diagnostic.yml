name: Modal secret diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[modal-run]')
    runs-on: ubuntu-latest
    steps:
      - name: Report safe credential presence
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          id_present=no
          secret_present=no
          id_format=no
          secret_format=no
          [ -n "$MODAL_TOKEN_ID" ] && id_present=yes
          [ -n "$MODAL_TOKEN_SECRET" ] && secret_present=yes
          [[ "$MODAL_TOKEN_ID" == ak-* ]] && id_format=yes
          [[ "$MODAL_TOKEN_SECRET" == as-* ]] && secret_format=yes
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔐 **Modal secret diagnostic** — token ID present: **${id_present}**; token secret present: **${secret_present}**; ID format ak-*: **${id_format}**; secret format as-*: **${secret_format}**. No credential values were exposed."
