name: Modal AERA v7 grouped L4 gate

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  grouped-gate:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v7-grouped-l4]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check grouped benchmark
        run: python -m py_compile modal_aera_v7_grouped_l4_gate.py
      - name: Install Modal
        run: pip install 'modal>=1.5,<2'
      - name: Verify Modal authentication
        run: modal token info
      - name: Record hard guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔒 **AERA-v7 native grouped-GEMM L4 guard** — exactly one L4; CPU preflight first; inference/microbenchmark only; no optimizer, training, checkpoint mutation, or automatic retry; hard GPU timeout=600s. Thresholds remain unchanged."
      - name: Run native grouped-GEMM L4 gate
        id: run_gate
        shell: bash
        run: |
          set -o pipefail
          modal run --timestamps modal_aera_v7_grouped_l4_gate.py | tee /tmp/aera-v7.log
      - name: Record authoritative result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result.md
          import json
          from pathlib import Path
          lines=Path('/tmp/aera-v7.log').read_text(errors='replace').splitlines()
          marker='AERA_V7_RESULT_JSON='
          rows=[line.split(marker,1)[1] for line in lines if marker in line]
          if not rows:
              raise SystemExit('result marker missing')
          r=json.loads(rows[-1])
          b1=r['results']['batch1']; b8=r['results']['batch8']
          print('📊 **AERA-v7 native grouped-GEMM L4 result**')
          print()
          print(f"- device: **{r['device']}**, torch **{r['torch_version']}**")
          print(f"- batch1 grouped lean vs dense: **{b1['grouped_lean_vs_dense']:.2f}x**")
          print(f"- batch8 grouped lean vs dense: **{b8['grouped_lean_vs_dense']:.2f}x**")
          print(f"- batch1 grouped heavy vs dense: **{b1['grouped_heavy_vs_dense']:.2f}x**")
          print(f"- batch8 grouped heavy vs dense: **{b8['grouped_heavy_vs_dense']:.2f}x**")
          print(f"- batch1 lean vs heavy: **{b1['grouped_lean_vs_heavy']:.2f}x**")
          print(f"- batch8 lean vs heavy: **{b8['grouped_lean_vs_heavy']:.2f}x**")
          print(f"- grouped lean vs v6 BMM: **{b1['grouped_lean_vs_v6_bmm']:.2f}x batch1 / {b8['grouped_lean_vs_v6_bmm']:.2f}x batch8**")
          print(f"- native hard profiles verified: **{r['checks']['native_grouped_profiles_verified']}**")
          print(f"- systems gate: **{'PASS' if r['pass'] else 'FAIL'}**")
          print()
          print('Passing this gate still does not authorize 100M; the small real-language matched gate remains mandatory.')
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$(cat /tmp/result.md)"
      - name: Record workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          tail -n 80 /tmp/aera-v7.log 2>/dev/null > /tmp/tail.txt || true
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="❌ **AERA-v7 grouped L4 workflow failed.** No automatic retry was attempted. Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
