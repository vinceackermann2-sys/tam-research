name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: pip install -e '.[test]'
      - name: Syntax-check Modal launchers
        run: python -m py_compile modal_*_app.py
      - name: SI PCMA history screen (development only, nonconfirmatory)
        if: github.head_ref == 'experiment/si-pcma-v1-history-information-gate-20261019'
        run: python -m tam_research.si_pcma_v1_history_information
      - name: Install pinned external POPGym memory benchmark (this PR only)
        if: github.head_ref == 'experiment/si-pcma-v1-published-memory-controls-20261019'
        run: pip install 'popgym==1.0.7'
      - name: POPGym published memory-positive control (nonconfirmatory)
        if: github.head_ref == 'experiment/si-pcma-v1-published-memory-controls-20261019'
        run: python -m tam_research.si_pcma_v1_published_memory
      - name: Run original SI hybrid vs Transformer POPGym CPU pilot (nonconfirmatory)
        if: github.head_ref == 'experiment/si-pcma-v1-popgym-neural-pilot-20261019'
        run: python -m tam_research.si_pcma_v1_popgym_neural_pilot
      - name: Run tests
        run: pytest -q
