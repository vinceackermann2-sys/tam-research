name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: pip install -e '.[test]'
      - name: Syntax-check Modal launchers
        run: python -m py_compile modal_*_app.py
      - name: Original user-architecture integrated fidelity checks (engineering only)
        if: github.head_ref == 'experiment/si-original-full-architecture-integration-v1-20261019'
        run: pytest -q tests/test_si_original_integrated_v1.py
      - name: Original SI integrated cross-modal learning pilot (fixed CPU developer data)
        if: github.head_ref == 'experiment/si-original-crossmodal-learning-v1-20261019'
        run: python -m tam_research.si_original_crossmodal_learning_v1
      - name: Original SI cross-modal data leakage and training parity tests
        if: github.head_ref == 'experiment/si-original-crossmodal-learning-v1-20261019'
        run: pytest -q tests/test_si_original_integrated_v1.py tests/test_si_original_crossmodal_learning_v1.py
      - name: Run tests
        run: pytest -q
