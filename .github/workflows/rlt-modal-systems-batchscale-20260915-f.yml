name: RLT Modal systems batch-scale 20260915 F

on:
  push:
    branches:
      - exp/rlt-colab
    paths:
      - .github/workflows/rlt-modal-systems-batchscale-20260915-f.yml

permissions:
  contents: write

concurrency:
  group: rlt-modal-systems-batchscale-20260915-f
  cancel-in-progress: false

jobs:
  systems:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-batchscale-modal-20260915-f
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-batchscale-modal-20260915-f.json
      PRIOR_D_PATH: experiments/rlt/modal/results/rlt-systems-compile-modal-20260915-d.json
      PRIOR_E_PATH: experiments/rlt/modal/results/rlt-systems-batched-head-modal-20260915-e.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-batchscale-20260915-f.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-batchscale-modal-20260915-f.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-batchscale-modal-20260915-f.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse any previously claimed or completed F attempt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          echo "JOB_BLOB_SHA=$JOB_BLOB_SHA" >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" > /tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-systems-batchscale-modal-20260915-f',
            'task':'systems_batchscale_profile',
            'engineering_seed':20260928,
            'seq_len':64,
            'batch_size':16,
            'prior_systems_job_id':'rlt-systems-compile-modal-20260915-d',
            'prior_batched_head_job_id':'rlt-systems-batched-head-modal-20260915-e',
            'scientific_execution':False,
            'automatic_retry':False,
          }, j
          PY

      - name: Require D PASS and E frozen failure
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$PRIOR_D_PATH" > /tmp/d.json
          git show "origin/$BRANCH:$PRIOR_E_PATH" > /tmp/e.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/d.json')); e=json.load(open('/tmp/e.json'))
          assert d.get('status')=='complete'
          assert d.get('classification')=='PASS_MATERIAL_COMPILE_SPEEDUP'
          assert d.get('scientific_execution') is False
          assert d['semantic_equivalence']['passed'] is True
          assert d['semantic_equivalence']['logits_max_abs']==0.0
          assert d['semantic_equivalence']['loss_abs']==0.0
          assert d['semantic_equivalence']['grad_max_abs']==0.0
          assert e.get('status')=='complete'
          assert e.get('classification')=='FAIL_SEMANTIC_EQUIVALENCE'
          assert e.get('scientific_execution') is False
          PY

      - name: Verify Modal GitHub secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"

      - name: Install pinned Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5.4,<1.6'

      - name: Validate batch-scale profiler locally
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/rlt/modal_preflight.py experiments/rlt/modal_batchscale_profile_f.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/modal_batchscale_profile_f.py').read_text()
          assert 'ENGINEERING_SEED = 20260928' in s
          assert 'BATCH_SIZE = 16' in s
          assert 'SEQ_LEN = 64' in s
          assert 'fullgraph=True' in s
          assert 'mode="default"' in s
          assert 'retries=0' in s
          assert 'train_rlt' not in s and 'datasets' not in s.lower()
          PY

      - name: Run non-GPU Modal control-plane preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          export P
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['P'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False
          p.update({'classification':'RLT_BATCHSCALE_SYSTEMS_F_ZERO_GPU_PREFLIGHT_PASS','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA']})
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit preflight before GPU
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt systems: record batch-scale preflight f'
          git push origin "HEAD:$BRANCH"

      - name: Create and commit one-shot F claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          payload={'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'engineering_only':True,'scientific_execution':False,'automatic_retry_authorized':False,'job':json.load(open(os.environ['JOB_PATH']))}
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100 profiling"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal A100 F systems attempt
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 25m modal run experiments/rlt/modal_batchscale_profile_f.py::main 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_BATCHSCALE_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize terminal F result without retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); payload=None
          if b:
            try: payload=json.loads(base64.urlsafe_b64decode(b.encode()))
            except Exception: payload=None
          if not isinstance(payload,dict):
            log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
            payload={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),'worker':'github-actions-modal','engineering_only':True,'scientific_execution':False,'error_type':'ModalInvocationOrTransportError','error':f'Modal CLI rc={rc}; no parseable terminal payload','log_tail':log[-5000:],'scientific_conclusion':None}
          payload.update({'job_id':os.environ['JOB_ID'],'modal_cli_rc':rc,'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA']})
          p=pathlib.Path(os.environ['RESULT_PATH']); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git push origin "HEAD:$BRANCH"

      - name: Summarize F outcome
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH'])); print(json.dumps(r,indent=2,sort_keys=True))
          assert r.get('scientific_execution') is False
          if r.get('status')!='complete' or not str(r.get('classification','')).startswith('PASS_'): raise SystemExit(1)
          PY
