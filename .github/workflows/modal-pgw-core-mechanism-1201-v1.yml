name: PGW core local-predictor attribution panel v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  pgw_core:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[modal-pgw-core-mechanism-1201-v1]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_SECONDARY: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
      MODAL_TOKEN_SECRET_SECONDARY: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_LOW_CREDIT_ACCOUNT: ${{ secrets.MODAL_LOW_CREDIT_ACCOUNT }}
      MODAL_MAX_THROTTLE_WAIT: "0"

    steps:
      - name: Validate immutable core trigger
        id: cfg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          cfg = json.loads(os.environ.get("ISSUE_BODY") or "{}")
          assert set(cfg) == {
              "phase", "prereg_issue", "run_control_issue", "source_sha"
          }
          assert cfg["phase"] == "pgw-core-mechanism-panel-1201-v1"
          assert cfg["prereg_issue"] == 1201
          assert cfg["run_control_issue"] == 1204
          source = str(cfg["source_sha"]).lower()
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          repo = os.environ["GITHUB_REPOSITORY"]
          title = "[modal-pgw-core-mechanism-1201-v1]"
          q = f'repo:{repo} is:issue in:title "{title}"'
          found = json.loads(subprocess.check_output(
              ["gh", "api", "search/issues", "-X", "GET",
               "-f", f"q={q}", "-f", "per_page=100"],
              text=True,
          ))
          exact = [item for item in found["items"] if item["title"] == title]
          trigger = int(os.environ["TRIGGER_NUMBER"])
          assert len(exact) == 1 and exact[0]["number"] == trigger, exact
          print(f"source_sha={source}")
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch before importing panel
        run: pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install repository test dependencies
        run: pip install -e '.[test]'

      - name: Verify protected panel and live-main source
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          PROTECTED="97432fc5fe36ec9a1ccbeef74c545f8713b9a475"
          git merge-base --is-ancestor "$PROTECTED" "$SOURCE_SHA"
          PROTECTED_PATHS=(
            tam_research/pgw_v1
            tam_research/pgw_v2
            tam_research/pgw_v2_mechanism
            tam_research/pgw_core_mechanism
            tam_research/models.py
            tam_research/train.py
            tam_research/data.py
            tests/test_pgw_v1_1159.py
            tests/test_pgw_v2_1168.py
            tests/test_pgw_v2_mechanism_1181.py
            tests/test_pgw_core_mechanism_1201.py
          )
          git diff --exit-code "$PROTECTED" "$SOURCE_SHA" -- "${PROTECTED_PATHS[@]}"
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$SOURCE_SHA" "$LIVE_MAIN"
          git diff --exit-code "$SOURCE_SHA" "$LIVE_MAIN" -- "${PROTECTED_PATHS[@]}"
          python - <<'PY'
          from tam_research.pgw_core_mechanism.protocol import (
              ARMS,
              EFFECT_THRESHOLD_NLL,
              EXPECTED_PARAMETERS,
              ISSUE,
              REPLICATION_SEEDS,
              RESULT_ROOT,
              SMOKE_SEED,
          )
          assert ISSUE == 1201
          assert SMOKE_SEED == 1200001
          assert REPLICATION_SEEDS == (1200101, 1200102, 1200103)
          assert RESULT_ROOT == "/vol/pgw-v2/local-predictor-panel-v1"
          assert EXPECTED_PARAMETERS == 24940288
          assert EFFECT_THRESHOLD_NLL == 0.005
          assert ARMS == (
              "transformer",
              "chunk_local_256",
              "local224_predictor_carry",
              "local224_predictor_reset",
              "local224_only",
          )
          PY

      - name: Run core mechanism zero-GPU contracts
        run: pytest -q tests/test_pgw_core_mechanism_1201.py tests/test_pgw_core_mechanism_run_control_1204.py

      - name: Install pinned Modal CLI
        run: pip install 'modal>=1.5.4,<1.6'

      - name: Select an eligible Modal account
        id: account
        run: |
          PYTHONPATH="$PWD" python scripts/modal_select_account_v3.py             --required-volume tam-research-data             --runtime-probe-path modal_runtime_admission_probe_1067_v1.py

      - name: Activate selected Modal account
        env:
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
          SECONDARY_CREDENTIAL_ALIASES: ${{ steps.account.outputs.secondary_credential_aliases }}
        run: |
          set -euo pipefail
          if [ "$SELECTED_MODAL_ACCOUNT" = "primary" ]; then
            printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET" >> "$GITHUB_ENV"
          elif [ "$SELECTED_MODAL_ACCOUNT" = "secondary" ]; then
            case ",$SECONDARY_CREDENTIAL_ALIASES," in
              *,secondary,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_SECONDARY"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_SECONDARY"
                ;;
              *,account2,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_2"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_2"
                ;;
              *,legacy_b,*)
                SECONDARY_ID="$MODAL_TOKEN_ID_B"
                SECONDARY_SECRET="$MODAL_TOKEN_SECRET_B"
                ;;
              *)
                echo "No resolved secondary credential alias" >&2
                exit 93
                ;;
            esac
            test -n "$SECONDARY_ID"
            test -n "$SECONDARY_SECRET"
            printf 'MODAL_TOKEN_ID=%s\n' "$SECONDARY_ID" >> "$GITHUB_ENV"
            printf 'MODAL_TOKEN_SECRET=%s\n' "$SECONDARY_SECRET" >> "$GITHUB_ENV"
          else
            echo "No eligible Modal account selected" >&2
            exit 92
          fi

      - name: Verify selected Modal authentication
        run: modal token info

      - name: Record authenticated core launch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          SELECTED_MODAL_ACCOUNT: ${{ steps.account.outputs.selected_account }}
        run: |
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"             -f body="PGW core launcher passed CPU contracts. Modal account=${SELECTED_MODAL_ACCOUNT}; source=${SOURCE_SHA}. Launching one-shot five-arm H100 smoke -> conditional replication."

      - name: Run one-shot PGW core mechanism panel
        env:
          SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
        run: |
          modal run --timestamps modal_pgw_core_mechanism_1201_app.py             --source-sha "$SOURCE_SHA"

      - name: Record normal Modal return
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"             -f body="PGW core Modal call returned normally. Authoritative payload: PGW_CORE_MECHANISM_RESULT in Actions and RESULT.json on the Modal volume."
