name: RLT Modal cross-data block4 4M AB evaluation 20260930 A

on:
  push:
    branches:
      - exp/rlt-colab
    paths:
      - .github/workflows/rlt-modal-crossdata-block4-4m-ab-20260930-a.yml

permissions:
  contents: write

concurrency:
  group: rlt-modal-crossdata-block4-4m-ab-20260930-a
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-crossdata-block4-4m-ab-modal-20260930-a
      JOB_PATH: experiments/rlt/modal/jobs/rlt-crossdata-block4-4m-ab-modal-20260930-a.json
      EVAL_PATH: experiments/rlt/eval_crossdata_block4_4m_ab.py
      LAUNCHER_PATH: experiments/rlt/modal_crossdata_block4_4m_ab.py
      A_PATH: experiments/rlt/modal/results/rlt-block4-scale15m-paired-4m-modal-20260929-a.json
      B_PATH: experiments/rlt/modal/results/rlt-block4-scale15m-paired-4m-modal-20260930-b.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-crossdata-block4-4m-ab-20260930-a.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-crossdata-block4-4m-ab-modal-20260930-a.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-crossdata-block4-4m-ab-modal-20260930-a.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse any previously claimed or completed evaluation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          EVAL_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$EVAL_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          echo "JOB_BLOB_SHA=$JOB_BLOB_SHA" >> "$GITHUB_ENV"
          echo "EVAL_BLOB_SHA=$EVAL_BLOB_SHA" >> "$GITHUB_ENV"
          echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA" >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" > /tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-crossdata-block4-4m-ab-modal-20260930-a',
            'task':'crossdata_block4_4m_ab',
            'requires_checkpoint_job_ids':[
              'rlt-block4-scale15m-paired-4m-modal-20260929-a',
              'rlt-block4-scale15m-paired-4m-modal-20260930-b',
            ],
            'fresh_data_seed':20260930,
            'eval_target_tokens_per_pair':1048576,
            'eval_batches':256,
            'batch_size':64,
            'seq_len':64,
            'fresh_train_tokens':100000,
            'fresh_val_tokens':1100000,
            'checkpoint_volume_a':'tam-rlt-block4-scale15m-checkpoints-account2',
            'checkpoint_volume_b':'tam-rlt-block4-scale15m-checkpoints-b-account2',
            'automatic_retry':False,
          }, j
          PY

      - name: Require durable block4 A B checkpoints and two-run quality penalty
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$A_PATH" > /tmp/a.json
          git show "origin/$BRANCH:$B_PATH" > /tmp/b.json
          python - <<'PY'
          import json
          rows=[json.load(open('/tmp/a.json')),json.load(open('/tmp/b.json'))]
          ids=[
            'rlt-block4-scale15m-paired-4m-modal-20260929-a',
            'rlt-block4-scale15m-paired-4m-modal-20260930-b',
          ]
          for expected_id,r in zip(ids,rows):
              assert r.get('job_id')==expected_id,r
              assert r.get('status')=='complete',r
              c=r.get('comparison')
              assert isinstance(c,dict) and c.get('status')=='complete',c
              assert c.get('classification')=='PAIRED_BLOCK4_SCALE15M_4M_NO_RLT_QUALITY_ADVANTAGE',c
              assert c.get('breakthrough_claim_supported') is False,c
              assert float(c['derived']['rlt_minus_transformer_final_nll'])>0.0,c
              assert c.get('semantic_equivalence',{}).get('passed') is True,c
              assert r.get('exact_parameter_match_verified') is True,r
              assert r.get('data_hashes_match_claim') is True,r
              assert r.get('checkpoint_durability',{}).get('modal_volume_committed') is True,r
              assert r.get('checkpoint_export',{}).get('github_artifact_upload_outcome')=='success',r
          PY

      - name: Select Modal account 2 and install CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'modal>=1.5.4,<1.6'
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"; SLOT="2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"; SLOT="B"
          else
            ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"; SLOT="A"
          fi
          test -n "$ID"; test -n "$SECRET"
          echo "MODAL_TOKEN_ID=$ID" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "MODAL_ACCOUNT_SLOT=$SLOT" >> "$GITHUB_ENV"

      - name: Validate cross-data 4M AB sources locally
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/rlt/modal_preflight.py "$EVAL_PATH" "$LAUNCHER_PATH"
          python - <<'PY'
          from pathlib import Path
          e=Path('experiments/rlt/eval_crossdata_block4_4m_ab.py').read_text()
          m=Path('experiments/rlt/modal_crossdata_block4_4m_ab.py').read_text()
          assert 'DATA_SEED = 20_260_930' in e
          assert 'EVAL_BATCHES = 256' in e
          assert 'BATCH_SIZE = 64' in e
          assert 'BLOCK_SIZE = 4' in e
          assert 'rlt-block4-scale15m-paired-4m-modal-20260929-a' in e
          assert 'rlt-block4-scale15m-paired-4m-modal-20260930-b' in e
          assert 'CROSSDATA_BLOCK4_4M_AB_BOTH_RLT_HIGHER_NLL' in e
          assert '"breakthrough_claim_supported": False' in e
          assert 't95_ci_pair_delta_nll_df1' in e
          assert 'create_if_missing=False' in m
          assert 'retries=0' in m and 'gpu="A100"' in m
          assert 'seed=job["fresh_data_seed"]' in m
          assert 'RLT_CROSSDATA_BLOCK4_4M_AB_RESULT_B64=' in m
          PY

      - name: Run non-GPU Modal preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          export P
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['P'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_CROSSDATA_BLOCK4_4M_AB_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'evaluator_blob_sha':os.environ['EVAL_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'scientific_execution':False,
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH'])
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit durable preflight before GPU
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt crossdata block4 4m ab: record zero-GPU preflight'
          git push origin "HEAD:$BRANCH"

      - name: Create and commit one-shot evaluation claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          p=pathlib.Path(os.environ['CLAIM_PATH'])
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'schema':1,
            'job_id':os.environ['JOB_ID'],
            'status':'claimed',
            'claimed_unix':time.time(),
            'worker':'github-actions-modal',
            'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'evaluator_blob_sha':os.environ['EVAL_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'fresh_data_seed':20260930,
            'automatic_retry_authorized':False,
            'job':json.load(open(os.environ['JOB_PATH'])),
          },indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt crossdata block4 4m ab: claim $JOB_ID before A100 evaluation"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal A100 cross-data 4M AB evaluation
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 55m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_CROSSDATA_BLOCK4_4M_AB_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize terminal evaluation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64','')
          rc=int(os.environ.get('MODAL_RC','999'))
          payload=None
          if b:
              try: payload=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception: payload=None
          if not isinstance(payload,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              payload={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed',
                       'finished_unix':time.time(),'worker':'github-actions-modal',
                       'error_type':'ModalInvocationOrTransportError',
                       'error':f'Modal CLI rc={rc}; no parseable terminal payload',
                       'log_tail':log[-6000:],'scientific_conclusion':None}
          payload.update({
            'modal_cli_rc':rc,
            'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'evaluator_blob_sha':os.environ['EVAL_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
          })
          p=pathlib.Path(os.environ['RESULT_PATH'])
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt crossdata block4 4m ab: record $JOB_ID terminal result"
          git push origin "HEAD:$BRANCH"

      - name: Summarize cross-data 4M AB outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          e=r.get('evaluation')
          if not isinstance(e,dict) or e.get('status')!='complete': raise SystemExit(1)
          if e.get('breakthrough_claim_supported') is not False: raise SystemExit(1)
          if e.get('classification') not in {
              'CROSSDATA_BLOCK4_4M_AB_BOTH_RLT_HIGHER_NLL',
              'CROSSDATA_BLOCK4_4M_AB_MEAN_RLT_HIGHER_NLL_MIXED',
              'CROSSDATA_BLOCK4_4M_AB_NO_QUALITY_PENALTY',
          }: raise SystemExit(1)
          print('classification:',e['classification'])
          print('pair deltas:',[x['rlt_minus_transformer_nll'] for x in e['pairs']])
          print('mean delta:',e['aggregate_across_model_seeds']['mean_rlt_minus_transformer_nll'])
          print('2-seed t95 CI:',e['aggregate_across_model_seeds']['t95_ci_pair_delta_nll_df1'])
          PY
