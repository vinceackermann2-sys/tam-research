name: Modal TAM budget-tail posttrain

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  tail:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[modal-tail]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "modal>=1.1,<2"
      - run: modal token info
      - name: Launch tiny eager SFT+DPO continuation
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          modal run --detach --timestamps modal_posttrain_tail_app.py \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"
      - name: Record handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **Budget-tail handoff completed.** One 55s-max H100 job only; no compile or pretraining."
