name: AERA v26.8 issue597 read-only issue594 result inspector

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect-existing-result:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-8-issue597-readonly-issue594-result-inspector]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue597 read-only inspector
        run: python -m py_compile modal_aera_v26_8_issue597_readonly_issue594_result_inspector.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify canonical CPU-only issue597 inspection boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/597" --jq '.title')" = "[research] AERA-v26.8 read-only full #594 post-read amplification result inspector after authoritative #596"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/597" --jq '.state')" = "open"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/596" --jq '.title')" = "[aera-v26-8-issue594-stage0-post-read-amplification-localizer-l4] sole diagnostic"

          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue597-readonly-issue594-result-inspector]")) | .number' \
              | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bind_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bind_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bind_lines}" | sed -n '1p')"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor a6515564aef1738b6dc95cc50102a432751be24e HEAD

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33772104621" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33772104621" --jq '.head_sha')" = "a6515564aef1738b6dc95cc50102a432751be24e"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33772104621" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33772104621" --jq '.path')" = ".github/workflows/aera-v26-8-issue594-stage0-post-read-amplification-localizer-l4.yml"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100704667286" --jq '.conclusion')" = "success"

          test "$(git hash-object tam_research/aera_v26_8_issue594_stage0_post_read_amplification_localizer.py)" = "2b72454ea74929ac7254cfc399bb2ab201dfc2cb"
          test "$(git hash-object modal_aera_v26_8_issue594_stage0_post_read_amplification_localizer_app.py)" = "4b4d0d4640f6638e410d89fe4256e1aa868e8a4f"
          test "$(git hash-object .github/workflows/aera-v26-8-issue594-stage0-post-read-amplification-localizer-l4.yml)" = "29895f8f60207507488f70ce9f2e1b9ce3c91510"
          test "$(git hash-object tests/test_aera_v26_8_issue594_stage0_post_read_amplification_localizer_cpu.py)" = "80c3c427cc2e7f0eea12550276e71262d24fba51"

          grep -q 'SOURCE_RESULT_PATH = "/vol/aera-v26/issue594-stage0-post-read-amplification-localizer/result.json"' modal_aera_v26_8_issue597_readonly_issue594_result_inspector.py
          grep -q 'SOURCE_RESULT_SHA256 = "c950d8fa50e70a48ec64a87f860d70d854cf1a2b58e1acbdfbcb0052495e809e"' modal_aera_v26_8_issue597_readonly_issue594_result_inspector.py
          test "$(grep -c 'gpu=' modal_aera_v26_8_issue597_readonly_issue594_result_inspector.py || true)" = "0"
          test "$(grep -c 'volume.commit' modal_aera_v26_8_issue597_readonly_issue594_result_inspector.py || true)" = "0"
          echo "bound_main=${bound_main}" >> "$GITHUB_OUTPUT"

      - name: Record issue597 inspection start (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.8 #597 read-only #594 result inspection started** — immutable #596 authority and exact result SHA contract verified. CPU-only reader; zero model/checkpoint execution and no volume mutation." || true

      - name: Recheck canonical trigger immediately before Modal
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t eligible < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-8-issue597-readonly-issue594-result-inspector]")) | .number' \
              | sort -n
          )
          test "${#eligible[@]}" -ge "1"
          test "${TRIGGER_ISSUE}" = "${eligible[0]}"
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.bound_main }}"

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Inspect immutable issue594 durable result once
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          modal run modal_aera_v26_8_issue597_readonly_issue594_result_inspector.py 2>&1 | tee /tmp/issue597.log
          test "$(grep -c '^AERA_V26_8_ISSUE597_READONLY_ISSUE594_RESULT_INSPECTOR_JSON=' /tmp/issue597.log)" = "1"

      - name: Record issue597 inspection result (best effort)
        if: steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >/tmp/issue597-summary.md
          import json
          from pathlib import Path
          prefix = "AERA_V26_8_ISSUE597_READONLY_ISSUE594_RESULT_INSPECTOR_JSON="
          lines = Path('/tmp/issue597.log').read_text().splitlines()
          payload = json.loads([line[len(prefix):] for line in lines if line.startswith(prefix)][-1])
          print('🔎 **AERA-v26.8 #597 read-only #594 full-boundary inspection**')
          print()
          print(f"Source SHA: `{payload['source_result_sha256']}`; decision: `{payload['source_decision']}`.")
          for batch in ('8', '64'):
              row = payload['batches'][batch]
              first_discrete = row['first_discrete_decision_difference']
              discrete_name = None if first_discrete is None else first_discrete['name']
              print(f"Batch {batch}: first bitwise `{row['first_bitwise_difference']['name']}` -> first integrated failure `{row['first_integrated_tolerance_or_metadata_failure']['name']}` -> first discrete `{discrete_name}`.")
              print(f"Batch {batch}: boundary indices `{json.dumps(row['boundary_indices'], sort_keys=True)}`, failures `{row['failure_names_execution_order']}`, stored boundaries `{row['boundary_count']}`.")
          print()
          print('Read-only extraction only. No numerical comparison was recomputed and no repair or higher scientific authorization follows.')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/issue597-summary.md)" || true
