name: RLT systems exact15M batch768 20260925 M

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-scale15m-batch768-20260925-m.yml

permissions:
  contents: write

concurrency:
  group: rlt-systems-scale15m-batch768-20260925-m
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-scale15m-batch768-modal-20260925-m
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-scale15m-batch768-modal-20260925-m.json
      LAUNCHER_PATH: experiments/rlt/modal_scale15m_batch768_profile_m.py
      SCALE_A_PATH: experiments/rlt/modal/results/rlt-exact15m-fineweb-4m-modal-20260925-a.json
      SCALE_B_PATH: experiments/rlt/modal/results/rlt-scale15m-paired-4m-modal-20260925-b.json
      LONG_A_PATH: experiments/rlt/modal/results/rlt-scale15m-paired-16m-modal-20260925-a.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-scale15m-batch768-20260925-m.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-scale15m-batch768-modal-20260925-m.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-scale15m-batch768-modal-20260925-m.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed engineering attempt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,'job_id':'rlt-systems-scale15m-batch768-modal-20260925-m',
            'task':'systems_scale15m_batch768_m','engineering_seed':20261018,
            'requires_scale4m_a_job_id':'rlt-exact15m-fineweb-4m-modal-20260925-a',
            'requires_scale4m_b_job_id':'rlt-scale15m-paired-4m-modal-20260925-b',
            'requires_scale16m_a_job_id':'rlt-scale15m-paired-16m-modal-20260925-a',
            'batch_size':768,'seq_len':64,'expected_parameters_each':15129344,
            'automatic_retry':False,
          },j
          PY

      - name: Require replicated exact15M quality evidence
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$SCALE_A_PATH" >/tmp/a.json
          git show "origin/$BRANCH:$SCALE_B_PATH" >/tmp/b.json
          git show "origin/$BRANCH:$LONG_A_PATH" >/tmp/l.json
          python - <<'PY'
          import json
          rows=[json.load(open('/tmp/a.json')),json.load(open('/tmp/b.json'))]
          ids=['rlt-exact15m-fineweb-4m-modal-20260925-a','rlt-scale15m-paired-4m-modal-20260925-b']
          seeds=[20261014,20261015]
          for r,jid,seed in zip(rows,ids,seeds):
              assert r.get('job_id')==jid and r.get('status')=='complete',r
              assert r.get('exact_parameter_match_verified') is True,r
              c=r.get('comparison'); assert isinstance(c,dict) and c.get('status')=='complete',c
              assert c.get('scientific_seed')==seed,c
              assert float(c['derived']['rlt_minus_transformer_final_nll'])<0.0,c
              s=c['scale_test']
              assert s['rlt_parameters']==15129344 and s['transformer_parameters']==15129344 and s['parameter_delta']==0,s
          l=json.load(open('/tmp/l.json'))
          assert l.get('job_id')=='rlt-scale15m-paired-16m-modal-20260925-a' and l.get('status')=='complete',l
          assert l.get('exact_parameter_match_verified') is True,l
          lc=l.get('comparison'); assert isinstance(lc,dict) and lc.get('status')=='complete',lc
          assert lc.get('classification')=='PAIRED_SCALE15M_16M_RLT_LOWER_NLL_SINGLE_RUN_HINT',lc
          assert float(lc['derived']['rlt_minus_transformer_final_nll'])<0.0,lc
          PY

      - name: Install Modal
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'modal>=1.5.4,<1.6'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Validate exact15M batch768 source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$LAUNCHER_PATH"
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/modal_scale15m_batch768_profile_m.py').read_text()
          for x in [
            'JOB_ID = "rlt-systems-scale15m-batch768-modal-20260925-m"',
            'ENGINEERING_SEED = 20_261_018','BATCH_SIZE = 768','SEQ_LEN = 64',
            'EXPECTED_PARAMETERS = 15_129_344','d_model=256','n_stages=2',
            'n_layers=3','ff_inner=938','gpu="A100-80GB"','retries=0',
            'RLT_SYSTEMS_SCALE15M_BATCH768_RESULT_B64=',
          ]: assert x in s,x
          vocab=50257; d=256; max_seq=128
          rlt=vocab*d+max_seq*d
          per_stage=d+3*d*d+d*d+d+d*d+2*d*d+d*d+d+2*d*(4*d)
          rlt += 2*per_stage + d + 2*d*d + d + d + d
          tr=vocab*d+max_seq*d + 3*(4*d+4*d*d+2*d*938) + 2*d
          assert rlt==tr==15129344,(rlt,tr)
          PY

      - name: Run non-GPU Modal control-plane preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit engineering preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_SYSTEMS_SCALE15M_BATCH768_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_only':True,'scientific_execution':False,
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt systems: record exact15m batch768 zero-GPU preflight'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Claim one-shot paid engineering attempt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          payload={
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_seed':20261018,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'engineering_only':True,'scientific_execution':False,'automatic_retry_authorized':False,
            'job':json.load(open(os.environ['JOB_PATH'])),
          }
          p=pathlib.Path(os.environ['CLAIM_PATH']);p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100-80GB profile"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal A100-80GB profile
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 65m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_SYSTEMS_SCALE15M_BATCH768_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize durable systems result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception:p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                 'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                 'error':f'Modal CLI rc={rc}; no parseable terminal payload','log_tail':log[-6000:],
                 'scientific_conclusion':None}
          p.update({'modal_cli_rc':rc,'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
                    'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
                    'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT']})
          out=pathlib.Path(os.environ['RESULT_PATH']);out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize systems outcome
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          assert r.get('semantic_equivalence',{}).get('passed') is True,r
          assert r['rlt']['parameters']==15129344 and r['transformer']['parameters']==15129344,r
          print('classification:',r['classification'])
          print('RLT tok/s:',r['rlt']['tokens_per_second'])
          print('Transformer tok/s:',r['transformer']['tokens_per_second'])
          print('gap:',r['derived']['transformer_throughput_multiple_vs_rlt'])
          print('RLT peak GB:',r['rlt']['peak_vram_gb'])
          PY
