name: Modal matched long-context state eval

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  evaluate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[modal-longstate100m]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check evaluator
        run: python -m py_compile modal_long_context_state_eval_app.py

      - name: Install Modal
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication
        run: modal token info

      - name: Materialize short-lived GitHub callback secret
        run: modal secret create --force github-secret GITHUB_TOKEN="$GITHUB_TOKEN"

      - name: Record evaluation guard
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🔒 **Long-context/state eval guard** — final TAM and matched Transformer DPO checkpoints only; synthetic paired trials, no optimizer, no weight updates, no training. CPU Volume preflight runs before one L4 is allocated. L4 timeout=1,800s; no automatic retry. Contexts >512 are explicitly treated as extrapolation."

      - name: Run matched long-context state evaluation
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: modal run --timestamps modal_long_context_state_eval_app.py --repo-full-name "$GITHUB_REPOSITORY" --issue-number "$ISSUE_NUMBER"

      - name: Record evaluation failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="❌ **Long-context/state eval workflow failed.** No automatic retry was attempted. Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
