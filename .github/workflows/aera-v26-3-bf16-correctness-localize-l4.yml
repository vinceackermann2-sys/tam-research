name: AERA v26.3 issue423 BF16 correctness localization

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: aera-v26-3-issue423-bf16-correctness-localize
  cancel-in-progress: false

jobs:
  localize:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-bf16-correctness-localize-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue423 launcher
        run: python -m py_compile modal_aera_v26_3_bf16_correctness_localize_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue423 one-attempt localization boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Issue #423 permits Actions attempt 1 only; no workflow retry." >&2
            exit 1
          fi

          prereg_title="$(gh api "repos/${GITHUB_REPOSITORY}/issues/423" --jq '.title')"
          test "${prereg_title}" = "[research] AERA-v26.3 post-#418 BF16 correctness localization: exact failed-row diagnostic only"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/418" --jq '.state')" = "closed"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/422" --jq '.state')" = "closed"
          run422_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33499743719" --jq '.conclusion')"
          run422_attempt="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33499743719" --jq '.run_attempt')"
          test "${run422_conclusion}" = "failure"
          test "${run422_attempt}" = "1"

          failure_evidence_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/422/comments?per_page=100" \
              --jq '.[] | select(.body | contains("correctness failed for bfloat16_batch8_mixed")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${failure_evidence_count}" -ge 1

          trigger_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-bf16-correctness-localize-l4]")) | .number' \
              | wc -l | tr -d ' '
          )"
          if [ "${trigger_count}" != "1" ]; then
            echo "Expected exactly one issue423 localization trigger, found ${trigger_count}." >&2
            exit 1
          fi

          result_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("🔬 **AERA-v26.3 #423 BF16 correctness localization**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${result_comment_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(
            printf '%s\n' "${event_body}" \
              | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' \
              | head -n 1
          )"
          if [ -z "${bound_main}" ]; then
            echo "Trigger must contain exact Bind main line." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 7a10d91258f7daa0247369554533e3b2f6445bad HEAD

          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "e8ab9778fe3f3b853e6b18327cbea2c73250624c"
          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test -f tam_research/aera_v26_3_bf16_correctness_localize.py
          test -f modal_aera_v26_3_bf16_correctness_localize_app.py
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record frozen issue423 guard (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          body="🔒 **AERA-v26.3 #423 localization gate** — checked-out main **${head_sha}**. This only localizes the accepted #418/#422 `bfloat16_batch8_mixed` correctness FAIL. Frozen Triton backend and #418 probe blobs are unchanged. Exact original fixture stream, BF16 tolerance 1e-2/1e-2, one NVIDIA L4 <=180 GPU seconds, Actions attempt 1 only. No timing/performance claim, model/checkpoint/corpus/training/scientific seed/freeze/S2/100M/breakthrough authorization."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}" || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue423 BF16 localization
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_bf16_correctness_localize_app.py 2>&1 | tee /tmp/aera-v26-3-issue423-bf16-localize.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE423_BF16_CORRECTNESS_LOCALIZE_RESULT_JSON=' /tmp/aera-v26-3-issue423-bf16-localize.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue423 localization (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result-comment.md
          import json
          from pathlib import Path
          lines = Path('/tmp/aera-v26-3-issue423-bf16-localize.log').read_text(errors='replace').splitlines()
          marker = 'AERA_V26_ISSUE423_BF16_CORRECTNESS_LOCALIZE_SUMMARY_JSON='
          rows = [line[len(marker):] for line in lines if line.startswith(marker)]
          if not rows:
              raise SystemExit('issue423 summary marker missing')
          p = json.loads(rows[-1])
          out = [
              '🔬 **AERA-v26.3 #423 BF16 correctness localization**',
              '',
              f'- row: **{p["target_row"]}** on **{p["device"]}**',
              f'- failed subgates: **{p["failed_subgates"]}**',
              f'- subgates: `{p["subgates"]}`',
              f'- selection semantic equivalence: **{p["selection"]["selection_semantically_equivalent"]}**; ties: **{p["tied_query_count"]}**; distinct selection mismatches: **{p["distinct_query_mismatch_count"]}**',
              f'- pre-out recalled: allclose **{p["pre_out_recalled_error"]["allclose"]}**, max abs **{p["pre_out_recalled_error"]["max_abs_error"]:.6g}**, failing elements **{p["pre_out_recalled_error"]["failing_element_count"]}**',
              f'- final out: allclose **{p["final_out_error"]["allclose"]}**, max abs **{p["final_out_error"]["max_abs_error"]:.6g}**, failing elements **{p["final_out_error"]["failing_element_count"]}**',
              '',
              '- Localization only: no timing or performance decision was made. Durable result + authoritative marker are the record.',
              '- No rerun is authorized. Any systems change requires a new CPU-first preregistration grounded in this localization.',
          ]
          print('\n'.join(out))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/result-comment.md)" || true

      - name: Record issue423 workflow failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          tail -n 120 /tmp/aera-v26-3-issue423-bf16-localize.log > /tmp/failure-tail.txt 2>/dev/null || true
          {
            echo '⚠️ **AERA-v26.3 #423 localization failed before an authoritative result marker.**'
            echo
            echo "Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'No rerun, automatic retry, redispatch, or timeout increase is authorized. Any continuation requires a new preregistration.'
            echo
            echo '<details><summary>log tail</summary>'
            echo
            echo '```text'
            cat /tmp/failure-tail.txt
            echo '```'
            echo '</details>'
          } > /tmp/failure-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/failure-comment.md)" || true
