name: CPW-v2 sequence run-control zero-GPU gate

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'modal_cpw_v2_sequence_1254.py'
      - 'tests/test_cpw_v2_sequence_run_control_1254.py'
      - '.github/workflows/cpw-v2-sequence-run-control.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
          pip install 'modal>=1.5.4,<1.6'
      - name: Protect frozen architecture
        run: |
          git diff --exit-code 8faff8bb30fd50e5c2b7cc33f90b643957cdac1b HEAD --             tam_research/cpw_v2_sequence             tests/test_cpw_v2_sequence_1254.py
          git diff --exit-code e326413ddcf592f532b23ef41b7d839421a45965 HEAD --             tam_research/cpw_v2_single/model.py             tam_research/cpw_v1/model.py
      - name: Run contracts
        run: |
          python -m compileall -q modal_cpw_v2_sequence_1254.py
          pytest -q             tests/test_cpw_v2_sequence_1254.py             tests/test_cpw_v2_sequence_run_control_1254.py
