name: AERA v26.3 issue460 reference autocast reportfix1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: aera-v26-3-issue460-reference-autocast-reportfix1
  cancel-in-progress: false

jobs:
  localize:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-repair4-reference-autocast-localize-reportfix1-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue460 launcher
        run: python -m py_compile modal_aera_v26_3_issue460_reference_autocast_reportfix1_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue460 one-attempt reportfix1 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Issue #460 permits Actions attempt 1 only; no workflow retry." >&2
            exit 1
          fi

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/460" --jq '.title')" = "[research] AERA-v26.3 #460 dtype-safe autocast localization reporting after #459 harness failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/459" --jq '.title')" = "[aera-v26-3-repair4-reference-autocast-localize-l4] sole issue456 localization trigger"

          source_run_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33546452532" --jq '.conclusion')"
          source_run_attempt="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33546452532" --jq '.run_attempt')"
          source_run_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33546452532" --jq '.head_sha')"
          test "${source_run_conclusion}" = "failure"
          test "${source_run_attempt}" = "1"
          test "${source_run_head}" = "d620b2a349ebb8e494b397bc534430abaeba394f"

          source_guard_step="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33546452532/jobs" \
              --jq '.jobs[] | select(.id == 99985042556) | .steps[] | select(.name == "Verify issue456 one-attempt localization boundary") | .conclusion'
          )"
          source_auth_step="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33546452532/jobs" \
              --jq '.jobs[] | select(.id == 99985042556) | .steps[] | select(.name == "Authenticate Modal") | .conclusion'
          )"
          source_l4_step="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33546452532/jobs" \
              --jq '.jobs[] | select(.id == 99985042556) | .steps[] | select(.name == "Run sole issue456 repair4 reference autocast localization") | .conclusion'
          )"
          test "${source_guard_step}" = "success"
          test "${source_auth_step}" = "success"
          test "${source_l4_step}" = "failure"

          source_failure_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/459/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("⚠️ **AERA-v26.3 #456 localization did not produce the authoritative result marker.**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${source_failure_comment_count}" = "1"

          old_trigger_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-repair4-reference-autocast-localize-l4]")) | .number' \
              | wc -l | tr -d ' '
          )"
          test "${old_trigger_count}" = "1"

          trigger_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-repair4-reference-autocast-localize-reportfix1-l4]")) | .number' \
              | wc -l | tr -d ' '
          )"
          if [ "${trigger_count}" != "1" ]; then
            echo "Expected exactly one issue460 reportfix1 trigger, found ${trigger_count}." >&2
            exit 1
          fi

          result_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("🔬 **AERA-v26.3 #460 reference-autocast reportfix1 localization**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${result_comment_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(
            printf '%s\n' "${event_body}" \
              | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' \
              | head -n 1
          )"
          if [ -z "${bound_main}" ]; then
            echo "Trigger must contain exact Bind main line." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor d620b2a349ebb8e494b397bc534430abaeba394f HEAD

          test "$(git hash-object tam_research/aera_v26_3_repair4_reference_autocast_localize.py)" = "8ed7de14a0f29f3ac66d6228a71892fbf97e150f"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "a3a603c8a2d4b20ebcccd7663970978f4288a760"
          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test -f tam_research/aera_v26_3_issue460_reference_autocast_reportfix1.py
          test -f modal_aera_v26_3_issue460_reference_autocast_reportfix1_app.py
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record frozen issue460 guard (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          body="🔒 **AERA-v26.3 #460 reportfix1 gate** — checked-out main **${head_sha}**. Frozen #456 localization, repair4 backend and probe; exact ordinal-5 \`bfloat16_batch8_mixed\`; dtype-safe FP32 reporting copies only; one NVIDIA L4 <=180 seconds, Actions attempt 1 only. #459 remains exhausted. No timing/performance/model/checkpoint/corpus/training/scientific-seed/freeze/S2/100M/breakthrough authorization."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}" || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue460 reportfix1 localization
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_issue460_reference_autocast_reportfix1_app.py 2>&1 | tee /tmp/aera-v26-3-issue460-reportfix1.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE460_REFERENCE_AUTOCAST_LOCALIZE_REPORTFIX1_RESULT_JSON=' /tmp/aera-v26-3-issue460-reportfix1.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue460 localization (best effort)
        if: success() && steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > /tmp/result-comment.md
          import json
          from pathlib import Path
          lines = Path('/tmp/aera-v26-3-issue460-reportfix1.log').read_text(errors='replace').splitlines()
          marker = 'AERA_V26_ISSUE460_REFERENCE_AUTOCAST_LOCALIZE_REPORTFIX1_SUMMARY_JSON='
          rows = [line[len(marker):] for line in lines if line.startswith(marker)]
          if not rows:
              raise SystemExit('issue460 summary marker missing')
          p = json.loads(rows[-1])
          out = [
              '🔬 **AERA-v26.3 #460 reference-autocast reportfix1 localization**',
              '',
              f'- row: **{p["target_row"]}** on **{p["device"]}**',
              f'- frozen correctness_row PASS: **{p["primary_pass"]}**; false subgates: **{p["primary_false_subgates"]}**',
              f'- first actual-reference inside-vs-outside differing checkpoint: **{p["first_differing_checkpoint"]}**',
              f'- actual reference vs outside pre-out allclose: **{p["actual_reference_vs_outside_pre_out"]["allclose"]}**',
              f'- actual reference vs production pre-out allclose: **{p["actual_reference_vs_production_pre_out"]["allclose"]}**',
              f'- actual reference vs production final allclose: **{p["actual_reference_vs_production_final"]["allclose"]}**',
              f'- reportfix1 applied: **{p["reportfix1_applied"]}**; native execution tensors changed: **{p["native_execution_tensors_changed"]}**',
              '',
              '- Localization/reporting only. No timing or performance decision was made.',
              '- Durable successor result + authoritative marker are the record. No rerun is authorized.',
          ]
          print('\n'.join(out))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="$(cat /tmp/result-comment.md)" || true

      - name: Record issue460 workflow failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          body="⚠️ **AERA-v26.3 #460 reportfix1 did not produce the authoritative result marker.** This Actions attempt is exhausted. No rerun, retry, redispatch, alternate trigger, or timeout increase is authorized; continue only under a separately preregistered successor grounded in this failure."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}" || true
