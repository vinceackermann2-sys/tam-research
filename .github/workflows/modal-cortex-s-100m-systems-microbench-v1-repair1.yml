name: Modal CORTEX-S 100M systems microbench v1 repair1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  launch:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[modal-cortex-s-100m-systems-microbench-v1-repair1]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Resolve immutable repair phase and source
        id: cfg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = json.loads(os.environ.get('ISSUE_BODY') or '{}')
          phase = str(cfg.get('phase', '')).strip().lower()
          source_sha = str(cfg.get('source_sha', '')).strip().lower()
          assert phase == 'microbench-v1-repair1', "issue phase must be exactly microbench-v1-repair1"
          assert re.fullmatch(r'[0-9a-f]{40}', source_sha), "source_sha must be a full commit SHA"
          print(f'phase={phase}')
          print(f'source_sha={source_sha}')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checkout and live main are exactly the frozen source
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.cfg.outputs.source_sha }}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${{ steps.cfg.outputs.source_sha }}"

      - name: Fail closed with stdlib-only static protocol check
        run: |
          test -f architectures/cortex_s/SYSTEMS_MICROBENCH_100M_V1_REPAIR1.md
          test -f architectures/cortex_s/experiments/scale100m_2b/systems_microbench_v1.py
          test -f modal_cortex_s_100m_systems_microbench_v1_repair1.py
          python - <<'PY'
          from pathlib import Path

          core = Path('architectures/cortex_s/experiments/scale100m_2b/systems_microbench_v1.py').read_text(encoding='utf-8')
          launcher = Path('modal_cortex_s_100m_systems_microbench_v1_repair1.py').read_text(encoding='utf-8')
          doc = Path('architectures/cortex_s/SYSTEMS_MICROBENCH_100M_V1_REPAIR1.md').read_text(encoding='utf-8')

          assert 'ENGINEERING_SEED = 2_026_090_901' in core
          assert 'MIN_PROMISING_SPEEDUP = 1.20' in core
          assert 'STOP_GROUPED_BELOW_SPEEDUP = 1.10' in core
          assert 'MEASURED_STEPS = 20' in core
          assert 'full_training_authorized": False' in core or '"full_training_authorized": False' in core
          assert 'APP_NAME = "cortex-s-v0-100m-systems-microbench-v1-repair1"' in launcher
          assert 'RESULT_ROOT = "/vol/cortex-s-v0/100m-systems-microbench-v1-repair1"' in launcher
          assert 'H100_TIMEOUT_SECONDS = 15 * 60' in launcher
          assert 'phase: str = "microbench-v1-repair1"' in launcher
          assert 'def full_2b(' not in launcher
          assert 'train_full_2b' not in launcher
          assert '[modal-cortex-s-100m-systems-microbench-v1-repair1]' in doc
          print('stdlib-only repair1 protocol guard PASS')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal only
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication before any remote function launch
        run: modal token info

      - name: Record guarded repair1 H100 handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **CORTEX-S systems microbench repair1 launcher authenticated** — source=${{ steps.cfg.outputs.source_sha }}, engineering seed=2026090901. Fresh repair namespace; one bounded engineering H100 dispatch only."

      - name: Launch exact frozen repair1 systems microbenchmark detached
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          modal run --detach --timestamps modal_cortex_s_100m_systems_microbench_v1_repair1.py \
            --phase "${{ steps.cfg.outputs.phase }}" \
            --source-sha "${{ steps.cfg.outputs.source_sha }}" \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"

      - name: Record GitHub to Modal repair1 handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal systems microbench repair1 handoff complete.** Modal must first pass the zero-GPU corpus gate, then may allocate one H100 under a 15-minute hard timeout. This cannot authorize 2B training."
