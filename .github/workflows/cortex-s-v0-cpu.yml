name: CORTEX-S v0 CPU gate

on:
  pull_request:
    paths:
      - "architectures/cortex_s/**"
      - ".github/workflows/cortex-s-v0-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cortex-s-v0-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU research dependencies
        run: python -m pip install -e '.[test]'
      - name: Run CORTEX-S primitive tests
        working-directory: architectures/cortex_s
        run: PYTHONPATH=. pytest -q tests/test_cpu_primitives.py
      - name: Reproduce exploratory engineering gate
        working-directory: architectures/cortex_s
        run: PYTHONPATH=. python state_machine.py --seed 123 --steps 600 --output /tmp/cortex-s-v0-exploratory.json
      - name: Verify exploratory classification
        run: |
          python - <<'PY'
          import json
          result = json.load(open('/tmp/cortex-s-v0-exploratory.json', encoding='utf-8'))
          assert result['status'] == 'PASS'
          assert result['scientific_status'] == 'EXPLORATORY_ENGINEERING_ONLY'
          assert result['seed'] == 123
          print(json.dumps(result['engineering_gate'], indent=2, sort_keys=True))
          PY
