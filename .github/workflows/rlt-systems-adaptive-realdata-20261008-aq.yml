name: RLT adaptive dual-path real-data quality/sec AQ
on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-adaptive-realdata-20261008-aq.yml
permissions:
  contents: write
concurrency:
  group: rlt-systems-adaptive-realdata-20261008-aq
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-adaptive-realdata-modal-20261008-aq
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-adaptive-realdata-modal-20261008-aq.json
      LAUNCHER_PATH: experiments/rlt/modal_adaptive_qualitysec_aq.py
      MODEL_PATH: experiments/rlt/model_gated_scan_adaptive.py
      AP_PATH: experiments/rlt/modal/results/rlt-residual-gated-scan-scientific-scale15m-60s-modal-20261008-ap.json
      RESIDUAL_MODEL_PATH: experiments/rlt/model_gated_scan_residual.py
      BASE_SCAN_MODEL_PATH: experiments/rlt/model_gated_scan.py
      DIAG_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-adaptive-realdata-20261008-aq.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-adaptive-realdata-modal-20261008-aq.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-adaptive-realdata-modal-20261008-aq.json
    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0
      - name: Reject consumed AQ and validate job and fresh seeds
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH"
          echo "main=$(git rev-parse origin/main) rlt=$(git rev-parse origin/$BRANCH)"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          echo "JOB_BLOB_SHA=$(git rev-parse "origin/$BRANCH:$JOB_PATH")" >> "$GITHUB_ENV"
          echo "LAUNCHER_BLOB_SHA=$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")" >> "$GITHUB_ENV"
          echo "MODEL_BLOB_SHA=$(git rev-parse "origin/$BRANCH:$MODEL_PATH")" >> "$GITHUB_ENV"
          echo "RESIDUAL_MODEL_BLOB_SHA=$(git rev-parse "origin/$BRANCH:$RESIDUAL_MODEL_PATH")" >> "$GITHUB_ENV"
          echo "BASE_SCAN_MODEL_BLOB_SHA=$(git rev-parse "origin/$BRANCH:$BASE_SCAN_MODEL_PATH")" >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/aq-job.json
          python - <<'PY'
          import json
          from pathlib import Path
          job=json.load(open('/tmp/aq-job.json'))
          assert job == {
           'schema':1,'job_id':'rlt-systems-adaptive-realdata-modal-20261008-aq',
           'task':'systems_adaptive_realdata_qualitysec_aq',
           'engineering_seed':20261060,'batch_seed':20271060,
           'eval_seed':20291060,'compile_probe_seed':20301060,
           'requires_ap_scientific_job_id':'rlt-residual-gated-scan-scientific-scale15m-60s-modal-20261008-ap',
           'requires_adaptive_cpu_tests_run_id':37844155104,
           'candidate_protocols':[
             {'name':'adaptive_scan','schedule':'cosine','learning_rate':0.001},
             {'name':'residual_scan','schedule':'cosine','learning_rate':0.001},
             {'name':'transformer_control','schedule':'cosine','learning_rate':0.001},
           ],
           'batch_size':64,'seq_len':64,'eval_batch_size':64,'eval_batches':32,
           'time_budget_seconds_each':60.0,
           'train_tokens':6000000,'val_tokens':500000,'training_data_seed':20260924,
           'expected_parameters_each':15129344,'automatic_retry':False,
          },job
          own=Path('experiments/rlt/modal/jobs/rlt-systems-adaptive-realdata-modal-20261008-aq.json')
          seeds={20261060,20271060,20291060,20301060}
          def ints(x):
           if isinstance(x,dict):
            for v in x.values(): yield from ints(v)
           elif isinstance(x,list):
            for v in x: yield from ints(v)
           elif isinstance(x,int): yield x
          collisions=[]
          for root in ['experiments/rlt/modal/jobs','experiments/rlt/modal/claims']:
           for f in Path(root).glob('*.json'):
            if f==own: continue
            try: blob=json.loads(f.read_text())
            except Exception: continue
            overlap=seeds.intersection(ints(blob))
            if overlap: collisions.append((str(f),sorted(overlap)))
          assert not collisions,collisions
          print('Unconsumed AQ seeds:',sorted(seeds))
          PY
      - name: Validate frozen AP science and 29 adaptive CPU tests
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$AP_PATH" >/tmp/ap.json
          python - <<'PY'
          import json,urllib.request
          ap=json.load(open('/tmp/ap.json'))
          assert ap.get('job_id')=='rlt-residual-gated-scan-scientific-scale15m-60s-modal-20261008-ap'
          assert ap.get('status')=='complete' and ap.get('classification')=='SCIENTIFIC_RESIDUAL_EQUALTIME_SINGLE_SEED_NO_QUALITY_ADVANTAGE'
          assert ap.get('scientific_execution') is True and ap.get('breakthrough_claim_supported') is False
          assert ap.get('modal_cli_rc')==0 and ap.get('data_hashes_match_claim') is True
          assert ap.get('compute_budget_verified') is True and ap.get('exact_parameter_match_verified') is True
          assert ap['derived']['residual_minus_transformer_final_nll']>0
          assert ap['data']['train_sha256']=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907'
          assert ap['data']['val_sha256']=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2'
          url='https://api.github.com/repos/vinceackermann2-sys/tam-research/actions/runs/37844155104'
          req=urllib.request.Request(url,headers={'User-Agent':'rlt-aq-check'})
          with urllib.request.urlopen(req,timeout=30) as resp:r=json.load(resp)
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_branch']=='exp/rlt-colab'
          assert r['path']=='.github/workflows/rlt-gated-scan-adaptive-zero-gpu-tests.yml'
          PY

      - name: Install zero-GPU reproducibility dependencies and select Modal account
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
           'modal>=1.5.4,<1.6' 'numpy>=2.0,<3' 'datasets>=4.0,<5' \
           'transformers>=4.55,<5' 'tokenizers>=0.21,<1' 'huggingface-hub>=0.34,<1'
          SLOT="";ID="";SECRET=""
          if [ -n "$MODAL_TOKEN_ID_2" ] && [ -n "$MODAL_TOKEN_SECRET_2" ]; then
           SLOT="2";ID="$MODAL_TOKEN_ID_2";SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "$MODAL_TOKEN_ID_B" ] && [ -n "$MODAL_TOKEN_SECRET_B" ]; then
           SLOT="B";ID="$MODAL_TOKEN_ID_B";SECRET="$MODAL_TOKEN_SECRET_B"
          else
           SLOT="A";ID="$MODAL_TOKEN_ID_A";SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID";test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID";export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          echo "MODAL_ACCOUNT_SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_ID=$ID" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$SECRET" >> "$GITHUB_ENV"
          python -m py_compile "$LAUNCHER_PATH" "$MODEL_PATH" "$RESIDUAL_MODEL_PATH" "$BASE_SCAN_MODEL_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/modal_adaptive_qualitysec_aq.py').read_text()
          for x in [
           'JOB_ID = "rlt-systems-adaptive-realdata-modal-20261008-aq"',
           'ENGINEERING_SEED = 20_261_060','BATCH_SEED = 20_271_060',
           'EVAL_SEED = 20_291_060','COMPILE_PROBE_SEED = 20_301_060',
           'TIME_BUDGET_SECONDS = 60.0','EXPECTED_PARAMETERS = 15_129_344',
           'PASS_ADAPTIVE_GATED_SCAN_REALDATA_ENGINEERING_QUALITYSEC',
           'AdaptiveResidualGatedScanRLT','ResidualGatedScanRLT',
           '("adaptive_scan", "cosine", 1e-3)',
           '("residual_scan", "cosine", 1e-3)',
           '("transformer_control", "cosine", 1e-3)',
           'gpu="A100-80GB"',
           'retries=0',
           'RLT_SYSTEMS_ADAPTIVE_AQ_RESULT_B64=',
           'RLT_SYSTEMS_ADAPTIVE_AQ_PREFLIGHT_B64='
          ]: assert x in s,x
          assert s.count('from experiments.rlt.model_gated_scan_adaptive import AdaptiveResidualGatedScanRLT') >= 2
          assert '("gated_scan", "constant", 1e-3)' not in s
          PY
      - name: Reproduce exact pinned FineWeb D bytes before claim
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import hashlib,json,pathlib
          import numpy as np
          from datasets import load_dataset
          from transformers import AutoTokenizer
          ntrain,nval,seed=6000000,500000,20260924
          tok=AutoTokenizer.from_pretrained('gpt2',use_fast=True)
          stream=load_dataset('HuggingFaceFW/fineweb-edu',name='sample-10BT',split='train',streaming=True)
          stream=stream.shuffle(seed=seed,buffer_size=10000)
          parts=[];count=0;target=ntrain+nval
          for row in stream:
           text=row.get('text') or ''
           if not text:continue
           ids=tok.encode(text,add_special_tokens=False)
           ids.append(tok.eos_token_id)
           x=np.asarray(ids,dtype=np.uint16)
           parts.append(x);count+=len(x)
           if count>=target: break
          assert count>=target,(count,target)
          all_tokens=np.concatenate(parts)[:target]
          tp=pathlib.Path('/tmp/aq-train.bin')
          vp=pathlib.Path('/tmp/aq-val.bin')
          all_tokens[:ntrain].tofile(tp);all_tokens[ntrain:].tofile(vp)
          def digest(path):
           h=hashlib.sha256()
           with path.open('rb') as stream:
            for b in iter(lambda:stream.read(8*1024*1024),b''):h.update(b)
           return h.hexdigest()
          th,vh=digest(tp),digest(vp)
          assert th=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',th
          assert vh=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',vh
          pathlib.Path('/tmp/aq-data.json').write_text(json.dumps({
           'seed':seed,'train_sha256':th,'val_sha256':vh,
           'train_tokens':ntrain,'val_tokens':nval
          },indent=2,sort_keys=True)+'\n')
          print('AQ pinned data hashes reproduced:',th,vh)
          PY
          RC=$?
          set -e
          # Known Arrow/tokenizer interpreter-finalization SIGABRT is not a
          # data-hash failure if the verified artifact was durably written.
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 134 ]; then exit "$RC"; fi
          test -f /tmp/aq-data.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/aq-data.json').read_text())
          assert d=={
             'seed':20260924,'train_tokens':6000000,'val_tokens':500000,
             'train_sha256':'0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',
             'val_sha256':'e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',
          },d
          assert Path('/tmp/aq-train.bin').stat().st_size==6000000*2
          assert Path('/tmp/aq-val.bin').stat().st_size==500000*2
          print('AQ durable pinned data verified after exit code:',d)
          PY
      - name: Validate Modal no-GPU general and exact AQ image
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"
          timeout 15m modal run "$LAUNCHER_PATH"::verify_dependencies 2>&1 | tee /tmp/aq-cpu.log
          C="$(grep '^RLT_SYSTEMS_ADAPTIVE_AQ_PREFLIGHT_B64=' /tmp/aq-cpu.log | tail -1 | cut -d= -f2-)"
          test -n "$C"
          echo "AQ_CPU_B64=$C" >> "$GITHUB_ENV"
          python - "$P" "$C" <<'PY'
          import base64,json,sys
          a=json.loads(base64.urlsafe_b64decode(sys.argv[1].encode()))
          c=json.loads(base64.urlsafe_b64decode(sys.argv[2].encode()))
          assert a.get('status')=='pass' and a.get('scientific_job_executed') is False,a
          assert c.get('status')=='pass' and c.get('gpu_requested') is False,c
          assert c.get('cpu_forward_shapes_passed') is True,c
          assert c.get('parameter_counts')=={
           'adaptive_scan':15129344,'residual_scan':15129344,'transformer_control':15129344
          },c
          print('AQ image and data checks passed.')
          PY
      - name: Commit AQ zero-GPU preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          c=json.loads(base64.urlsafe_b64decode(os.environ['AQ_CPU_B64'].encode()))
          assert p['status']=='pass' and c['status']=='pass'
          p.update({
           'classification':'RLT_ADAPTIVE_AQ_ZERO_GPU_PREFLIGHT_PASS',
           'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
           'job_id_checked':os.environ['JOB_ID'],
           'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
           'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
           'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
           'residual_model_blob_sha':os.environ['RESIDUAL_MODEL_BLOB_SHA'],
           'base_scan_model_blob_sha':os.environ['BASE_SCAN_MODEL_BLOB_SHA'],
           'engineering_only':True,'scientific_execution':False,
           'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
           'cpu_model_preflight':c,
           'reference_data':json.load(open('/tmp/aq-data.json'))
          })
          out=pathlib.Path(os.environ['DIAG_PATH']);out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "$BRANCH"
          git add "$DIAG_PATH"
          git commit -m 'rlt systems: record AQ real-data zero-GPU preflight'
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Durably claim exactly one AQ real-data engineering run
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open(os.environ['DIAG_PATH']))
          assert d['status']=='pass' and d['cpu_model_preflight']['status']=='pass'
          out=pathlib.Path(os.environ['CLAIM_PATH']);out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({
           'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed',
           'claimed_unix':time.time(),'worker':'github-actions-modal',
           'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
           'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
           'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
           'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
           'residual_model_blob_sha':os.environ['RESIDUAL_MODEL_BLOB_SHA'],
           'base_scan_model_blob_sha':os.environ['BASE_SCAN_MODEL_BLOB_SHA'],
           'engineering_seed':20261060,'batch_seed':20271060,
           'eval_seed':20291060,'compile_probe_seed':20301060,
           'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
           'train_sha256':d['reference_data']['train_sha256'],
           'val_sha256':d['reference_data']['val_sha256'],
           'engineering_only':True,'scientific_execution':False,
           'automatic_retry_authorized':False,
           'job':json.load(open(os.environ['JOB_PATH']))
          },sort_keys=True,indent=2)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before real-data A100 run"
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Execute one-shot equal-time AQ training
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 110m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=$?
          B64="$(grep '^RLT_SYSTEMS_ADAPTIVE_AQ_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0
      - name: Persist durable AQ terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64','');rc=int(os.environ.get('MODAL_RC','999'))
          p=None
          if b:
           try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
           except Exception:p=None
          if not isinstance(p,dict):
           log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
           p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed',
           'finished_unix':time.time(),'worker':'github-actions-modal',
           'error_type':'ModalInvocationOrTransportError',
           'error':f'Modal CLI rc={rc}; no parseable terminal payload',
           'log_tail':log[-6000:],'scientific_conclusion':None,
           'engineering_only':True,'scientific_execution':False}
          claim=json.load(open(os.environ['CLAIM_PATH']))
          d=p.get('data') or {}
          p.update({'modal_cli_rc':rc,'branch':os.environ['BRANCH'],
           'trigger_sha':os.environ['GITHUB_SHA'],
           'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
           'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
           'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
           'residual_model_blob_sha':os.environ['RESIDUAL_MODEL_BLOB_SHA'],
           'base_scan_model_blob_sha':os.environ['BASE_SCAN_MODEL_BLOB_SHA'],
           'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
           'data_hashes_match_claim':(
             d.get('train_sha256')==claim['train_sha256']
             and d.get('val_sha256')==claim['val_sha256']
           )})
          f=pathlib.Path(os.environ['RESULT_PATH']);f.parent.mkdir(parents=True,exist_ok=True)
          f.write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          git fetch origin main "$BRANCH"
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Summarize AQ engineering quality and timing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,sort_keys=True,indent=2))
          assert r.get('status')=='complete',r
          assert r.get('classification')=='PASS_ADAPTIVE_GATED_SCAN_REALDATA_ENGINEERING_QUALITYSEC',r
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          assert r.get('breakthrough_claim_supported') is False,r
          assert r.get('data_hashes_match_claim') is True,r
          assert r.get('gpu_scan_vs_serial_passed') is True,r
          assert r.get('exact_parameter_match_verified') is True,r
          assert [row['name'] for row in r['results']]==['adaptive_scan','residual_scan','transformer_control'],r
          assert all(row['parameters']==15129344 for row in r['results'])
          print('AQ adaptive relative to Transformer:',r['derived']['adaptive_minus_transformer_final_nll'])
          print('AQ adaptive relative to residual:',r['derived']['adaptive_minus_residual_final_nll'])
          PY
