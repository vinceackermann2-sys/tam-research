name: RLT systems exact15M q1-efficient whole 20260927 R

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-scale15m-q1-efficient-whole-20260927-r.yml

permissions:
  contents: write

concurrency:
  group: rlt-systems-scale15m-q1-efficient-whole-20260927-r
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-scale15m-q1-efficient-whole-modal-20260927-r
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-scale15m-q1-efficient-whole-modal-20260927-r.json
      LAUNCHER_PATH: experiments/rlt/modal_scale15m_q1_efficient_whole_profile_r.py
      Q1_PATH: experiments/rlt/modal/results/rlt-systems-scale15m-q1-attention-modal-20260926-p.json
      REDUCE_PATH: experiments/rlt/modal/results/rlt-systems-scale15m-reduce-overhead-modal-20260927-q.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-scale15m-q1-efficient-whole-20260927-r.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-scale15m-q1-efficient-whole-modal-20260927-r.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-scale15m-q1-efficient-whole-modal-20260927-r.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse prior claim or result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          echo "JOB_BLOB_SHA=$JOB_BLOB_SHA" >> "$GITHUB_ENV"
          echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA" >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-systems-scale15m-q1-efficient-whole-modal-20260927-r',
            'task':'systems_scale15m_q1_efficient_whole_r',
            'engineering_seed':20261024,
            'requires_q1_profile_job_id':'rlt-systems-scale15m-q1-attention-modal-20260926-p',
            'requires_reduce_overhead_job_id':'rlt-systems-scale15m-reduce-overhead-modal-20260927-q',
            'batch_size':768,'seq_len':64,'expected_parameters_each':15129344,
            'automatic_retry':False,
          },j
          PY

      - name: Require P and Q engineering evidence
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$Q1_PATH" >/tmp/p.json
          git show "origin/$BRANCH:$REDUCE_PATH" >/tmp/q.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/p.json'))
          assert p.get('status')=='complete' and p.get('classification')=='PASS_SCALE15M_Q1_ATTENTION_BACKEND_PROFILE',p
          assert p.get('engineering_only') is True and p.get('scientific_execution') is False,p
          rank=p['steady_state_len32_ranking']
          assert rank[0]['backend']=='efficient' and float(rank[0]['speedup_vs_flash'])>1.5,rank
          assert p['numerical_vs_flash']['32']['efficient']['bit_identical_output'] is False,p

          q=json.load(open('/tmp/q.json'))
          assert q.get('status')=='complete',q
          assert q.get('classification')=='PASS_SCALE15M_REDUCE_OVERHEAD_NO_MATERIAL_SPEEDUP',q
          assert q.get('engineering_only') is True and q.get('scientific_execution') is False,q
          assert q['default_vs_reduce_overhead_exact_equivalence']['passed'] is True,q
          assert float(q['derived']['reduce_overhead_speedup_vs_default'])<1.10,q
          PY

      - name: Install Modal
        run: python -m pip install --disable-pip-version-check 'modal>=1.5.4,<1.6'

      - name: Select Modal account 2
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT=2; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT=B; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT=A; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          echo "MODAL_ACCOUNT_SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_ID=$ID" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$LAUNCHER_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/modal_scale15m_q1_efficient_whole_profile_r.py').read_text()
          for x in [
            'JOB_ID = "rlt-systems-scale15m-q1-efficient-whole-modal-20260927-r"',
            'ENGINEERING_SEED = 20_261_024','BATCH_SIZE = 768','SEQ_LEN = 64',
            'EXPECTED_PARAMETERS = 15_129_344','SDPBackend.EFFICIENT_ATTENTION',
            'class Q1EfficientRLT','decoder_q1_backend',
            'PASS_SCALE15M_Q1_EFFICIENT_WHOLE_MATERIAL_SPEEDUP',
            'RLT_SYSTEMS_SCALE15M_Q1_EFFICIENT_WHOLE_R_RESULT_B64=',
            'gpu="A100-80GB"','retries=0',
          ]: assert x in s,x
          PY

      - name: Zero-GPU Modal preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit engineering preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_SYSTEMS_SCALE15M_Q1_EFFICIENT_WHOLE_R_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],'engineering_only':True,
            'scientific_execution':False,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
          })
          out=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt systems: record q1-efficient whole preflight'
          git fetch origin "$BRANCH"; git rebase "origin/$BRANCH"; git push origin "HEAD:$BRANCH"

      - name: Claim one-shot engineering profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          out=pathlib.Path(os.environ['CLAIM_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_seed':20261024,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'engineering_only':True,'scientific_execution':False,'automatic_retry_authorized':False,
            'job':json.load(open(os.environ['JOB_PATH'])),
          },indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100-80GB profile"
          git fetch origin "$BRANCH"; git rebase "origin/$BRANCH"; git push origin "HEAD:$BRANCH"

      - name: Execute one Modal q1-efficient whole profile
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 78m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_SYSTEMS_SCALE15M_Q1_EFFICIENT_WHOLE_R_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"; echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize durable result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception:p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                 'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                 'error':f'Modal CLI rc={rc}; no parseable terminal payload','log_tail':log[-6000:],
                 'scientific_conclusion':None}
          p.update({'modal_cli_rc':rc,'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
                    'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
                    'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT']})
          out=pathlib.Path(os.environ['RESULT_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"; git rebase "origin/$BRANCH"; git push origin "HEAD:$BRANCH"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          print('classification:',r['classification'])
          print('speedup:',r['derived']['q1_efficient_speedup_vs_default'])
          print('numerical:',r['numerical_vs_default'])
          print('default tok/s:',r['default']['tokens_per_second'])
          print('q1-efficient tok/s:',r['q1_efficient']['tokens_per_second'])
          PY
