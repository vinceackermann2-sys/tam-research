name: AERA v26.5 issue505 physically-real sparse end-to-end systems L4 gate

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-5-issue505-e2e-systems-l4
  cancel-in-progress: false

jobs:
  end-to-end-systems:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-5-issue505-e2e-systems-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue505 frozen evaluator and launcher
        run: |
          python -m py_compile tam_research/aera_v26_5_end_to_end_systems.py
          python -m py_compile tam_research/aera_v26_5_end_to_end_systems_repair1.py
          python -m py_compile modal_aera_v26_5_issue505_end_to_end_systems_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue505 sole one-attempt systems boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/505" --jq '.title')" = "[research] AERA-v26.5 one-shot physically-real sparse end-to-end systems L4 gate after #503"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/505" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/504" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/504" --jq '.head.sha')" = "58d04a12edaef50caf5daa24eb0386e8c624c6ca"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/504" --jq '.merge_commit_sha')" = "4dece4ef767d8de58b74acd091e1adb55009c5ab"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33657968851" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33657968851" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33657968851" --jq '.head_sha')" = "58d04a12edaef50caf5daa24eb0386e8c624c6ca"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100341171002" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33618950619" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33618950619" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100211244996" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33651216734" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33651216734" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100318422299" --jq '.conclusion')" = "success"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-5-issue505-e2e-systems-l4]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"
          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.5 #505 end-to-end systems result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 4dece4ef767d8de58b74acd091e1adb55009c5ab HEAD

          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems.py)" = "c9731cae7e386f09b2a190b045532591c4fa00be"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems_repair1.py)" = "b3f7082b188644007b873db3733492f424d4941a"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_hardware_core_v26_4_ficem_write_triton.py)" = "e54570292489bd17570038dca7518419ac00418c"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object modal_aera_v26_5_issue505_end_to_end_systems_app.py)" = "491fe31b0f701c1a67e91a9bd877069eeba42e55"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue505 gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.5 #505 end-to-end systems gate** — exact bound main, repaired evaluator and frozen READ/WRITE/reference blobs verified. One NVIDIA L4, Actions attempt 1 only. No rerun/freeze/scientific-seed/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue505 end-to-end systems L4 gate
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_5_issue505_end_to_end_systems_app.py 2>&1 | tee /tmp/issue505.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_5_ISSUE505_END_TO_END_SYSTEMS_RESULT_JSON=' /tmp/issue505.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue505 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_5_ISSUE505_END_TO_END_SYSTEMS_SUMMARY_JSON=' /tmp/issue505.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.5 #505 end-to-end systems result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. Systems PASS alone does not authorize architecture freeze/scientific seed/100M/breakthrough." || true

      - name: Record issue505 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.5 #505 end-to-end systems gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
