name: CPW-v0 run-control zero-GPU gate

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'modal_cpw_v0_app.py'
      - 'tests/test_cpw_v0_run_control_1245.py'
      - '.github/workflows/cpw-v0-run-control-cpu.yml'

permissions:
  contents: read

jobs:
  run-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install repository tests
        run: pip install -e '.[test]'
      - name: Syntax check scientific runner
        run: python -m compileall -q modal_cpw_v0_app.py tam_research/cpw_v0
      - name: Run architecture and run-control contracts
        run: pytest -q tests/test_cpw_v0_1245.py tests/test_cpw_v0_run_control_1245.py
