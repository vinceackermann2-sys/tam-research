name: RLT streaming affine state-carry correctness

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-streaming-affine-carry-zero-gpu-tests.yml

permissions:
  contents: read

concurrency:
  group: rlt-streaming-affine-carry-zero-gpu
  cancel-in-progress: false

jobs:
  cpu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0
      - name: Confirm branch and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "exp/rlt-colab"
          git fetch origin main exp/rlt-colab
          echo "main=$(git rev-parse origin/main) rlt=$(git rev-parse origin/exp/rlt-colab)"
          python -m py_compile experiments/rlt/streaming_affine_scan.py tests/test_rlt_streaming_affine_scan.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/streaming_affine_scan.py').read_text()
          for token in [
            'def chunked_affine_scan(', 'associative_affine_scan(',
            'state = chunk_states[:, -1, :]', 'return torch.cat(outputs, dim=1), state'
          ]: assert token in s,token
          assert '.detach(' not in s
          assert 'gpu=' not in s
          PY
      - name: Install CPU test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'torch>=2.3,<3' 'pytest>=8,<10'
      - name: Check scan identity, irregular chunks, causality, gradients and carry
        shell: bash
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: 2
          MKL_NUM_THREADS: 2
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_rlt_streaming_affine_scan.py -vv
