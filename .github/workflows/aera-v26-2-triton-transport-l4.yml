name: AERA v26.2 issue408 fused Triton transport L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-2-issue408-triton-transport-l4
  cancel-in-progress: false

jobs:
  triton-transport:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-2-triton-transport-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue408 launcher
        run: python -m py_compile modal_aera_v26_2_triton_transport_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue408 one-attempt synthetic boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Issue #408 permits Actions attempt 1 only; no workflow retry." >&2
            exit 1
          fi

          prereg_title="$(gh api "repos/${GITHUB_REPOSITORY}/issues/408" --jq '.title')"
          test "${prereg_title}" = "[research] AERA-v26.2 fused Triton zero-pack transport + synthetic L4 gate"

          cpu_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/407")"
          test "$(jq -r '.merged' <<<"${cpu_pr}")" = "true"
          test "$(jq -r '.head.sha' <<<"${cpu_pr}")" = "cda834f623e248c81b997ec6647651c6083e90ac"
          test "$(jq -r '.merge_commit_sha' <<<"${cpu_pr}")" = "27fc272e495bc3c125f7a1786c09581557670b3d"

          trigger_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-2-triton-transport-l4]")) | .number' \
              | wc -l | tr -d ' '
          )"
          if [ "${trigger_count}" != "1" ]; then
            echo "Expected exactly one issue408 Triton transport trigger, found ${trigger_count}." >&2
            exit 1
          fi

          result_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("🔬 **AERA-v26.2 #408 fused Triton transport result**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${result_comment_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(
            printf '%s\n' "${event_body}" \
              | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' \
              | head -n 1
          )"
          if [ -z "${bound_main}" ]; then
            echo "Trigger must contain an exact 'Bind main: `<40-hex-sha>`' line." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 27fc272e495bc3c125f7a1786c09581557670b3d HEAD

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record frozen issue408 guard (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          body="🔒 **AERA-v26.2 #408 fused Triton transport gate** — checked-out main **${head_sha}**. Synthetic production-shaped transport only: float32/bfloat16, batches 8/64, fractions 0.25/0.50/0.75/1.00, one NVIDIA L4 <=300 GPU seconds, Actions attempt 1 only. No model/checkpoint/corpus/training/scientific seed/end-to-end/freeze/S2/100M/breakthrough authorization."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}" || {
            echo "warning: issue408 guard comment could not be posted; reporting is non-authoritative" >&2
            exit 0
          }

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue408 synthetic L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_2_triton_transport_app.py 2>&1 | tee /tmp/aera-v26-2-issue408-triton-transport.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE408_TRITON_TRANSPORT_RESULT_JSON=' /tmp/aera-v26-2-issue408-triton-transport.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Build issue408 result report
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        run: |
          python - <<'PY' > /tmp/result-comment.md
          import json
          from pathlib import Path

          lines = Path('/tmp/aera-v26-2-issue408-triton-transport.log').read_text(errors='replace').splitlines()
          marker = 'AERA_V26_ISSUE408_TRITON_TRANSPORT_RESULT_JSON='
          rows = [line[len(marker):] for line in lines if line.startswith(marker)]
          if not rows:
              raise SystemExit('issue408 result marker missing')
          payload = json.loads(rows[-1])
          out = [
              '🔬 **AERA-v26.2 #408 fused Triton transport result**',
              '',
              f'- decision: **{payload["decision"]}**; overall PASS: **{payload["overall_pass"]}**',
              f'- device: **{payload["device"]}**',
              f'- batch64 geomean ratios: **{payload["batch64_geomean_latency_ratio_by_dtype"]}** (each required <= **0.90x**)',
              f'- correctness: **{payload["correctness_pass"]}**; launch reduction: **{payload["kernel_launch_reduction_pass"]}**; row latency: **{payload["row_latency_pass"]}**',
              f'- zero cat/stack: **{payload["no_cat_or_stack_pass"]}**; no auxiliary CUDA kernel: **{payload["no_auxiliary_cuda_kernel_pass"]}**',
          ]
          for key, row in payload['rows'].items():
              out.append(
                  f'- {key}: latency **{row["latency_ratio_candidate_over_reference"]:.3f}x**, CUDA-event ratio **{row["kernel_event_ratio_candidate_over_reference"]:.3f}x**, exact **{row["correctness"]["pass"]}**'
              )
          out += [
              '',
              '- Synthetic state transport only; model/checkpoint/corpus/training/scientific seed: **False / False / False / False / False**.',
              '- Durable Modal result + Actions marker are authoritative; this comment is reporting only.',
              '- This primitive result does **not** authorize end-to-end AERA timing, architecture freeze, S2, a fresh scientific seed, 100M, or a breakthrough claim.',
          ]
          print('\n'.join(out))
          PY

      - name: Record issue408 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$(cat /tmp/result-comment.md)" || {
            echo "warning: authoritative issue408 result exists but GitHub reporting failed" >&2
            exit 0
          }

      - name: Record issue408 workflow failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          tail -n 100 /tmp/aera-v26-2-issue408-triton-transport.log > /tmp/failure-tail.txt 2>/dev/null || true
          {
            echo '⚠️ **AERA-v26.2 #408 Triton transport gate failed before an authoritative result marker.**'
            echo
            echo "Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'No rerun, automatic retry, or timeout increase is authorized. Any continuation requires a new preregistration.'
            echo
            echo '<details><summary>log tail</summary>'
            echo
            echo '```text'
            cat /tmp/failure-tail.txt
            echo '```'
            echo '</details>'
          } > /tmp/failure-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$(cat /tmp/failure-comment.md)" || {
            echo "warning: issue408 failure reporting could not be posted" >&2
            exit 0
          }
