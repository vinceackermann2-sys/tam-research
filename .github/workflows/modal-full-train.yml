name: Modal TAM full train

on:
  workflow_dispatch:
    inputs:
      max_gpu_seconds:
        description: "Hard H100 function ceiling (max 1300)"
        required: true
        default: "1300"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  full-train:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[modal-full-train]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve guarded budget
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_MAX_GPU_SECONDS: ${{ inputs.max_gpu_seconds }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.environ["EVENT_NAME"] == "issues":
              cfg = json.loads(os.environ.get("ISSUE_BODY") or "{}")
              seconds = int(cfg.get("max_gpu_seconds", 1300))
          else:
              seconds = int(os.environ["INPUT_MAX_GPU_SECONDS"])
          assert 300 <= seconds <= 1300
          print(f"max_gpu_seconds={seconds}")
          PY

      - name: Record launcher start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **Full TAM launcher started** — hard H100 ceiling=${{ steps.cfg.outputs.max_gpu_seconds }}s."

      - name: Install Modal
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication
        run: modal token info

      - name: Prepare data and launch detached full training
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          modal run --detach --timestamps modal_full_train_app.py \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --max-gpu-seconds "${{ steps.cfg.outputs.max_gpu_seconds }}"

      - name: Record handoff
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal full-training handoff completed.** No additional GPU jobs are triggered by this workflow."
