name: RLT systems block sweep exact15M batch768 20260929 AB

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-block-sweep-scale15m-batch768-20260929-ab.yml

permissions:
  contents: write

concurrency:
  group: rlt-systems-block-sweep-scale15m-batch768-20260929-ab
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab.json
      MODEL_PATH: experiments/rlt/model_block.py
      LAUNCHER_PATH: experiments/rlt/modal_block_sweep_scale15m_batch768_ab.py
      AA_PATH: experiments/rlt/modal/results/rlt-systems-block8-scale15m-batch768-modal-20260928-aa.json
      BLOCK8_QUALITY_PATH: experiments/rlt/modal/results/rlt-block8-scale15m-paired-4m-modal-20260929-a.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-block-sweep-scale15m-batch768-20260929-ab.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed block sweep
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          MODEL_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$MODEL_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "MODEL_BLOB_SHA=$MODEL_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab',
            'task':'systems_block_sweep_scale15m_batch768_ab',
            'engineering_seed':20261036,
            'requires_block8_profile_job_id':'rlt-systems-block8-scale15m-batch768-modal-20260928-aa',
            'requires_block8_quality_job_id':'rlt-block8-scale15m-paired-4m-modal-20260929-a',
            'block_sizes':[2,4,8],
            'batch_size':768,
            'seq_len':64,
            'expected_parameters_each':15129344,
            'automatic_retry':False,
          },j
          PY

      - name: Require successful AA profile and negative block8 quality result
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$AA_PATH" >/tmp/aa.json
          git show "origin/$BRANCH:$BLOCK8_QUALITY_PATH" >/tmp/q.json
          python - <<'PY'
          import json
          aa=json.load(open('/tmp/aa.json'))
          assert aa.get('job_id')=='rlt-systems-block8-scale15m-batch768-modal-20260928-aa',aa
          assert aa.get('status')=='complete' and aa.get('engineering_only') is True,aa
          assert aa.get('scientific_execution') is False,aa
          assert aa.get('classification')=='PASS_BLOCK8_SCALE15M_GAP_LE_1_5X',aa
          v=aa['implementation_validation']
          assert v['block_size_1_exact_reference_equivalence']['passed'] is True,v
          assert v['block_size_8_future_token_causality']['passed'] is True,v
          assert aa['architecture']['parameter_neutral'] is True,aa
          assert aa['architecture']['state_schema_equal_to_frozen_rlt'] is True,aa
          assert float(aa['derived']['transformer_throughput_multiple_vs_block8']) < 1.5,aa

          q=json.load(open('/tmp/q.json'))
          assert q.get('job_id')=='rlt-block8-scale15m-paired-4m-modal-20260929-a' and q.get('status')=='complete',q
          assert q.get('data_hashes_match_claim') is True and q.get('exact_parameter_match_verified') is True,q
          c=q['comparison']
          assert c['classification']=='PAIRED_BLOCK8_SCALE15M_4M_NO_RLT_QUALITY_ADVANTAGE',c
          assert float(c['derived']['rlt_minus_transformer_final_nll'])>0.0,c
          assert c['semantic_equivalence']['passed'] is True,c
          PY

      - name: Install Modal
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'modal>=1.5.4,<1.6'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Validate sweep source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$MODEL_PATH" "$LAUNCHER_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          m=Path('experiments/rlt/model_block.py').read_text()
          p=Path('experiments/rlt/modal_block_sweep_scale15m_batch768_ab.py').read_text()
          for x in [
            'if self.block_size == 1:',
            'return super().forward(tokens)',
            'state = hidden[:, -1, :]',
          ]: assert x in m,x
          for x in [
            'JOB_ID = "rlt-systems-block-sweep-scale15m-batch768-modal-20260929-ab"',
            'ENGINEERING_SEED = 20_261_036',
            'BLOCK_SIZES = (2, 4, 8)',
            'BATCH_SIZE = 768',
            'EXPECTED_PARAMETERS = 15_129_344',
            'block_size=1 exact anchor failed',
            'PASS_BLOCK_SWEEP_SCALE15M_BATCH768',
            'RLT_SYSTEMS_BLOCK_SWEEP_SCALE15M_BATCH768_AB_RESULT_B64=',
            'gpu="A100-80GB"',
            'retries=0',
          ]: assert x in p,x
          PY

      - name: Run non-GPU Modal control-plane preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit block sweep engineering preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_SYSTEMS_BLOCK_SWEEP_SCALE15M_BATCH768_AB_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_only':True,
            'scientific_execution':False,
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'block_sizes':[2,4,8],
            'batch_size':768,
            'expected_parameters_each':15129344,
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH'])
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt systems: record block sweep AB zero-GPU preflight'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Claim one-shot block sweep attempt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'schema':1,
            'job_id':os.environ['JOB_ID'],
            'status':'claimed',
            'claimed_unix':time.time(),
            'worker':'github-actions-modal',
            'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_seed':20261036,
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'engineering_only':True,
            'scientific_execution':False,
            'block_sizes':[2,4,8],
            'batch_size':768,
            'automatic_retry_authorized':False,
            'job':json.load(open(os.environ['JOB_PATH'])),
          },indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100-80GB sweep"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal A100-80GB block sweep
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 100m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_SYSTEMS_BLOCK_SWEEP_SCALE15M_BATCH768_AB_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize durable block sweep result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try: p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception: p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={
                'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed',
                'finished_unix':time.time(),'worker':'github-actions-modal',
                'error_type':'ModalInvocationOrTransportError',
                'error':f'Modal CLI rc={rc}; no parseable terminal payload',
                'log_tail':log[-6000:],'scientific_conclusion':None,
              }
          p.update({
            'modal_cli_rc':rc,
            'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
          })
          out=pathlib.Path(os.environ['RESULT_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize block sweep
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('classification')=='PASS_BLOCK_SWEEP_SCALE15M_BATCH768',r
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          v=r['implementation_validation']
          assert v['block_size_1_exact_reference_equivalence']['passed'] is True,v
          assert v['parameter_neutral_and_state_schema_equal'] is True,v
          assert set(v['future_token_causality_by_block_size'])=={'2','4','8'},v
          assert all(x['passed'] is True for x in v['future_token_causality_by_block_size'].values()),v
          rows=r['blocks']; assert [x['block_size'] for x in rows]==[2,4,8],rows
          assert all(x['parameters']==15129344 for x in rows),rows
          assert r['transformer']['parameters']==15129344,r
          for x in rows:
              print('block',x['block_size'],'tok/s',x['tokens_per_second'],
                    'gap',x['transformer_throughput_multiple_vs_block'])
          PY
