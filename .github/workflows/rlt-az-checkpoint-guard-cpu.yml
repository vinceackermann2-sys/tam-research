name: RLT AZ checkpoint archive guard CPU tests

on:
  push:
    branches: [exp/rlt-ax-bounded-transformer]
    paths:
      - .github/workflows/rlt-az-checkpoint-guard-cpu.yml

permissions:
  contents: read

jobs:
  cpu-artifact-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/rlt-ax-bounded-transformer
      - name: Confirm no training or GPU invocation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/rlt/analysis/checkpoint_archive_guard.py tests/test_rlt_checkpoint_archive_guard_az.py
          python - <<'PY'
          from pathlib import Path
          code=Path('experiments/rlt/analysis/checkpoint_archive_guard.py').read_text()
          assert 'import torch' not in code
          assert 'torch.cuda' not in code and '.backward(' not in code
          PY
      - name: Install CPU-only pytest
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'
      - name: Test that missing or ignored checkpoints fail closed
        run: python -m pytest -q tests/test_rlt_checkpoint_archive_guard_az.py -vv
