name: Modal CORTEX-S 100M 2B grouped guarded run v3

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  launch:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (github.event.issue.title == '[modal-cortex-s-100m-2b-preflight-v3-grouped]' ||
       github.event.issue.title == '[modal-cortex-s-100m-2b-full-v3-grouped]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Resolve immutable grouped v3 phase and source
        id: cfg
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = json.loads(os.environ.get('ISSUE_BODY') or '{}')
          title = os.environ['ISSUE_TITLE']
          expected_phase = (
              'preflight-v3-grouped'
              if title == '[modal-cortex-s-100m-2b-preflight-v3-grouped]'
              else 'full-v3-grouped'
          )
          phase = str(cfg.get('phase', '')).strip().lower()
          source_sha = str(cfg.get('source_sha', '')).strip().lower()
          assert phase == expected_phase, f'phase must be exactly {expected_phase}'
          assert re.fullmatch(r'[0-9a-f]{40}', source_sha), 'source_sha must be a full 40-char SHA'
          print(f'phase={phase}')
          print(f'source_sha={source_sha}')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checkout and live main are exactly the frozen source
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.cfg.outputs.source_sha }}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${{ steps.cfg.outputs.source_sha }}"

      - name: Fail closed with grouped v3 static protocol guard
        run: |
          python - <<'PY'
          from pathlib import Path
          launcher = Path('modal_cortex_s_100m_2b_app.py').read_text(encoding='utf-8')
          protocol = Path('architectures/cortex_s/experiments/scale100m_2b/protocol.py').read_text(encoding='utf-8')
          grouped = Path('architectures/cortex_s/grouped_moe.py').read_text(encoding='utf-8')
          assert 'CALIBRATION_SEED = 2_026_090_905' in launcher
          assert 'CALIBRATION_SEED = 2_026_090_905' in protocol
          assert 'preflight-v3-grouped' in launcher
          assert 'paired-seed8100-v3-grouped' in launcher
          assert 'PhysicalPaddedGroupedSparseMoE' in grouped
          assert 'train_full_grouped_2b' in grouped
          assert '[modal-cortex-s-100m-2b-preflight-v2]' not in Path('.github/workflows/modal-cortex-s-100m-2b.yml').read_text(encoding='utf-8')
          assert '[modal-cortex-s-100m-2b-full-v2]' not in Path('.github/workflows/modal-cortex-s-100m-2b.yml').read_text(encoding='utf-8')
          print('grouped v3 paid protocol guard PASS')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal only
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication before any function launch
        run: modal token info

      - name: Record grouped v3 launcher handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **CORTEX-S grouped v3 launcher authenticated** — phase=${{ steps.cfg.outputs.phase }}, source=${{ steps.cfg.outputs.source_sha }}. v1 #761, v2 #769, and engineering repair namespaces are not reused. Exact hashes, source binding, grouped backend, single-use roots and budget gates remain enforced."

      - name: Launch exact frozen grouped v3 phase detached
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          modal run --detach --timestamps modal_cortex_s_100m_2b_app.py \
            --phase "${{ steps.cfg.outputs.phase }}" \
            --source-sha "${{ steps.cfg.outputs.source_sha }}" \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"

      - name: Record GitHub to Modal grouped v3 handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal grouped v3 handoff complete.** The detached app is source-bound and single-use. Preflight cannot launch full training; full-v3-grouped requires a separately opened issue and exact-source PASS artifact."
