name: Modal CORTEX-S 100M 2B guarded run v2

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "preflight-v2 or full-v2"
        required: true
        default: "preflight-v2"
      source_sha:
        description: "Exact frozen commit SHA to execute"
        required: true
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  launch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       (github.event.issue.title == '[modal-cortex-s-100m-2b-preflight-v2]' ||
        github.event.issue.title == '[modal-cortex-s-100m-2b-full-v2]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Resolve immutable v2 phase and source
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          if os.environ['EVENT_NAME'] == 'issues':
              cfg = json.loads(os.environ.get('ISSUE_BODY') or '{}')
              expected_phase = 'preflight-v2' if os.environ['ISSUE_TITLE'].endswith('preflight-v2]') else 'full-v2'
              phase = str(cfg.get('phase', expected_phase)).strip().lower()
              source_sha = str(cfg.get('source_sha', '')).strip().lower()
              assert phase == expected_phase
          else:
              phase = os.environ['INPUT_PHASE'].strip().lower()
              source_sha = os.environ['INPUT_SOURCE_SHA'].strip().lower()
          assert phase in {'preflight-v2', 'full-v2'}
          assert re.fullmatch(r'[0-9a-f]{40}', source_sha), 'source_sha must be a full 40-char SHA'
          print(f'phase={phase}')
          print(f'source_sha={source_sha}')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checkout is exactly frozen source
        run: test "$(git rev-parse HEAD)" = "${{ steps.cfg.outputs.source_sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal only
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication before any function launch
        run: modal token info

      - name: Record v2 launcher handoff
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **CORTEX-S guarded v2 launcher authenticated** — phase=${{ steps.cfg.outputs.phase }}, source=${{ steps.cfg.outputs.source_sha }}. Consumed preflight #761 is not being reused. Modal still enforces exact hashes, single-use namespaces and budget gates."

      - name: Launch exact frozen v2 phase detached
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          modal run --detach --timestamps modal_cortex_s_100m_2b_app.py \
            --phase "${{ steps.cfg.outputs.phase }}" \
            --source-sha "${{ steps.cfg.outputs.source_sha }}" \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"

      - name: Record GitHub to Modal v2 handoff
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal v2 handoff complete.** Detached execution is governed by the frozen v2 app; full training cannot run unless the exact-source v2 H100 preflight artifact is PASS."
