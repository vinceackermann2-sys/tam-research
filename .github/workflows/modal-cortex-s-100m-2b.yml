name: Modal CORTEX-S 100M 2B memory-lean guarded run v4

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  launch:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (github.event.issue.title == '[modal-cortex-s-100m-2b-preflight-v4-memory-lean]' ||
       github.event.issue.title == '[modal-cortex-s-100m-2b-full-v4-memory-lean]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Resolve immutable memory-lean v4 phase and source
        id: cfg
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = json.loads(os.environ.get('ISSUE_BODY') or '{}')
          title = os.environ['ISSUE_TITLE']
          expected_phase = (
              'preflight-v4-memory-lean'
              if title == '[modal-cortex-s-100m-2b-preflight-v4-memory-lean]'
              else 'full-v4-memory-lean'
          )
          phase = str(cfg.get('phase', '')).strip().lower()
          source_sha = str(cfg.get('source_sha', '')).strip().lower()
          assert phase == expected_phase, f'phase must be exactly {expected_phase}'
          assert re.fullmatch(r'[0-9a-f]{40}', source_sha), 'source_sha must be a full 40-char SHA'
          print(f'phase={phase}')
          print(f'source_sha={source_sha}')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.cfg.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checkout and live main are exactly the frozen source
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.cfg.outputs.source_sha }}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${{ steps.cfg.outputs.source_sha }}"

      - name: Fail closed with memory-lean v4 static protocol guard
        run: |
          python - <<'PY'
          from pathlib import Path
          launcher = Path('modal_cortex_s_100m_2b_v4_app.py').read_text(encoding='utf-8')
          protocol = Path('architectures/cortex_s/experiments/scale100m_2b/protocol.py').read_text(encoding='utf-8')
          grouped = Path('architectures/cortex_s/grouped_moe_v4.py').read_text(encoding='utf-8')
          assert 'CALIBRATION_SEED = 2_026_090_906' in launcher
          assert 'CALIBRATION_SEED = 2_026_090_906' in protocol
          assert 'preflight-v4-memory-lean' in launcher
          assert 'full-v4-memory-lean' in launcher
          assert 'paired-seed8100-v4-memory-lean' in launcher
          assert 'PRODUCTION_SYSTEMS_VARIANT = "memory_lean_cast_before_gather_pad_v4"' in protocol
          assert 'MemoryLeanPhysicalPaddedGroupedSparseMoE' in grouped
          assert 'train_full_memory_lean_grouped_2b' in grouped
          assert 'flat.to(CUDA_COMPUTE_DTYPE)' in grouped
          assert 'self.expert_w2.to(dtype=CUDA_COMPUTE_DTYPE)' in grouped
          print('memory-lean v4 paid protocol guard PASS')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal only
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication before any function launch
        run: modal token info

      - name: Record memory-lean v4 launcher handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **CORTEX-S memory-lean v4 launcher authenticated** — phase=${{ steps.cfg.outputs.phase }}, source=${{ steps.cfg.outputs.source_sha }}. Consumed v1/v2/v3 and repair namespaces are not reusable. Exact hashes, source binding, fresh seed, single-use roots and frozen budget gates remain enforced."

      - name: Launch exact frozen memory-lean v4 phase detached
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          modal run --detach --timestamps modal_cortex_s_100m_2b_v4_app.py \
            --phase "${{ steps.cfg.outputs.phase }}" \
            --source-sha "${{ steps.cfg.outputs.source_sha }}" \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"

      - name: Record GitHub to Modal memory-lean v4 handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal memory-lean v4 handoff complete.** Preflight cannot launch paired training. Full-v4 requires a separately opened issue and exact-source PASS artifact."
