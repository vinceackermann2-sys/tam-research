name: AERA v26.9 issue643 bounded-memory end-to-end systems L4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  bounded-memory-end-to-end-systems:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-9-issue643-bounded-memory-e2e-systems-l4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue643 adapter and launcher
        run: |
          python -m py_compile tam_research/aera_v26_9_issue643_bounded_memory_end_to_end_systems.py
          python -m py_compile modal_aera_v26_9_issue643_bounded_memory_end_to_end_systems_l4_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue643 canonical bounded-memory systems boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/643" --jq '.title')" = "[research] AERA-v26.9 bounded-memory end-to-end systems successor after #641 CPU-green compatibility merge"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/643" --jq '.state')" = "open"

          mapfile -t freeze_comments < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/643/comments?per_page=100" \
              --jq '.[] | select((.body // "") | startswith("## #643 pre-implementation bounded-memory E2E harness freeze")) | .body'
          )
          test "${#freeze_comments[@]}" = "1"
          freeze_comment="${freeze_comments[0]}"
          printf '%s\n' "${freeze_comment}" | grep -F 'research/aera-v26-9-issue643-bounded-memory-e2e-systems-l4' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F '[aera-v26-9-issue643-bounded-memory-e2e-systems-l4]' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F '/vol/aera-v26/issue643-bounded-memory-end-to-end-systems/result.json' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'hard timeout `600` seconds maximum' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'ISSUE643_ADAPTER_BLOB=512572340cc09e2e7ad6729712258c12cb377ef2' >/dev/null
          printf '%s\n' "${freeze_comment}" | grep -F 'LAUNCHER_BLOB=aee3916cb87d48296e63f36d77d6541e0cf4d474' >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/642" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/642" --jq '.head.sha')" = "504b5b3fdd254645eeb31bcb059831a8a6ee3164"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/642" --jq '.merge_commit_sha')" = "ef93e787e6d01585307f05f046d7fd3806374511"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33989770634" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33989770634" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/101369805445" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33989555924" --jq '.conclusion')" = "failure"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33989555924" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/101369221062" --jq '.conclusion')" = "failure"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.title')" = "[aera-v26-9-issue630-runner-allocation-continuation-l4] sole #630 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.body' | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')" = "a5708223f2bba17c0eb931d63507fee93e98605b"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33985543569" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33985543569" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/101358253857" --jq '.conclusion')" = "success"
          primitive_comment_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/640/comments?per_page=100" \
              --jq '.[] | select((.body // "") | contains("ef92c85b55484b3ce191cd4016be86bf52da997a153f737194976164b29554b4")) | select((.body // "") | contains("\"decision\":\"PASS\"")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${primitive_comment_count}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/573" --jq '.title')" = "[aera-v26-8-issue571-memory-safe-e2e-systems-l4] sole #571 trigger"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/573" --jq '.body' | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')" = "c913d817ee1c1a1fca2d7c7622f4c8ca5353772f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33741700781" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33741700781" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100604889696" --jq '.conclusion')" = "success"
          historical571_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/573/comments?per_page=100" \
              --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.8 #571 memory-safe end-to-end systems result**")) | select((.body // "") | contains("\"decision\":\"FAIL_FROZEN_E2E_SYSTEMS_GATE\"")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${historical571_count}" = "1"

          mapfile -t matching_triggers < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue643-bounded-memory-e2e-systems-l4]")) | .number' \
              | sort -n
          )
          test "${#matching_triggers[@]}" -ge 1
          canonical_trigger="${matching_triggers[0]}"
          test "${TRIGGER_ISSUE}" = "${canonical_trigger}"

          report_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" \
              --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.9 #643 bounded-memory end-to-end systems result**")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_lines="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(printf '%s\n' "${bound_lines}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          bound_main="$(printf '%s\n' "${bound_lines}" | head -n 1)"
          test -n "${bound_main}"

          auth_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/643/comments?per_page=100" \
              --jq --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("## #643 sole L4 bounded-memory E2E authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${auth_count}" = "1"

          git cat-file -e "${bound_main}^{commit}"
          git checkout --detach "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor ef93e787e6d01585307f05f046d7fd3806374511 HEAD

          test "$(git hash-object tam_research/aera_v26_9_issue643_bounded_memory_end_to_end_systems.py)" = "512572340cc09e2e7ad6729712258c12cb377ef2"
          test "$(git hash-object modal_aera_v26_9_issue643_bounded_memory_end_to_end_systems_l4_app.py)" = "aee3916cb87d48296e63f36d77d6541e0cf4d474"
          test "$(git hash-object tam_research/aera_v26_9_issue641_physical_sparse_backend_identity_compat.py)" = "5ea1919d15904add0f9e0fb714757f32b11442cb"
          test "$(git hash-object tests/test_aera_v26_9_issue641_physical_sparse_backend_identity_compat_cpu.py)" = "e620a9874958bda78d586269f597095f5cf70670"
          test "$(git hash-object tam_research/aera_hardware_core_v26_9_ficem_read_identity_weight_visibility.py)" = "b81cc209f5d95abbe1fb8bd620c78e87c067bc19"
          test "$(git hash-object tam_research/aera_v26_9_issue625_schema_guard_repair1.py)" = "92d06a4954bca1b302355e81f5bf09b06fcee222"
          test "$(git hash-object tam_research/aera_v26_8_issue569_end_to_end_systems_memory_safe.py)" = "1eeaa80adb2ae960e2a8dad06031c4ed5ca99203"
          test "$(git hash-object tam_research/aera_v26_8_issue562_end_to_end_systems.py)" = "3534103eea21f7c4d9d31798ad34601fd47090d6"
          test "$(git hash-object tam_research/aera_v26_6_issue530_end_to_end_systems.py)" = "9d5a3c31f4a3862f96b957540baa2e0ec6a84c6b"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems.py)" = "c9731cae7e386f09b2a190b045532591c4fa00be"
          test "$(git hash-object tam_research/aera_v26_5_end_to_end_systems_repair1.py)" = "b3f7082b188644007b873db3733492f424d4941a"

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Re-verify issue643 canonical trigger immediately before Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t matching_triggers < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-9-issue643-bounded-memory-e2e-systems-l4]")) | .number' \
              | sort -n
          )
          test "${#matching_triggers[@]}" -ge 1
          test "${TRIGGER_ISSUE}" = "${matching_triggers[0]}"
          bound_main="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p')"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          auth_count="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/643/comments?per_page=100" \
              --jq --arg bound "${bound_main}" '.[] | select((.body // "") | startswith("## #643 sole L4 bounded-memory E2E authorization")) | select((.body // "") | contains("Authorize main: `" + $bound + "`")) | .id' \
              | wc -l | tr -d ' '
          )"
          test "${auth_count}" = "1"

      - name: Record issue643 bounded-memory systems gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.9 #643 bounded-memory systems gate** — canonical-lowest trigger, exact bound main, authoritative #640 primitive PASS, immutable #571 systems FAIL and merged #641 evaluator compatibility verified. Exactly one NVIDIA L4, Actions attempt 1 only. No rerun/freeze/scientific-seed/S2/replication/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run canonical issue643 bounded-memory end-to-end systems L4 gate
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_9_issue643_bounded_memory_end_to_end_systems_l4_app.py 2>&1 | tee /tmp/issue643.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_9_ISSUE643_BOUNDED_MEMORY_END_TO_END_SYSTEMS_RESULT_JSON=' /tmp/issue643.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue643 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_9_ISSUE643_BOUNDED_MEMORY_END_TO_END_SYSTEMS_SUMMARY_JSON=' /tmp/issue643.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.9 #643 bounded-memory end-to-end systems result**\n\n${marker}\n\nDurable Modal JSON plus authoritative RESULT marker are experiment authority. PASS permits only a separately preregistered architecture-freeze audit; no fresh science/S2/replication/100M/breakthrough claim." || true

      - name: Record issue643 pre-result failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.9 #643 bounded-memory systems gate failed before an authoritative RESULT marker.** The attempt is consumed. No rerun, retry, redispatch, alternate eligible trigger or timeout increase is authorized; continuation requires separate preregistration." || true
