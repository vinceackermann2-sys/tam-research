name: RLT residual optimizer quality-sec calibration AO

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-residual-optimizer-qualitysec-20261008-ao.yml

permissions:
  contents: write

concurrency:
  group: rlt-systems-residual-optimizer-qualitysec-20261008-ao
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-residual-optimizer-qualitysec-modal-20261008-ao
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-residual-optimizer-qualitysec-modal-20261008-ao.json
      LAUNCHER_PATH: experiments/rlt/modal_residual_optimizer_qualitysec_ao.py
      AN_PATH: experiments/rlt/modal/results/rlt-systems-gated-scan-residual-realdata-modal-20261008-an.json
      MODEL_PATH: experiments/rlt/model_gated_scan_residual.py
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-residual-optimizer-qualitysec-20261008-ao.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-residual-optimizer-qualitysec-modal-20261008-ao.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-residual-optimizer-qualitysec-modal-20261008-ao.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed AE
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          MODEL_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$MODEL_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
            echo "MODEL_BLOB_SHA=$MODEL_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-systems-residual-optimizer-qualitysec-modal-20261008-ao',
            'task':'systems_residual_optimizer_qualitysec_ao',
            'engineering_seed':20261058,
            'batch_seed':20271058,
            'eval_seed':20291058,
            'compile_probe_seed':20301058,
            'requires_an_realdata_job_id':'rlt-systems-gated-scan-residual-realdata-modal-20261008-an',
            'requires_residual_cpu_tests_run_id':37758045098,
            'batch_size':64,
            'time_budget_seconds_each':60.0,
            'seq_len':64,
            'train_tokens':6000000,
            'val_tokens':500000,
            'training_data_seed':20260924,
            'expected_parameters_each':15129344,
            'candidates':[
              {'name':'constant_lr3e-4','schedule':'constant','learning_rate':0.0003},
              {'name':'constant_lr1e-3','schedule':'constant','learning_rate':0.001},
              {'name':'constant_lr3e-3','schedule':'constant','learning_rate':0.003},
              {'name':'cosine_lr1e-3','schedule':'cosine','learning_rate':0.001},
            ],
            'automatic_retry':False,
          },j
          PY

      - name: Refuse reused AO seeds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          current=Path('experiments/rlt/modal/jobs/rlt-systems-residual-optimizer-qualitysec-modal-20261008-ao.json')
          targets={20261058,20271058,20291058,20301058}
          collisions=[]
          roots=[Path('experiments/rlt/modal/jobs'),Path('experiments/rlt/modal/claims')]
          def walk(v):
              if isinstance(v,dict):
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
              elif isinstance(v,int):
                  yield v
          for root in roots:
              for p in sorted(root.glob('*.json')):
                  if p==current:
                      continue
                  try: obj=json.loads(p.read_text())
                  except Exception: continue
                  overlap=targets.intersection(walk(obj))
                  if overlap:
                      collisions.append((str(p),sorted(overlap)))
          assert not collisions,collisions
          print('AO seeds unused across existing RLT jobs/claims:',sorted(targets))
          PY

      - name: Validate completed AN and residual CPU correctness
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$AN_PATH" >/tmp/an.json
          python - <<'PY'
          import json,urllib.request
          an=json.load(open('/tmp/an.json'))
          assert an.get('job_id')=='rlt-systems-gated-scan-residual-realdata-modal-20261008-an'
          assert an.get('status')=='complete' and an.get('classification')=='PASS_RESIDUAL_GATED_SCAN_REALDATA_ENGINEERING_QUALITYSEC'
          assert an.get('engineering_only') is True and an.get('scientific_execution') is False
          assert an.get('data_hashes_match_claim') is True and an.get('gpu_scan_vs_serial_passed') is True
          assert an.get('modal_cli_rc')==0 and an.get('breakthrough_claim_supported') is False
          assert an.get('exact_parameter_match_verified') is True
          assert [x['name'] for x in an['results']]==['gated_scan','residual_scan','transformer_control']
          assert all(x['parameters']==15129344 for x in an['results'])
          assert an['derived']['residual_minus_gated_final_nll'] < 0
          assert an['derived']['residual_minus_transformer_final_nll'] > 0
          assert an['data']['train_sha256']=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907'
          assert an['data']['val_sha256']=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2'
          req=urllib.request.Request('https://api.github.com/repos/vinceackermann2-sys/tam-research/actions/runs/37758045098',headers={'User-Agent':'rlt-ao'})
          with urllib.request.urlopen(req,timeout=30) as f: run=json.load(f)
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_branch']=='exp/rlt-colab'
          PY

      - name: Install zero-GPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             'modal>=1.5.4,<1.6' 'numpy>=2.0,<3' 'datasets>=4.0,<5'             'transformers>=4.55,<5' 'tokenizers>=0.21,<1' 'huggingface-hub>=0.34,<1'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Validate AO source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$LAUNCHER_PATH" "$MODEL_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/modal_residual_optimizer_qualitysec_ao.py').read_text()
          for x in [
            'JOB_ID = "rlt-systems-residual-optimizer-qualitysec-modal-20261008-ao"',
            'ENGINEERING_SEED = 20_261_058',
            'BATCH_SEED = 20_271_058',
            'EVAL_SEED = 20_291_058',
            'COMPILE_PROBE_SEED = 20_301_058',
            'BATCH_SIZE = 64',
            'TIME_BUDGET_SECONDS = 60.0',
            'EXPECTED_PARAMETERS = 15_129_344',
            'ResidualGatedScanRLT',
            'CompilableLightStateRLT',
            'PASS_SCALE15M_RESIDUAL_OPTIMIZER_QUALITYSEC_CALIBRATION',
            'RLT_SYSTEMS_RESIDUAL_OPTIMIZER_QUALITYSEC_AO_RESULT_B64=',
            'gpu="A100-80GB"',
            'retries=0',
          ]: assert x in s,x
          PY

      - name: Reproduce pinned D data bytes before claim
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import hashlib,json,pathlib
          import numpy as np
          from datasets import load_dataset
          from transformers import AutoTokenizer
          train_tokens=6000000; val_tokens=500000; seed=20260924
          tok=AutoTokenizer.from_pretrained('gpt2',use_fast=True)
          stream=load_dataset('HuggingFaceFW/fineweb-edu',name='sample-10BT',split='train',streaming=True)
          stream=stream.shuffle(seed=seed,buffer_size=10000)
          target=train_tokens+val_tokens
          chunks=[]; total=0
          for row in stream:
              text=row.get('text') or ''
              if not text: continue
              ids=tok.encode(text,add_special_tokens=False); ids.append(tok.eos_token_id)
              a=np.asarray(ids,dtype=np.uint16); chunks.append(a); total+=len(a)
              if total>=target: break
          assert total>=target,(total,target)
          all_tokens=np.concatenate(chunks)[:target]
          tp=pathlib.Path('/tmp/ao-train.bin'); vp=pathlib.Path('/tmp/ao-val.bin')
          all_tokens[:train_tokens].tofile(tp); all_tokens[train_tokens:].tofile(vp)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          th,vh=sha(tp),sha(vp)
          assert th=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',th
          assert vh=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',vh
          pathlib.Path('/tmp/ao-data.json').write_text(json.dumps({
            'seed':seed,'train_sha256':th,'val_sha256':vh,
            'train_tokens':train_tokens,'val_tokens':val_tokens
          },indent=2,sort_keys=True)+'\n')
          PY
          RC=$?
          set -e
          test -f /tmp/ao-data.json
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 134 ]; then exit "$RC"; fi
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/ao-data.json').read_text())
          assert d=={
           'seed':20260924,'train_tokens':6000000,'val_tokens':500000,
           'train_sha256':'0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',
           'val_sha256':'e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2'
          },d
          assert pathlib.Path('/tmp/ao-train.bin').stat().st_size==12000000
          assert pathlib.Path('/tmp/ao-val.bin').stat().st_size==1000000
          PY

      - name: Run non-GPU Modal preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Verify exact AO Modal image without GPU
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m modal run "$LAUNCHER_PATH"::verify_dependencies 2>&1 | tee /tmp/ao-cpu.log
          C="$(grep '^RLT_SYSTEMS_RESIDUAL_AO_PREFLIGHT_B64=' /tmp/ao-cpu.log | tail -1 | cut -d= -f2-)"
          test -n "$C"
          echo "AL_CPU_B64=$C" >> "$GITHUB_ENV"
          python - "$C" <<'PY'
          import base64,json,sys
          c=json.loads(base64.urlsafe_b64decode(sys.argv[1].encode()))
          assert c.get('status')=='pass' and c.get('gpu_requested') is False,c
          assert c.get('cpu_forward_shapes_passed') is True,c
          assert c.get('scan_vs_serial_passed') is True and c.get('parameters')==15129344,c
          print('AO image preflight:',c)
          PY

      - name: Commit AO zero-GPU preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          cpu=json.loads(base64.urlsafe_b64decode(os.environ['AL_CPU_B64'].encode()))
          assert cpu.get('status')=='pass' and cpu.get('gpu_requested') is False,cpu
          p['cpu_model_preflight']=cpu
          p.update({
            'classification':'RLT_SYSTEMS_RESIDUAL_OPTIMIZER_QUALITYSEC_AO_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],'model_blob_sha':os.environ['MODEL_BLOB_SHA'],
            'engineering_only':True,'scientific_execution':False,
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'reference_data':json.load(open('/tmp/ao-data.json')),
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt systems: record residual optimizer quality-sec AO preflight'
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Claim one-shot AO calibration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open(os.environ['DIAGNOSTIC_PATH']))
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_seed':20261058,'batch_seed':20271058,'eval_seed':20291058,
            'compile_probe_seed':20301058,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'engineering_only':True,'scientific_execution':False,
            'train_sha256':d['reference_data']['train_sha256'],
            'val_sha256':d['reference_data']['val_sha256'],
            'automatic_retry_authorized':False,
            'job':json.load(open(os.environ['JOB_PATH'])),
          },indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100-80GB calibration"
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal AO calibration
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 110m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_SYSTEMS_RESIDUAL_OPTIMIZER_QUALITYSEC_AO_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize durable AO result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception:p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                 'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                 'error':f'Modal CLI rc={rc}; no parseable terminal payload',
                 'log_tail':log[-6000:],'scientific_conclusion':None}
          claim=json.load(open(os.environ['CLAIM_PATH']))
          d=p.get('data') or {}
          p.update({
            'modal_cli_rc':rc,'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'data_hashes_match_claim':(
              d.get('train_sha256')==claim['train_sha256'] and d.get('val_sha256')==claim['val_sha256']
            ),
          })
          out=pathlib.Path(os.environ['RESULT_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin main "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize AL
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('classification')=='PASS_SCALE15M_RESIDUAL_OPTIMIZER_QUALITYSEC_CALIBRATION',r
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          assert r.get('wrapper_semantic_equivalence',{}).get('passed') is True,r
          assert r.get('data_hashes_match_claim') is True,r
          assert r['protocol']['batch_size']==64,r['protocol']
          rows=r['results']; assert len(rows)==4,rows
          assert all(x['parameters']==15129344 for x in rows),rows
          print('best:',r['best_by_final_nll'])
          for x in rows:
              print(x['candidate'],x['final_eval']['nll'],x['tokens_seen'],x['steps'],
                    x['tokens_per_second'],x['optimizer_steps_per_second'],
                    x['training_nonfinite'],x['eligible_for_selection'])
          PY
