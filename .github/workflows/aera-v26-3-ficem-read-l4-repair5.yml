name: AERA v26.3 issue474 FICEM read L4 repair5

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-3-issue474-ficem-read-l4-repair5
  cancel-in-progress: false

jobs:
  ficem-read-repair5:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-3-ficem-read-l4-repair5]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue474 launcher
        run: python -m py_compile modal_aera_v26_3_ficem_read_repair5_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue474 one-attempt repair5 boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/474" --jq '.title')" = "[research] AERA-v26.3 repair5 fused FICEM read synthetic L4 gate"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/474" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/470" --jq '.title')" = "[research] AERA-v26.3 FICEM read repair5 implementation after complete historical-contract migration"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/473" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/473" --jq '.head.sha')" = "55a8262d144a4644a392ea2ab81eda99124518ca"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/473" --jq '.merge_commit_sha')" = "34be2d4f1311fb00acdc5acf14b4914fb80c6bd5"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33606059884" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33606059884" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33606059884" --jq '.head_sha')" = "55a8262d144a4644a392ea2ab81eda99124518ca"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100170186089" --jq '.conclusion')" = "success"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-3-ficem-read-l4-repair5]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"

          marker_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | contains("AERA_V26_ISSUE474_FICEM_READ_REPAIR5_RESULT_JSON=")) | .id' | wc -l | tr -d ' ')"
          test "${marker_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 34be2d4f1311fb00acdc5acf14b4914fb80c6bd5 HEAD

          test "$(git hash-object tam_research/aera_v26_3_ficem_read_probe.py)" = "16aa99b9f6f0a1d11bd7bf5f36b2f0b1fb97047b"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object modal_aera_v26_3_ficem_read_repair5_app.py)" = "581e330b50c5631bde9e17a1f03748f980fab83f"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue474 gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.3 #474 repair5 read gate** — exact bound main, frozen #418 probe and merged repair5 backend verified. One NVIDIA L4, Actions attempt 1 only. No rerun/end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue474 repair5 synthetic L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_3_ficem_read_repair5_app.py 2>&1 | tee /tmp/issue474.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE474_FICEM_READ_REPAIR5_RESULT_JSON=' /tmp/issue474.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue474 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_ISSUE474_FICEM_READ_REPAIR5_SUMMARY_JSON=' /tmp/issue474.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.3 #474 FICEM read repair5 result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. No end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Record issue474 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.3 #474 repair5 gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
