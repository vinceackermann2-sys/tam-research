name: CPW-v2 secondary read-only volume inspect

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/INSPECT_V2_SEQUENCE_SECONDARY.json'

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal
        run: pip install 'modal>=1.5.4,<1.6'
      - name: Bind secondary
        run: |
          test -n "$MODAL_TOKEN_ID_2"
          test -n "$MODAL_TOKEN_SECRET_2"
          printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID_2" >> "$GITHUB_ENV"
          printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET_2" >> "$GITHUB_ENV"
      - name: Inspect secondary volume read-only
        run: modal run --timestamps modal_cpw_v2_sequence_inspect_1254.py | tee inspect-secondary.log
      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.txt
          from pathlib import Path
          p="CPW_V2_SEQUENCE_INSPECT="
          xs=[x.split(p,1)[1] for x in Path("inspect-secondary.log").read_text(errors="replace").splitlines() if p in x]
          print("CPW-v2 #1255 secondary-volume read-only inspection")
          print()
          print(xs[-1] if xs else '{"error":"missing payload"}')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1255/comments" -F body=@/tmp/comment.txt
