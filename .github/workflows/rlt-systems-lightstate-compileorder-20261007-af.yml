name: RLT light-state compile-order diagnostic 20261007 AF

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-systems-lightstate-compileorder-20261007-af.yml

permissions:
  contents: write

concurrency:
  group: rlt-systems-lightstate-compileorder-20261007-af
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-systems-lightstate-compileorder-modal-20261007-af
      JOB_PATH: experiments/rlt/modal/jobs/rlt-systems-lightstate-compileorder-modal-20261007-af.json
      LAUNCHER_PATH: experiments/rlt/modal_lightstate_compileorder_diagnostic_af.py
      AE_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae.json
      B_PATH: experiments/rlt/modal/results/rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-systems-lightstate-compileorder-20261007-af.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-systems-lightstate-compileorder-modal-20261007-af.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-systems-lightstate-compileorder-modal-20261007-af.json

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed AF
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-systems-lightstate-compileorder-modal-20261007-af',
            'task':'systems_lightstate_compileorder_af',
            'engineering_seed':20261048,
            'batch_seed':20271048,
            'eval_seed':20291048,
            'compile_probe_seed':20301048,
            'training_data_seed':20260924,
            'requires_optimizer_calibration_job_id':'rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae',
            'requires_compute_match_job_id':'rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b',
            'variants':['train_compile_first','compiled_eval_first'],
            'time_budget_seconds_each':20.0,
            'batch_size':64,
            'learning_rate':0.001,
            'schedule':'constant',
            'seq_len':64,
            'train_tokens':6000000,
            'val_tokens':500000,
            'expected_parameters':15129344,
            'automatic_retry':False,
          },j
          PY

      - name: Refuse reused AF seeds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          current_job=Path('experiments/rlt/modal/jobs/rlt-systems-lightstate-compileorder-modal-20261007-af.json')
          current_launcher=Path('experiments/rlt/modal_lightstate_compileorder_diagnostic_af.py')
          targets={20261048,20271048,20291048,20301048}
          collisions=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p in {current_job,current_launcher}:
                  continue
              try:
                  s=p.read_text()
              except Exception:
                  continue
              hit=[x for x in targets if str(x) in s]
              if hit:
                  collisions.append((str(p),sorted(hit)))
          assert not collisions,collisions[:30]
          print('AF seeds unused outside preregistration/launcher:',sorted(targets))
          PY

      - name: Require AE and compute-match B evidence
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$AE_PATH" >/tmp/ae.json
          git show "origin/$BRANCH:$B_PATH" >/tmp/b.json
          python - <<'PY'
          import json
          ae=json.load(open('/tmp/ae.json'))
          assert ae.get('job_id')=='rlt-systems-lightstate-optimizer-qualitysec-modal-20261007-ae',ae
          assert ae.get('status')=='complete',ae
          assert ae.get('classification')=='PASS_SCALE15M_LIGHTSTATE_OPTIMIZER_QUALITYSEC_CALIBRATION',ae
          assert ae.get('engineering_only') is True and ae.get('scientific_execution') is False,ae
          assert ae.get('data_hashes_match_claim') is True,ae
          assert ae.get('wrapper_semantic_equivalence',{}).get('passed') is True,ae
          best=ae['best_by_final_nll']
          assert best['candidate']=={'name':'constant_lr1e-3','schedule':'constant','learning_rate':0.001},best
          ae_tps=float(best['tokens_per_second'])

          b=json.load(open('/tmp/b.json'))
          assert b.get('job_id')=='rlt-lightstate-compute-matched-optimizer-tuned-scale15m-60s-modal-20261007-b',b
          assert b.get('status')=='complete',b
          assert b.get('data_hashes_match_claim') is True,b
          assert b.get('exact_parameter_match_verified') is True,b
          assert b.get('compute_budget_protocol_verified') is True,b
          c=b['comparison']
          assert c['semantic_equivalence']['passed'] is True,c
          assert c['classification']=='COMPUTE_MATCHED_LIGHTSTATE_OPTIMIZER_TUNED_SCALE15M_60S_NO_RLT_QUALITY_ADVANTAGE',c
          assert c['protocol']['lightstate_train_batch_size']==64,c
          assert c['protocol']['lightstate_learning_rate']==0.001,c
          assert c['protocol']['lightstate_schedule']=='constant',c
          b_tps=float(c['lightstate']['tokens_per_second'])
          ratio=b_tps/ae_tps
          assert ratio<0.80,(ae_tps,b_tps,ratio)
          assert b['data_sha256']['train.bin']=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',b
          assert b['data_sha256']['val.bin']=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',b
          print('Observed AE->B light-state throughput ratio:',ratio)
          PY

      - name: Install zero-GPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             'modal>=1.5.4,<1.6' 'numpy>=2.0,<3' 'datasets>=4.0,<5'             'transformers>=4.55,<5' 'tokenizers>=0.21,<1' 'huggingface-hub>=0.34,<1'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Validate AF source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$LAUNCHER_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/rlt/modal_lightstate_compileorder_diagnostic_af.py').read_text()
          for x in [
            'JOB_ID = "rlt-systems-lightstate-compileorder-modal-20261007-af"',
            'ENGINEERING_SEED = 20_261_048',
            'BATCH_SEED = 20_271_048',
            'EVAL_SEED = 20_291_048',
            'COMPILE_PROBE_SEED = 20_301_048',
            'VARIANTS = ("train_compile_first", "compiled_eval_first")',
            'TIME_BUDGET_SECONDS = 20.0',
            'EXPECTED_PARAMETERS = 15_129_344',
            'LightStateRecurrentTransformer',
            'CompilableLightStateRLT',
            'CONFIRMED_LARGE_COMPILEORDER_THROUGHPUT_EFFECT',
            'NO_LARGE_COMPILEORDER_THROUGHPUT_EFFECT',
            'RLT_SYSTEMS_LIGHTSTATE_COMPILEORDER_AF_RESULT_B64=',
            'gpu="A100-80GB"',
            'retries=0',
          ]: assert x in s,x
          PY

      - name: Reproduce pinned D data bytes before claim
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import hashlib,json,pathlib
          import numpy as np
          from datasets import load_dataset
          from transformers import AutoTokenizer
          train_tokens=6000000; val_tokens=500000; seed=20260924
          tok=AutoTokenizer.from_pretrained('gpt2',use_fast=True)
          stream=load_dataset('HuggingFaceFW/fineweb-edu',name='sample-10BT',split='train',streaming=True)
          stream=stream.shuffle(seed=seed,buffer_size=10000)
          target=train_tokens+val_tokens
          chunks=[]; total=0
          for row in stream:
              text=row.get('text') or ''
              if not text: continue
              ids=tok.encode(text,add_special_tokens=False); ids.append(tok.eos_token_id)
              a=np.asarray(ids,dtype=np.uint16); chunks.append(a); total+=len(a)
              if total>=target: break
          assert total>=target,(total,target)
          all_tokens=np.concatenate(chunks)[:target]
          tp=pathlib.Path('/tmp/af-train.bin'); vp=pathlib.Path('/tmp/af-val.bin')
          all_tokens[:train_tokens].tofile(tp); all_tokens[train_tokens:].tofile(vp)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          th,vh=sha(tp),sha(vp)
          assert th=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',th
          assert vh=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',vh
          pathlib.Path('/tmp/af-data.json').write_text(json.dumps({
            'seed':seed,'train_sha256':th,'val_sha256':vh,
            'train_tokens':train_tokens,'val_tokens':val_tokens
          },indent=2,sort_keys=True)+'\n')
          PY
          RC=$?
          set -e
          test -f /tmp/af-data.json
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 134 ]; then exit "$RC"; fi

      - name: Run non-GPU Modal preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit AF zero-GPU preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_SYSTEMS_LIGHTSTATE_COMPILEORDER_AF_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_only':True,'scientific_execution':False,
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'reference_data':json.load(open('/tmp/af-data.json')),
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt systems: record light-state compile-order AF preflight'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Claim one-shot AF diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open(os.environ['DIAGNOSTIC_PATH']))
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'engineering_seed':20261048,'batch_seed':20271048,'eval_seed':20291048,
            'compile_probe_seed':20301048,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'engineering_only':True,'scientific_execution':False,
            'train_sha256':d['reference_data']['train_sha256'],
            'val_sha256':d['reference_data']['val_sha256'],
            'automatic_retry_authorized':False,
            'job':json.load(open(os.environ['JOB_PATH'])),
          },indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt systems: claim $JOB_ID before A100-80GB diagnostic"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal AF diagnostic
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 100m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_SYSTEMS_LIGHTSTATE_COMPILEORDER_AF_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Materialize durable AF result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception:p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                 'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                 'error':f'Modal CLI rc={rc}; no parseable terminal payload',
                 'log_tail':log[-6000:],'scientific_conclusion':None}
          claim=json.load(open(os.environ['CLAIM_PATH']))
          p.update({
            'modal_cli_rc':rc,'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
          })
          results=p.get('results') or {}
          hashes_ok=True
          for x in results.values():
              d=x.get('data') or {}
              hashes_ok = hashes_ok and d.get('train_sha256')==claim['train_sha256'] and d.get('val_sha256')==claim['val_sha256']
          p['data_hashes_match_claim']=bool(results) and hashes_ok
          out=pathlib.Path(os.environ['RESULT_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt systems: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize AF
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('engineering_only') is True and r.get('scientific_execution') is False,r
          assert r.get('data_hashes_match_claim') is True,r
          assert r.get('classification') in {
            'CONFIRMED_LARGE_COMPILEORDER_THROUGHPUT_EFFECT',
            'NO_LARGE_COMPILEORDER_THROUGHPUT_EFFECT',
          },r
          for name,x in r['results'].items():
              assert x.get('status')=='complete',(name,x)
              assert x['training']['batch_size']==64,x
              print(name,x['initial_eval'],x['compile_probe'],x['training'],x['final_eval'])
          print('derived:',r['derived'])
          PY
