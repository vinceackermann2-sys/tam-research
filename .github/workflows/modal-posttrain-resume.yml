name: Modal TAM posttrain resume

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  resume-posttrain:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[modal-posttrain-resume]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve guarded budget
        id: cfg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.loads(os.environ.get("ISSUE_BODY") or "{}")
          seconds = int(cfg.get("max_gpu_seconds", 900))
          assert 300 <= seconds <= 900
          print(f"max_gpu_seconds={seconds}")
          PY

      - name: Record launcher start
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟨 **Post-training resume launcher started** — hard H100 ceiling=${{ steps.cfg.outputs.max_gpu_seconds }}s."

      - name: Install Modal
        run: pip install "modal>=1.1,<2"

      - name: Verify Modal authentication
        run: modal token info

      - name: Launch detached checkpoint resume
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          modal run --detach --timestamps modal_posttrain_resume_app.py \
            --repo-full-name "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --max-gpu-seconds "${{ steps.cfg.outputs.max_gpu_seconds }}"

      - name: Record handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="🟪 **GitHub → Modal checkpoint-resume handoff completed.**"
