name: RLT compute-matched exact15M 60s 20260926 A

on:
  push:
    branches: [exp/rlt-colab]
    paths:
      - .github/workflows/rlt-compute-matched-scale15m-60s-20260926-a.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: rlt-compute-matched-scale15m-60s-20260926-a
  cancel-in-progress: false

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      MODAL_TOKEN_ID_A: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET_A: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_TOKEN_ID_B: ${{ secrets.MODAL_TOKEN_ID_B }}
      MODAL_TOKEN_SECRET_B: ${{ secrets.MODAL_TOKEN_SECRET_B }}
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      BRANCH: exp/rlt-colab
      JOB_ID: rlt-compute-matched-scale15m-60s-modal-20260926-a
      JOB_PATH: experiments/rlt/modal/jobs/rlt-compute-matched-scale15m-60s-modal-20260926-a.json
      TRAINER_PATH: experiments/rlt/train_compute_matched_scale15m_60s_a.py
      LAUNCHER_PATH: experiments/rlt/modal_compute_matched_scale15m_60s_a.py
      AGG_PATH: experiments/rlt/modal/results/rlt-scale15m-16m-ab-aggregate-20260926-a.json
      SYSTEMS_PATH: experiments/rlt/modal/results/rlt-systems-scale15m-batch768-modal-20260926-n.json
      D_PATH: experiments/rlt/modal/results/rlt-compiled-paired-4m-modal-20260923-d.json
      DIAGNOSTIC_PATH: experiments/rlt/modal/diagnostics/modal-actions-compute-matched-scale15m-60s-20260926-a.json
      CLAIM_PATH: experiments/rlt/modal/claims/rlt-compute-matched-scale15m-60s-modal-20260926-a.json
      RESULT_PATH: experiments/rlt/modal/results/rlt-compute-matched-scale15m-60s-modal-20260926-a.json
      VOLUME_NAME: tam-rlt-compute-matched-scale15m-account2
      ARTIFACT_NAME: rlt-compute-matched-scale15m-60s-modal-20260926-a-checkpoints
      EXPECTED_TRAIN_SHA256: 0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907
      EXPECTED_VAL_SHA256: e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2

    steps:
      - name: Checkout isolated RLT branch
        uses: actions/checkout@v4
        with:
          ref: exp/rlt-colab
          fetch-depth: 0

      - name: Refuse previously claimed or completed compute-matched attempt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          if git cat-file -e "origin/$BRANCH:$CLAIM_PATH" 2>/dev/null; then exit 31; fi
          if git cat-file -e "origin/$BRANCH:$RESULT_PATH" 2>/dev/null; then exit 32; fi
          JOB_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$JOB_PATH")"
          TRAINER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$TRAINER_PATH")"
          LAUNCHER_BLOB_SHA="$(git rev-parse "origin/$BRANCH:$LAUNCHER_PATH")"
          {
            echo "JOB_BLOB_SHA=$JOB_BLOB_SHA"
            echo "TRAINER_BLOB_SHA=$TRAINER_BLOB_SHA"
            echo "LAUNCHER_BLOB_SHA=$LAUNCHER_BLOB_SHA"
          } >> "$GITHUB_ENV"
          git show "origin/$BRANCH:$JOB_PATH" >/tmp/job.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/job.json'))
          assert j=={
            'schema':1,
            'job_id':'rlt-compute-matched-scale15m-60s-modal-20260926-a',
            'task':'compute_matched_scale15m_60s_a',
            'scientific_seed':20261020,
            'training_data_seed':20260924,
            'requires_scale16m_aggregate_id':'rlt-scale15m-16m-ab-aggregate-20260926-a',
            'requires_systems_profile_job_id':'rlt-systems-scale15m-batch768-modal-20260926-n',
            'time_budget_seconds_each':60.0,
            'train_batch_size':768,
            'seq_len':64,
            'train_tokens':6000000,
            'val_tokens':500000,
            'expected_parameters_each':15129344,
            'checkpoint_volume':'tam-rlt-compute-matched-scale15m-account2',
            'automatic_retry':False,
          },j
          PY

      - name: Require replicated long-budget signal and measured large-batch systems profile
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$BRANCH:$AGG_PATH" >/tmp/agg.json
          git show "origin/$BRANCH:$SYSTEMS_PATH" >/tmp/systems.json
          git show "origin/$BRANCH:$D_PATH" >/tmp/d.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/agg.json'))
          assert a.get('analysis_id')=='rlt-scale15m-16m-ab-aggregate-20260926-a',a
          assert a.get('status')=='complete' and a.get('scientific_execution') is False,a
          assert a.get('classification')=='SCALE15M_16M_AB_BOTH_RLT_LOWER_NLL',a
          assert a.get('breakthrough_claim_supported') is False,a
          aa=a['aggregate_across_model_seeds']
          assert aa['pair_count']==2 and aa['rlt_lower_pair_count']==2,aa
          assert float(aa['mean_rlt_minus_transformer_nll'])<0.0,aa
          ep=a['exact_parameter_match']
          assert ep['rlt_parameters']==15129344 and ep['transformer_parameters']==15129344,ep
          assert ep['parameter_delta']==0,ep

          s=json.load(open('/tmp/systems.json'))
          assert s.get('job_id')=='rlt-systems-scale15m-batch768-modal-20260926-n',s
          assert s.get('status')=='complete' and s.get('engineering_only') is True,s
          assert s.get('scientific_execution') is False,s
          assert s.get('semantic_equivalence',{}).get('passed') is True,s
          assert s['rlt']['parameters']==15129344 and s['transformer']['parameters']==15129344,s
          assert s['profile']['batch_size']==768 and s['profile']['seq_len']==64,s
          gap=float(s['derived']['transformer_throughput_multiple_vs_rlt'])
          assert 2.0 < gap < 5.0,gap

          d=json.load(open('/tmp/d.json'))
          assert d.get('job_id')=='rlt-compiled-paired-4m-modal-20260923-d' and d.get('status')=='complete',d
          assert d.get('data',{}).get('seed')==20260924,d
          assert d.get('data_sha256',{}).get('train.bin')=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',d
          assert d.get('data_sha256',{}).get('val.bin')=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',d
          PY

      - name: Install zero-GPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             'modal>=1.5.4,<1.6' 'numpy>=2.0,<3' 'datasets>=4.0,<5'             'transformers>=4.55,<5' 'tokenizers>=0.21,<1' 'huggingface-hub>=0.34,<1'

      - name: Select Modal account 2 before claim
        shell: bash
        run: |
          set -euo pipefail
          SLOT=""; ID=""; SECRET=""
          if [ -n "${MODAL_TOKEN_ID_2:-}" ] && [ -n "${MODAL_TOKEN_SECRET_2:-}" ]; then
            SLOT="2"; ID="$MODAL_TOKEN_ID_2"; SECRET="$MODAL_TOKEN_SECRET_2"
          elif [ -n "${MODAL_TOKEN_ID_B:-}" ] && [ -n "${MODAL_TOKEN_SECRET_B:-}" ]; then
            SLOT="B"; ID="$MODAL_TOKEN_ID_B"; SECRET="$MODAL_TOKEN_SECRET_B"
          else
            SLOT="A"; ID="$MODAL_TOKEN_ID_A"; SECRET="$MODAL_TOKEN_SECRET_A"
          fi
          test -n "$ID"; test -n "$SECRET"
          export MODAL_TOKEN_ID="$ID"; export MODAL_TOKEN_SECRET="$SECRET"
          modal token info
          {
            echo "MODAL_ACCOUNT_SLOT=$SLOT"
            echo "MODAL_TOKEN_ID=$ID"
            echo "MODAL_TOKEN_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - name: Validate compute-matched source and exact parameter equality
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$TRAINER_PATH" "$LAUNCHER_PATH" experiments/rlt/modal_preflight.py
          python - <<'PY'
          from pathlib import Path
          t=Path('experiments/rlt/train_compute_matched_scale15m_60s_a.py').read_text()
          m=Path('experiments/rlt/modal_compute_matched_scale15m_60s_a.py').read_text()
          for x in [
            'SCIENTIFIC_SEED = 20_261_020',
            'PAIRED_BATCH_SEED = 20_271_020',
            'PAIRED_EVAL_SEED = 20_291_020',
            'COMPILE_PROBE_SEED = 20_301_020',
            'TRAIN_BATCH_SIZE = 768',
            'TIME_BUDGET_SECONDS = 60.0',
            'EXPECTED_PARAMETERS = 15_129_344',
            'ff_inner=938',
            'cosine_by_elapsed_post_compile_training_time',
            'COMPUTE_MATCHED_SCALE15M_60S_RLT_LOWER_NLL_SINGLE_RUN_HINT',
          ]: assert x in t,x
          for x in [
            'JOB_ID = "rlt-compute-matched-scale15m-60s-modal-20260926-a"',
            'CHECKPOINT_VOLUME = "tam-rlt-compute-matched-scale15m-account2"',
            'gpu="A100-80GB"','retries=0',
            'RLT_COMPUTE_MATCHED_SCALE15M_60S_RESULT_B64=',
          ]: assert x in m,x
          vocab=50257; d=256; max_seq=128
          rlt=vocab*d+max_seq*d
          per_stage=d+3*d*d+d*d+d+d*d+2*d*d+d*d+d+2*d*(4*d)
          rlt += 2*per_stage + d + 2*d*d + d + d + d
          tr=vocab*d+max_seq*d + 3*(4*d+4*d*d+2*d*938) + 2*d
          assert rlt==tr==15129344,(rlt,tr)
          PY

      - name: Reproduce D data bytes on CPU before claim
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import hashlib,json,pathlib
          import numpy as np
          from datasets import load_dataset
          from transformers import AutoTokenizer
          train_tokens=6000000; val_tokens=500000; seed=20260924
          tok=AutoTokenizer.from_pretrained('gpt2',use_fast=True)
          stream=load_dataset('HuggingFaceFW/fineweb-edu',name='sample-10BT',split='train',streaming=True)
          stream=stream.shuffle(seed=seed,buffer_size=10000)
          target=train_tokens+val_tokens
          chunks=[]; total=0
          for row in stream:
              text=row.get('text') or ''
              if not text: continue
              ids=tok.encode(text,add_special_tokens=False); ids.append(tok.eos_token_id)
              a=np.asarray(ids,dtype=np.uint16); chunks.append(a); total+=len(a)
              if total>=target: break
          assert total>=target,(total,target)
          all_tokens=np.concatenate(chunks)[:target]
          tp=pathlib.Path('/tmp/compute-train.bin'); vp=pathlib.Path('/tmp/compute-val.bin')
          all_tokens[:train_tokens].tofile(tp); all_tokens[train_tokens:].tofile(vp)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          th,vh=sha(tp),sha(vp)
          assert th=='0f9ea99680f532f990ca64fabbd02b46bba2c4f8077f868545a03f5e6907c907',th
          assert vh=='e6b3fb209a80a2cebe22924c3c8af26b30fc4afd322a1a49c71af8b968057db2',vh
          pathlib.Path('/tmp/compute-data-preflight.json').write_text(json.dumps({
            'seed':seed,'train_tokens':train_tokens,'val_tokens':val_tokens,
            'train_sha256':th,'val_sha256':vh
          },indent=2,sort_keys=True)+'\n')
          PY
          RC=$?
          set -e
          test -f /tmp/compute-data-preflight.json
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 134 ]; then exit "$RC"; fi

      - name: Run non-GPU Modal control-plane preflight
        shell: bash
        run: |
          set -euo pipefail
          timeout 4m modal run experiments/rlt/modal_preflight.py::main | tee /tmp/preflight.log
          P="$(grep '^RLT_MODAL_PREFLIGHT_B64=' /tmp/preflight.log | tail -1 | cut -d= -f2-)"
          test -n "$P"
          echo "MODAL_PREFLIGHT_B64=$P" >> "$GITHUB_ENV"

      - name: Commit durable compute-matched preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib
          p=json.loads(base64.urlsafe_b64decode(os.environ['MODAL_PREFLIGHT_B64'].encode()))
          assert p.get('status')=='pass' and p.get('scientific_job_executed') is False,p
          p.update({
            'classification':'RLT_COMPUTE_MATCHED_SCALE15M_60S_ZERO_GPU_PREFLIGHT_PASS',
            'branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_id_checked':os.environ['JOB_ID'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'scientific_execution':False,'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'reference_data':json.load(open('/tmp/compute-data-preflight.json')),
            'time_budget_seconds_each':60.0,'train_batch_size':768,'expected_parameters_each':15129344,
          })
          path=pathlib.Path(os.environ['DIAGNOSTIC_PATH']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIAGNOSTIC_PATH"
          git commit -m 'rlt compute-match: record 60s exact15m zero-GPU preflight'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Create and commit one-shot compute-matched scientific claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time
          d=json.load(open(os.environ['DIAGNOSTIC_PATH']))
          payload={
            'schema':1,'job_id':os.environ['JOB_ID'],'status':'claimed','claimed_unix':time.time(),
            'worker':'github-actions-modal','branch':os.environ['BRANCH'],'trigger_sha':os.environ['GITHUB_SHA'],
            'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],
            'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],'scientific_seed':20261020,
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],'time_budget_seconds_each':60.0,
            'train_batch_size':768,'expected_parameters_each':15129344,
            'train_sha256':d['reference_data']['train_sha256'],'val_sha256':d['reference_data']['val_sha256'],
            'automatic_retry_authorized':False,'job':json.load(open(os.environ['JOB_PATH'])),
          }
          p=pathlib.Path(os.environ['CLAIM_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add "$CLAIM_PATH"
          git commit -m "rlt compute-match: claim $JOB_ID before A100-80GB execution"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Execute exactly one Modal A100-80GB compute-matched attempt
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 78m modal run "$LAUNCHER_PATH"::main --job-path "$JOB_PATH" 2>&1 | tee /tmp/result.log
          RC=${PIPESTATUS[0]}
          B64="$(grep '^RLT_COMPUTE_MATCHED_SCALE15M_60S_RESULT_B64=' /tmp/result.log | tail -1 | cut -d= -f2- || true)"
          echo "MODAL_RC=$RC" >> "$GITHUB_ENV"
          echo "RESULT_B64=$B64" >> "$GITHUB_ENV"
          exit 0

      - name: Decode terminal compute-matched payload
        id: decode
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,time
          b=os.environ.get('RESULT_B64',''); rc=int(os.environ.get('MODAL_RC','999')); p=None
          if b:
              try:p=json.loads(base64.urlsafe_b64decode(b.encode()))
              except Exception:p=None
          if not isinstance(p,dict):
              log=pathlib.Path('/tmp/result.log').read_text(errors='replace') if pathlib.Path('/tmp/result.log').exists() else ''
              p={'schema':1,'job_id':os.environ['JOB_ID'],'status':'failed','finished_unix':time.time(),
                 'worker':'github-actions-modal','error_type':'ModalInvocationOrTransportError',
                 'error':f'Modal CLI rc={rc}; no parseable terminal payload','log_tail':log[-6000:],
                 'scientific_conclusion':None}
          pathlib.Path('/tmp/pair-result.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PAIR_STATUS='+str(p.get('status','unknown'))+'\n')
          PY

      - name: Export and verify compute-matched checkpoints
        id: export
        if: env.PAIR_STATUS == 'complete'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rlt-checkpoints; mkdir -p /tmp/rlt-checkpoints
          modal volume get "$VOLUME_NAME" "$JOB_ID" /tmp/rlt-checkpoints
          python - <<'PY'
          import hashlib,json,pathlib
          r=json.load(open('/tmp/pair-result.json')); root=pathlib.Path('/tmp/rlt-checkpoints')
          def one(n):
              xs=list(root.rglob(n)); assert len(xs)==1,(n,xs); return xs[0]
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for x in iter(lambda:f.read(8*1024*1024),b''): h.update(x)
              return h.hexdigest()
          rp,tp=one('rlt_final.pt'),one('transformer_final.pt')
          assert sha(rp)==r['checkpoint_durability']['rlt']['sha256']
          assert sha(tp)==r['checkpoint_durability']['transformer']['sha256']
          assert r['checkpoint_durability']['modal_volume_committed'] is True
          PY

      - name: Upload compute-matched checkpoint artifact
        id: upload
        if: env.PAIR_STATUS == 'complete' && steps.export.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/rlt-checkpoints
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Materialize durable compute-matched result
        if: always()
        shell: bash
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if [ ! -f "$CLAIM_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os,pathlib
          p=json.load(open('/tmp/pair-result.json')); claim=json.load(open(os.environ['CLAIM_PATH']))
          dh=p.get('data_sha256') or {}; c=p.get('comparison') or {}
          rlt=c.get('rlt') or {}; tr=c.get('transformer') or {}; protocol=c.get('protocol') or {}
          p.update({
            'modal_cli_rc':int(os.environ.get('MODAL_RC','999')),'branch':os.environ['BRANCH'],
            'trigger_sha':os.environ['GITHUB_SHA'],'job_source_blob_sha':os.environ['JOB_BLOB_SHA'],
            'trainer_blob_sha':os.environ['TRAINER_BLOB_SHA'],'launcher_blob_sha':os.environ['LAUNCHER_BLOB_SHA'],
            'modal_account_slot':os.environ['MODAL_ACCOUNT_SLOT'],
            'data_hashes_match_claim':(
              dh.get('train.bin')==claim['train_sha256'] and dh.get('val.bin')==claim['val_sha256']
            ),
            'exact_parameter_match_verified':(
              rlt.get('parameters')==15129344 and tr.get('parameters')==15129344
            ),
            'compute_budget_protocol_verified':(
              protocol.get('post_compile_training_time_budget_seconds_each')==60.0
              and protocol.get('compile_time_excluded_from_compute_budget') is True
              and protocol.get('train_batch_size')==768
            ),
            'checkpoint_export':{
              'modal_volume_get_outcome':os.environ.get('EXPORT_OUTCOME',''),
              'github_artifact_upload_outcome':os.environ.get('UPLOAD_OUTCOME',''),
              'github_artifact_id':os.environ.get('ARTIFACT_ID',''),
              'github_artifact_digest':os.environ.get('ARTIFACT_DIGEST',''),
              'github_artifact_name':os.environ['ARTIFACT_NAME'],'github_run_id':os.environ['GITHUB_RUN_ID'],
            },
          })
          out=pathlib.Path(os.environ['RESULT_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git add "$RESULT_PATH"
          git commit -m "rlt compute-match: record $JOB_ID terminal result"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Summarize compute-matched outcome
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_PATH" ]; then exit 0; fi
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RESULT_PATH']))
          print(json.dumps(r,indent=2,sort_keys=True))
          if r.get('status')!='complete': raise SystemExit(1)
          assert r.get('data_hashes_match_claim') is True,r
          assert r.get('exact_parameter_match_verified') is True,r
          assert r.get('compute_budget_protocol_verified') is True,r
          c=r.get('comparison'); assert isinstance(c,dict) and c.get('status')=='complete',c
          assert c.get('breakthrough_claim_supported') is False,c
          assert c.get('classification') in {
            'COMPUTE_MATCHED_SCALE15M_60S_RLT_LOWER_NLL_SINGLE_RUN_HINT',
            'COMPUTE_MATCHED_SCALE15M_60S_NO_RLT_QUALITY_ADVANTAGE',
          },c
          rt=float(c['rlt']['actual_train_seconds']); tt=float(c['transformer']['actual_train_seconds'])
          assert rt>=60.0 and tt>=60.0,(rt,tt)
          assert abs(rt-tt)<1.5,(rt,tt)
          e=r.get('checkpoint_export',{})
          assert e.get('modal_volume_get_outcome')=='success' and e.get('github_artifact_upload_outcome')=='success',e
          print('classification:',c['classification'])
          print('RLT final NLL:',c['rlt']['final_eval']['nll'])
          print('Transformer final NLL:',c['transformer']['final_eval']['nll'])
          print('delta NLL:',c['derived']['rlt_minus_transformer_final_nll'])
          print('RLT tokens:',c['rlt']['tokens_seen'],'seconds:',rt)
          print('Transformer tokens:',c['transformer']['tokens_seen'],'seconds:',tt)
          print('token multiple:',c['derived']['transformer_tokens_multiple_vs_rlt'])
          PY
