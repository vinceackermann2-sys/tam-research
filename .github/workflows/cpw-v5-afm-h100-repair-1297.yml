name: CPW-v5 AFM repaired one-shot H100 delayed-recall benchmark

on:
  push:
    branches:
      - experiment/cpw-v0-brain-predictive-workspace-20261005
    paths:
      - 'cpw/LAUNCH_V5_AFM_REPAIR_1297.json'

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate repaired one-shot merge authority
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${{ github.actor }}" = "${{ github.repository_owner }}"
          python - <<'PY'
          import json
          launch=json.load(open('cpw/LAUNCH_V5_AFM_REPAIR_1297.json'))
          validate=json.load(open('cpw/VALIDATE_V5_LAUNCH_REPAIR_1297.json'))
          assert launch == {
              'issue':1297,
              'scientific_issue':1290,
              'mode':'one-shot-h100-delayed-recall-repair',
              'failed_source':'bb575f59c4c4d6a23e76eb5e5c2d749148080783',
              'post_failure_namespace_run':37680127321,
              'frozen_parent':'bb575f59c4c4d6a23e76eb5e5c2d749148080783',
          }
          assert validate['issue']==1297
          assert validate['mode']=='exact-head-launch-repair-validation'
          assert validate['base_sha']=='bb575f59c4c4d6a23e76eb5e5c2d749148080783'
          assert len(validate['authorized_parent_sha'])==40
          PY
          AUTHORIZED_PARENT="$(python -c 'import json; print(json.load(open("cpw/VALIDATE_V5_LAUNCH_REPAIR_1297.json"))["authorized_parent_sha"])')"
          test "$(git rev-parse HEAD^2^)" = "$AUTHORIZED_PARENT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run frozen zero-GPU contracts
        run: |
          pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'
          pip install 'modal>=1.5.4,<1.6'
          python -m compileall -q modal_cpw_v5_afm_1290.py tam_research/cpw_v5_afm
          pytest -q tests/test_cpw_v5_afm_1290.py tests/test_cpw_v5_run_control_1290.py

      - name: Protect frozen scientific implementation
        run: |
          set -euo pipefail
          git diff --exit-code 2984308ca307e28a1c1c8fa1ba5a2510e38624ac "$GITHUB_SHA" -- \
            tam_research/cpw_v5_afm \
            modal_cpw_v5_afm_1290.py \
            tests/test_cpw_v5_afm_1290.py \
            tests/test_cpw_v5_run_control_1290.py \
            docs/CPW_V5_ASSOCIATIVE_FAST_MEMORY.md \
            tam_research/cpw_v4_memory/task.py

      - name: Bind verified account2
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID_2"
          test -n "$MODAL_TOKEN_SECRET_2"
          printf 'MODAL_TOKEN_ID=%s\n' "$MODAL_TOKEN_ID_2" >> "$GITHUB_ENV"
          printf 'MODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_SECRET_2" >> "$GITHUB_ENV"

      - name: Verify Modal authentication
        run: modal token info

      - name: Record repaired scientific launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1297/comments" \
            -f body="CPW-v5 repaired one-shot H100 launch authorized at source ${GITHUB_SHA}. account2; post-failure namespace run 37680127321 clean; retries=0; no resume. The first durable ATTEMPT.json consumes seeds 1291001/1291101/1291102/1291103."

      - name: Run frozen one-shot AFM benchmark
        run: |
          set -o pipefail
          modal run --timestamps modal_cpw_v5_afm_1290.py --source-sha "${GITHUB_SHA}" | tee cpw-v5-afm-repair.log

      - name: Record terminal result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.txt
          import json
          from pathlib import Path
          prefix='CPW_V5_AFM_RESULT='
          rows=[line.split(prefix,1)[1] for line in Path('cpw-v5-afm-repair.log').read_text(errors='replace').splitlines() if prefix in line]
          if not rows:
              raise SystemExit('missing terminal CPW-v5 result')
          result=json.loads(rows[-1])
          agg=result['aggregate']
          print('CPW-v5 #1290 AFM delayed-recall terminal result')
          print()
          print(f"- classification: `{result['classification']}`")
          print(f"- replication integrity: `{result['replication_integrity']}`")
          print(f"- Transformer learns: `{agg['transformer_learns']}`")
          print(f"- sequence leakage alarm: `{agg['sequence_leakage_alarm']}`")
          print(f"- supported seed count: `{agg['supported_seed_count']}/3`")
          print(f"- AFM memory supported: `{agg['memory_supported']}`")
          print(f"- AFM strong memory supported: `{agg['strong_memory_supported']}`")
          print(f"- Transformer long accuracy: `{agg['transformer_long_mean_accuracy']}`")
          print(f"- sequence long accuracy: `{agg['sequence_long_mean_accuracy']}`")
          print(f"- AFM long accuracy: `{agg['afm_long_mean_accuracy']}`")
          print(f"- AFM distance-256 accuracy: `{agg['afm_distance_256_accuracy']}`")
          print(f"- AFM examples/sec ratio: `{agg['afm_examples_per_second_ratio']}`")
          print(f"- AFM compute ratio: `{agg['afm_total_compute_ratio']}`")
          print(f"- AFM parameter fraction: `{agg['afm_parameter_fraction']}`")
          for arm, distances in agg.get('distance_means', {}).items():
              compact={d:{'accuracy':round(v['accuracy'],6),'nll':round(v['nll'],6)} for d,v in distances.items()}
              print(f"- {arm} per-distance: `{compact}`")
          print('- breakthrough claim authorized: `false`')
          print('- scale-up authorized: `false`')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1297/comments" -F body=@/tmp/comment.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1294/comments" -F body=@/tmp/comment.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1290/comments" -F body=@/tmp/comment.txt

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1297/comments" \
            -f body="CPW-v5 repaired workflow failed for source ${GITHUB_SHA}. Inspect durable ATTEMPT/RESULT/FAILURE before any action. Do not rerun this source or seeds."
