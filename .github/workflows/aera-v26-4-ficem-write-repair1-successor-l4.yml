name: AERA v26.4 issue498 repaired FICEM WRITE successor L4 gate

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aera-v26-4-issue498-ficem-write-repair1-successor
  cancel-in-progress: false

jobs:
  ficem-write-repair1-successor:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[aera-v26-4-ficem-write-l4-repair1-successor]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check issue498 launcher and frozen probe
        run: |
          python -m py_compile tam_research/aera_v26_4_ficem_write_probe.py
          python -m py_compile modal_aera_v26_4_ficem_write_repair1_successor_app.py

      - name: Install Modal client
        run: pip install 'modal>=1.2,<1.3'

      - name: Verify issue498 one-attempt repaired WRITE boundary
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/498" --jq '.title')" = "[research] AERA-v26.4 repaired FICEM WRITE successor synthetic L4 gate after #495"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/498" --jq '.state')" = "open"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/497" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/497" --jq '.head.sha')" = "515d3fad8463c8e61da664b2667b7a4616ab3864"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/497" --jq '.merge_commit_sha')" = "852edbe5261f75f56f45e52b33d6acf3bea02f2b"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33647126135" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33647126135" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33647126135" --jq '.head_sha')" = "515d3fad8463c8e61da664b2667b7a4616ab3864"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100304584393" --jq '.conclusion')" = "success"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33638047466" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33638047466" --jq '.run_attempt')" = "1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100273784137" --jq '.conclusion')" = "success"
          test "${TRIGGER_ISSUE}" != "490"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33618950619" --jq '.conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/100211244996" --jq '.conclusion')" = "success"

          trigger_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(has("pull_request") | not) | select(.title | startswith("[aera-v26-4-ficem-write-l4-repair1-successor]")) | .number' | wc -l | tr -d ' ')"
          test "${trigger_count}" = "1"
          report_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" --jq '.[] | select((.body // "") | startswith("🔬 **AERA-v26.4 #498 repaired FICEM WRITE successor result**")) | .id' | wc -l | tr -d ' ')"
          test "${report_count}" = "0"

          event_body="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}")"
          bound_main="$(printf '%s\n' "${event_body}" | sed -n 's/^Bind main: `\([0-9a-f]\{40\}\)`$/\1/p' | head -n 1)"
          test -n "${bound_main}"
          test "$(git rev-parse HEAD)" = "${bound_main}"
          git merge-base --is-ancestor 852edbe5261f75f56f45e52b33d6acf3bea02f2b HEAD

          test "$(git hash-object tam_research/aera_hardware_core_v26_4_ficem_write_triton.py)" = "e54570292489bd17570038dca7518419ac00418c"
          test "$(git hash-object tam_research/aera_hardware_core_v26.py)" = "268644ac4edee15a4cc4e29d3fed7f61eeb3caa7"
          test "$(git hash-object tam_research/aera_hardware_core_v25_1_compact.py)" = "4e336b6e1a6238dac782fa320751d68281493ee1"
          test "$(git hash-object tam_research/aera_hardware_core_v26_3_ficem_read_triton.py)" = "263f68eb1186a8ac14a08fc4b4df1fc5b292c711"
          test "$(git hash-object tam_research/aera_v26_4_ficem_write_probe.py)" = "7d8c2c4990beb4c7b4a719d02d009ffefe94671f"
          test "$(git hash-object modal_aera_v26_4_ficem_write_repair1_successor_app.py)" = "a0de551981ebc833149839ae9362e156163b21f5"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Record issue498 gate (best effort)
        if: steps.guard.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔒 **AERA-v26.4 #498 repaired FICEM WRITE successor gate** — exact bound main, repaired WRITE candidate and frozen #488 probe verified. One NVIDIA L4, Actions attempt 1 only. No rerun/end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Authenticate Modal
        if: steps.guard.outputs.allowed == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run sole issue498 repaired FICEM WRITE successor L4 probe
        if: steps.guard.outputs.allowed == 'true'
        id: modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash --noprofile --norc {0}
        run: |
          set -o pipefail
          set +e
          modal run modal_aera_v26_4_ficem_write_repair1_successor_app.py 2>&1 | tee /tmp/issue498.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^AERA_V26_ISSUE498_FICEM_WRITE_REPAIR1_SUCCESSOR_RESULT_JSON=' /tmp/issue498.log; then
            exit 0
          fi
          if [ "${rc}" = "0" ]; then exit 1; fi
          exit "${rc}"

      - name: Record issue498 result (best effort)
        if: steps.guard.outputs.allowed == 'true' && steps.modal.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="$(grep '^AERA_V26_ISSUE498_FICEM_WRITE_REPAIR1_SUCCESSOR_SUMMARY_JSON=' /tmp/issue498.log | tail -n 1)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="🔬 **AERA-v26.4 #498 repaired FICEM WRITE successor result**\n\n${marker}\n\nDurable Modal result + authoritative marker are the experiment record. No end-to-end/freeze/S2/scientific-seed/100M/breakthrough authorization." || true

      - name: Record issue498 failure (best effort)
        if: failure() && steps.guard.outputs.allowed == 'true' && steps.modal.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="⚠️ **AERA-v26.4 #498 repaired WRITE successor gate failed before an authoritative result marker.** No rerun, automatic retry, redispatch, alternate trigger, or timeout increase is authorized; continuation requires a new preregistration." || true
