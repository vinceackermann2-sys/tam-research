[project]
name = "tam-research"
version = "0.1.0"
description = "Reproducible Transformer vs TAM architecture research"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.7,<2.11",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
modal = [
  "modal>=1.1,<2",
  "datasets>=4.0,<5",
  "transformers>=4.55,<5",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.34,<1",
]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["tam_research*"]
exclude = ["archive*", "docs*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
